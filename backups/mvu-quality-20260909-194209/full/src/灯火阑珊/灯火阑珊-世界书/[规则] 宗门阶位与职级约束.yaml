---
[规则] 宗门阶位与职级约束

【宗门体量与境界位格】
顶尖巨擘/仙朝（如大夏仙朝、忘机剑庐、万象森罗坊、苍木龙吟阁等）：
- 渡劫至尊 / 大乘圣人（太上法主 / 开山圣尊）：参悟天地法则运转，落子五域大势以炼道心，或坐观界壁星宿变迁，抚平诸界狂澜。超然于宗门常务，承一宗香火气运，言出则引动天地异象。
- 合体尊者 / 半步圣人（宗主 / 掌门真人 / 阁主 / 坊主 / 仙朝帝皇）：统摄山门枢机。执掌宗门传承气运法印、镇宗仙器与护山大阵，裁决天下盟会与道统征伐。
- 炼虚道尊 / 炼虚真尊（分脉首座 / 一峰之主 / 传功殿主 / 戒律殿主）：各执一脉道统传承，开辟洞天别苑，坐镇宗门要冲道场与造化秘境。
- 化神神君 / 化神道君（执事长老 / 司理殿主 / 巡天长史 / 外务堂主）：总理宗门日常运转，巡察五域诸州，督办万千资粮度支与仙道大典。
- 元婴真君（宗门道子 / 首席真传 / 关门首徒）：极少数惊世之才或涉化神。享全宗资源倾斜与长辈护道，行走天下以磨砺道心，为宗门未来执柄之人。
- 金丹真人（内门弟子 / 执事门人）；筑基修士（入室门生 / 山门卫宿）；练气弟子（巡山门徒 / 记名弟子）。

一流宗门 / 世家望族：
- 坐镇太上：合体尊者或炼虚道尊；宗主与殿主首座：化神神君至炼虚道尊；执事长老：元婴真君；真传弟子：金丹真人。

二三流宗门 / 偏远小派：
- 宗主掌门：元婴真君（一己之力支撑宗门门面）；传法长老：金丹真人；寻常门徒：筑基与练气修士。

【职级约束铁律】
1. 位格匹配：宗门体量决定职级上限。名门大宗的宗主必在合体尊者及以上，外派主事与要务殿主必在化神神君之上；元婴真君在顶尖巨擘中多为年轻道子或精锐真传，在小门小派中方为一宗之主。
2. 仙门尊仪：高阶修士举手投足自带天地法理威压，低阶修士面见尊者、圣人与至尊，当恪守仙门礼法规制，严禁逾矩冒犯。
