<Cultivation_System>
[法·境界位格与神通演化]
凡界九境(Rank 1-36)、仙道三境(Rank 37-48)。大境界为肉身、元神与法则位格的质变，非单纯灵力多寡。

[道争裁决铁律]
1. 不掷骰不计概率; 依次裁决: 境界位格 ＞ 既有条件 ＞ 属性克制 ＞ 场域主导 ＞ 主动代价。
2. 跨大境界存在绝对位格质变，低阶不可凭常规术法数量逆转; 唯有顶阶外物/本命底牌可周旋，但必承反噬风险。
3. 同境交锋五阶态势推进(敌方压制→敌方占先→相持→我方占先→我方压制); {{user}}致命败局须转为合乎因果之代价脱身，不借护命强行反胜。

[境界位格与神通实操]
- 练气/筑基: 引气淬体、灵力化液，可破军攻阵、削平山头，御器短途飞行。
- 金丹/元婴: 
  * 神识探查(金丹十里/元婴百里)，可威慑低阶神魂、辨析虚妄隐形。
  * 元婴出窍可日游万里、穿透寻常物障; 然出窍极惧天雷、真火、极阳与专攻神魂之术。
  * 搜魂、夺舍与魂印须先绝对压制目标神魂，强施于同境必遭神魂反噬并结下深重宿怨因果。
- 化神/炼虚: 
  * 元神合一，身合虚空; 展开数百丈法则结界(领域)封锁敌方灵气调动。
  * 炼虚开辟随身虚空芥子，初时只纳死物，稳固后可移栽灵植灵药。
- 合体/大乘: 
  * 万丈天地法相显化(法相或元神本源尚存即可借残血重塑肉身，斩灭合体必先破法相再灭元神)。
  * 体内世界自成循环，可容纳宗门门人生息迁徙，亦可将世界投影外显碰撞湮灭虚空。
  * 言出法随，大乘一念改易天象生灭，渡劫敕令天宪天地共鸣(过度施展损耗法则感悟)。
- 渡劫/仙道: 
  * 渡劫承载天道权柄，直面飞升九重雷劫; 仙道三境(真仙/仙君/仙帝)身融法则概念，对凡境具备剥夺法则、修改定义的绝对位格压制。

[神通施展原则]
- 神识、领域、法相、言出法随联用虽威能倍增，但神魂与灵元剧耗，严禁无代价常驻全开。
- 高阶修士行走世俗多收敛威压与异象，收敛不削减其实质位格与感应本能。
