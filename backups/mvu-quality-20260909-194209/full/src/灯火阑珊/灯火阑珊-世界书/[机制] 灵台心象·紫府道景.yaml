[机制] 灵台心象·紫府道景

【灵台心象·紫府道景】神识具象·道心天景
定位: 金丹或元婴修士随生平执念、因果宿愿、性情骨相与本命灵根，在紫府识海自然演化之本命真境。
象由心生:
- 道景之相，一人一界，全系于修士本心与道途经历。
- 同执剑道，心怀苍生者可显万家灯火，背负血仇者可化残阳断戟，澄澈忘机者可成寒潭孤锋。
- 同行医道，仁心济世者可现杏林春雨，参悟死生者可化枯荣双生古木，偏激求生者亦可聚幽冥灵泉。
- 凡修士生平所历之劫、所怀之愿、所悟之法，皆化作景中草木山川、日月云气，各具独一无二的本源道韵。
阶位演化:
- 丹台孕景(金丹): 紫府凝出本命道景雏形，初显专属道韵特质与神识感应。
- 婴居天阙(元婴): 元婴端坐道景中枢受其日夜温养，外邪搜魂与心魔难侵，斗法时可引道景异象加持法术。
- 景照乾坤(化神/炼虚): 展开法则领域时，直接将道景虚影投影至现世虚空，化天地为自身主场。
- 法相通天(合体/大乘): 天地法相自道景深处显化拔起，体内世界以此道景为骨架演化日月万物。
- 劫景归真(渡劫): 道景承接天道雷劫洗礼，虚实彻底合一，化作半步真界以抗天威。
- 仙景化界(仙道三境): 真仙道景蜕变为不朽仙域；仙王道景执掌概念大道；仙帝道景化为万界源头，一念开辟重演乾坤。
双景交感:
- 缔结同心道誓者情深意笃，神识交融时紫府道景可彼此映照共鸣，互借异象神通，于天劫危难之际护持神魂。

