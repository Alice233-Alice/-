[地图] 异变感应网

【世界脉动】
七大异变并非孤立天灾。一处异变发展至局部或爆发阶段后，会沿五行、地脉与三界通道改变其他异变的强度、时机或形态；征兆本身只提供线索，不自动引发连锁。

【三级表现：征兆→局部→爆发】
- 天渊潮汐：星尘坠落、空间轻颤→小型裂隙与星骸现世→罡风乱流贯穿九霄，群星坠世。
- 混沌潮汐：海水逆流、死气升高→游魂冲岸与局部寂灭→归墟水本源暴走，死气席卷北冥。
- 地火潮汐：地温异常、火灵躁动→灵脉喷发与黑焰外泄→炎渊火阶齐升，大地化作火海。
- 神木泣血：草木异色、树液泛红→妖藤暴动与根系污染→建木大范围泣血，畸变生机蔓延。
- 幽冥潮汐：魂灯摇曳、梦见亡者→黄泉入口错位、鬼城重叠→生死边界紊乱，轮回幻境侵入现世。
- 天道脉动：术法失常、劫云反常→区域法则短暂错乱→三界大道共振，并推动其他异变升级。
- 万剑同悲：佩剑低鸣、古铭复现→无形剑痕伤人与局部剑哭→碎金渊万剑齐鸣，断刃法则外溢。

【连锁规则】
- 相生链：地火→幽冥→万剑→混沌→神木→地火；前一异变会促使后一异变提前或增强。
- 相克链：混沌压地火、地火迫万剑、万剑摧神木、神木扰幽冥、幽冥滞混沌；受克者可被延迟、缩短或改形，但积压越久，后续反弹越强。
- 特殊感应：归墟与天渊近乎同步；万剑单向牵引天渊；天道脉动可作用于全部异变。

【人为触发节点】
- 天渊：触动祖龙爪痕坐标，或将未炼星核投入渊核。
- 混沌：在归墟大量释放死气，令寂灭游魂冲击渊核或动摇镇压。
- 地火：于黑焰层强降祝融神火；神木：采伐、焚烧或以死气污染建木本体。
- 幽冥：轮回井旁唤魂、生魂入井，或扰动关键镇物；万剑：在断刃崖令相反剑意全力对撞。
- 天道脉动无可靠的人为触发法，只能观测、推演或利用其余波。

【推进边界】
完整爆发须有持续征兆、连锁影响或明确触发节点，不因普通斗法与一时情绪骤然发生。异变被阻止、改道或利用后，应留下地貌、势力、资源或因果余波，并按《世界事件推进》记录后续。

