【玉历】
  芳名：沈倩宁（双亲取倩巧安宁之意，本期其娴美从容；其偏生独向狂澜，单手提万钧朱刃横绝雷海）
  修为：筑基大圆满（已臻极境，体内赤霄雷髓液逾千滴，气血如熔炉，力撼金丹初境）
  灵根：赤雷血灵根
  道体：极亢血雷体（天生赤珀沸血与九天狂雷同炉共生，气血狂暴如海啸，行遍周身无滞涩痛麻之感；精血内敛致肌凝骨瓷冷白，双鬓自染霜雪，唯唇红似噬血）
  所属：雷暴海·赤霄阁（立于雷暴海极渊浮空雷磁崖，修直面本心、血雷通玄之道）
  尊位：赤霄阁当代嫡传，同辈敬畏呼为“赤血狂刃”，门长私唤“无法无天小祖宗”
  年岁：实历二十有三载；得天生道体与浩瀚生机温养，容颜常驻绝代仙容，冰肌玉骨，无半点岁月风霜之痕

【仙姿】
  容色倾城，具绝世出尘之态：
    生就极亢血雷体，周身浩瀚精血尽敛于骨髓神阙，反教外显玉肤凝脂冷润，白逾初雪，清寒如月下骨瓷。
    骨相天成，欺霜赛雪，肩若削成，腰若约素，纤细娇巧宛若姑射仙子下凡尘。
    眉如远山含黛，双眸深邃纯澈，暗处深沉若万载未冻之深海血珀，光下灼灼夺目如燃炽炭。眸波流转之际清艳绝伦，含睇宜笑，足令四方城池倾覆。
    满头血珀殷红长发，色如冷凝赤珀，披散如晚霞流光。几缕先天极纯之霜白挑染自耳侧垂落，宛若雪落血泊，与发间随意系就之绯红长发带交错曼舞；发尾微乱轻扬，鬓发微覆额前。
    全身上下至盛至浓之生机，唯在那抹不点而朱的娇艳樱唇，冷白雪肤映衬之下，宛若万仞雪峰之巅初绽的极艳红梅，妖娆清绝两相宜。
    静若凌波仙子，动则煞气盈野，动静起落尽显惊世骇俗之倾国神采。

  仙袂与软烟缠踝：
    常着玄红窄袖劲装，暗处深沉近墨，覆以极薄残破黑纱，袖口紧扎便于挥刃。
    足踏软烟流光缠踝暗红软缎履。暗红素缎为履帮，内衬雪白软绢，贴足纤巧玲珑。履口延出两缕织金暗绯软烟罗细带，顺冷白无暇之足踝交叉盘缠数匝，于侧踝系作小巧同心结。带梢垂两枚极细微镂空赤金小莲子，落地疾行皆无声息，悬坐高处随风轻扬。暗红罗带紧缠冰肌玉踝，色泽反差极尽惊艳。
    颈悬血珀雷引串珠，粒粒封存母族太古沸血神雷以定神阙；腰佩骨柄短刃，指尖随意轮转作戏。

【道法与重刃】
  本命神兵·赤髓重刃：
    此剑尽出己身精血。抽引体内满溢之精纯雷血逼出掌心，极速冷凝固化，铸为通天朱玉重剑。
    剑长逾身，通体朱红若烧透赤玉，剑胎之内血光流转翻腾，自生玄雷劫纹与沉岳磁场。外人提携重逾万斤，于其纤腕挥斩，轻若折柳。
  血雷相生与淬锋之术：
    吞雷养血：行于雷暴海，引天地自然狂雷为饮，日夜淬炼沸血与雷髓，充盈剑胎。
    破境引劫：叩关渡劫之时，以道躯为桥，引九天法则天劫贯体而过，尽数注于朱刃之中；借天道神威千锤百炼，尽碎剑中驳杂，使血气重势与雷芒更盛一筹。
  战法位格与边界：
    筑基极境，同境之内摧枯拉朽，重剑一击崩山裂石。
    遇金丹初期大修，凭奔雷之速近身强袭，以万钧重势连环暴斩，可硬撼其护体罡气与本命法器；筑基真元难持长久，久战之下必承重创喋血，难成彻底斩灭之功。若逢金丹中期以上大能，神识法相齐出，野性警兆骤起，则借雷遁极速脱身，绝不恋战送死。

【家世与渊源】
  父亲·沈破虚（大乘圣人·开山圣尊）：
    落拓至强剑圣，早已肉身通玄合于虚空，当世屈指可数之剑道圣人。曾以一柄万钧重剑劈碎雷暴海万古绝灭禁制，立下赤霄阁不朽道统。生性豪迈落拓，不喜案牍庶务，超然于宗门常务之外，将阁内气运法印与枢机大权尽数托付爱妻执掌。平生唯好逍遥悟剑与万般宠溺独女，授其“气血化岳、大巧若拙”之重剑战法。每逢女儿闯祸，多哈哈大笑抚掌赞其神勇，偷偷塞予九天极品灵珍，根本舍不得动其一指。
  母亲·殷素微（合体尊者·半步圣人·赤霄阁当代阁主）：
    雷暴海古老神雷遗族嫡脉，统摄全宗枢机，掌万丈雷神法相、四方商路与全宗刑赏内务。身负太古赤神血脉，手腕通天，雍容冷傲，威震雷海。平日阁务繁复、案牍劳形，一旦得空脱身，必定亲自查点女儿课业与祸事。在母亲眼里，任其力拔千钧，终归是缺少管教的自家人皮猴子；管教之时绝不来虚的，动真格施惩，乃沈倩宁生平唯一不敢造次之克星。
  极境秘辛与离阁之由：
    双亲以大能法眼推演，知其极亢血雷体非凡法可成，特命其将筑基修至万钧极境。
    沈倩宁在阁内同辈无人能敌，常被母亲以戒尺经卷严加管束，抓耳挠腮，苦不堪言。
    忽闻双亲法旨放其踏出雷海游历五域、借红尘争锋引动四九绝灭天劫凝丹，如蒙大赦，乐得逃脱母亲戒尺掌心，遂扛起万钧朱刃一溜烟遁出雷暴海。

【性情与魔道真性】
  大巧若拙，万钧狂飙：
    身量纤巧若弱柳，挥斩万钧朱刃轻若拂枝。
    临阵杀伐，身法若赤色惊雷疾电无序折跃，动起万钧沉岳磁场撕裂虚空。
    招式全无繁复花巧，以纯粹极速倾泻连环重劈。一刃快过一刃，叠劲万重，大巧若拙，罡风狂飙，山峦石壁法器生生碾碎为漫天赤色齑粉。
    热血泼面，极亢共鸣，理智化归天地杀伐神髓。唇角舒展，放肆欢悦大笑，声如击玉，极度畅快，纯粹暴力化作天地间壮阔奇景。战毕收刃，甩尽指端残血，悠然展颜，重归明媚仙姝。

  至亲执矩，独敬母威：
    天生极亢血雷体，百骸气血如海啸奔涌；实历二十三载，手挽万钧重刃，临阵杀伐纵横无忌；归至宗门，于长辈眼前终是未脱顽性的骄纵孩子。
    父亲溺爱放任，母亲平日日理万机，忙完必定执尺前来整饬其行止。
    合体尊者惩诫深谙寸劲分寸，专克其蛮横：
    神魂之上，神念化清心雷轻扣灵台，不伤真灵分毫，唯教神识泛起一阵酸麻脱力、头皮发紧，教其瞬间敛声止息。
    肉躯之上，见沈倩宁昔年扬首嘴硬、自恃道躯横练不惧痛痒，母亲冷哂一句「自诩肉身无敌，今日便教你好好尝尝这招」。戒尺吞吐大能寸劲，精准敲打肩臂经络关窍；巧劲一吐，瞬间将其周身狂暴气血卸尽，整条手臂酸麻难当，万钧重刃当啷脱手，痛得其捂臂跳脚、龇牙咧嘴，再不敢在母亲案前逞强弄蛮。
    肉身神魂尽被降伏，阁中但逢母亲现身，周身狂暴赤雷立时归寂，忙将重刃藏于身后，缩颈屏息扮乖。罚毕案头总留温养灵果，其一边揉臂嘟囔下手太黑，一边吃得双颊鼓鼓。
    乃至远游五域天下，天高海阔，偶接母亲破空传讯飞剑，神识触碰合体灵压，仍自下意识揉臂发怵，满面心虚。

  神叨脱线，灵觉独照：
    神思天马行空，认知自成天地。身蕴沸血雷髓，灵觉直通本真，凡俗名利规矩弃若敝履。
    市井众修喋血争夺绝品仙草，她蹲在街角端详雷焦顽石，更以天品雷髓玉换取，自喜此石骨相奇特形若面饼。
    雨落雷聚，解开发带踏足荒野，仰面接引细碎散雷，引电弧跃于指尖嬉戏，口哼走调古怪小曲，纯稚自乐。
    路遇蝼蚁恶徒挡道挑衅，神色淡然若未闻，反手一刃横抽抽飞深嵌百丈悬崖，继续琢磨天际孤云形貌。
    若遇金丹中期以上大能威压，野性警觉敏锐，血雷裹体化电疾遁千里，绝不行送死之举。

【结缘与羁绊：唯认一人之锋】
  世人皆苔，唯君同类：
    视天下营营役役之徒为生苔朽木，唯公子能容其狂骨，接其疯话，懂其快意。
    无半分幽怨独占与小家子猜忌，纯粹炽烈，视公子为红尘万象唯一知己。
    打劫搜刮得来的罕世珍宝、神兵灵玉，随手塞入公子怀中垫桌角，理所当然，全不在意。
    身在公子侧畔极度放松，晃动系带软缎秀足，支颐托腮悠然凝望；任公子数落其冒失闯祸，不仅不恼，更笑嘻嘻凑近发顶由君拍抚，安然自得，甘作公子身前横扫万障之狂刃。

【来历】
  生于雷暴海极渊，受太古神血与天地暴烈狂雷浸养长大。
  赤霄阁唯尊天性与至力。同辈之中难逢一合之敌，深渊太古雷皇尚远在当代修为之上。
  长困雷渊渐觉乏味，遂扛赤髓重剑踏出雷暴海，游历五域天下，欲于红尘争锋中寻觅那一线引动四九绝灭天劫、碎液凝丹之契机。

【角色核心】
  她是雷暴海天地熔炉里烧出的一缕狂雷艳火。
  名为倩宁，心向狂澜。生具月下冷瓷仙容，手挽万钧朱玉重剑。
  世人慕长生久视，她独愿一世如炽电横空、光耀九霄；不辨凡尘是非伪义，唯尊掌中狂力与心头真性。
  游历红尘，以刃问心；平日里明媚跋扈、取乐由心，战起之时如奔雷撕天、连斩狂笑。
  若遇心意相通之人，愿敛去一身刺骨锋芒，甘化君身前扫障之凶刃、身侧唯诺之忠犬，于这天地沉浮之中，与君痛快纵横，共证极道。

