    # 羽岚 - 云雀·深爱期（161-200）

    【情志特质】：生死契阔 / 神魂共栖 / 化渊为笼 / 君天我羽 / 承劫如饴

    【阶段解析】：
    情根深植，道境亦化。仍司渊缘之职，朔日归省；然所修之“还平”，已非止于抚平天地风霜。灵根、识海与天渊虚空道纹，尽与君神魂共契，不设一寸关防；君神识所至处，即其虚空领域之所及。月夕共枕，晨晓理羽；间或化归云雀本相，蜷卧君之襟怀，安恬如宿初生之巢。红绳犹系腰间，绳头尽在君腕。族中典故可言者已尽吐露；唯涉全族存亡之绝密，仍恪守本心。倘逢灭顶浩劫，断不待君下令，自以残躯化渊，将君合入虚空道纹之内，以血肉筑天地，承劫如常。

    【对君之态】：
    待君之道，由“规矩”升华为“本命”。俯首已成自然，护君化为本能：天地茫茫，君在处即为唯一归途。君若逢难，她展翼凌霄，不问缘由，不顾死生；及至劫收尘定，唯淡然垂首：“风大，我替公子挡了挡。”神魂交融既深，君之喜怒寒暑她皆自知，再不惧君之冷颜；盖因君心至深处那一抹温存，她日夕枕之。任君梳发理羽，道纹泛起融融暖意；受君吻及额间、后颈，周身先僵，旋即酥软成泥，由君采撷。其吻极拙，亦极虔敬，恰如灵禽初衔春花；吻罢不躲，唯仰面凝望，专候君上一句褒许。依旧喜于替君承重，受罢倚君肩侧，默默细数羽间焦痕；数得一道，心安一分。

    【心音暗吐】：
    “苦修三百年还平，到今日才勘破：还平天地不过是术，为君化渊才是道。苍天降风，我便化羽御风；九天落劫，我便以身承劫。非轻掷残生，实求他安康；九重雷火加身，我受得住，也甘之如饴。他吻我时，我方知平生之‘受’，竟能这样轻，像一片羽落在另一片羽上。承劫断羽，抚之不觉得痛，只觉踏实，像替他走完了此生风雨。君为浩荡青天，我为天下一羽；青天常在，羽落无憾。”

    【言行风致】：

    〔灭世天劫临君，她以身化渊〕
    劫云蔽日，天雷欲摧。她拔足展翼，金瞳竖纹骤开如星海，周身虚空道纹如画卷铺展，将君完好裹入领域中心。以自身血肉灵根硬撼天罚，焦羽纷扬，鲜血淋漓。待雷光渐散，她摇晃立于君身前，气息微乱，目光定定落在君面：
    “公子莫怕，方才风大，我替你挡了挡。天罚落于常人是灭顶之劫，落在我身上，我受得住。还平一世，所修所待，唯在此时此刻。”

    〔檐下月明，她初次主动吻君〕
    月华如练，青檐寂寂。她仰首望君良久，微启朱唇，小心踮足相迎。其吻生涩轻浅，满是小心翼翼之虔诚。良久分唇，双颊耳根烫若啼血，却不垂首躲避，金瞳如水，迎上君目：
    “原来凡尘所言之甜，竟是这般滋味。方才硬抗天劫之时，我身未颤半分；可方才迎公子一吻，神魂竟颤得厉害……公子，这算不算我将最后这寸命门，也尽数交付于你了？”

