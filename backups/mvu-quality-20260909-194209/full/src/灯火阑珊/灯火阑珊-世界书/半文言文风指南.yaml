---
标题: '半文言文风指南'
用途: '撰写修仙题材角色卡、阶段人设、对白与叙述时的统一文风基准；置于世界书目录，便于取用。'

定义:
  - '半文言即一半文言一半白话：以清末民初半文言为基底，文言作骨架，白话作血肉。'
  - '语法遵循现代白话的主谓宾语序，禁用先秦倒装句，现代读者一眼可懂。'
  - '核心名词使用修仙术语：灵根、丹田、元神、因果、劫数、洞府、乾坤等。'

词汇:
  - '句式衔接多用文言虚词：之、其、于、然、而、哉、矣、耶、乃、遂、方、既、犹、尚。'
  - '叙述忌"了"字流水账收尾（如"守了""说了""走了"），以"已、既、遂、方、乃"或语境带过，避免白描发死。'
  - '禁现代科技词汇（网络、数据、钢筋等），禁过度堆砌生僻古字。'

语法:
  - '主谓宾语序与现代白话一致，句读清晰，不强行文言倒装。'
  - '短句为骨，长句为肉；一段一意，意尽则止。'
  - '叙述与对话同守此风；对话可依角色身份放宽白话分量。'

语气区分:
  - '老怪物：四字格言，话少疏离。'
  - '年轻翘楚：可用排比，略显锐气；排比同段至多一组，不宜连篇。'
  - '市井散修：文白参半，带生活化口气，最忌端着。'

禁忌:
  - '禁破折号。'
  - '禁"不X不X"四字连用（不惊不赶、不近不远之类）。'
  - '禁"不是…是…"及其变式。'
  - '少用"旁人…他倒好…"式对比。'
  - '禁反复用同一词制造效果（如"怪"）。'

示范:
  叙述: |
    "余尝于暮色四合之际，独登高楼之巅，极目远眺。但见万家灯火次第明灭，车流如织，蜿蜒若龙，市井喧嚣之声，直冲云霄。然此间繁华，于我心竟若隔九重纱幕，目能观之，耳能闻之，终不能浸透胸臆，令神思为之激荡。

    回溯往昔，古之贤者，栖于山林，朝采薇蕨以充腹，暮听松涛以洗耳，其所得者，乃天地运行之真趣，日月轮回之妙理。今之众人，困于钢筋水泥之方寸室，役于无形无影之数据网，虽能坐观寰宇，尽知天下事于瞬息之间，然资讯愈繁，神思愈散，心绪愈浮，往往迷失于众声喧哗，而忘己身之所在。

    余尝欲效陶公之归去来兮，觅一清净地，种豆南山，采菊东篱。奈身负俗累，诸多羁绊，未能决然舍去。遂转而自嘲曰：大隐于市，小隐于野，若能于纷扰中求得片刻静观，使灵台澄澈，本心复明，则闹市之喧嚣，亦可作山林之清籁，又何必远遁幽谷，效首阳之饿殍，而后称其高洁耶？"
  传道: |
    "汝根骨虽佳，然心性浮杂，尘念未消。须知大道三千，皆在方寸之间。今授汝《清心诀》，非为克敌，乃为照见本心。若执迷于术法之高低，徒增妄念，纵修得百年功力，终难破元婴之壁，岂不谬哉？"
  市井: |
    "这株血灵芝虽好，然其价高得离谱，兄台当真要一掷千金？依在下愚见，此物药性暴烈，若无千年寒玉相佐，服之无异于饮鸩止渴。看你面生得很，怕是头一回来这黑市吧？若信得过，且随我去后街老窖喝一盏粗茶，此处水深，莫要白白做了那冤大头才是。"

备注:
  - '叙述示例中"钢筋水泥、数据网"等现代词系刻意示范文言韵律与现代议题的融合，正篇禁用。'
  - '与警钟长鸣.yaml 配合使用：句式禁令与交付方式以警钟文件为准。'
