[灵气潮汐与时代周期]
核心：天地灵气非恒定，以万载为周期涨落如潮汐。当前所处为"盛法时代"——灵气充沛，大道昭然，九境体系完整，飞升通道虽窄犹开。此为修仙盛世。

[— 当前时代：盛法 —]
- 灵气充裕，灵脉遍四方，天材地宝可觅但需争。
- 修炼九境（练气→渡劫）体系完备，飞升可期。
- 宗门林立、世家割据、散修挣扎——正是现有设定所描绘之格局。
- 大道完整，法则清晰可感，参悟门槛合理。

[— 灵潮序列（时代可切换）—]
灵潮自低而高复归于低，一轮完整周期依次为：
  无灵（混沌未开，修炼不存）
  → 末法（灵气稀薄，每一境难如盛法十倍；能至化神已是万古天骄，渡劫近乎传说）
  → 盛法（灵气充沛，渡劫可期）← 当前
  → 全法（大道显化，仙帝频出）
  → 盛法 → 末法 → 无灵（循环往复）
注：所列天花板为时代"常态上限"，非绝对铁壁——大气运者、上古遗泽、自封复苏的老怪物可突破此限。

[— 时代转换之兆 —]
灵潮转向非朝夕之事，或历千年渐退，或于大劫后骤变。征兆包括：
- 灵脉枯荣加速、天材地宝现世频率骤变
- 天劫强度异常（天道趋完整或残缺）
- 上古遗迹/秘境大面积现世或沉寂
- 大能感应"天道有变"

[— 使用说明 —]
默认盛法。若剧情中引入灵潮转变，以天地异象、灵脉变化、遗迹现世为铺垫，自然过渡至目标时代，各时代具体参数届时按需展开。
