# 仅供人工查阅与维护。
# 本文件不接入伪同层前端、MVU 初始化、变量更新规则或动态世界书。

项目: 灯火阑珊
文档: 伪同层与变量结构更新日志
最近更新: 2026-08-27

维护约定:
  - 版本记录按时间倒序排列，最新版本置于最前。
  - 仅记录伪同层前端、伪同层控制器、MVU Schema 与变量守卫的功能变化。
  - 世界书文案、开场剧情、角色设定与生图素材不在本日志中展开。
  - 技术协议版本与变量结构版本分别记录，不使用虚构的统一版本号。

版本记录:
  - 版本: '2026.08.27-dev'
    标题: 伪同层交互重构与变量结构 v4
    状态: 当前开发版
    组件版本:
      伪同层协议: 14
      伪同层兼容范围: 'v4～v14'
      变量结构: 4
      修炼系统: 3

    '✨ 新增':
      伪同层:
        - 新增幕间对话抽屉；交谈与传讯不再占用独立页签，可在阅读正文时随时打开、收起并调整宽度。
        - 幕间对话按发起时的正文楼层锚定并归档，历程页能够在对应正文下查看往来记录。
        - 支持编辑 AI 正文、玩家行动与灵台观照内容，并保留原生重生成、删除和楼层导航能力。
        - 新增未完成输入恢复；生成中断后可以找回尚未得到回复的玩家输入，避免行动丢失。
        - 新增正文内嵌行动选项，可选择“填入行动栏”或“直接推演”，设置保存在本地。
        - 新增玩家个人档案入口；玩家可随时编辑，AI 能读取档案内容但不能通过变量更新命令改写。
        - “红颜”页签更名为“红尘”并更换图标；侧栏新增“尘缘客录”，显示已有 NPC 图鉴中的姓名、境界、宗门与备注。
        - 红尘人物页新增羁绊纪事、关系上下文、修行档案与当面交谈、远程传讯入口。
        - 地图支持地点锚定；特殊地点可落到指定地域，同时保留其真实天地层级。

      变量结构:
        - 本尊新增 `_档案` 字段，用于保存玩家自行维护的详细背景资料；身份仍保留为可由 AI 更新的简要社会身份。
        - 根结构新增 `$地图锚点`，用于声明“具体地点 → 地图地域”的稳定映射，不参与常规 AI 变量更新。
        - 地域枚举扩展到独立海域、边界域、天域与幽界五渊，任务地点与本尊行踪共用同一套地域定义。
        - 可参与机遇支持当前紧凑格式 `{ 行动, 类型, 提示 }`，并兼容英文键与旧版完整对象。
        - 变量守卫新增正文证据校验，跨级突破与跌境必须同时得到结构化声明和剧情文本支持。

    '🛠️ 优化':
      伪同层:
        - 正文主轴与隐藏的幕间状态楼层分离；关闭对话后仍停留在原正文，不再被隐藏楼层带离阅读位置。
        - 历程读取改为分页获取，长聊天不必一次载入全部楼层；旧控制器会自动安全降级。
        - 灵台观照从正文内容中独立解析和显示，避免思维链、正文与变量更新块互相污染。
        - 行动提示只采用当前楼层的有效 JSONPatch；本轮未更新时不再错误沿用上一轮旧选项。
        - 当行动数据缺失或格式异常时，可根据进行中任务与当前处境生成保守的兜底行动。
        - 红尘缘契改为 0～200 的五阶段进度条，仅显示有效的非负好感度。
        - 地图仍保持“三界总览、地界舆图、幽界渊图”三张；独立海域直接归入现有地界舆图，不额外增加专题地图页。
        - 地域推断优先采用显式地图锚点，并区分“当前区域”与“所属层级”，减少同名地点造成的误判。
        - 视觉卡片解析会跳过思维链和变量更新块中的重复占位内容，降低重复立绘与错误切图。

      变量结构:
        - '灵石统一为非负数值，并兼容旧版 `{ 下品灵石: 数量 }`、`{ 灵石: 数量 }` 等账本对象。'
        - 变量守卫会把旧式 `/本尊/灵石/下品灵石` 更新路径归一到当前标量字段。
        - 战斗负荷的真元、神识与肉身状态改为可描述文本，允许记录比固定枚举更具体的伤势和消耗。
        - 可参与机遇统一中英文类型别名，自动归并为探索、交涉、战斗、修炼、整备或亲密。
        - 地图锚点和个人档案均采用只读前缀约定，开场 `initvar` 可以填写，后续由玩家界面或脚本维护。

    '🐛 修复':
      伪同层:
        - 修复龙眠海峡等独立地域已经配置却仍被显示为神州的问题。
        - 修复显式写入天层、地层或下层时，前端仍沿用上一楼层具体地域的问题。
        - 修复中断生成后残留的玩家消息无法继续使用或回收的问题。
        - 修复幕间交谈、传讯与正文历史混排后，翻页、返回最新和状态快照可能错位的问题。
        - 修复 NPC 境界等级以 `unknown` 传入颜色函数造成的类型错误，并补齐多行省略的标准 CSS 属性。
        - 修复好感度负数被渲染到红尘缘契进度条的问题。

      变量结构:
        - 修复旧版灵石对象无法通过当前数值 Schema，或增减命令落到不存在的子字段的问题。
        - 修复机遇使用 `action/type/hint` 时被误判为补丁索引对象的问题。
        - 修复 AI 仅修改等级数字、但正文没有真实突破依据时仍可能发生跨境晋升的问题。

    '🔁 兼容':
      - 伪同层协议保持对 v4～v14 控制器的协商与降级支持；编辑、分页、输入恢复和幕间抽屉按协议能力启用。
      - 变量结构升级到 v4 时继续接收旧灵石账本、旧机遇对象和既有行踪数据，并在解析阶段归一为当前格式。
