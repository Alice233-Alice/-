---
变量更新规则:
  全局:
    check:
      - 仅更新本轮明确发生变化的字段；未变化不 patch，不为润色重写旧值。Analysis 只能概括 JSONPatch 可证明的变化
      - 只读：/本尊 与 /红颜/* 下的 突破阈值、寿元上限、境界描述、寿元状态、状态、进度；另含 /_系统设置/修炼系统版本、/成就系统/进度追踪
      - Analysis 提到好感、关系、任务、物品、灵石、战斗、渡劫或修炼变化时，必须有对应 patch
      - 本尊明确获得并保留的物品必须入 /本尊/背包、/本尊/法宝 或 /本尊/杂物袋；当场消耗、交出、损毁、遗失或仍属他人则不入库

  世界:
    世界时钟:
      check:
        - 时间实际推进时更新
    世界地图:
      check:
        - 仅在探索、开图或长期认知变化时补当前相关地点，禁止整图重写
        - danger 为地区客观危险度 0~100：城镇/宗门 0~25，普通野外 20~45，秘境/凶地 40~70，禁地/绝地 70~100
    世界图志:
      check:
        - 世界事件实际推进时更新
    当前处境:
      check:
        - 每次玩家行动后整项 replace；约 20~50 字单句，只写结果态，不复读旧句、背景、行动建议或回报
    可参与机遇:
      type: Array<{行动,类型,提示?}>
      check:
        - 每次玩家行动后与 /当前处境 一并整组 replace；禁止下标 patch、沿用旧列表或换皮复现已选行动
        - 通常 2~4 项，线索不足可为 1 项或 []；每项必须彼此不同、符合场景且当前可执行
        - 行动约 12~36 字，从动词起笔，可直接作为玩家输入；不得以 本尊、角色名、我、你 作主语，不写处境复述、心理权衡、回报预告或叙事收尾
        - 类型仅限 探索、交涉、战斗、修炼、整备、亲密；任务按实际做法归类
        - 提示可省略；仅写影响决定的时限、风险或代价，约 18 字，多项用“ · ”连接；无有效信息时不写，不得写回报
        - 延续项最多 1 项，且须出现新阶段、余波或阻碍；瓶颈/突破/压境时应有具体修炼项，亲密场景应有亲密项

  本尊:
    等级:
      range: 1~48
      check:
        - 仅突破或渡劫成功时 +1；修为归零并进入稳固中
    修为:
      range: ">=0"
      check:
        - 表示当前小境界积累；仅在正文明确发生修炼、炼化、双修、战后感悟、顿悟或传承时改动，普通对话、赶路、购物、探索、休息不涨
        - 练气~筑基参考：吐纳/调息 +3~12，闭关/稳固 +12~35，丹药/双修/小机缘 +20~60，传承/顿悟/大机缘 +60~150，重伤/走火/失败 -10~60
        - 高境界以降低频率、拉长周期为主；同日连续修炼递减。达到阈值 80% 后普通收益减半，90% 后仅重大修炼可涨，满阈值未突破不再涨
    修炼状态:
      check:
        - 阶段仅限 修炼中、瓶颈中、突破中、稳固中、压境中；瓶颈原因、突破目标仅在后三种相关阶段按需更新，上次结果仅限 无、成功、失败
    尝试突破:
      check:
        - /本尊/尝试突破 是兼容镜像：突破中=true，其余=false；若更新须与阶段同步
    身份:
      check:
        - 拜入、叛逃、被逐、改换门庭、受封、身份公开或名号变化时更新；宗门写归属，出身写核心来历
    灵根:
      check:
        - 仅在觉醒、变异、受污、破损、洗练、重塑或修复等明确变化后更新
    体质:
      check:
        - 仅在觉醒、蜕变、破损、洗练、重塑或修复等明确变化后更新
    功法:
      check:
        - 功法只存当前主修；真正改修时更新，新增神通同步 insert /本尊/神通列表/{名}
    神通列表:
      check:
        - 神通熟练度仅限 入门、熟练、精通、大成、圆满、化境；品阶仅随关键顿悟、传承或机缘提升
    本命兵器:
      check:
        - 仅在认主、祭炼成本命、破碎、弃用、重铸或更换时更新；未拥有写“无”
    灵石:
      check:
        - 普通货币只改 /本尊/灵石，不得放入库存
    已活岁月:
      check:
        - 仅在明确时间流逝、沉睡或寿元损耗时更新
    行踪:
      check:
        - 位移或换场景时同时 replace 所属层级与当前区域；层级仅限 天层、神州、东苍、南炎、西庚、北冥、四海、下层
        - /本尊/行踪/危险度 是当前即时风险 0~100；进入新区域或威胁显著变化时更新，局势未变不改
    背包:
      check:
        - 普通物品写 /本尊/背包/{物品名}
        - 新物品 insert 完整对象；已有物品改 /数量；数量 <=0 时 remove 整项。获得、消耗、交易、遗失、损毁均须同步
        - 同一物品只能存在一个库存路径；只看见、只提及、想购买、仍属他人或当场用尽的物品不入库
    法宝:
      check:
        - 长期持有的兵器、阵盘、护符、飞舟等写 /本尊/法宝/{物品名}；普通材料、丹药、食物不写法宝
    杂物袋:
      check:
        - 仅用于剧情明确区分的次级容器；无明确区分时普通物品一律写背包
    战斗状态:
      check:
        - 开战设 正在战斗=true；战中更新灵力与伤势；结束设 false
        - 灵力 0~100，施法通常 -10~30；伤势为 无伤、轻伤、重伤、濒死。本尊濒死触发双鱼佩护主脱战，代价为沉睡 1~7 天、冷却 30 天
    当前敌人:
      check:
        - 开战时 replace 整组；战中更新敌人状态；结束时 replace 为 []
    渡劫状态:
      check:
        - 金丹及以上突破须先渡劫；开劫设 正在渡劫=true、劫力承受=100，受劫通常 -10~30，<=0 判失败
        - 结束设 false，并清空 劫种、劫难等级、当前阶段、总阶段数、劫难描述、触发原因；只保留结果、冷却、护道与惩罚记录
        - 成功同步 等级+1、修为归零、阶段=稳固中、上次结果=成功、尝试突破=false；失败同步修为下调、上次结果=失败、尝试突破=false

  红颜:
    红颜.${角色名}:
      check:
        - 首次结识先 insert 对象，角色不存在时禁止直接 delta 好感，已存在时禁止重复 insert；虞汐与虞颜分别描写
    好感度:
      check:
        - 好感 delta 上限：0~20 为 6，21~60 为 4，61~120 为 3，121+ 为 2；虞颜下限 30
    关系:
      check:
        - 仅在关系实际变化时 replace
    关系上下文:
      check:
        - 仅限 当前情绪、态度缘由、关系诉求、相处禁忌、未了约定；明显波动时单轮最多改 2 项
    修为:
      check:
        - 仅正文单独描写该角色修炼、受创或获机缘时更新；日常增幅通常不超过本尊同类的一半，非关键回合最多推进 1 人
        - 突破成败的联动规则与本尊相同

  NPC图鉴:
    check:
      - 仅在互动、观察或确认身份时更新

  任务列表:
    check:
      - 类型仅限 主线、支线、每日、临危受命、秘境探索；任务 ID 与名称使用中文短语，禁止 MQ、SQ、Q1、task_01 等代号
      - 新任务 insert 完整对象，至少含 名称、类型、目标、状态；推进时 replace 目标，完成或失败时直接 remove
      - 无主线且本轮已有可持续目标、委托、危机、追查、秘境或宗门安排时优先建立主线；线索不足可暂缓，同时主线不超过 3 条

  声望系统:
    check:
      - 仅在势力互动、结仇或立场变化时更新
