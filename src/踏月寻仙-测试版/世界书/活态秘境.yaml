[机制] 劫运褶皱·活态秘境

【劫运褶皱·活态秘境】空间折叠·天道生灭遗迹
定位: 七大异变爆发或地脉剧震时，三界空间被强行挤压折叠而成的暂时性活态秘境；非常规固定洞府，乃天道缝隙中的生灭造化。
催生与征兆:
- 异变挤压: 地火潮汐或现「古炎残宫」，神木泣血或生「万毒灵冢」，幽冥潮汐或浮「迷魂客栈」，天渊潮汐或坠「星骸废都」。
- 空间折叠: 现世寻常山谷密林突生空间涟漪、光阴滞涩或灵雾弥漫，即为秘境入口显兆。
活态法则(秘境生存铁律):
- 生灭时限: 秘境随地脉脉动而生，亦随灵气平息而坍缩(存续三日、数月不等)；坍缩时界壁闭合，未遁出者肉身化道。
- 异域奇律: 秘境内部常受天道残律支配，自成独特禁忌(如神识受限百步、引力上下倒错、入夜不可言语、生死之气颠倒)。
- 伴生凶险: 秘境由地脉暴走凝成，常孕生与异变同源之虚空异兽或上古残念，极具领地杀性。
机缘与大势反哺:
- 天地奇珍: 核心处必蕴生太古道果、残篇古经、虚空晶石或先天灵宝胎胚。
- 拨动大势: 破除或平息秘境核心，可消弭现世对应的局部异变；若引爆秘境灵脉，亦可逆向重创外界敌对宗门之护山大阵。

