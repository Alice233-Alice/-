【开局十九-沈倩宁】
苍茫古径八百里，万木交错成穹，终年阴翳如晦。

自神州西来之灵机，行至此间渐由均衡转作沉郁木灵，湿冷水气与黏滞木意如暗沼般侵蚀林莽。古道青石板多生湿滑厚苔，两旁古木盘根错节，枯藤横斜。寻常行客至此，无不紧束袍袖，默运玄功抵御体内被沉郁木气压制的火雷二气。

{{user}}身着一袭洗练素袍，身躯匀称修挺，骨架宽厚结实。手腕与足踝套着沉黑的万斤玄铁环，步履踏在湿滑青苔上沉凝无声，地脉深处的厚土之息随着呼吸在百骸四肢吞吐回转。他指间捏着半块咸香耐嚼的粗粝熟牛肉干，一边慢条斯理地咀嚼，一边漫步打量着古道深处盘虬的古木根脉。林间侵袭而来的湿寒木灵重压，触及他周身三尺微热气血，便如碎雪入温汤般自散无形。

前方的幽暗古林忽然泛起一阵微末躁动。

一股源自太古的极纯血煞与沉岳威压，自昏暗深处蛮横撕开沉滞的木灵之气。

幽暗的青石尽头，一道娇小的玄红身影踏破湿苔行来。暗处如墨的窄袖劲装裹着骨瓷身量，微残的黑纱覆在肩头；雪白无瑕的侧踝处，两缕织金暗绯罗带盘缠数匝，于踝骨侧挽作小巧同心结，两枚镂空赤金小莲子随步轻晃，落地无声。满头血珀殷红长发如晚霞披散，耳侧几缕先天极纯之霜白挑染随风扬落，冷瓷雪肤在昏暗古径间清寒夺目。

唯独她肩上随意扛着的那柄阔大重刃，长逾其身，通体宛若冷凝赤珀血玉所铸。

大剑之内，共铸着她自幼温养的太古赤神真血。剑身血槽间暗红血光流淌浮沉，加之古径沉木之气微相激荡，大剑随其道躯本能微生躁意，剑脊深处不断掠过丝丝缕缕猩红电芒，暴烈赤雷裹挟着微甜血煞在剑面游走明灭，发出轻微撕扯之声。

她单手搭着万钧沉岳的大剑，指尖漫不经心地转动着一柄白骨短刃。骨刃翻飞如雪浪，偶尔掠过虚空，划出极细微的漆黑空隙。

道旁忽有一头潜伏多时的三阶青苔毒蟒，经不住她周身纯净真血的致命诱惑，自腐叶阴影中暴起突袭，腥风扑面。

沈倩宁连眼皮都未曾抬起一下。

她手腕随心而动，甚至未曾催动繁复剑招，顺着大剑本身的凶狂意志，反手一刃横抽。

阔大血刃轰然划破虚空。

重岳沉力混着暴烈赤雷奔涌而出，大剑自行激荡起暴虐血芒，在半空化作一道赤红雷网。毒蟒甫一触及剑面风压，庞大坚硬的妖躯瞬间被狂暴的血雷巨力生生震散，化作漫天极细的赤色齑粉汽化无踪。阔如门扇的朱玉剑面掠过血雾，护刃磁场嗡然一震，连半滴妖血都未曾沾染，依然明净如初。

随手碾灭妖兽，她步履未停。冷白晶莹的齿唇间，因适才真血微有激荡，自然泛起一抹近乎娇艳欲滴的极艳红晕。

数丈外，{{user}}嚼着牛肉干的动作微不可察地一顿。

他常年修持太岳搬山力道，最知天下沉劲分寸。方才那一记横抽毫无花巧雕饰，纯以万钧沉岳之重与极速血雷硬生生碾爆妖躯，纤巧皓腕之下，分明藏着一头能崩山碎岳的极道凶灵。眼底掠过一丝武夫遇良招的真切激赏，他咽下口中干粮，眉宇间舒展从容。

一人顺径前行，一人扛剑漫步。

古径狭窄，两人错步擦肩，相距不过两三尺。

幽微的异样，便在气机交汇的一瞬自剑上生出。

那柄以神血同炉共铸的本命重刃，平日里向来顺应她的杀伐本能，极喜放大血雷狂澜。可就在它随沈倩宁的步履切入{{user}}身侧三尺清定领域的刹那，剑槽中原本躁动游走的猩红赤电，忽地无声柔和了下去。

剑身深处那一股随她经络血脉不断奔涌的沸腾血煞，如狂涛落入无垠沃土，翻滚的血光渐渐沉淀为深邃温润的暗赤血珀，甚至在剑脊内里，极其微弱地泛起一声极低极轻的幽沉嗡鸣。

重刃并未脱手，亦未做出任何逾矩举动，依旧稳稳搭在她的雪白肩头。

可它周身缭绕的那股暴烈血煞与燥意，却在这一刻真真切切地软化平抑了三分。

沈倩宁前行的步子蓦地收住。

系带软缎履碾在青石苔藓上，赤金小莲子微微一晃。

她与这柄大剑血脉相连、呼吸同炉。此番与眼前这个衣着寻常的素袍青年擦肩而过，剑内暴躁的血雷竟自发平抑了下来，连带着她体内长年奔涌微躁的神血，都隐隐泛起一阵前所未有的妥帖与安宁。

沈倩宁纤腕轻轻一旋。

长逾其身的万钧大剑并未顿地，而是在她掌风抚过的刹那，化作一泓流转的暗赤血光，悄无声息地尽数敛入她冷白晶莹的掌心窍穴。

没了阔大重刃横亘，更显出她身量的娇柔纤细与弱柳扶风之态。

她转过身来，脚下暗红软缎履踩过青苔，足踝处织金系带微扬，径直迈出两步，停在离{{user}}不过尺许的近前。

满头血珀殷红的长发披散如霞，耳侧几缕霜白挑染随风拂在脸颊，冷瓷绝颜欺霜赛雪，朱唇艳若初梅。她身量未及青年胸口，却微微仰起小巧雪白的下颔，微眯起一双深邃如极渊血珀的赤瞳，带着一种毫不遮掩的好奇与极致的危险，直勾勾钉在青年的眉眼与心口之间。

雪白指尖上，那一柄白骨短刃依旧悬空飞旋，偶尔掠过虚空擦出细微的黑痕，刃尖几欲挨上青年的前襟。

她唇角微扬，绽开一抹纯净娇艳、却教人不寒而栗的甜险笑靥，嗓音轻软柔糯，徐徐打破古林的死寂：

“当真稀奇。此刃受我心头真血温养二十余载，生性孤烈至极，遇生灵近前，雷煞动辄裂石喋血。”

她偏着头，鼻息温软微甜，眼底却跳动着近乎癫狂的新奇血光：

“方才自你身侧行过，剑中翻涌的血意雷劲竟尽数伏敛，连带着我这身燥烈经络，都凭空生出几分清凉妥帖。你身上未施避雷道诀，赤手空拳不见半件压煞重器，这副骨架筋肉倒硬朗沉实得很。喂，你是天生一副能化尽血雷的温软筋骨，还是披了人皮的通玄定盘？莫要动弹，借我以短刃划开你胸臆端详一二，如何？”

{{user}}步履随之稳稳收住。

面对几乎挨上心口前襟的白骨短刃与虚空割痕，他眉眼舒展，神色未见半点惊惶，甚至好整以暇地将手中剩下的半包肉干折好塞入腰间暗袋。垂眸俯瞰眼前这个凶名在外、偏生生得娇小倾城的魔姬，他唇角微扬，眼底漾开一抹温厚宽舒的笑意。

“姑娘家的大剑方才贴着在下身侧低鸣敛气，甚是通情达理；做主人的倒好，初次照面，便要抄刀替它把识货的同道拆骨剥皮。”

{{user}}从容迎上那双灼灼如炭的血珀赤瞳，抬起宽厚粗粝的右手，屈起两根指节，顺手在自己结实如岩壁的胸膛前襟上轻轻敲了敲。

嗒，嗒。

沉闷厚重的皮肉骨音回荡开来，宛若钝锤敲在千锤百炼的玄铁石桩之上，坚凝沉稳：

“借你划一刀倒无妨，只是在下修的是太岳厚土力道，一身糙皮肉骨自幼引地煞真火烧透了，硬得很。姑娘若失了准头，崩缺了你心爱的小骨刃，或是震酸了纤巧手腕，可莫要当场耍赖，赖我这块石头欺负仙子。”

沈倩宁那双深邃赤瞳微微睁大，眼底原本深沉的凶光，刹那间被极度浓郁的惊异与新奇尽数冲散。

在雷暴海赤霄阁里，宗门上下同辈闻她脚步皆两股战战，外头修士见她出剑更是仓皇遁逃。还是破天荒头一回，有人既不惧她的大剑杀威，还能一本正经地拿自家坚骨打趣，笑盈盈反将她一军。

她掌心一翻，飞旋的白骨短刃顺服收归腰侧。

下一瞬，她竟真不客气地伸出两根欺霜赛雪的纤细指尖，隔着素袍布料，使劲戳了戳青年那副坚实如精金的胸膛。

指尖传来的触感沉硬如山峦地盘，甚至隐隐泛着一股沉定温和的阳和地气，引得她指尖的微末赤雷悄然化开，通体舒泰。

“呀，敲着真像块晒透了日头的热石头！”

沈倩宁仰着绝颜，纯净明艳的甜险笑靥在唇角彻底漾开，耳侧霜白挑染曼舞，罗带系结的赤金小莲子发出极清脆的叮当轻响：

“大剑果然没看错，你这人嘴皮子倒比它利索多了！既然大剑由着你顺毛，我这身燥血也觉着舒坦，那你今日便不许走了。本姑娘扛剑游历五域，正缺个能接大剑沉力的抗揍同伴。喂，你叫什么名号？”

{{user}}看着她这副天真烂漫又霸道横行的娇蛮模样，不由失笑摇头，朗声抱拳：

“神州太岳承天宗，名讳{{user}}。”

他目光望向前路幽暗处隐现的炊烟微光，温和提议道：

“古径深处湿寒黏滞，前头数里便是老槐驿。沈姑娘若是嫌古道漫长，不妨一道过去饮盏热腾腾的古道灵茶，歇歇脚力，顺道由着你家大剑多蹭上片刻，如何？”

“神州太岳宗？听说过，专修搬山体魄的硬骨头，难怪砸不烂！”

沈倩宁负手微晃着系带软缎小履，笑靥嫣然，血珀赤瞳微转：

“本姑娘乃雷暴海赤霄阁沈倩宁。既然你这般识趣相邀，本姑娘便赏光同你走上一遭！走，去老槐驿喝茶！”

言罢，红发如晚霞轻扬，她踩着轻快的步子转过身，与挺拔沉稳的青年并肩行向古道幽深处。苍茫古径的阴翳林海间，多出了一道玄红与素白交错的奇特身影。

