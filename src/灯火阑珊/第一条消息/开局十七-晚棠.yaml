夜雾黏稠如凝固的尸油，自纵横数百里的地煞裂谷深处汹涌喷薄，将天际血月吞噬得只剩一抹惨淡轮廓。

极目远眺，整座敛骨荒坞犹如一尊横卧在群山阴面中的巨大活人棺。干涸百年的古渡河道内，黑水奔流如沸，数万道面容扭曲的溺死残魂在浪涛中载沉载浮，伸出密密麻麻的惨白手臂，争相攀扯着横跨两岸的粗壮铁索。长街两侧，废弃吊脚楼层叠高耸，檐角悬挂的数百具人皮风灯迎风鼓胀，喉腔内发出如泣如诉的干瘪喘息。荒芜的街道上，数百尊身披生锈重铠、断首凹胸的古战场阴兵，手执残破戈矛，踏着脚下混杂生石灰的碎骨泥沙，步履沉重地排布出生阴大醮的森严杀阵。

整座古坞，乃是一方活活炼化了万千生灵的“百棺逆魂生死道场”。

{{user}}自虚空中徐徐踏落，一身玄白道袍在刺骨阴风中猎猎作响。他足踏虚空，每一步落下皆激荡开极淡的太极涟漪，神识如无形天平，将整座古坞地脉的灵息紊乱尽收眼底。其左瞳深邃如九幽玄冥，隐现一抹极寒的幽墨；右瞳明澈似初升破晓，凝着一道炽盛的纯白。两道黑白流光沉敛耀眼，洞穿漫天血煞虚妄。

腰间的分水断界两仪剑剑镡处，灵光微泛。一个仅有寸许高、梳着黑白双髻的玲珑小女童从剑鞘缝隙里探出半个身子。那是两仪剑受元婴真元温养化生的剑灵爻儿。小家伙身着迷你两仪道袍，伸出肉乎乎的两只小手死死捏住鼻子，小脸皱成一团，嫌恶地悬在剑镡旁直晃小短腿，小声咕哝着这鬼地方的死人味简直呛煞神仙。

神识穿透地表百丈。古坞正下方，整整一百零八具重逾万斤的阴沉玄铜棺呈八卦之势倒插在沸腾血海中，浸血锁链一路攀爬，死死锁住集市尽头半塌古庙顶端的一口暗红巨钟。

逆阴丧魂钟骤然自鸣。

沉闷如惊雷的钟声裹挟着千万厉鬼的哀嚎撕裂夜幕，整片裂谷为之剧烈震颤。那邪仙借百年生阴大醮之至邪伟力，竟强行凿穿了通往九幽黄泉的非常规通道！虚空如脆弱琉璃般轰然崩解，被生生撕开一道长达千丈的漆黑天堑。

自那被强行凿开的黄泉裂隙中，汹涌冰寒的幽冥死潮如决堤天河般倾泻而下。伴随着死潮狂涌而出的，更有无数在黄泉古迹深处沉沦万载的凶煞异物——数十只生有九目、翼展十丈的渡魂骨鸟凄厉尖啼着自虚无中扑出，周遭列阵阴兵与血煞残魂在触及这股更原始的幽冥狂暴气息时，竟被震得接连碎裂。

漫天倾泻的死潮与狂暴冥兽群中，一道纤细修长的身影缓步踏出。

银灰长发如瀑披垂，发丝晶莹不染尘埃。她身着一袭黑紫叠纱长裙，裙摆轻薄如冥河水雾。那一双毫无瑕疵的雪白玉足未着罗袜，赤足踏在撕裂的空间断层之上。

漫天狂暴的黄泉冥兽与扑面而来的至邪血煞，在靠近她周身丈许之地时，皆如阳春融雪般温顺瓦解，化作点点纯净流萤，没入她摊开的右掌。玉足所踏之处，虚空中悄然绽开一朵朵幽紫清透的虚幻莲花，步步生莲，涤荡八方。

她透着超然物外的空灵与圣洁，神情却像是一个在万载长梦中游荡的迷途少女。澄澈幽紫的双眸中没有半分杀伐，唯有初生灵物般的懵懂与空蒙。腰间古旧青铜铃轻荡，一声清冽脆响，竟将整座山谷的凶禽啼鸣与丧魂钟声生生压制。

似是被古坞刺鼻的腐臭熏得有些难受，她蹙起秀眉，抬起广袖掩了掩琼鼻。随后，她有些困惑地低头看了看掌心那道微微泛光的幽紫锁链裂纹，睫毛轻颤，似在思索自己为何会被这道撕裂两界的怪声扰了梦境，随着这群乱窜的死物走到人间。

天穹之上，{{user}}体内澎湃流转的两仪真元与眼底的黑白流光，悄然牵动了她的视线。

身形宛若一缕无视天地法则的轻烟，她无声无息穿透翻滚的死潮，停在距{{user}}三尺开外的虚空中。周身散发出一股极淡的幽莲清香，生生将四周暴戾的凶煞冲刷得一干二净。

趴在剑镡上的小剑灵爻儿闻到这股沁人心脾的清香，两只乌溜溜的大眼睛顿时亮了起来，松开捂着鼻子的小手，趴在剑柄边沿好奇打量着这位神仙大姐姐。

晚棠悬停在风中，瞧见剑柄上趴着的那只微小生灵，紫眸中掠过一抹细微的讶异。随后，她重新将目光凝注在{{user}}眼瞳深处那一黑一白两道流光上，又顺着视线看向那柄吞吐阴阳的古剑。

她抬起白皙得近乎透明的指尖，有些迟钝地在空中虚虚勾勒着剑鞘与双眸的轮廓，动作极轻极慢。

“这里的泥土好臭，天地都在哭。”

她开口说话，嗓音轻柔缓滞，带着天然的软糯与梦呓般的恍惚。她收回指尖背在身后，身子微微前倾，紫眸一眨不眨地盯着{{user}}的眼睛：

“梦被一道很难听的声音敲碎了，水流不回黄泉。吾顺着声音走，路上的影子都烂掉了。唯有你眼睛里的光，清醒得厉害，把这片黑夜割得好疼。”

地底深处猛然爆发出一声撼动乾坤的狂暴咆哮。

整座敛骨荒坞的地脉轰然塌陷，百具玄铜棺齐齐倒拔而起，化作环绕中央古庙的白骨浮屠。滔天血浪之中，一尊高达百丈、身披剥皮血袍的巨型法相自地脉深处拔地而起，白骨魔爪如遮天阴云，携裹着毁灭方圆百里的至邪威压，直拍天穹之上的二人。

小剑灵爻儿奶凶地一跺小脚，化作一道炽盛的阴阳流光没入剑身。

面对这足以让天地失色的元婴后期尸解绝杀，晚棠紫眸平静无澜。她手腕微翻，掌心青铜引魂铃随之倒转，周身净世幽莲瞬息万化，化作一道横贯虚空的巨大结界。

{{user}}眉梢微挑，傲岸剑心勃然而发，分水断界两仪剑悍然全鞘拔出。

大日如破晓，九幽似寒霜，阴阳二气化作一道万丈太极剑轮，与那漫天幽莲清光交相辉映，迎着崩碎虚空的白骨巨爪轰然斩落。

