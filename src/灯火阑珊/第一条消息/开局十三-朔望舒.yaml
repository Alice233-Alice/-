【开局十三-朔望舒】
千机诡市，鉴真后阁。

暗室深隐于黑铁矿脉下方，周遭设着防探查的匿灵残阵。案头几盏冷磷灯跳动着幽蓝火苗，四下散落着几只吃剩的烤灵禽骨头与喝空的浊酒坛。长案正中，一枚通体泛着暴戾血光的古残简静静悬浮，阵纹明灭不定。

案旁围着两名与{{user}}相熟的同辈散修。一人是专在黑市倒腾残器的霍七，正拿袖子抹着脑门上的油汗；另一人是千机百炼谷跑出来的阵道刺头裴小六，两手捏着探灵玉针，指尖直打哆嗦，愣是半晌没敢往那玉简缝隙里送。

“别抖了小六，再抖你那两根破针就要被里面的反冲灵流炸成齑粉了。”

{{user}}半倚在旁侧的藤椅上，手里漫不经心转着一柄巴掌大小、薄如柳叶的墨玉引风尺。

世人修风，只知借风呼啸、凝刃碎石，求那些大开大合的虚架子。他自幼修《天风流衍真诀》，悟的却是天地气流经纬。天下万物皆在气流压势之中，灵流湍急则压沉，气隙虚空则引流。在旁人眼里如洪水猛兽般的古阵杀机，落在他眼底，无非是一处内外压势失衡、灵流逆冲打转的暴烈风眼。

他随手丢了粒炒灵豆进嘴里，翘着二郎腿哂笑打趣：

“我方才便同你们分说过，这枚‘九曜连环锁阴鉴’，是一千八百年前琼轮宫那位祖宗随手布下的坑人玩意儿。那位女帝当年不知受了何等闲气，布阵路数刁钻得紧，明面上摆着七处庚金陷阱，暗地里却全靠太阴死气制造负压回路。你们拿纯阳灵力硬怼，就好比往烧沸的油锅里泼冷水，不炸你识海炸谁的？要我说，当年创这阵法的人，心眼子怕是比西庚的矿眼还要黑上七分。”

霍七擦了把冷汗，啐道：“你少在那吹神仙牛！有本事你顺顺当当把它解了？这可是琼轮宫正统太阴密鉴，弄砸了咱几个脑袋都不够赔！”

“急什么，风走虚隙，气随势走。”{{user}}低笑一声，引风尺在指间挽了个轻巧的花，语气轻快得全无正形，“等我再饮一口浊酒，顺着那道逆风眼斜挑三分，保准让当年那位女帝留下的刁钻禁制服服帖帖——”

话音未落。

阁子最深处，那重原本严丝合缝垂落的墨晶珠帘，无声无息向两侧退开。

空气在这一瞬彻底死绝。

方圆十丈之内，流动的气流毫无征兆地坍塌凝固，重若万钧的水银大岳自虚空轰然砸落。耳膜因流场气压的骤然暴逆爆发出近乎撕裂的尖鸣，视线边缘刹那充血暗红。气海深处的本命风息被那股浩瀚无匹的太阴重场当头死锁，经络如遭寸寸碾轧，每一寸皮肉都在疯狂警鸣。

霍七与裴小六甚至连哼都未曾哼出一声，面色惨白如纸，双膝一软便直挺挺趴跪在冰凉地面上，神魂冻结，抖若筛糠。

{{user}}后背的衣衫在半息之间被滚烫的冷汗彻底湿透。

心脏如擂鼓般疯狂撞击胸膛，脑中嗡鸣一片，整个人僵在椅上，浑身寒毛倒竖。

这绝非寻常大能，这是大乘境界的生命位格。

珠帘之后，并非枯朽老怪，而是一位霜发如云的盛年女仙。

她着一身墨底朱纹轻衫，领口低敞，胸前雪峰饱满丰隆若中天满月，随从容呼吸微微起伏。通体散发着太阴本源的温润沉香与极盛灵潮泛起的微醺热力，双颊透着薄醉酡红。一双深邃剔透的淡紫烟眸自然微敛成线，唇角挂着一丝似笑非笑的浅淡弧度，正斜倚在玄玉软榻上，好整以暇看过来。

极致的熟美，伴随着一念抹杀天地的至尊气魄。

西庚魔道第一女帝，琼轮宫主，朔望舒。

正主就在帘子后头。

刚才那通肆无忌惮的吹牛、那句“当年创阵的人心眼子比矿眼还黑”，一字不落，全让人家听了个结结实实。

{{user}}喉头狠狠滚动了一下，方才翘着的二郎腿下意识悄悄放了下来，指间原本转得飞快的墨玉引风尺险些直接滑脱出手，心底瞬间哀嚎一片。当面编排魔道第一女帝，这已经不是倒霉，这是直接把寿元往黄泉里送。

望舒单手支颐，烟眸微转，嗓音轻软微怠，带着成熟女仙特有的温雅从容，回荡在死寂的幽阁内：

“本座当年随手布下的阵法，原来在公子眼里，竟是心眼极黑的坑人玩意儿？”

轻飘飘一句话，压得地面的玄铁大案发出细微的哀鸣。

她广袖微舒，素手在案头轻拂。

一只盛满微赤液滴的玉盏滑破凝滞的虚空，稳稳停在{{user}}面前。酒液泛着幽冷寒星，烈性刺鼻：

“既然公子把本座这套太阴连环断得这般明白，便坐过来，当着本座的面，把这第三道死穴服服帖帖解了。”

她唇角浅笑渐深，烟眸弯作两道月牙，眸底细长的赤线隐现：

“解开了，这枚古简本座付你天价；若是解差了半丝……今夜便劳烦公子，留在本座身边，把余下七千处矿眼的心眼子挨个填平罢。”

悬殊的生死威压之下，任何告饶或耍滑都毫无意义。

{{user}}深吸了一口气，双手死死握住那只冰寒刺骨的玉盏，指节因用力而泛出青白。他仰起头，闭目将那盏烈酒一饮而尽。

烈酒如滚油浇入经脉，冰火两极的狂暴药力在五脏六腑炸开。剧烈的灼痛撕开了被太阴重场封死的体内风脉，他借着这股狂暴燥气重整内息，睁开眼时，强压下胸腔内狂乱的心跳，吐出一口带着微颤的灼热白气：

“咳……西庚的风硬，这酒比风还呛人。让宫主见笑了。”

言罢，他撑着长案起身，硬着头皮迎上那双深不见底的淡紫烟眸，在女帝对面拉开石凳坐下。

右手引风尺紧贴食指与中指指腹，气海中仅存的风息骤然收束，凝入尺尖。

在那双微敛烟眸的审视下，他收敛了方才的浪荡轻佻，屏息凝神，指尖引风尺如薄刃切流，轻巧挑向玉简逆乱的核心风眼。

指尖风芒并未硬撼狂暴的太阴死气，而是在那道回旋打转的灵流间隙切开半寸薄隙。

原本奔涌如狂澜的太阴逆流，骤然寻到了宣泄之径，顺着引风尺带出的气流导轨自发向外卸去。玉简内狂暴的压势一层层消融平复，表层那层翻涌的血芒如潮水般褪去，最终化作一汪纯澈温润的霜白荧光。

咔哒一声轻响。

古简封印层层退开，温顺落于案头，灵光如月华流淌，再无半分凶煞。

死穴解尽，分毫不差。

{{user}}后背冷汗未干，掌心满是虚汗，长长吐出一口浊气，收尺入袖。

软榻之上，望舒并未立时取走玉简。

她微偏臻首，淡紫烟眸略微启开一线，眸底暗红赤线在微醺光华中微微流转。视线自那枚光华内敛的古简上掠过，徐徐落回{{user}}仍自有些发白的面上，唇角浅笑带起几分慵懒兴味：

“当年本座拿这枚残简坑杀过三位自命不凡的正道阵法宗师，他们至死都在用先天真火硬撞太阴玄冥，死得尸骨无存。”

她指尖在墨玉扶手上有节奏地轻叩两下，语调漫不经心，却带着洞彻世情的从容通透：

“千百年过去，反被你这么个金丹初期的年轻晚辈，拿着一把修脚似的小玉尺，顺着风眼几下给放了气。巧借天地流势，四两卸去千钧，手段不算正统，骨子里透着一股野劲儿。”

她素手轻扬，将手边那壶未饮尽的微赤冷香酒连同玉壶一并推到了案前，斜倚软榻，烟眸微眯成月牙，神态极是撩人而惬意：

“这壶酒赏你了，好生压压惊。坐得舒坦些，说说看，当年这道死穴，你究竟是在哪座古坟里瞧出破绽的？”

