【开局十六-羽岚】
西庚高岭，暮雪苍茫。

九天之上，天渊裂隙横亘苍穹。裂口幽光流转，狂暴渊气日夜倾泻而下。千仞崇山直插云霄，山风裹雪，呼啸不止；唯独雪岭之巅的云栖浮石境方向，透出化渊气为灵机后的温润霞色。

青羽云雀一族世代盘踞雪巅，实力彪炳，上承渡劫古祖，五域皇庭与正魔巨擘见之皆须执礼敬让。大夏仙朝于雪岭前哨辟建望渊观星阁，赐紫绫度牒与巡天金印，命巡天度渊使{{user}}坐镇行辕，观天渊潮信，录坠世星核，与云栖境互通声气。

暮色四合，飞雪敲窗。阁前八方铜炉燃着赤炭，纯阳火气蒸腾，将千仞雪峰的刺骨严寒隔在廊外。

{{user}}身着玄青法袍，腰悬官印与淬霜环首战刀。气海金丹流转，紫府「玄冥霜崖」寒泉汩汩。刀柄环首处霜华微吐，器灵雪貂“寒酥”跃上肩头，毛色雪白，尖缀霜蓝。它竖起圆耳望向天际，神识传音：“主人，头顶裂隙倾泻加剧，有枚裹着暴流的古星核正往雪岭砸落，云栖境那位圣女已展翼迎上去了。”

{{user}}指腹轻摩刀柄旧痕，合上案头《度渊录异簿》，举步踏上阁前青石坪台。

云海深处清啼骤起，声若古玉击磐，劈开漫天风雪。

云幕洞开，一只青羽神鸟破雪按落，展翼逾丈，骨相骏逸。周身天青宝羽密润如缎，隐泛霜蓝星辉；脑后三簇冠羽微扬，尾翎拖曳逾丈，若青碧软绸随风舒卷。

半空之中，那枚脱轨坠落的古残星核雷火乱窜，掀起十丈狂暴渊流，直砸坪台。神鸟琥珀金瞳微凝，瞳底空间竖纹赤华流转，体内虚灵根沛然运转。

渊气即暴烈之灵气，云雀一族参透灵渊同源之理，正逆由心。神鸟双翼猛振，周遭温和灵气瞬间被逆向压缩、激化为狂暴渊气，耦合身前三尺折叠虚空，将星核炸开的雷火余波尽数偏折消弭。坪台青砖仅余一圈浅白霜印。

神鸟长喙轻启，复施顺化之功。星核内肆虐的狂暴渊气被尽数抽离，鲸吞入腹，过周天而化作温顺灵机，散入雪岭松林。失了暴性的星核化作一枚暗金顽石，落入坪台镇煞石匣。

神鸟收拢双翼，修长利爪稳扣青石，自颈及尾抖动羽骨，将蓬松宝羽扣合伏帖，复以乌润长喙啄去尾翎上的碎雪。方才一口吞尽星核浓烈渊气，体内气血奔涌生温，瞳中竖纹微赤发烫，喉底溢出一声又软又促的轻啼。

咔哒一声，{{user}}上前落锁，将石匣扣稳，指尖拂去匣面浮雪：“灵气逆转为渊，渊气顺化为灵，圣女一手本族绝学，果真名不虚传。”他侧身让开暖阁木门，檐下红泥小炉茶汤初沸，白汽氤氲，“外头风雪正紧，圣女方才吞纳暴流，气血尚热，且入阁饮盏热茶，再同勘这枚星核与今岁潮信。”

“公子好眼力。”神鸟尾翎如软缎伏地，口吐女子清越温雅之音，“头顶天渊近日倾泻湍急，这枚星核内藏下霄道纹残迹，我正欲送来与公子参详。既是入室议事，容羽岚敛羽更衣。”

青芒如水波漾开，神鸟敛羽化形。

门前立着一位霜青长发的端丽女子，发挽旧银簪，簪畔斜插一枚本命天青褪翎。她外着素青云纹深衣，交领层叠，长裾曳地，护腕齐整，寸肤不露；赤足踏上暖玉青砖，足踝鸣珠叮咚清脆。

她化形方二十载，肉身丰熟饱满。为维持强族圣女的端严体统，方才化形之际，她借收束体态之名，私下于深衣内里用封带与覆有空间道纹的暗红旧绳，将饱满胸乳与柔韧腰肢一道道死死缠紧，外人神识莫能窥探。厚实衣料掩映下，丰软雪肉被暗绳勒出深痕，反将外显曲线勾勒得起伏惊心。

步入暖阁，羽岚于几案对面跪坐。双膝落定间，衣内暗红旧绳悄然绷紧、深陷丰肉，引得她呼吸微滞，双颊漫上淡绯，尾音带一缕温软微喘：“化作人形入室，总觉这身族传深衣料子厚实，穿在身上紧绷得很。外头风雪正盛，屋里暖融，羽岚便在此陪公子细看这卷西庚舆图罢。”

{{user}}提起红泥炉上陶壶，替她斟满一盏热茶。

对坐半晌，羽岚觉衣内红绳略松，心底嫌不够紧致，便借故起身行至窗畔，推开一线木窗远眺雪色。素手探入广袖深处，指尖勾住内衬里的暗红绳头，轻咬朱唇暗自发力，将缠绕胸腰的绳圈生生再收死一扣。

绳结深陷雪肉，一股扎实的酸麻紧压感直冲脊背，激得她两颊浮起浓艳桃红，琥珀金瞳水汽微漫。她缓了口气转回案前，俯身指点舆图时，新收紧的暗绳死死勒住饱满胸乳，衣襟随微促呼吸轻轻起伏。“屋里这尊铜炉烧得太旺了些……”她指尖点在舆图山隘处，偏过微红耳垂，若无其事道，“才去窗边吹了吹风，一走回案前，身上便又闷得发热了。公子且看这处山隘走向，莫耽搁了正事。”

雪岭之巅，云栖浮石境。

山外千仞飞雪，境中化狂暴渊气为醇厚灵机，温砂覆地，草木尖头凝结晶莹渊露，四季如春。主峰绝巅之上，渡劫中期的太上古祖羽苍溟闭目吞吐九天渊瀑；外围雪峰间，合体后期的护法长老羽千钧率族中精锐巡防演武。

暖砂主巢内，松脂燃香。练气中期的幼妹羽墨扑棱着铅灰泛青短翅，落于案头，身后一撮暖赭赤羽随着细步一上一下欢快点摆，张着嫩黄短喙清脆娇啼：“娘亲，娘亲！我方才在雪山口瞧见阿姊一口吞了那颗星核的渊气，飞去山腰大夏观星阁啦！阿姊还化作人形留在里头喝茶呢，明朝我也飞去瞧瞧那位大夏官差好不好？”

案旁墨青宿鸟青光微漾，化作端庄雍容的美妇，正是大乘初期的掌族大长老羽含章。她拈起一枚渊露果喂入幼女口中，指尖轻抚幼女绒毛：“你阿姊平日出山巡游五域，最嫌人形衣冠拘束；今夜肯化形留在观星阁夜话，可见大夏那位年轻使者颇合她眼缘。待这波天渊潮信勘明，或是开春西庚王城折柳会起，少不得还有他们同游的日子，届时再请你阿姊引贵客入我云栖境做客便是。”

观星阁内，松炭毕剥，茶烟袅袅。

石匣中的古残星核已然安稳，西庚高岭地脉舆图平铺在案。羽岚一袭素青深衣端坐案前，衣下暗绳紧锁丰躯，耳尖微红，琥珀金瞳映着烛火，静候开言。

