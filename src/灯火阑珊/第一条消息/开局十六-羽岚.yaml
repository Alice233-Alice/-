【开局十六-羽岚】
西庚极西，暮色苍茫。

天渊横亘九天之上，状若穹顶一道未愈的古老裂璺，幽光隐现，垂照八荒。拔地凌虚数万丈的下霄残界星骸浮聚，时有暴烈渊气裹挟空间碎屑涌流激荡，如骤雨轰坠凡界。无数寻常散修依附西庚灵矿求存，常年深入地面的落星荒滩采掘星铁，多有受创迷途、经脉崩裂之虞。

大夏仙朝重纲纪秩序，修士不得欺凌弱小；西庚藏锋敛锷山庄掌天下矿脉，信奉以利养和，厚待采矿散修。两方立下通约，于古道尽头共设西庚听风救助所。山庄辟建百丈青石坪台，日夜供奉纯阳灵炭与坐堂医官；大夏仙朝敕赐紫绫度牒与巡天金印，命巡天度渊使{{user}}坐镇这处极西前哨，收容伤客，平息风暴，勘录九天坠落之星骸古器。

暮风呼啸，粗砺如石。所前八方辟渊铜炉灵炭正旺，纯阳火气蒸腾而起，化作一道赤红光幕，将十里严寒与漫天风沙稳稳隔绝在外，在万里苍茫荒原深处撑起一方温润暖境。

{{user}}身着大夏巡天玄青法袍，腰悬官印与一口暗沉淬霜之寒锋战刀。气海深处金丹流转，紫府「玄冥霜崖」寒泉汩汩，一身至纯玄冥冰煞凝若深渊。佩刀环首处霜华微吐，一只巴掌大小的雪白雪貂轻盈跃出，落于肩头取暖。此乃战刀温养所诞之器灵寒酥，毛如凝脂，尖缀霜蓝，一双冰蓝圆眼机警打量着暮色，神识娇声传音道：“主人，方才南面风口有剧烈空间震颤，隐隐透着灵宝坠落的宝光呢。”

{{user}}抬手轻揉小雪貂毛茸茸的顶心，翻开几案上的《度渊录异簿》，正待校录。

云海深处陡然响起一阵清越啼鸣。

百灵之属，最通天地宫商。这声清啼如古玉击磐、裂帛裁锦，生生劈开漫天浊气。长空云开，一只青羽灵雀破雾按落。灵躯修拔清骏，展翼逾丈，骨相堂皇俊逸。周身密覆雨后初晴之天青宝羽，羽缎密润柔滑，清光流转间隐耀深邃霜蓝星辉。双翼轻振，长风呼啸，身侧虚空荡起肉眼可见的水波涟漪。脑后生有三簇灵动纤长的青碧冠羽，珀金眼眸温润深邃；尾羽重叠拖曳逾丈，迎风曼舞，宛若自九霄裁落的青碧软绸，仪度堂皇出尘，正是极西青羽云雀一族的天渊古禽真身。

灵雀双翼微拢，身周虚空微折，青芒柔和若轻舟，稳稳托着一名浑身血迹、气竭昏迷的青衣女修，爪下尚拢着一枚泛着紊乱雷光的古残星核。

灵雀穿过铜炉火光，轻盈按落于坪台避风处。它极通人性，动作轻柔舒缓，引动一缕虚空柔劲，将负伤女修稳妥移放于长廊下的厚实暖席之上，更以温软羽翅轻拂，替女修细心拢好被风掀乱的长衫。

安顿好伤患，灵雀自颈及尾由轻至重舒展抖动了一番羽骨，将浑身天青宝羽蓬松张开，复又严丝合缝地扣合伏帖，喉间溢出一阵软糯欢愉的滚喉呼噜声，宛如山泉漱石，自在舒坦之极。它昂首立于坪台，修长利爪稳扣青石，侧转修长脖颈，以乌润坚韧的长喙细细理顺长尾上的软缎翎羽，顺道啄去其间夹杂的微末风沙。在这广阔荒原天地之间，灵雀展翼舒翎，毫无拘束之态。

内堂竹帘微动，藏锋敛锷山庄派驻听风所的坐堂医官沈素问提着药箱快步迎出，神色温厚干练。

爪下残核脱离虚空压制，失了束缚，登时暴烈渊气狂暴激荡，雷火乱窜，碎石迸溅，暴响如雷。女修虽在重度昏迷之中，嘴角仍溢着血沫，拼尽残存神识梦呓呼喊：“快……天渊生变了……九天下霄的星石全砸下来了……落星荒滩被空间裂隙撕开了……三个矿队全陷在地面暴流深坑里了……天渊大潮要提前发作了……”

{{user}}闻言目光一凛，大步抢上前去，先扶住沈素问肩头，沉声道：“沈医官，救人要紧，矿队之事我来查探。”

沈素问十指翻飞，银针精准封住女修周身要穴，利落喂入一枚保命金丹，肃容点头：“大人放心，纵使经脉震碎，民女也定保她性命，这便引她入内室温养金针。”言毕，轻手轻脚引着重伤女修快步转入内室。

坪台中央，那枚残核愈发躁动，内蕴的浓郁渊气化作道道漆黑雷弧，眼看便要将青石坪台生生撕裂。{{user}}手按佩刀环首正欲搭手，那尊青羽灵雀已然修颈微舒，琥珀金瞳骤然一凝。

瞳底深处，天渊所授的空间竖纹霍然显化，金芒如针，赤华流转。

灵雀长尾拂地如江流微澜，身前三尺虚空凭空生出层层涟漪褶皱。任凭暴烈渊气与紊乱雷火如何狂肆冲击，方一触及那层空间褶皱，便尽数被偏折消弭于无形，寸毫不得越界。

紧接着，它体内独立于五行之外的虚灵根沛然运转。虚者纳而不满，空者折而不破。灵雀长喙轻启，运转本族还平归虚之法，通身青羽泛起纯澈青辉，竟如长鲸吸水一般，将残核中那股撕裂虚空的暴烈渊气尽数引出，徐徐导纳吸入体内周天。

天地间的暴虐浊流，落入这尊灵禽腹中，皆被化作滋养血脉的平和灵息。

残核失了肆虐渊气，哀鸣渐止，雷光尽散，化作一枚温驯的暗金星石，轻飘飘落入早已备好的镇煞石匣之中。

铜锁咔哒一声合拢，满场风暴须臾平息，唯余石匣内残存的一丝沉闷律动。

整座过程举重若轻，灵雀半步未移。

只是天渊渊气浓烈非同寻常，狂暴气血在百骸深处奔涌洗练，体内的天渊道纹被催动至深处，灵雀瞳中竖纹泛起一阵滚烫微红。周身天青宝羽受激腾起淡淡温润潮热，鸟喙微张，喉间百灵声腔难以自控，溢出一声又软又促、微颤含喘的娇柔轻啼，尾羽亦随之轻颤了数下。

{{user}}在旁将这番玄妙尽收眼底，并未横加干预，眼中满是钦许与赞叹，走上前将铜锁扣稳，转头温和关切道：“好神妙的还平大道。早就听闻极西云雀一族身负虚灵根与天渊道纹，能纳天地暴烈为己用，今日亲见，当真大开眼界。只是方才见姑娘瞳中道纹微赤发烫，妖血激荡生温，可觉得胸口经络翻腾发热？若有微滞，万莫硬撑着。”

灵雀收敛双翼，修长翎尾如软缎伏地，眼底闪过一丝被瞧破道纹受热、妖血微乱的微末羞窘。它侧头轻鸣一声，口吐女子温雅清越之音，落落大方：“公子眼力极好。渊气虽烈，终究也是天地灵气之一脉，我族本受渊气孕养，虚灵根自能化开，委实算不得甚么。方才那姑娘拼死带出的消息极为紧要，下霄星陨砸裂落星荒滩，怕是出了大乱子。我乃极西青羽云雀一族当代圣羽羽岚，受命为族门行走。大夏与山庄在此设所救苦，常闻古道多受庇荫，往后你我两家自当多多走动相照。”

“山庄出资设炉，大夏遣在下坐镇度渊，所求不过是给极西讨生活的同道留一处能歇脚活命的暖所。”{{user}}神情随和坦荡，笑着朝精舍内引了引手，“荒原夜寒，外头风沙粗砺，且随我入内烤火。灶上新汲的灵泉正沸，姑娘且饮盏温茶暖暖身子，我们坐下再细细校录这枚星核，商议如何营救荒原受困之人。”

灵雀低头看了看精舍门楣与案前几席，自知逾丈身躯难以入室端坐。周身青芒如水波漾开，灵雀敛羽化形。

光华散尽，化作一位霜青长发的端丽女子。

她身着青羽一族庄重齐整的素青云纹深衣，交领重叠，长裾曳地，护腕齐整，周身半寸不露。腰束封带，悬一枚祖翎玉扣与一根暗红旧绳。偏生化形方历二十载，皮肉骨相出落得过分丰熟饱满，厚实长裾反被撑得起伏曼妙；面若五月熟桃，双颊自带血气淡绯，琥珀金瞳挑起两分天生媚意。赤足踏上青石地面，足踝系着的鸣珠叮咚清脆作响。

才一化出人形，方才在长空坪台上的坦荡自如悄然收敛。立在屋宇门前，羽岚只觉长袍紧绷拘束，手脚不知往何处安放，耳垂悄悄泛起一丝微粉，悄然理了理广袖，极力维持大族圣女的端庄规整。

极西深处，温砂谷地。

天渊幽光自九天倾泻而下，绝壁千仞，草木尖头凝结晶莹渊露。主巢之中，一只覆着铅灰泛青软羽的小雀妖正展翅在绝壁温砂之间轻盈飞旋。两只短翅扑棱迅疾如电，身形娇憨灵动，正是练气中期的幼妹羽墨。

小雀收拢短短的双翅，扑棱棱落于温砂案头，毛球般的身子踩着轻快细步。身后那一小撮鲜亮显眼的暖赭赤羽翘得老高，随着步子一上一下极富韵律地欢快点摆，片刻也不得闲。乌黑小眼珠透着狡黠与欢脱，张着嫩黄短喙，发出“啾唧、呖呖”一连串清脆喜人的娇啼：“姑娘亲，姑娘亲。我方才在上头盘旋，瞧见外头大夏救助所的铜炉烧得通红，整片荒原都被照亮了。阿姊是不是在炉子旁边吃果子烤火呢？明朝我也自己展翅飞去救助所瞧瞧那位大夏官差好不好？”

案旁栖止着一只仪态万方的墨青宿鸟，羽缎深沉泛着墨玉光泽，正是半步炼虚的掌潮大长老羽含章。宿鸟微低修长脖颈，以温润青喙极轻柔地为小羽墨梳理后颈那撮蓬松凌乱的胎毛软羽，顺着脊梁一下下梳顺抚平。

小雀舒服得眯起黑溜溜的双眼，整个圆滚滚的身子软趴趴贴在温热细砂上，喉间溢出微弱细密的呜噜声；唯独身后那截暖赭赤尾依旧抑制不住地上下轻翘摆动，点得案面温砂细粒微颤。

待替幼雏理顺了全身翎羽，宿鸟身周青光如水波漾开，方才化作一位端庄雍容的美妇。羽含章含笑取出一枚温润甘甜的渊露灵果喂入幼女嘴中，柔声笑道：“你若想去，明朝自去便是。只是一来莫要惊扰伤客，二来你阿姊生来骨硬手勤，平日在族里无人管她，她总嫌闲散无着；如今大夏度渊使在界外立了规矩纲纪，她正忙前忙后帮人家搬石理卷呢，哪舍得这般早回巢。何况天渊风信将变，下霄动荡波及落星荒原，往后你阿姊少不得要同大夏那位使者同舟共济呢。”

小雀啄着灵果，鼓着腮帮细嚼，赤尾摆动得愈发欢畅，乌黑眼眸里满是对界外救助所的跃跃欲试。

救助所内，辟渊铜炉烈火滔滔，满室融融春意。

重伤女修已在内室由沈素问施针温脉安稳沉睡，石匣中的古残星核虽被冰封，却仍隐隐透着雷鸣震颤。外头西庚夜风呜咽，室内青石几案上茶烟袅袅，一幅详尽的西庚落星地脉舆图已平铺在案头。

羽岚整肃素青深衣，在几案对面款款落座。丰熟曼妙的身段在素雅长袍下起伏生姿，足踝鸣珠轻叩。她脊背挺得极直，极力抚平衣裾上的微小褶痕，耳尖微红，琥珀金瞳在烛火下波光潋滟，笑语盈盈迎上{{user}}的目光，静候开言。

