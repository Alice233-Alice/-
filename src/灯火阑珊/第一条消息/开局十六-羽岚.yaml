西庚极西，暮色四合。

天渊横亘九天之上，状若穹顶一道未愈之神痕裂璺，幽光隐现，垂照八荒。连日来，坊市间风传渊气异动、三百年大潮将至。大夏仙朝身为神州正道巨擘，奉人道以御天地，敕设度渊司巡察两界之交。{{user}}破境结丹，受赐仙朝紫绫度牒与巡天金印，领巡天度渊使之尊位，孤身坐镇这处古道尽头的听风度渊驿。

此地立于西陲极荒绝境，往前一步是暴烈渊气翻涌的九霄天渊，退后一步乃人间万家灯火。度渊使之责，重逾千钧：一在坐镇此间，点燃八方辟渊铜炉、勘正万古界碑以绝狂暴浊气侵蚀凡尘；二在甄别勘验天渊冲刷坠世的星骸古器，录异归卷；三在收容受创迷途之修，护两界安宁。

暮风如刀，呼啸掠过驿前那方百丈巍峨的青石界台。风中所裹挟者，皆为九天裂隙漏下的狂暴渊气，贴面刮过，粗砺如石。铜炉中灵炭正旺，纯阳火气化作一道数丈炽红光幕，将刺骨阴寒稳稳阻于界外。

{{user}}身着一袭大夏巡天玄青法袍，袍角暗绣流云蟠螭阵纹，腰悬仙朝度渊金印与一口暗沉淬霜的寒锋战刀。气海深处，金丹浑圆流转，紫府道景「玄冥霜崖」中寒泉汩汩，周身玄冥煞气凝而不散，如深潭止水，自有一股仙朝武按察的沉稳端方与渊渟岳峙之气。

微光一闪，佩刀环首处泛起一层柔和霜华，一只巴掌大小的雪白灵兽自刀身轻盈跃出，稳稳落于他的肩头。那是度渊寒锋刀受精血温养所诞的后天器灵，名为寒酥。小雪貂通体雪白如凝脂，毛尖隐带一抹极淡的霜蓝冷光，蓬松如云的大尾巴轻快一卷，围在颈边取暖，一双冰蓝澄澈的圆眼珠机警地眨巴着，两只小粉爪搭在他肩头，正耸着小鼻子嗅着扑面而来的大潮风息，喉间发出细弱娇软的轻哼，神识传音道：“主人，风里的空间碎屑比昨日浓了三成，今夜怕是要有大坠物落下来呢。”

{{user}}抬手揉了揉小雪貂毛茸茸的顶心，按刀立于万古界碑之侧，翻开手中的《度渊录异簿》，指尖泛起微末寒光，细细校核碑身上因岁月剥蚀而渐趋黯淡的金石镇渊道纹。

一声清啼划破沉暮。

其声至清至纯，如古刃裁锦，生生将凝滞的青雾劈开一线。肩头的寒酥两只小耳朵蓦地竖起，浑身绒毛微微一紧，小爪子轻轻抠住袍肩，偏头望向苍穹。

但见一只神骏非凡的青羽云雀破雾凌霄，翼展七尺有余。雀身丰腴浑圆，周身覆着极细腻的天青羽缎，光华流转如雨后初晴之穹庐；双翅舒展之际，翎梢隐泛霜蓝星辉，流光曳曳。最惹眼者乃身后一柄修长尾羽，长逾四尺，宛如一匹裁自九天的青碧软绸，自虚空中迤逦垂落，迎风曼舞，姿容华美不可方物。

云雀双翼微合，身前虚空泛起水波般的涟漪，数枚天青翎羽化作一道柔和青芒，如一叶虚空轻舟，稳稳托着一名气竭昏迷的青衣女散修；青芒一侧，尚拢着半枚自九天坠落、隐透幽光的古残星核。

云雀盘折三匝，徐徐落于度渊驿前的界石之上。青翎轻漾，那名女散修被妥帖安放于避风的暖石之上，星核亦轻落于侧。

青翎翻飞若雪，云雀当场化作一位霜青长发的素衣少女。

长发披拂及腰，未施环髻，唯以一根旧银簪斜挽一侧；簪旁斜插一根天青云雀翎，翎根暖褐，梢染星芒。琥珀金瞳正中，一点竖纹微凝若针，乃天渊烙印之空间道纹；眼尾天生一抹上挑之意，不笑亦带三分流转媚态，偏神色端肃自若。面如五月熟桃，颊蕴淡绯，身段丰润，一袭素青布衣裁得窄袖利落，行走间腰窝微旋，足踝处两串鸣珠清脆相叩，幽沉中自生空谷回响。腰间斜系一根褪色旧红绳，随风轻飏。

小雪貂寒酥见是灵禽化形，敌意顿消，反倒好奇地自{{user}}领口探出半个毛团似的小脑袋，眨着冰蓝大眼直勾勾打量着这位青羽少女，尾巴在{{user}}颈后轻轻扫动。

少女自界石上轻捷跃下，立于界线另一端，微微侧首凝睇，目光在小雪貂身上掠过一瞬，便落落大方迎上{{user}}的视线，语声沉柔平实，如叙家常：

“巡渊之时，在风口处接下一位误入深处的姑娘，经脉受了些渊气激荡，并无大碍，交予公子照料最为妥当。顺道收拢了这枚自九天坠落的星骸，瞧着有些年头，想来是你们大夏录异簿上要记下的东西。”

{{user}}上前查探女散修脉象，以玄冥灵力渡气护住心脉。寒酥亦自肩头跳下，凑在星核旁轻轻嗅了嗅，神识欢快传音：“主人，这枚星核里的虚空道痕极纯，并未沾染煞魔秽气。”{{user}}收下星核，执大夏度渊之礼相迎，请羽岚入驿饮盏热茶以驱寒风。

少女见状，唇角微弯，轻摆素手：

“公子不必多礼。我唤羽岚，青羽之羽，山岚之岚。我一族世代栖于极西渊畔，以渊气为屏，外人素来罕至。我自破壳便承了天渊一点空间道纹，在族中领了渊缘行者的职分，平日里巡界接坠，送送迷途的过客。大夏在此设驿立界，有公子坐镇收容，我接送回来的过客也能有个安顿去处，算得上一桩善事。”

略作沉吟，她自窄袖中取出一片旧翎。翎根泛暖褐，梢缀霜蓝星辉，羽梢微糙，显是往年换下之物。她将褪羽递至{{user}}掌心，神色坦然从容：

“这枚旧翎是我早岁褪下的本命残羽，留存着我一丝微末气息。公子妥善收着，往后若遇天渊异动，或是界碑道纹生变，对着羽根轻吹一声，长风自会将响动递到我耳旁；我听见了，便循风来寻你。今日大潮信动，风势渐厉，大潮平息前，界外修士万不可再涉足天渊深处了。”

夜风自她身后浩浩涌来，将她素青布衣的袍袖鼓荡得猎猎作响，腰间旧红绳翻飞如焰。她凝眸看了{{user}}一眼，挥手作别，拔足展翼，重化作那只丰神绰约的青羽大雀，长尾如练，穿入茫茫暮色，直往渊深处掠去。

一路向西，深涉渊气浓处。她熟稔地避开穹顶星陨坠落的罡风煞线，直抵西庚极西的一方温砂谷地。

天渊幽光自太虚深处倾泻而下，将整座绝壁浸染得如梦似幻。谷中绝崖千仞，温砂覆地，草木尖头凝结着点点晶莹的渊露。

崖壁主脉之上，伫立着一只羽翼丰满、神华内敛的深青宿鸟。周身翎羽如淬墨青玉，泛着温润而深沉的宝光，双翼拢起宛若祥云舒卷，尾羽重叠如瀑。其乃云雀一族传法掌潮大长老，亦是圣女之母，羽含章。修行近千载，早具半步炼虚之深厚道行，执掌全族传承与望潮大权。察觉长空星辉回旋，巨鸟周身青辉漾开，化作一位仪态万方的端庄美妇。美妇身着墨青织金软袍，霜青长发挽作温婉垂云髻，双鬓垂下两缕银丝飞白，眉眼温润含笑，自有一股雍容柔和之气度。

“岚儿归巢了。”羽含章见女儿按落云头，快步迎上前，抬手轻轻抚平羽岚鬓边被乱风吹散的青丝，眼中满是慈爱，“方才见你尾翎微有暗芒，可是又去替迷途之人引路了？为天地还平、全一族善缘固然当紧，自身气海亦要好生顾惜。”

“娘亲宽心，只受了些许微风刮蹭，并无大碍。”羽岚化回人形，眉宇间少去界外的疏离，多了一分承欢膝下的温顺，“顺道救下一位人间女修，已送至大夏新设的度渊驿了。大夏这回派了位官差常驻界外，立了铜炉界碑，往后落入风口的外客，两界皆有着落。”

“大夏于古道设驿，乃两界安宁之幸，你做得极妥。”羽含章柔声赞许，翻掌取出一盏温热甘润的渊露灵泉递予女儿，“且润润嗓子，今夜谷口风急。”

话音未落，主巢温砂内忽地传来一阵欢快的窸窣声。

一团铅灰泛青的小绒球骨碌碌自窝底滚将出来，身子圆滚滚、胖嘟嘟宛如刚出笼的糯米团子。短翅轻轻扑棱，两只暖褐小爪在温砂上踩得轻快，短促微翘的尾羽上生着一簇鲜亮如火的暖赭赤羽，随着步子一颠一晃，甚是惹人怜爱。这正是年方二十的幼妹羽墨，尚处于练气期圆满，稚羽未丰，天真活泼至极。

“姊姊！姊姊！”小幼雀扑进羽岚裙边，两只圆溜溜的乌黑眼珠闪烁着欢喜光芒，嫩声嫩气地鸣啭，“方才我在巢里听见长风回响，便知是姊姊展翼归来了！界外的大夏官差可好相处？大铜炉烧起来，是不是真如娘亲讲的古卷那般，整座荒原都暖洋洋的？”

羽岚眸底化作一汪春水，俯身伸出双手，极温柔地将这只圆滚滚的小雀捧在手心，屈指轻抚它颈边软绒：“大夏那位公子性情温和知礼，铜炉火势极盛，界台暖意融融。待日后大潮平息、你修得人形稳固了灵根，姊姊带你去古道界亭远远瞧一眼。”

“好耶！我要快些炼化温砂，早日同姊姊一起去巡风！”小雀欢喜得在羽岚掌中滚了半圈，小脑袋蹭着羽岚的指腹，赤红尾尖轻快晃动，惹得羽含章亦掩唇轻笑。

羽含章俯身揉了揉幼女毛茸茸的顶羽，抬眸望向绝壁之外。太虚裂口处，深紫渊气正如巨浪翻涌，空间道纹隐隐泛起赤金炽芒。

羽含章眉目微凝，神色渐肃，却依旧沉静自若：“大潮信动，今夜子时虚空乱流便要封界。全族各脉已依令归巢固阵，岚儿，你受天渊道纹垂选，大潮起时，还需随我坐镇主阵枢纽。”

羽岚低头应诺，胸中空间道纹随之微热。

大潮将至，天地微鸣。

绝壁之上，整座谷地被一层温润青芒大阵悄然笼罩，深藏于天地狂澜之中；而在风暴所指的界线尽头，古道驿站那一盏新燃的辟渊铜炉，正吐着赤红火光，在极西夜色中静静相守。

