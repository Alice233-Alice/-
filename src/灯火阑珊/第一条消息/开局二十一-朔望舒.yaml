【开局二十一-朔望舒】
八月十五，中秋。

神州天河平滑若镜，水天浩渺，万里长空无纤云。

中天冰轮孤悬，洒下万顷寒芒，照得江心碎银流转，宛若置身积水空明之界。

一叶吃水极浅的乌篷木舟随流漂荡，孤悬于天河正中。船头架着一口红泥小炭炉，炭火微红无烟。瓦罐温着陈年桂花老酒，甜香裹着酒气袅袅浮动。铁箅子上两块手作的椒盐苏子月饼炙得皮酥油润，芝麻焦香随江风飘散数里。

{{user}}斜倚舟舷，身形英挺轩朗，生着一张廿八九岁洗尽青涩的坚毅面庞。神态闲适，眉宇间沉淀着渊渟岳峙的正道极巅气象，眼神深邃，不羁中透着从容。

他手中平举着一根温润如髓的九节青玉竹竿。一根晶莹如雪的纤细龙须化作青丝直垂入水，下端空空荡荡，无钩亦无饵。

万丈江流奔涌，那根无钩丝线却在水底纹丝不乱，若定海之针。

平滑如镜的天河江心，毫无预兆地荡起一丝清冷涟漪。

月华自九天倾泻，在水面凝作晶莹霜桥。

一道丰熟绰约的身影踏水而来，玉足踩碎江心倒映的中天满月。

两道大乘境界的神识与道则，在天河上空无声撞在一处。虚空深处发出一声唯有极巅修士方能听闻的沉闷道鸣。太阴极盈的浩瀚重场如万仞雪山压顶而至，撞上木舟周围浑然一体的正道清气，激荡消融于无形，江面未曾激起半寸恶浪。

来人止步于小舟十丈之外。

霜雪银丝高挽，着一袭墨底朱纹长裙，外披薄如蝉翼的素白云纹丝袍。领口低敞，胸前雪峰饱满丰隆若中天满月，随呼吸微幅起伏。淡紫烟眸自然微敛成两道浅淡月牙，唇角噙着从容浅笑。客场深入神州正道腹心，她全无半分戒备局促，通体萦绕着琼月道体的温润沉香与极盛之下的薄醉酡红。

一只玄玉灵猫踏波立于其侧，珀金双眸滴溜溜转动，紧紧盯着泥炉上的焦香酥饼。

踏水而立的女帝烟眸微挑，眸底细长的赤线在月辉中隐现，嗓音轻软微怠，带着成熟女仙特有的温润醇厚：

“天下水流皆朝东去，天上冰轮照彻大千。本座乘兴漫步神州天河，未曾料到，竟在激流里撞上一根定海铁桩。道友手中无钩无饵，垂在此处，莫非是专候本座的法驾？”

{{user}}手中青竹竿轻提，晶莹龙须破水而出，甩下一串如珠玉碎落的水滴，随手横置于案头。

竹身青芒微敛，神识深处悄然响起一道清冷而带着娇矜依恋的传音：

“这西庚的女帝尊主生得好生累赘张扬，领口敞得这般低，那两团雪肉便不怕被天河夜风吹散了灵气么？主人莫要总盯着人家的前襟瞧……”

{{user}}神色自若，指腹漫不经心在温凉的青竹竿身轻轻摩挲安抚。青玉竹竿微微轻颤，温顺敛去暗藏的龙威。

他转过目光，迎上女帝那双淡紫烟眸。神态平和，嘴角噙着一抹随性淡然：

“天河底下的水脉，奔流千万载从未停歇，方才因道友法驾凌波，凝滞了半息。线若有钩，惊的是贪食锦鳞；手中无钩，候的自是能让天河驻足的九天同道。”

他挽袖提起红泥炉上的黑陶瓦罐，倾注一道滚烫清亮的桂花酒，落入粗瓷陶碗，击出清冽细响：

“两千年前西庚定界，琼轮宫恪守方圆，两界安澜。今夜神州中秋，天上冰轮圆满，江心水天一色，女帝踏月涉水至此，倒是一桩意料之外的雅事。”

言语从容，全无虚张声势，亦无阵营私怨，尽是顶峰相见的大度与明澈。

朔望舒眸光微动，自那碗清冽桂酒移向眼前人沉静如渊的面容，心底了然。眼前之人深藏不露，道心之厚重浑圆，不在自己两千载修行之下。

她敛去周身澎湃如海的太阴威压，面上泛起温雅自若的从容浅笑。赤足轻移，凌波步入乌篷小舟。琼月纯阴道体自生的清冷沉香混着浓润体温，伴随微醺醇气盈满舟舱。

木舟随水波微晃，复归平稳。

她坦然在红泥小炉对面侧身坐定，墨底朱纹长裙层叠铺散于舟板，领口雪峰饱满丰隆，随舒展呼吸起伏。素手轻挽轻衫广袖，烟眸微转，语气从容知礼，极具宗师分寸：

“大乘孤行，千载辟谷，五域修士尽在枯坐中求虚无大道。本座久居西庚极渊，看惯了苦修与杀伐，尤念这口人间烟火。”

她单手支颐，打量着陶罐中泛起的桂花碎金，温言浅叙：

“今夜中秋，长空无云，冰轮朗照，正合我道体极盛之候。神州天河水清月朗，乃天地造化之绝景。本座乘兴涉水，未怀片羽杀心，能在此偶遇道友这般旷达人物，是机缘，亦是清欢。”

{{user}}淡然一笑，将斟满温酒的陶碗推至她面前，顺手以竹篾夹起一块烤得焦香金黄的椒盐苏子饼，置入白瓷小碟，推至案心：

“五谷草木历经人间春生秋实，经凡火烘焙，方成这一缕焦香。这是浩瀚神州天地，借秋风赠予你我的一点草木真味。女帝请。”

玄玉灵猫“琉璃”踏水跃上案头，四爪踏雪，珀金双眸好奇打量着酥饼，口吐清脆干练的人言：

“妙哉。神州名门硕儒总爱讲些正邪立判的陈规戒律，道友一言一行，更显大道浑圆的天趣。”

望舒哑然失笑，素指轻按猫首，端起那只粗瓷陶碗。

微赤酒液倒映着两人的眉眼与天河孤月。正魔两道立于极巅的人物，不问阵营，不拘门户，在这万顷碎银的孤舟案前，如多年故友般，静静碰了一盏。

