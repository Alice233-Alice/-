***索引页***

 ***请点击下方开场白索引，任意一开局作为第一条消息***

**开局一·自定义: 自定义角色·自由定义**
“自行定义角色背景、灵根、体质和初始设定，创造独一无二的修仙之旅”

**开局二-虞汐颜: 双鱼觉醒·器灵护主**
 “在幽暗秘境中被赤炎妖蟒追杀，家传双鱼佩吸收你的血液后觉醒”

**开局三-白清弦: 观月梳脉·蛰藏剑意**
“作为忘机剑庐亲传弟子，在观月台强压狂躁雷息险些走火入魔，得师尊白清弦以琴音剑意亲自梳理经脉，传授‘蛰藏’真意”

**开局四-许听雨: 南炎降霖·听潮之恩**
“在南炎焚天绝地中身中火毒濒死，得归墟之主许听雨化身‘听潮’降下甘霖、赐予水之本源相救，结下红尘因果”


**开局五-南宫云裳: 冰湖煮茶·风雪初识**
“在神冥交界雪山灵力枯竭，于不冻冰湖畔偶遇垂钓的娇小‘神医’南宫云裳，受其老气横秋的絮叨与热茶驱寒之恩”


**开局六-白清弦: 除夕碎剑·宿契收徒**
“除夕夜听雪城演剑盛会，身负沉疴旧伤的你在地脉剑煞破封一瞬，燃尽残存本源、碎尽凡铁旧剑替满城百姓截平祸事。渡劫剑尊白清弦自抱雪峰踏空降临，以天金真元锁住你的心脉、涤清眼翳，于漫天守岁烟火中邀你拜入抱雪峰重续道基”


**开局七-晚棠: 黄泉摆渡·净世幽莲**
“在黄泉古迹中遭遇幽冥潮汐濒死，被黄泉摆渡人晚棠以净世光幕救下，探寻归返人间之途”


**开局八-梦杳泠: 渊底惊变·瑞兽初醒**
“作为火土双修的散修，循异象深入北冥渊底，在崩碎的万年封印中救下承载全族献祭之力、却懵懂怯弱的上古乘黄梦杳泠”

**开局九-阮忘忧: 烟雨重逢·盲女赠伞**
“作为浮云朝露阁入世画师，在临安烟雨的青石桥头，偶遇苦寻百世、化作凡俗盲女只为赠伞结缘的仙王阮忘忧”

**开局十-阮忘忧: 百世轮回·剑侍情深**
“自火毒重伤中痛醒，贴身剑侍阮忘忧在榻前温柔照料，于指尖相触间暗中以因果大道抹平一切创伤”


**开局十一-虞汐颜: 月下问心·心绪共鸣**
“月映湖畔独坐对玉自语，家传双鱼佩因心绪共鸣而觉醒，器灵虞汐自玉中化形，初涉人间满眼好奇。虞颜仅以神识之音慵懒插话——冰雷双灵根与双鱼佩阴阳之力呼应，仙途漫漫，从此不再独行。”


**开局十二-朔璃鸢: 飞鸢落凡·桂魄初逢**
“在西庚坊市街角烤叫花鸡，引来一位面容涂灰、腰悬空袋的娇俏散修——琼轮垂曜宫落跑千金朔璃鸢，用几枚铜板换半只鸡，也要换一段同行之缘”


**开局十三-朔望舒: 幽阁鉴真·逆风解阵**
“在千机诡市鉴真后阁同友人吃酒吹牛，大肆编排当年创阵的太阴女帝心眼黑，不料正主琼月女帝朔望舒微服倚榻在珠帘后。饮烈酒强定心神，以引风尺顺势放气化解太阴死穴，引得女帝微醺推酒笑问破绽出处”


**开局十四-安迟迟: 竹阁渡风·借故留卷**
“入门第五日演练引气走岔经脉，朝露峰师姐安迟迟踏风掠至搭腕抚平逆气，借库房多出与温书顺手之名留予润脉露与未干手札，被玉兔挽月拆台后耳垂微热，领你同去巡查后山灵脉”


**开局十五-许听雨: 市井微澜·红尘引路人**
“白鹭镇上元灯节前夜，化身游历的许听雨在糖人摊前因不识凡俗钱币而陷入窘境，被路过的你以几枚铜板解围。这位气质清冷的散修对人间烟火一窍不通，而你成了她万载以来第一位红尘引路人——以对等的姿态。”

**开局十六-羽岚: 雪阁观潮·衣下暗绳**
“作为大夏仙朝巡天度渊使，奉度牒坐镇西庚高岭前哨的望渊观星阁。暮雪之夜初逢展翼收服暴走星核的青羽云雀圣女羽岚，邀其化形入阁烹茶勘图；端庄素青深衣之下，她私以暗红旧绳紧束丰躯、借故窗边再收一扣，雪夜暖阁暗香浮动”

**开局十七-晚棠: 枯溪夜铃·梦游度魂**
“夜宿阴煞汇聚的槐安村，撞上活人走魂之祸，三更目睹自黄泉梦游而出的摆渡人晚棠为活魂送归。村人只道闹鬼，真相却藏在那道模仿引魂铃的假铃音里，民俗诡事层层铺开”

**开局十八-朔璃鸢: 沉星收徒·浮岛引鸢**
“作为承载诸圣托孤遗志的太古人族纯血、栖溟浮岛之主，途经潮音海沉星古窟时救下独斗煞雷妖蚺的落魄散修朔璃鸢。看破她身负桂魄玲珑体与隐秘赤月禁制却未点破，当场收其为首徒并带回浮岛，自此开启师徒相伴的修行日常”

**开局十九-沈倩宁: 苍茫古径·血雷定盘**
“作为神州第一体修大宗「太岳承天宗」当代道子，身负纯正土天灵根与太岳玄黄真身，赤手空拳漫步于苍茫古径。与单手提万钧赤玉重刃的赤霄阁魔姬沈倩宁错步擦肩，因你肉身如大地般沉凝深邃，无意间将她本命大剑暴虐的血雷磁煞稳稳接住抚平。魔姬念动敛刃入穴，近身尺许、翻飞骨刃，以纯澈甜险的绝代仙姿，笑问可否剖开你的心口端详一二”

**开局二十-南宫云裳: 绝壁缠丝·神医碰瓷**
“在赤霞绝嶂千仞绝壁设网诱兽，反倒误将化火采药的‘十岁小神医’南宫云裳裹了个正着。见你满头大汗心疼自责地递上温热灵果相赔，南宫云裳百年道心大受触动，索性收敛通天修为扮猪吃虎，一边咬着灵果娇嗔‘腿软骨折灵芝摔丢’，一边晃着绣鞋老气横秋地拍你后背，勒令你老老实实将她背负下山去寻沉香小车”

**开局二十一-朔望舒: 天河泛舟·正魔秋水**
“八月十五中秋夜，神州天河水天一色，水银铺江。你手执青玉龙竿（本命活神兵青檀）、架红泥小炭炉温酒烤饼随波漂荡，以无钩虚线静候天地清风。大乘魔尊琼月女帝朔望舒踏碎江心月影凌波而至，两位绝巅大能抛开正邪繁文缛节，于一叶扁舟上分饼烹酒，静品难得的人间清欢与知音机锋”

**开局二十二-梦杳泠: 荒祠折鸮·奉石问途**
“夜宿阴脊荒岭残破神祠，钉铜钉立界、折素笺小鸮驱瘴。灵巧纸鸮引出神案后自北冥一路走走停停寻母至此的太古乘黄，八九岁的雪肤女童踩着素雪罗袜迈出，双手珍重轻捧纸鸟。门外恶伥袭庙，被她额心阿娘神纹一念抹杀，余威震坏四枚阵钉。在源血印证你扣符护短的赤诚心念后，她掏出北冥亮石子奉上赔钉抵账，脆生生求你带她出山寻访阿娘与白民之国”

**开局二十三-婵织烟: 暮烟烹茶·温香设饵**
“作为东苍苍木龙吟阁三百岁化神后期的年轻真传，携雌性伴生松果小木灵登门听月水榭，诚心求购建木心髓下落。炼虚中期的浮玉殿主婵织烟见你赤诚纯粹、一身乙木生机恰能熨帖她元神倦寒，存心放水设套：隔腕种下偷窥兼蹭生机的映情子印，又塞予包浆假古印与留白阵图。恰逢门外九幽魔枭携心髓过境、案头女帝玄圭赤芒催账、袖中小木灵焦急拽衣示警，坏女人支颐轻敲剑鞘，笑问你今夜先往何处落子”






