时空断层深处，虚空罡风如万千无形利刃呼啸撕扯。

青衫微动，{{user}}负手漫步于紊乱的空间乱流之中，步履平缓，宛若春日闲庭踏青。身周未见浩大灵光外放，狂暴的空间褶皱触及其周身三尺，便如清风拂面般自生自灭。

其身侧，一泓温润如月华的灵光化作一道曼妙身影。

女子身着一袭玄白交织、暗绣太古云纹的素雅襦裙，青丝如瀑，仅以一根白玉素簪轻绾。容颜清婉绝俗，眉眼间透着经年伴道伴书的书卷静气，正是《诸圣万劫谱》在{{user}}紫府人道长明界中历经万千造化温养、褪去微蒙胎息而彻底化作常人身量的器灵，素昭。

素昭敛衽微步，长袖轻垂，朝虚空边缘指了指，嗓音轻柔温婉：“尊上，前方最平稳的现世出口，落在西庚与潮音海交界的一处古修遗迹，唤作‘沉星古窟’。”

{{user}}微侧过头，目光落在她温婉端庄的侧颜上，温和一笑：“这些时日推演天地灵轨辛苦了。今日这随云髻梳得极好，颇有几分名门闺秀的文雅气象。”

素昭未料到尊上会忽而夸赞自己的装扮，清丽面庞微微一滞，雪白修颈与耳尖悄然泛起一抹淡淡薄红。她微微垂下眼睫，双手轻捏着袖角，低声道：“尊上又拿素昭打趣。素昭不过是见尊上平日喜好清雅，才随手挽了挽。”

说话间，{{user}}眉梢微动，深邃如渊的神识透过虚空断层，落向下方秘境最深处的死地。

“且慢出去。”{{user}}停下脚步，眼中浮起几分兴味，“这底层的阴窟里，正有个炼气期的小丫头在同妖兽搏命。”

潮音海孤岛之下，沉星古窟深处的禁锢死地煞雷渊心。

四周昏黑幽冷，狭窄的石窟内弥漫着令人窒息的阴煞之气。一头丈许长、披着墨黑鳞甲的炼气期煞雷妖蚺盘踞在岩隙前方，猩红信子吞吐不定，发出低沉沙哑的嘶鸣，庞大的身躯已然封死了唯一的退路。

朔璃鸢退无可退，后背紧紧贴着冰冷潮湿的岩壁。

她浑身浸透泥水，双手剧烈发颤。她天生畏惧幽暗，独自困在这样伸手不见五指的地底，心头早已慌乱到了极点。怀里死死护着好不容易采到的两株伴星草与两块星髓石，那原本是她打算换取凡间盘缠的指望。

妖蚺身躯骤然绷紧，裹挟着一股腥臭黑风，张开满嘴尖牙直扑面门而来。

死亡的阴影当头罩下，少女眼眶发红，骨子里的求生本能压过了恐惧。

她银牙死死咬破下唇，强忍着经脉中传来的撕裂剧痛，体内那一股微弱清冷的月华之气在绝境逼迫下自发奔涌，尽数灌入掌中的无弦短弓。

灵气化弦，神识凝箭。

原本若隐若现的微弱风矢，在这一瞬骤然爆发出清冽如霜雪的耀目月华，照亮了她满是决绝的小脸。

弓弦震响。

流星矢如匹练破空，带着撕裂幽暗的尖啸，精准贯穿了妖蚺的咽喉，去势不减，生生将整条暴烈的妖蚺死死钉在了后方坚硬的黑玄岩壁上。

妖蛇剧烈抽搐了几下，污血顺着岩壁流淌，彻底没了生息。

虚空断层边缘，素昭眸光微动，在神识中轻声传音道：“尊上，这小丫头体内流转的……竟是罕见的‘桂魄玲珑体’。且她识海深处还潜藏着一道极为隐晦的赤月神念禁制，那绝非寻常门派之物，至少也是大乘绝巅的手段。”

{{user}}微微颔首，传音回道：“方才生死一瞬，她凭自身搏命射出那一箭，反倒未曾惊动体内禁制。这般身负极道传承与罕世道体的小家伙，竟独自在外摸灵草换盘缠，倒是个有趣的孩子。”

石窟内重归死寂。

朔璃鸢双腿一软，脱力跌坐在碎石堆里，胸口剧烈起伏，大口喘着粗气。她低头看着自己颤抖的双手，又怔怔望向岩壁上那具被钉死的妖兽尸身，眸子里满是茫然与难以置信的震动。

自己何曾有过这般凌厉的手段？

尚未从劫后余生的震惊中回过神来，前方的幽暗处忽然泛起一圈淡淡的金色波纹。

一道青衫身影自虚空中踱步而出，身旁伴着一位宛若画中走出的清丽白衣女子。

突如其来的陌生人影让朔璃鸢吓了一跳，原本松弛的心弦瞬间绷紧。她猛地往后缩去，手忙脚乱地抓起碎星弓横在胸前，眼神里满是戒备与惊疑，声音发颤道：“你……你们是何人？为何会在此处？”

青衫男子并未逼近，只负手站在三丈开外的平缓处，神态自若。

随手打了个响指，一团柔和明亮的纯阳星火自指尖升腾而起，静静悬于窟顶，将整座阴冷死寂的石窟照得亮如白昼，逼退了四周所有渗人的阴煞寒气。

温热的光芒倾洒而下，朔璃鸢紧绷的身子不由自主地微微一松，掌中的短弓也稍稍垂下了几分。

身侧的素昭见状，敛衽缓步上前，神色端庄温婉，自袖中取出一方温软丝帕与一枚散发着清香的雪白玉果，半蹲下身，将东西轻轻放在两人之间的平整石块上。

素昭向朔璃鸢微微福身，轻声细语道：“姑娘莫要受惊。我家尊上名讳{{user}}，方才路过此地，察觉窟底有异动方才前来看顾。我是尊上身侧的随侍器灵，名为素昭。我们并非凶徒，姑娘无需多虑。”

她指了指石上的灵果，又柔声补道：“方才见你强行引动气机贯穿妖兽，双臂经络受了震荡，若不及时梳理，恐伤及根基。吃下这枚清心玉梨，能化解体内的滞涩寒毒。”

灵果清香扑鼻，素昭谈吐得体、仪态端庄，加之那股纯正温和的善意，让朔璃鸢原本紧绷的心防彻底放了下来。

她咽了咽唾沫，小心翼翼地拿起果子啃了一小口。甘甜清润的汁水顺喉而下，双臂原本如针扎般的刺痛顿时消散大半，整个人轻松得舒了口气。

“多谢素昭姐姐，多谢前辈……”朔璃鸢揉了揉发酸的胳膊，有些不好意思地小声开口，“我叫阿鸢，是个自个儿在外头游历的散修……原本只是想采些灵草换盘缠，不小心踩坏了传送阵才掉进这里的。”

{{user}}负手看着她，温和笑道：“阿鸢，名字倒也灵动。不过你这小丫头胆子倒是不小，修为平平，身法与箭术底子却极硬，竟敢独自一人揣着石头闯这等死地。”

朔璃鸢吐了吐舌头，小声嘀咕道：“我也不想啊，谁知道这破阵法一踩就碎……不过方才那一箭，我自己都没想到能射中呢。”

{{user}}打量着她身上那件虽沾泥灰却暗泛流光的青灰内衬，又看了看她眸中那抹在绝境中依然不曾磨灭的明亮与生机，看破却未点破其身世底细，只微笑道：

“身陷死地尚知拔弓搏命，临危不乱，心性倒是不差。本座座下尚无门人，今日在此撞见，也算有缘。你可愿随我修行，奉我为师父？”

朔璃鸢眨巴着眼睛，看着眼前这位气度如渊海般深不可测、随手便能驱散满窟阴煞的长者，心头猛地一跳。

她自知体质特殊，难以筑基，寿元不过百年，平日在江湖飘零最怕遇上吃人不吐骨头的恶修。眼前这位前辈修为深不可测，身边随侍的姐姐又这般温柔良善，若是能拜入其门下，岂不是平白多了一尊天大的靠山？往后这百年光阴里，有这等大能护着，何愁没有安稳日子过、何愁吃不上好东西？

想到此处，少女眸光晶亮，哪里肯放过这等送上门的天大仙缘。

她顾不得身上的泥水污渍，在碎石地上端端正正跪好，规规矩矩地叩了三个响头：“徒儿阿鸢，拜见师父！”

三拜礼毕，她从怀里掏出那一株洗得最干净、泛着莹莹微光的伴星灵草，双手郑重捧起，仰起满是泥灰却明媚灿烂的小脸，脆生生道：“徒儿身上没有值钱物什，这是方才拼命采来的灵草，送给师父当拜师礼！”

{{user}}失笑，伸手接过那株灵草，收入袖中：“为师收下了。”

言罢，袍袖轻轻一卷，浩瀚的人皇纯阳道力化作一圈柔和清光，将三人尽数笼罩。

虚空泛起涟漪，一息之间，地底死寂的阴窟与腥风残雷尽数退散。

天光骤然大亮。

放眼望去，乃是一片悬浮于万丈九霄之上的太古仙岛，栖溟浮岛。

脚下白玉为阶，流泉飞瀑，古木苍翠如盖；四周被浩渺云海环抱，和煦朝阳洒落，为整座仙岛镀上一层温润的金辉。倚栏俯瞰，下方宽达两百里的浩瀚龙眠海峡与无边无际的东苍建木红树林尽收眼底，壮丽开阔，气象万千。

朔璃鸢站在庭院青石上，揉了揉眼睛，看得目瞪口呆。

一阵清脆响亮的腹鸣声自少女肚中传来。

朔璃鸢小脸腾地通红，双手死死捂着肚子，眼巴巴地望向庭院角落里挂满红彤彤灵果的千年朱颜树，喉间轻咽。

素昭在旁掩唇轻笑，面颊微红着走上前，自储物玉盒中取出一碟刚用灵泉温热的精致软糕，温声细语道：“阿鸢一路受惊受累，先吃些点心垫垫饥。尊上平日喜居中苑，稍后我带你去东跨院，为你拾掇一间向阳明亮的暖阁安歇。”

朔璃鸢看着眼前递来的点心与素昭温柔的面庞，心头满是融融暖意，脆生生喊道：“谢谢素昭姐姐！”

言罢，她抓起一块软糕大快朵颐，腮帮子鼓起，颊边梨涡清浅明媚。

{{user}}行至院中石桌旁坐下，提起紫砂灵壶斟满清茶，看着眼前狼吞虎咽的少女与微红着脸忙前忙后的素昭，端方温润的眉眼间泛起一抹惬意随和的笑意。

“慢些吃，没人同你抢。”{{user}}慢条斯理地抿了口茶，屈指轻扣桌面，打趣道，“吃饱了便随为师去静室行功。为师这儿规矩不多，但偷懒耍滑之人，明日的灵鱼羹可就换成苦灵草了。”

朔璃鸢咽下糕点，抹了抹嘴角，扬起满是生机的小脸，迎着云海朝阳，甜滋滋地应了一声：“知道啦，师父！”


