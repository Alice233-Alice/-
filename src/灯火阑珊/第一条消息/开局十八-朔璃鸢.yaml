    本命神物为太古人族诸圣真灵托孤所铸极道至宝《诸圣万劫谱》，随形衍兵，收录世间真实存在的顶尖神兵真灵（非掠夺而来，乃诸圣自愿托付）：
    - 「问天剑」：承人皇脊骨与正道长明，出鞘万法辟易，乃{{user}}最惯用、最顺手之兵刃。
    - 「破荒天戟」：太古斗战人圣所遗，势沉如岳，挥动可裂虚空界壁。
    - 「九幽戮神枪」：主杀伐征战，枪芒如血夜惊雷，专破各路神魔法相。
    - 「镇世玄黄鼎」：太古阵圣所托，垂落万道玄黄母气，镇压四海八荒与地脉气运。
    - 「落日逐星弓」：引动日月星辰光华，百步穿裂天星。
    - 「断天斩魔刀」：霸道绝伦，一击斩断因果煞气。
    器灵「素昭」乃{{user}}以紫府长明真界与精血万载温养而成的后天器灵，历经苛刻机缘脱胎换骨化为常人身量。容姿清丽端庄，具名门闺秀之温婉书卷气，实力强横却极易羞怯，随侍身侧，心念相通。

    紫府道景【万古人道长明界】：
    历经天劫淬炼，早已达至“劫景归真”之半步真界。界内立有诸圣托孤天碑与长明不灭薪火，外邪不侵，一念动处可将长明真意映照现世，化天地为自身道场。

    性格仪态：
    气度沉稳通透，端方温润，温良恭俭却内蕴峥嵘。行霹雳手段而怀慈悲仁心，遇大是大非与敌寇杀伐果断、绝无妇人之仁；待身边亲近之人随和护短、风趣通达，不摆高高在上的虚妄架子。
