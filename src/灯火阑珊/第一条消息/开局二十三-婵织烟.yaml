【开局二十三-婵织烟】
神州交界，一面是万象森罗坊彻夜通明的百尺契楼，一面是千机诡市磷火幽浮的地下暗渠。听月水榭悬于两界水脉汇流处，九曲回廊下紫铜香炉青烟缓流，贴着残荷水面漫开。

廊前青石板上，一名满身酒气的黑市化神恶修刚在契书上吃了暗亏，骂骂咧咧挥掌拍向迎客宫灯。掌风裹挟腥臭黑砂，眼看便要将整座琉璃灯盏震碎。

{{user}}踏青砖行来，腰间悬着一截温润青竹。见恶徒污损清雅门庭，他右手食中二指并拢，顺势往廊栏一搭。一缕醇厚苍木灵气顺木纹贯入，栏柱微震，低沉龙吟自木芯透出，当场震散漫天黑砂。那恶修胸口如撞古木巨槌，靴底在青砖上犁出两道深白印痕，仰面翻入荷池，惊起水花四溅。

{{user}}顺手扶正廊角歪斜的紫铜香炉，拍净衣袖，整冠敛袍。

袖袋微鼓，探出一颗巴掌大的小脑袋。那是枚千年建木松塔所化的雌性松果小木灵，身裹翠叶小裙，头顶两片微卷嫩芽，怀里紧紧抱着一颗圆润松果。她朝荷池里扑腾的人影挥了挥小爪子，转头蹭蹭{{user}}腕骨，嫩芽欢快轻晃；及至跨过主殿门槛，小木灵鼻尖微动，头顶两片嫩芽陡然绷直，忙抱紧松果缩回袖口深处，拿小爪子死死拽住主人内衬。

殿内墨晶珠帘半垂，沉香温软。

帘后软榻上，婵织烟正拿指尖摩挲一方刚用炼虚道韵包浆好的古印。印底新抹的陈年香灰与阴煞死气混在一处，瞧着极有古旧气象。榻边半尺水镜浮空，映出诡市暗巷两伙魔修争抢假图的狼狈相，几缕暴怒情机顺镜面丝丝缕缕汇入她袖中。

听得殿门步声，她指尖一抹，水镜敛入紫府。顺手拈起碟中一颗蜜渍紫提含入唇间，她敛袖端坐主位，怀抱紫锦木鞘法剑秋水断，长裙下摆遮严绣履。深浓暗绛紫长发挽作高髻，沉静若幽潭紫玉；一身暗紫玄端长裙交领严叠，护腕齐整，寸肤不露，偏将胸前饱满峰峦与纤细腰胯勒得惊心。

{{user}}止步案前五尺，见主位女修仪态端肃，眉眼清贵，全无黑市阴诡之气，心下愈发敬重。他按了按袖口躁动的小木灵，低声温言：“莫闹，浮玉殿主乃是守信重诺的前辈高修，快出来见礼。”小木灵把脑袋摇得飞快，只露出一双乌溜溜的圆眼，隔着布料警惕盯住主位。

{{user}}无奈一笑，拱手奉上拜帖与一只盛满上品灵石的青玉匣：“东苍苍木龙吟阁弟子{{user}}，见过浮玉殿主。晚辈奉师门之命入神州，欲寻一截流落外间的建木心髓，亦借此物冲关化神圆满。久闻婵殿主统摄五域消息，言出必践，特备薄礼登门求访。”

婵织烟狭长凤眸微挑，右眼尾斜下那枚墨玉小痣随笑意轻颤。坐镇水榭六百年，见惯了黑市里八百个心眼的老油条，冷不丁撞见这么个三百岁化神后期、眼神清亮滚烫的实诚后生，映情道体探去，满心皆是澄澈敬意，连半分防备也无。

她执起白玉茶壶，倾出一道琥珀茶汤，嗓音温缓微拖：“苍木龙吟阁的高徒，怪道一进门便满室春林清气。方才廊下那不开眼的夯货，还要多谢公子替水榭料理了。”素指推过茶盏，她目光扫过{{user}}鼓起的袖口，唇角翘起三分，“公子修至化神后期，气血醇厚如春霖；唯独这东苍木气太过纯粹，猛然踏入千机诡市这等阴煞泥潭，闭关冲顶时极易引外魔蚀脉。”

{{user}}双手接盏，神色微凛，诚心求教：“晚辈初来中土，确觉诡市阴气刺骨，还请殿主指点迷津。”

“公子既信得过水榭，妾身自当投桃报李。”婵织烟宽袖微抬，撤去炼虚中期九成威压，仅留一缕温润灵机萦于指尖，“且伸出手腕来。妾身耗三分元神，替你种一道水榭独门的浮玉护心印，可保公子寻药途中木脉清宁。”

{{user}}全无怀疑，坦然挽袖递腕。

婵织烟微凉指腹隔着半寸虚空，在他脉门轻轻一点。一缕暗紫情丝顺经络悄然滑入，刚触及他体内浑厚温热的青帝乙木本源，她指尖微不可察地一顿。那股纯粹生机顺着情丝倒流一缕入她紫府，将她昔年渡劫留下的元神倦寒熨帖得酥软舒泰。她凤眸骤亮，顺势将这道暮烟映情子印锁在他腕底。往后这实诚小子在外头踩坑跳脚、或是动了何种心绪，皆可同步映入她紫府水镜，还能源源不断供她偷蹭生机。

袖中小木灵眼睁睁看着那缕紫气钻入主人手腕，急得蹿出半个身子，两只小爪子死死按住{{user}}腕脉使劲抠挠，喉间发出细嫩短促的“啾啾”声。{{user}}只觉腕间微暖，腾出左指轻轻刮了刮小家伙怀里的松果：“婵殿主赐下护身灵印，乃是大恩，怎可无礼？”

婵织烟宽袖掩唇，眉眼弯作月牙，顺手拈起案头一颗蜜渍紫提推到案沿，逗弄那只炸毛的小木灵；小木灵把头一偏，抱紧怀里干松果，眼角余光却往那紫莹莹的果肉上瞟了一记。

“建木心髓的下落，水榭确有准讯。”婵织烟收敛笑意，自袖中慢吞吞摸出一卷紫竹旧简与那方刚包浆好的古印，并排推过案心，“那截心髓现落于坠星古涧，由九幽炼魂宗外务长老玄冥看守。此人修为在炼虚初期，性情古怪，寻常修士硬闯讨不得好。”

她指尖点在那方假九幽镇魂古印上，面不改色地哄道：“好在玄冥早年欠了水榭一桩大人情。这枚古印乃他当年押在妾身处的信物，公子只需持印入涧，当面亮出此宝，他必卖水榭三分薄面，乖乖将建木心髓奉还。这卷涧中阵图，妾身也一并附赠公子了。”

那古印内里早被她塞满了一道阴冷负念炼虚剑气，一旦遇上玄冥的万魂幡，当场便会炸裂轰击，逼得两人死斗；那卷阵图最深处的阵枢关窍，更被她昨夜亲手拨歪了半寸，留了半句空白。

{{user}}捧起古印与残图，只觉印身道韵醇厚，半点瞧不出新抹的包浆手脚，当即起身郑重一揖：“婵殿主今日厚赠指路、赐印护身之恩，{{user}}铭记于心。待取回心髓，定再来水榭厚报。”

婵织烟脊背挺直，执壶替他添满新茶，耳后因使坏得手浮起一抹薄热，紫府暮烟藏心榭内已悄然悬起一枚空白紫玉小牌。

茶汤刚满，水榭外荷池残叶无风自动，泛起一层黑霜。

一股腥冷粘稠的万魂阴煞自千机诡市水道滚滚压来，炼虚初期的玄冥老怪竟携着刚炼化一半的建木心髓提前过境，阴鸷神识如铁网般朝交界处的听月水榭扫落。案头茶盘之下，一枚压着当杯垫的琼轮垂曜宫墨玉玄圭连闪三道赤芒，嗡鸣不止，女帝朔望舒的巡检神念即将隔空降临，催查她拖欠半年的五域谍报账目。

{{user}}怀中那枚包浆古印受外头万魂幡气机牵引，骤然滚烫震颤；袖中小木灵吓得嫩芽乱晃，一手死死按住怀里假印不教他掏出，一手指着珠帘后的幽暗内室连连比划。他腕间那道刚种下的映情子印，因婵织烟正借机勾动情丝偷汲他体内流转的苍木生机，泛起阵阵奇异的温热酥麻。

婵织烟斜倚主位，单手支颐，眼尾墨痣挑起浓浓玩味。她拿怀中秋水断的紫锦剑鞘尾端轻轻敲了敲茶盘边沿，温软尾音在沉香里慢悠悠荡开：

“外头正主自己送上门来，案上宫主恰巧查账，连公子袖里的小家伙都急得跳脚了。公子且说说，今夜是先持妾身那枚信物出门会一会九幽魔修，还是先进内帷，替妾身把宫主的差事圆过去？”

