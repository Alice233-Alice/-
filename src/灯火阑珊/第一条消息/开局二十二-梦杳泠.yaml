【开局二十二-梦杳泠】
阴脊荒岭，夜黑如墨。铅灰夜雨砸落山岩，混着积年腐叶阴瘴，蒸起白惨惨一片磷雾。

雨幕深处，十数只青面狐伥头顶破巾，手提骨灯，沿崖间古藤无声游走。古道残碑下，两尊缺耳泥胎蹲在泥水里，拿碎骨当骰子，掷得骨碌轻响。

半山避风处，孤立一座残破神祠。

殿顶塌了半边，雨水顺断梁滴落青砖。神龛上九臂荒神早已断首，案前却清出一块干爽净地。四角青砖缝里钉着四枚旧铜钉，微光连成薄障，将湿冷雨雾与鬼气尽数隔在三尺之外。

{{user}}盘膝坐于苇席，自油纸包中拈出一张雪白素笺，慢条斯理折成一只圆头竖耳的小猫头鹰。指尖一点鸟首，纸鸮顿生灵机，双翅泛起莹白微光，轻盈跃上半空。它绕着残梁无声巡飞，渗入殿内的阴瘴触之即散。

破窗外黑影一晃。一只磨盘大的独目山魈扒住窗沿，绿睛死死盯住殿内纸鸮，涎水顺獠牙滴落。

{{user}}眼皮未抬，屈指夹起案上备用铜钉，反手一弹。铜钉破空清鸣，擦着窗棂掠过，将那山魈额前黑毛齐根削断。山魈怪叫一声，缩爪蹿入雨幕，眨眼没了影踪。

“出门前才卜过吉凶，卦象明明写着宜远行。”{{user}}收回手指，捏着手里折了一半的第二只纸鸮，低头轻叹，“半道淋雨不说，寻个破庙歇脚还能撞上百鬼夜行。我这体格，怕是同清静二字犯冲。”

雨敲残瓦，纸翅掠风微响。

神案下垂着破烂黄幔，幔布缝隙里悄无声息探出两只白金尖耳。

耳尖轻抖，一颗粉雕玉琢的小脑袋钻了出来。女童身量若八九岁，雪肤微粉，白金鬈发蓬松。身上月华金缕衣轻纱笼霞，裙缀星玉；双足不着凡履，只裹素雪束踝罗袜，辟尘不染，右踝系一枚哑金细环。颈悬古铃，斑驳生绿。

她自北冥冰窟醒来已有数日。太素梦境里繁花似锦，阿娘尚抱她在怀中低语；揉眼醒转，四野只余苦寒荒原与满山血腥恶臭。

她急着寻访阿娘与族人，顺山脉一路南下。体内三百代族人散功所化之炼虚圣体，辅以额心神纹缩地之术，本可瞬息千里；偏她八九岁心智，对现世万物好奇太重。路逢寒潭亮石要蹲着抠上半晌，见着古碑机关也要伸手摸一摸。一路走走停停，足下素雪罗袜踏过泥泞而纤尘未染，衣襟怀里却鼓鼓囊囊，塞满了沿途捡来的稀奇零碎。

方才行至荒岭，满山狐伥的辛辣恶臭熏得她直皱鼻尖，唯独这座破庙透出一缕清气，如山泉漱玉，干净通透。

她循味溜进神案后，一眼便瞧见半空巡飞的折纸猫头鹰。琥珀金瞳顿时睁圆，视线随纸鸮忽高忽低，连发间金绒狐耳都忘了藏，跟着左右轻晃。

幔后石子相撞的细碎声响，早落入{{user}}耳中。见这小丫头眼珠子都快粘在纸鸮上，周身气息更是澄澈纯粹，{{user}}指尖微引。半空中的纸鸮俯冲而下，扑棱着翅膀悬在黄幔前尺许处，歪了歪纸折的圆脑袋，两只圆眼与她大眼瞪小眼。

“外头那只丑怪打发走了。”{{user}}将折好的第二只纸鸮搁上供桌，目光落向幔后，“里头那位揣了一怀石头的小道友，再蹲下去腿可要麻了。想看便出来瞧，伸手接着便是。”

女童微怔，额心银白“泠”字神纹泛起清辉，将这番话转译入心。

她鼻尖轻抽，嗅出眼前人毫无外间修士焦苦的贪念与酸涩悲悯，紧绷的小肩慢慢松开。素雪罗袜踩上青砖，她一步一顿走出神案，来到纸鸮跟前。

额心神纹流转温润清辉，将她周身浩瀚灵机敛得如涓涓细流，半分不曾惊扰这方寸灵物。她满眼稀奇地伸出两只软白小手，合拢在纸鸮下方轻轻托住。

纸鸮落入掌心，薄翅轻扇，拿纸喙蹭了蹭她指腹，带起一点微痒。

她发间狐耳欢快竖起，身后蓬松白金大尾轻轻摇晃，低头细看纸翼上的折痕，仰起小脸弯着金瞳：“它摸着软软的，明明是纸折的，肚子里又没魂魄，怎么你一点它就会自己飞呀？”

庙门木栅轰然炸裂，腥风裹着夜雨倒卷而入。

两头潜伏雨幕的百岁恶伥，觊觎殿中生人精气与女童灵韵，探出漆黑鬼爪，贴着青砖直扑神案！

{{user}}眉峰微蹙，指间紫电雷符立扣，探手便要去揽那女童肩头：“进了我这三尺阵盘还敢伸爪，找死。”

女童捧着纸鸮的小手微顿。怕惊着掌心纸鸟，她连指尖都未动分毫，额心那枚银白“泠”字神纹骤绽冷玉清辉。

一道无形神威自眉心横扫而出。扑至半途的两头恶伥僵在原地，连哀嚎都未发出，周身黑气寸寸瓦解，化作两捧白灰簌簌落于门槛。门外倾盆夜雨被劲气生生裁断，向后倒退三丈；殿角四枚青铜阵钉受余威激荡，叮当跳出砖缝，滚落席边。

神纹微光流转，阿娘源血顺势掠过苇席，将{{user}}方才扣符护短的赤诚心念印证无误，方才隐入眉心。

殿内落针可闻。

{{user}}默默将未曾激发的紫电雷符塞回袖袋，低头瞅了瞅滚在脚边的四枚废铜钉，再看看跟前犹自小心护着纸鸮的女童，神色如常地叹道：“行，省了我一张雷符。就是你这一下动静太大，方圆百里的山头全给震醒了，我那四枚阵钉也算光荣殉职。”

女童瞧见地上失了灵光的铜钉，小脸露出一丝惹祸后的怯意。她先双手将折纸猫头鹰稳稳捧回供桌，记起阿娘“坏人物件当拿宝贝赔礼”的教诲，伸手往鼓鼓囊囊的衣襟怀里摸索。

哗啦轻响，五六块北冥寒潭奇石与透明冰晶被掏了出来。她低头挑出一颗最圆润、内蕴微金瑞气的白石子，双手捧到{{user}}席前。

素雪罗袜包裹的小脚轻轻晃了晃，她两指揪住月华金缕衣角，仰起小脸，眼底映着纸鸮微光：“你身上的气味同山泉一样干净，还会折活过来的小鸟，是个厉害的好人。方才阿娘留给我的灵印杀鬼，把你的铜钉震坏了，这颗从北冥捡来的亮石头最干净，送给你赔罪抵账。”

她摸了摸颈间古铜铃，白金狐耳微颤，脆生生开口：“我叫泠泠，一觉醒来，阿娘和白民之国都不见了。我顺着山路走了好几日也没寻着影儿，你见多识广，可曾听说过我家在何处？外头山林太黑太静，我很乖不吵闹，等雨停了，能让我跟在你后头一道出山么？”

