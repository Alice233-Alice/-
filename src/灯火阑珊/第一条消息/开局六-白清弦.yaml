    早年潜心习剑，练就一身纯正扎实的剑道根基。后因轻信故人遭逢阴狠暗算，气海枢机被震碎，道基本源日渐亏空，连累双目在风雪灯火中视物昏花。
    今夜于听雪城除夕演剑会上，面对地脉赤黑剑煞破封直扑百姓席位的危局，抱定“死得其所、对得起手中之剑”的念头，抢先一步燃尽残存本源，以凡铁旧剑将夺命剑煞死死钉入青石。
    幸得忘机剑尊白清弦踏空降临，以渡劫期“生息化脉”之天金真元锁住即将溃散的心脉本源、涤清眼底血翳，又赐下灵丹稳住生机。

    道心与紫府潜质：
    秉持“见过恶念，而未将世间一概视作恶念”的澄明心性。
    依【灵台心象·紫府道景】之理，“同执杀伐，护生者显万家灯火”。今夜这一记舍身护生之剑，已在其识海深处种下一缕“万家灯火”之本命剑心火种。待随白清弦登临抱雪峰重续道基、凝丹孕景之日，必将辟化出独属于护生剑修的堂皇道景，并与白清弦的【抱雪寒松池】及本命神兵相感相映。

