---
世界观:
  清浊代谢·道失为祟:
    太古留痕: |-
      此世历经太古神魔浩劫，苍穹崩裂，大道留痕；及至当世，灵机鼎盛、法则显化完备，步入渡劫圆满即可飞升的盛法时代。
    道失为祟: |-
      天道循生灭本能澄汰万物，世间修士逆天争命，皆依性情骨相、所证之道与平生因果辟化「紫府道景」；道在活人心界，便有分寸与悲喜。
      然生者为道，亡失则为祟与灾：太古崩天留下的断裂法则，连同历代陨落大能未竟之志、失约之憾与散逸道则，一旦脱离生者心界约束，便退化为盲目而暴烈的吞噬本能，顺九曲天河尾闾与地脉沉入九泉五渊。
    九泉五渊:
      - 黄泉：淤积红尘执妄，化迷魂死障。
      - 碎金渊：聚拢不屈断剑，凝噬血锋芒。
      - 无尽炎渊：奔涌求真狂焰，焚万物概念。
      - 神木枯冢：沉积逆命死气，育畸变藤狱。
      - 归墟：死锁太古沉疴，吞生机归于混沌。
    七潮共振: |-
      渊底死结与天地本源积蓄过重，便随五行生克激荡为七大天地异变（上霄天道脉动、下霄天渊潮汐、归墟混沌潮汐、炎渊地火潮汐、枯冢神木泣血、黄泉幽冥潮汐、碎金万剑同悲；归墟与天渊同频共振，天道脉动波及诸变）。
    涉渊铁律: |-
      诸变超越世俗正邪，实乃失控法则引发的天地灾劫。修为体魄或心神不足者贸然涉足，道躯与元神必遭异化湮灭；唯有肉身道基强横、道景稳固，或得高阶道景与异宝庇护者，方能于十死无生中化旧日沉渣为今朝造化。

  众生骨相·世道人心:
    人即其道: |-
      世间求道者万类竞渡，紫府道景皆由平生所历之劫、未了之愿化作山川草木、日月雷泽，外饰万般而本心难掩。
    道统分殊: |-
      五域道统因根本大义分殊而立：正道立秩序庇护苍生，魔道任真性生死由命，中立守铁则各取所需，太古神裔与异族各守祖地荣光。
    傲骨底线: |-
      世人重因果、畏天誓，行事皆由道念交锋、权柄野心、资源争夺或宿怨恩仇驱使；无论正邪皆具欲求底线与傲骨，绝无沉湎低俗色欲、无端纠缠之辈，恪守尊强者、守底线、重誓约之正统仙侠风骨。
    高处负重: |-
      低阶修士争一时渡世机缘，立于绝巅之大能与当世奇女子则多与天地气数休戚与共。她们性情鲜活、至情至性，却常因执掌仙朝宗门、背负苍生因果，或世代镇守五渊堤坝、身负宿世盟约而受制于大局。万家灯火与锦绣盛世之下，既有仗剑同游的快意恩仇，亦有孤身按住天地旧创的无声守望。