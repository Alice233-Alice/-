[神通体系总纲]
境界决定修士能够触及的力量层次，并不代表破境后自动精通全部神通。共通能力会随境界开启，具体形态仍取决于功法、血脉、传承与个人悟道。

[使用与裁决]
1. 未达对应境界者无法凭苦练越过力量层次；强行承载高阶神通，轻则反噬，重则走火入魔。
2. 道心、熟练度与克制关系只影响同一大境界内的发挥，不得借此抹平大境界位格差。
3. 神识、领域、法相等神通联用可相互增幅，灵力消耗与神魂负担亦同步上升，不可无代价常驻全开。
4. 高阶修士可主动收敛神通异象；收敛只是不外显，不代表能力消失。

一、神识（金丹起）
- 金丹：神识初开，探查十里，可辨灵气、生灵与寻常遮蔽物后的动静。
- 元婴：神识化形，探查百里，可凝作魂刃、威慑低阶神魂。
- 化神：神识成域，探查千里，可锁定未受同阶手段遮掩的目标。
- 炼虚/合体：神念分化，一心多用，分魂可跨越大陆追踪或传讯。
- 大乘/渡劫：由因果窥见过去未来的碎片；所得并非确定天命，仍受天机遮掩、同阶干扰与自身因果所限。主动施术可读取无防护低阶修士的表层念头，并非时刻全知。

二、元婴与元神（元婴起）
- 元婴可出窍神游、穿越寻常物障；离体后惧雷劫、业火、极阳与专攻神魂之术。元婴被彻底磨灭，方算身死道消。
- 搜魂、夺舍、魂印须先压制目标神魂；对同境者不可随意施成，强行施展会遭反噬并结下重因果。
- 化神后元婴与神魂合为元神；所谓「元神不灭」，只指肉身毁后仍可逃遁、转修散仙或寻机重塑，并非元神无法被同阶手段杀灭。

三、领域（化神起）
- 化神：展开数百丈法则结界，压制敌方调动灵气，并增幅自身道法。
- 炼虚：领域由虚凝实，显化法则景象，攻防一体。
- 合体：领域与法相共鸣，彼此增幅。
- 大乘：将体内世界的法则投影为外显小天地；同阶相争即世界投影碰撞，可致空间湮灭。

四、天地法相（合体起）
- 法相由精气神与法则凝聚，完全显化可达万丈，也可依场景凝缩；其兵刃随本尊道行而生，不按普通兵器衡量。
- 法相或元神本源尚存，修士便可借残血重塑肉身；彻底斩杀合体须先破法相，再灭元神本源，脱离本源的残血不能无限复生。
- 法相消耗极重，受创会直接反噬神魂；渡劫法相全力展开可覆压万里。

五、体内世界（炼虚起）
- 炼虚：开辟虚空芥子，初时仅存死物，稳固后可容草木。
- 合体：洞天自成循环，可容生灵修炼，亦可携宗门迁行。
- 大乘：衍化日月更迭与万物生灭，修士即此方世界之主。
- 本尊陨落会令洞天失去支撑；未及时撤离的生灵将随世界崩毁。

六、言出法随（大乘起）
- 大乘可令言语承载法则，改易天象或抹除凡俗生机；渡劫主动敕令「天宪」时，天地随言响应。
- 正常交谈可收敛权柄，不会自动伤及身边低阶者。天宪对同境只能形成争夺与压制，不能无条件改写对方。
- 过度施展会消耗法则感悟，须闭关弥补；因而高阶修士极少将其用于无关小事。

七、法则掌控（渡劫起）
- 渡劫可在感知范围内短暂改写单条法则；改动越广、越深，代价越重。强改因果只能维持一瞬，事后往往闭关数十年。
- 天道会将频繁、无节制的篡改视为「病变」，继而提前并加强天劫。
- 飞升后的法则剥夺、概念修改、现实改写及层级压制，统一见《境界威能》。

[对抗引用]
境界压制、小阶差距与外物跨境统一遵循《境界威能》。
