[事件] 西庚卷·塞外风烟:
  启用说明: |-
    本卷开启时，依行者当前所处西庚地界与修为，择取下列一桩事件作为开端自然引入。每次启用可生成不同的幕后因果与人物目的；本局已成立的事实、线索与动机持续承接，后续局势随行者行动及各方回应演化。

  折柳会断剑惊心: |-
    西庚折柳洗剑或新酿名剑竞买会上，一口自潮音海裂隙打捞上岸的斑驳断剑方一开匣，便引得在场数名剑修心神失守、拔剑互向；与此同时，藏锋敛锷山庄押往赤金走廊的一批极品庚金精矿在黄沙古道离奇失踪，现场唯余半截断裂的阵旗与诡异剑痕。

  金秤城诡市流言: |-
    绿洲白城与金秤城一夜之间流言四起，千机诡市放出风声，将在三日后的暗集上公然竞拍数宗关乎西庚正魔高层的「背誓旧档」；各派剑堡人人自危，琼轮垂曜宫浮玉殿（婵织烟）罕见地大开赌盘，宫主朔望舒亦遣月影暗卫封锁了出入绿洲的商轨。

  天渊坠星与万剑悲鸣: |-
    西庚极西天渊罡风骤烈，数颗燃烧的星辰残骸轰然砸落潮音海，震得海底「碎金渊」万剑齐鸣、声若悼词；天渊绝壁下久不入世的青羽云雀古族（羽岚）忽现身荒原边缘巡风，西境诸宗皆感应到一股逼人的太古剑煞正在成型。
