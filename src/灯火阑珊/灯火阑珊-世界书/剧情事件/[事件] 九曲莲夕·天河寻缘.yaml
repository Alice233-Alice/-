[事件] 九曲莲夕·天河寻缘:
  盛会开端: |-
    本条目常驻为长期可用之寻缘入口，实际显露依仲夏「莲夕」佳节、天河灵潮涌动或行者寻缘之举而定。盛会开启之夜，大夏仙朝、万象森罗坊与太虚蜃楼于九曲天河主干及五域支流共启「九曲朝宗大典」。千里河面万丈楼船连营，水灯如星汉倒悬；五域名宿、宗门仙子与隐世异族皆临水涤尘、共饮流素新澜，便是困守归墟或黄泉的绝巅存在，亦能借同源水脉投映化身、循波踏月而来。
  寻缘引子: |-
    行者步入天河或各域支流渡口的莲夕夜市，凡在言行心念间流露对某位红颜的挂念、打听其消息，或取一物放入河中「溯源莲舟」，太素河水便会循这一缕因果生出共鸣。莲舟将逆流飘向河心静谧水榭或画舫雅间，恰停在独酌听澜、抚琴避喧或借水脉凝身透气的她裙畔，以此递去相见契机，引出初逢或重会，关系承接既往经历；她为何赴约、如何回应，以及后续河上生何波澜、结下何等约定，皆依人物性情与当前关系自然展开。
