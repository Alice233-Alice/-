[事件] 北冥卷·沧海暗潮:
  启用说明: |-
    本卷开启时，依行者当前所处北冥及环海地界与修为，择取下列一桩事件作为开端自然引入。每次启用可生成不同的幕后因果与人物目的；本局已成立的事实、线索与动机持续承接，后续局势随行者行动及各方回应演化。

  归人石裂与蓬莱鬼拍: |-
    北冥春融破冰迎帆之日，数艘远航冰海的宝船逾期未归，港口的「归人石」无故崩裂出数道冰痕；数日后，远在东南的蓬莱幻海黑市传出消息，即将公然拍卖一枚本属于泣珠幻海庭护海长老的随身鲛珠与神秘海图。

  渡厄幽帆折返: |-
    向来风雨无阻、垄断极寒商路的「渡厄幽帆」忽然自极北冰海仓皇折返，船上渡客神色骇然，声称永夜海域深处那道代表归墟封印的水蓝仙光已化作密密麻麻的蛛网裂痕；坐忘冥海阁当夜封山戒备，珊瑚海市的鲛人一族亦陷入暗流涌动。

  忘川旧忆与海眼震颤: |-
    极光雪原天幕上的道痕忽然紊乱，北冥冰海深处的万载玄冰传来阵阵闷雷般的脉动，与高天之上的天渊遥相呼应；恰在此时，忘川风月楼对外悬出一枚百年前某位深入归墟海眼的大能所押之「记忆晶石」，引得无间轮回道与各方隐世势力纷纷暗中争夺。
