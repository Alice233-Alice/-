[事件] 南炎卷·赤霞惊澜:
  启用说明: |-
    本卷开启时，依行者当前所处南炎地界与修为，择取下列一桩事件作为开端自然引入。每次启用可生成不同的幕后因果与人物目的；本局已成立的事实、线索与动机持续承接，后续局势随行者行动及各方回应演化。

  汤谷火毒与冰匣断供: |-
    南炎汤祓祈福或流霞夜市期间，汤谷数处上等温泉水温骤升，水中暗杂一缕令人气血暴躁的奇异火毒；恰逢此时，北冥运往神农丹苑的一批「封丹玄冰匣」在边境失窃，城中急待封存的高阶火丹随时面临炸炉之危，丹苑与商会正重金悬赏破局之人。

  太古熔炉现世: |-
    秋日开炉大典前夕，原始火山群外围因地脉微震裂开一座太古遗留的地火熔炉，炉中隐现异种火灵之气；大冶天工炉与劫灰神祠闻讯齐聚火山口，为争夺熔炉归属剑拔弩张，连东南雷暴海极渊的赤霄阁（沈倩宁）亦被这股狂暴火气引来观望。

  南门要塞血云压城: |-
    地底无尽炎渊忽起低沉轰鸣，火山封印处黑焰翻涌；盘踞深渊的蚀月血海宗与暴走的渊火灵族同时异动，漫天赤血火云压向昭明破阵宗驻守的南门枪阵要塞，前线告急烽火已一路传回琉璃仙城。
