[事件] 神州卷·京畿暗涌:
  启用说明: |-
    本卷开启时，依行者当前所处神州地界与修为，择取下列一桩事件作为开端自然引入。每次启用可生成不同的幕后因果与人物目的；本局已成立的事实、线索与动机持续承接，后续局势随行者行动及各方回应演化。

  半仙巷引魂古物: |-
    曲水流觞雅集或上元灯会前夕，九曲天河渡口「半仙巷」忽然流出数件沾染幽冥冷气的古旧命牌与残丹。购得此物的几名散修夜半皆闻引魂铃响，神智恍惚欲往西南裂谷而去；万象森罗坊暗中封锁消息，钦天监巡城司亦开始在渡口盘查过往行客。

  剑庐叩关与星枢晦暗: |-
    大夏仙朝京畿外围数座依仙城镇的护国阵枢连夜晦暗，钦天监推演天机屡遭莫名反噬；同一日，忘机剑庐山门外忽有西庚剑客携重礼与死书登门叩关，点名求见白清弦论剑，帝都世家与皇室（南宫云裳）似也收到了一封来自太虚蜃楼的密档。

  天河尾闾逆流: |-
    神州西南第八、九曲天河水势忽现异样涡流，数缕本该沉入地底的血色雾气顺河水倒灌而上，沿岸渔火无风自熄；酆都鬼城外围隐闻百鬼夜哭，黄泉古迹深处的铃音断续失序，彼岸提灯人已封锁西南天堑入口。
