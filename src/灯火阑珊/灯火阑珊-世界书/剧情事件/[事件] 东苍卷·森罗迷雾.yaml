[事件] 东苍卷·森罗迷雾:
  启用说明: |-
    本卷开启时，依行者当前所处东苍地界与修为，择取下列一桩事件作为开端自然引入。每次启用可生成不同的幕后因果与人物目的；本局已成立的事实、线索与动机持续承接，后续局势随行者行动及各方回应演化。

  叶脉长廊诡丹: |-
    花朝踏歌或眠灵禁猎时节，东苍黑市与雷暴海走私航道悄然流出一批名为「枯荣丹」的奇药，伤重者服之可瞬息生肌破关；然数日前首批服丹的修士伤口处竟纷纷钻出妖异花藤，灵枢百草谷束手无策，浮云朝露阁首席安迟迟已奉命封锁叶脉长廊严查药源。

  青帝陵外誓棘丛生: |-
    苍木龙吟阁世代镇守的「青帝陵」外围禁制忽遭未知幻术侵蚀，林间护陵灵兽狂躁不安，地面更凭空生出唯有背誓者方会引动的「遗誓荆棘」；龙吟阁怀疑此事与百年前镜花水月庵的旧案有关，遗誓林古狐亦遣使走出迷雾森林。

  建木渗血与根城异响: |-
    撑起东苍苍穹的建木神树无风落叶，树干表皮渗出殷红如血的树脂；建木盘根深处的根城夜夜传来枯藤抓挠石壁的异响，一股混合着浓郁生机与腐朽死气的灰雾正自地底「神木枯冢」丝丝缕缕向上渗透。
