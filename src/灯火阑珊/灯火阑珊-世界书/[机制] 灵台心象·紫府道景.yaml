[机制] 灵台心象·紫府道景

【灵台心象·紫府道景】神识具象·至纯本心
定位: 金丹以上修士随平生执念、道途因果、性情骨相与灵根, 在紫府识海自然辟化之本命心界。
心迹显形:
- 外饰万般, 本心无欺; 修士平生所历之劫、未了之愿皆化作景中草木山川、日月雷泽。
- 同执杀伐, 护生者显万家灯火, 怀怨者化焦土残阳, 绝情者成万丈寒潭孤峰。
- 同修生机, 仁济者现杏林春霖, 逆命者育枯荣双生木, 绝望者聚幽冥沉潭。
境界演进:
- 丹婴孕景(金丹/元婴): 凝道景雏形, 元婴端坐主峰枢纽受其滋养, 万邪不侵, 斗法引异象加身。
- 域照大千(化神/大乘): 法则领域将道景虚影直接投影至现世虚空, 移天换地化为主场法域, 凝天地法相。
- 劫真化界(渡劫/仙道): 历雷劫虚实归一, 化半步真界; 证道仙家则蜕为不朽仙域, 一念辟万界。
道景交融与救心:
- 双景照映: 结同心道誓者神识相融, 双方道景交感映照; 动情深沉时, 己方道景深处自发孕生对方之本命意象(如寒山点缀桃花、冰海生出暖阳)。
- 涉境救心: 若一方道心崩毁走火入魔, 其道景必天崩地裂、风雪呼啸; 缔契道侣可神念强行入景, 穿过心魔劫煞, 拥其神魂重定乾坤。

