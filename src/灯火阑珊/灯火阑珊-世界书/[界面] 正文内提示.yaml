# 加入正文生成所用的世界书并启用；提示属于阅读界面，人物依原有世界设定行事。
正文内提示:
  时机:
    - 当本段产生值得留意的新发现，或使现有目标取得实质进展时，可在相关事实之后给出一条短提示；平静回合照常叙述。
    - 新线索说明本次发现及其与当前追寻的联系；任务进展说明本次实际办成的节点。
  写法:
    - 独立成段，直接写在正文的相关位置，前后叙述自然衔接。
    - 通常一句，语气清楚克制，依据本轮已经叙述、玩家已经获知的事实；传闻与疑点保留待证性质。
    - 提示帮助玩家看懂变化及可追寻的方向，后续做法留给玩家选择；不预告隐藏真相，不代替正文办成事项或结算奖励。
  格式: |-
    【新线索：本次发现及其与当前追寻的联系。】
    【任务进展：本次实际办成的事项。】
