[机制] 本命命修·同参道契

【本命命修·器灵与镇景】
命器连心: 修士引本命精血与神识温养之物(飞剑/灵宝/阵盘/神物); 命器即紫府道景之定岳镇物, 器利则神慧, 器碎则识海崩塌。
器灵双途:
- 后天化灵(心血相生): 法宝随精血道韵孕生灵性; 初阶多显寸许仙童或幼兽(灵雀/稚狐/玉兔), 随位格蜕变亦可长成为亭亭人形; 栖于紫府道景山水之间吞吐道韵, 伴主嬉戏自守丹台, 临敌破空护命, 遇主情动则羞隐鞘中。
- 先天化真(造化通神): 太古神物或造化至宝所孕真性(如双鱼古玉化灵虞汐颜); 具独立人形肉身与圆满道则, 出可随身征战红尘, 入可坐镇道景枢纽, 乃三界极道通玄之缘。

【同参道契·命魂相系】
同参道印: 缔结「同心道誓」且情深意笃之际, 双方神识熔铸「同参道印」, 为仙道最深羁绊:
- 道韵互哺: 随情缘加深自发流转生机、水德、剑心或古妖通感; 双修闭关时灵台互照, 极大削减破境瓶颈。
- 命劫共担: 渡劫遇险互分天威; 伤损濒危时生出万里灵觉感应, 能以本命精气续命吊魂。
- 破障唤心: 一方陷心魔幻障、紫府沉沦之际, 羁绊深厚者可持印破入其紫府道景, 寻其本心破魔斩妄。
- 伴生极境: 达至深爱共命之境, 可引双人命器道景合璧共鸣, 爆发越阶绝杀或虚空绝命护持。

