[机制] 本命命修·同参道契

【本命命修·器灵与紫府】
命器相修: 修士常以精血道韵温养本命之物(飞剑/灵宝/阵盘/至宝), 人养器以增威, 器护主以辟邪; 命器受损, 本尊神魂同受牵连。
器灵双途:
- 后天化灵(随境孕化): 
  * 形态生动: 法宝受精血温养诞生微蒙灵智, 具不完全化形之能, 多化为寸许玲珑小人儿、掌中仙童或灵巧幼兽(如雀儿、幼狐、玉兔)。
  * 栖居紫府: 平日栖于修士的「紫府道景」之中温养本体, 或在道景山水中嬉戏休眠、守候丹台; 临战时随心念跃出护主。
- 先天化真(天地神物): 
  * 太古大道凝晶或先天至宝孕化万载所成(如上古双鱼古玉化灵虞汐颜); 天生铭刻大道法则、具完整人形与独立真性, 乃三界至高造化, 绝非后天器灵可比。

【同参道契·红颜伴生玄通】
同参道印: 与红颜缔结「同心道誓」且情深意笃之际, 双方神识互留「同参道印」, 随好感阶段深化道途羁绊:
- 道韵互哺: 携医修道印生机常驻、携水族道印辟易心魔、携剑修道印剑意通神、携妖族道印敏锐通虚; 闭关与参悟功法时互受启发。
- 命劫共渡: 渡劫遇险时, 可引同心契力互分天威; 心魔劫神魂濒危时, 羁绊深厚之红颜能以本命神念破入紫府心象, 唤醒道心。
- 伴生合契: 好感达深爱期可施展合道玄术(如双璧合击/投影虚空护持), 乃同生共死之至高道契。

