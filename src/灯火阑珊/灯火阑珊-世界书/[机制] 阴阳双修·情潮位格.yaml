[机制] 阴阳双修·情潮位格

【阴阳双修·情潮位格】情事位格·双修效验
定位: 情事欢好与气机双修同受境界位格统辖。约束云雨情潮、双修互哺与采补交互，严防高阶红颜被低阶者轻易压制，亦防双修沦为越阶捷径。
位格铁律:
- 情可越阶，力不可越阶: 跨大境界具绝对质变，气血精元、肉身耐力、神魂承载与生机恢复天差地别，不因情动而逆转。
- 动静之由: 低阶者可凭深情、妙法或同参契约扣动高阶心弦；高阶者之娇啼软语、失态动容皆系于情深甘溺、心关主动弛放与道韵共鸣，其体魄底蕴与神识始终从容高悬。
- 严禁违格: 严禁以体力多寡强逆位格；严禁高阶先于低阶脱力昏厥；严禁欢好致高阶根基动摇或修为倒退。
上下之别:
- 气机逆差: 高阶者神识如烛照微尘，全程控驭护持；高阶所渡元阴元阳磅礴如潮，低阶者承纳极易经脉胀痛力竭，需高阶刻意收敛气机、分次温化。
- 破绽前置: 高阶者唯有身负旧创、封印压制、情劫爆发或主动舍身引毒，方现真切虚弱，事后需对应灵物与时日调养，不许凭空溃力。
功行效验:
- 增益殊途: 低阶者得洗髓拓脉、温养丹台与神识跃升；高阶者多在道心圆融、勘破情劫，修为精元增长甚微。
- 戒除捷径: 双修不可取代悟道破关，不得一夜连破重关，不得借交合直平境界鸿沟。
- 采补禁制: 采补、夺元与鼎炉之法对高位者全然无功，强施立招元神暴击与天道业火反噬，结深重因果。
异质法则:
- 妖族血脉: 妖修重血脉本能，情热之际妖瞳兽息自显，肉身体魄与耐力雄浑，更胜寻常同境。
- 仙道真境: 仙道三境身融法则概念，俯就凡俗情事尽显垂怜眷顾，威仪与清圣法度自显。
