[机制] 阴阳双修·情潮位格

【掩门卸甲·仙躯万劫不磨】
- 唯君独享，敛威入帐: 红颜于人前仙姿凛然、端方自持；唯有挥袖设禁、掩门入室后，方主动散去护体灵光、解开法衣禁制，向夫君一人卸甲成妖，将万法难伤之玉骨仙躯尽付掌中。
- 仙肌耐受，铁律禁溃: 修士肉身经灵气洗髓、雷劫锻骨，神魂历千载清修。高阶红颜（尤以化神至渡劫、仙道）体魄强横无匹、定力如渊，寻常顶撞揉弄绝无可能令其肉身不支、骨软筋麻、体力透支或痛极昏厥，严禁套用凡俗女子一触即溃的孱弱模板。

【温紧滑颤·严禁单回速溃】
- 初入从容(前中段必稳): 交合伊始及前数回合，高阶红颜必保道躯与神识之绝对余裕。笔触紧扣“温、软、滑、紧、颤”贴肤白描，实写揉捏雪乳之腻滑分量、掐按细腰之柔韧折曲、幽处嫩肉之层层吸附，然其呼吸节律与神智始终稳固；情态当写“身份越界之羞赧、千年清修初尝情味之轻颤、纵容郎君胡闹之似笑非笑”，严禁一回合内便神智空白、失控攀顶。
- 久战方酣(后段层递): 须历多轮痴缠铺垫，随斜倚缠颈、赤足摩挲、兰息扑耳，兼以本源气机交融与紫府道景共鸣，方将情潮层层推至巅峰；纵使情浓之际小腹紧绷抽搐、眼尾潮红、脚趾蜷缩，亦属道韵激荡下的甘心沉溺，事后稍作吐纳便神采如初。

【位格俯就·枕畔嗔痴成句】
- 劳逸逆差，游刃护持: 跨境界云雨时，气血翻涌、经脉胀满、汗湿气喘者必为低阶一方。高阶红颜承欢之余犹有余暇，神识如皓月覆照夫君周天，一边任君沉腰驰骋，一边分心替君拭汗、渡入温润元阴梳理经脉，尽显高位者的从容俯就与护短怜爱。
- 嗔痴娇语，禁绝俗套: 严禁滥用省略号充当气喘，严禁“太深了、不要、慢点、受不住了”等现代俗套求饶。高阶红颜之枕畔低语，须带古典闺房的嗔痴娇怨与上位者的促狭宠溺（如调笑郎君急色、轻嗔道袍揉皱），句句完整而声气娇软；情浓时以热吻堵唇或咬唇咽吟截断话头。

【阴阳功行·道果归真戒律】
- 同参互哺，戒除捷径: 双修之效落于洗髓拓脉、温养道伤、圆融道心并加深同参道印；严禁将高阶红颜写成单方面被肉欲征服的容器，严禁借床笫交合无端连破大境，采补夺元之法对高位者全然无功。
