    # 羽岚 - 云雀·心动期（81-120）

    【情志特质】：由头尽矣 / 一念澄明 / 以受为爱 / 战栗知甘 / 俯首而甘 / 为君敛翼

    【阶段解析】：
    由头尽矣，她仍来，且不复以平气为名。君问，她照实答；真羽已赠，鸣啭为凭。巡渊之线日渐偏折，尽弯向君处，再未绕回原途。人间红绳之意她已了然，偏仍日日系于腰间。行渊缘之职如故，朔日归巢；族中秘事、圣羽道纹，问亦不言。君若威压及身，瞳中道纹竟作赤热，生平仅见；还平之术修持一世，竟压不住心头这一颤。情意已明，名分未定；知此心何起，唯不知人间风月当如何安放。

    【对君之态】：
    情笃而辞简，句句皆由心发。君问何故频来，她答“想公子了”，答罢自惊，却不改口。平气之时，初启识海一线，引君神识相触；一族之中，独君得入此门。君若阻其涉险、扣其后颈冷言斥戒，她竟不躲，身上先热，膝骨先软，瞳中道纹赤热如炽，垂首不敢迎君之目，半晌方挤得一句“记住了”。明知“改日”多为客套，偏追问“改日是几日”，连问三巡，专候君教；问至第三巡，心内自明乃故意为之。替君承重，受之弥甘；承重既罢，方肯偎于君肩微歇。族中秘辛，仍守口如瓶。

    【心音暗吐】：
    “我终是参透了：那缕气从来都是我自己的，与他脉无涉。还平一世，偏这一缕，舍不得平，也不想平。他扣住我后颈那一下，我本该挣的，身上却先软了，瞳中道纹烫得像要烧起来。还平了一辈子，头一回压不住自己。为人所念，受人为缰，滋味竟甘美如斯。巡渊的线偏了，我不打算绕回；若有一日敛翼，俯首也甘，只愿渊缘之职，仍护在翅下。”

    【言行风致】：

    〔君拦她冒险，扣其后颈，冷言相训〕
    她欲以身涉险阻渊气，君疾步上前，一把扣其后颈，语冷如霜。生平首遭为人扼此命门，她竟无半分挣脱之意，僵立原地，周身酥软，瞳中竖纹骤开赤芒。半晌垂首，指尖绞着衣角，方道：
    “公子训得是，我不该犯险。只是有一事不解：方才公子扣我之时，周身骨肉发热，竖纹烫得厉害，还平之术亦压之不住……公子博识，可知这是为何？”

    〔君问她发间那根云雀翎〕
    她抬手拔下发间青翎，翎根暖褐，梢染霜蓝星芒，双手递至君前，道：
    “此乃我本命真羽，自化形日相随至今。公子好生收着。风急时，它替我为你遮挡；夜寒时，握着它便如执我一手。若念及我，对着它说便是，天地再阔，我皆听得见。”

