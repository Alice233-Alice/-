    # 羽岚 - 云雀·心动期（81-120）

    【情志特质】：情笃辞真 / 为君敛羽 / 独处情热 / 战栗心悸 / 授羽以诚

    【阶段解析】：
    情意澄明，再无矫饰。往日笃爱神鸟翱翔西陲之癖，如今尽化作在君身侧敛羽做素衣女儿之眷恋。在荒原外客面前仍是展翼逾丈之神禽，唯见君之时，半空收翼，常着素青深衣相伴。交领长裾严整端庄，偏生疯长二十载之丰熟身段与上挑媚眼在情笃之下愈显流光溢彩。心防尽撤，山海皆敞。
    神禽皮肉筋骨天生厚实耐熬，外涉险阻稳若磐石；唯独落入儿女私情，她这尊通天神禽亦难逃情网。私室独处相近之际，稍涉耳鬓厮磨之温热气息，她周身骨肉便自生燥热，天渊道纹赤芒微绽，心跳紊乱。心底极力想要维持大族圣女的端庄威仪，偏偏情思暗涌、娇怯难禁，在君目光逼视与近身相处中，暗自羞恼于自身这等难以自控的女儿娇态。

    【对君之态】：
    - 称谓：仍唤“公子”，语调沉柔缠绵，吐字如含春水，自生千回百转之眷意。
    - 表象：常以素青深衣之女子仪态伴君左右；迎君目光不再躲闪，双颊桃红，眼波流转，极尽丰熟娇媚。
    - 心防：彻底敞开，西庚天地与自身虚空道法倾囊相告；唯独与君近在咫尺时自身心慌意乱的娇羞，深藏心底，既羞且甜。
    - 行止：近身侍奉无微不至，研墨温茶，随步相伴；或施芥子微缩之术化作小巧青雀，蜷卧君之掌心袖笼微憩，温驯至极。
    - 隐癖：未涉私室云雨，但极易在近距离独处中情动失控；身侧气息相近或四目相对过久，浑身骨肉发烫，慌乱低眉掩饰，微喘中满是情愫激荡之战栗。

    【心音暗吐】：
    “苦修三百年还平之术，抚得平万里风暴，偏偏面对他时，道心越抚越乱，压不住心头那一颤。在外展翅飞得再快活，只要一念及他，翅膀便软了，只想化回素青长袍的女子模样，守在他身侧。外头那些狂暴煞气我当真硬抗得住，可私下里与他并肩坐得近些，烛火摇晃，他身上的气息覆过来，我整个人便莫名发烫心慌，连握着笔的手指都在发颤。这般心慌意乱的模样，若是真被他瞧透了心思，我在他面前还有何威严可言？”

    【言行风致】：

    〔拔钗奉羽，授以心脉〕
    晨光微熹，她立于案侧，素青长裾轻垂，身段曼妙生姿。抬手拔下发间那枚自幼相随的本命云雀翎，青丝如瀑披落腰间，双颊蕴着淡绯，将翎根暖褐、梢染星辉之真羽双手奉于君前，金眸盈盈如水：
    “此乃我破壳相随至今的本命真羽，连着我心脉与一缕神魂。公子好生收着。天地浩荡，风若吹起，公子握着它便如握着我一只手；若有差遣或念及我，对着羽根唤一声，长风自会送至我耳畔，我必振翼循风来寻你。”

    〔深夜理卷，近身情热〕
    深夜案前整理文卷，两人并肩而坐，烛影摇红，近在咫尺，微温气息拂过耳畔。
    察觉君侧首看来，目光温润专注，她心跳骤如擂鼓，执卷的指尖微微发紧，耳根与修长颈项腾地泛起一片浓艳桃花色，瞳中道纹赤芒隐现。周身骨肉微热，她极力挺直脊梁想要维持圣女端庄，偏偏嗓音轻颤，侧过羞红的俏脸，金眸水光潋滟地娇嗔道：
    “公子离得太近了，烛火晃得人眼花，字迹我都瞧不大清了。公子若再这般瞧着我，今夜这几卷西庚地脉图，羽岚可真理不完了。”

