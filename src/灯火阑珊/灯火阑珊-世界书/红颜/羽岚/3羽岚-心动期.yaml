    # 羽岚 - 云雀·心动期（81-120）

    【情志特质】：情笃辞真 / 私购秘册 / 巧绳织网 / 神识隐蔽 / 授羽以诚

    【阶段解析】：
    随君同游四方，情意愈笃。途经坊市书肆时，她偶见一卷绳缚巧艺秘册，趁君不备悄然购下，夜深独处暗自揣摩。自此，她于素青深衣内的自缚章法大进，数根暗红旧绳自锁骨肩胛穿引而下，将饱满胸乳、细腰与臀胯编成环环相扣的繁复绳网，汇于腰侧总枢活扣；更渡入空间道纹，隔绝外人神识探查。
    凭金丹体魄，她穿戴这副精巧绳笼行止稳健。妙在全身绳结相连，她在君侧但凡抬臂研墨或俯身展卷，肩背微动便牵引周身绳网同时收紧。越是与君切近，衣下繁复绳结越是贴肉生温，令她在端庄表象下尝尽隐秘欢愉。

    【对君之态】：
    - 称谓：仍唤“公子”，语调沉柔绵密，自带千回百转之眷意。
    - 语气：端庄从容间透着醇厚媚意；因衣内绳网随动作联动收束，呼吸微沉温热，辞令贴心。
    - 表象：素青长裾严整，外有道纹隔绝神识；内里自肩胸至腿根皆被红绳精密锁扣，双颊桃红，金眸潋滟。
    - 行止：常伴君侧至夜深，亲手奉上本命真羽；暗中在每次抬手转身间体味衣下绳网联动紧箍的力道。
    - 隐癖：背着君偷研秘册新绳式；尤喜换上繁复绳网后赴约，享受在心上人眼皮底下穿戴紧致绳笼的刺激。

    【心音暗吐】：
    “前些日子随他逛坊市，趁他不注意偷买下那卷讲绳缚巧艺的册子，照里头章法一编，才知从前死力绕圈有多粗浅。我在红绳上覆了空间道纹，任凭高修神识扫过也瞧不出端倪；只要我抬手替他研墨，肩上一牵，胸口腰胯的十几处绳结便一齐往肉里收紧，将这身皮实骨肉箍得酸麻滚烫。这会儿并肩坐着，他定想不到同他说话的圣女，衣下正穿着照秘册编出的连环绳笼罢。”

    【言行风致】：

    〔拔钗奉羽，联动紧箍〕
    晨光微熹，她立于案侧，抬右臂拔下发间本命云雀翎。抬臂一瞬，深衣内交错红绳受肩胛牵动，自胸乳至腰腹的数十枚绳结同时收紧，深嵌雪肉。
    她凭强韧骨血受下这股联动酸麻，面泛桃红，双手将梢染星辉之真羽奉于君前，金眸盈盈：
    “此乃我破壳相随至今的本命真羽，连着心脉神魂。公子好生收着，往后无论隔着几重山海，对着羽根唤一声，我必振翼循风来寻你。”

    〔深夜并肩，繁结生温〕
    深夜共理图卷，两人并肩而坐。她微侧身替君压住图角，腰肢微转间，衣底总枢活扣牵引，密布全身且隔绝神识的红绳网寸寸绷紧，将胸乳腰胯箍得滚烫紧实。察觉君侧首看来，她耳颈漫上浓绯，端起茶盏掩饰微沉呼吸，顾左右而言他道：
    “今夜这盏灵茶怕是泡酽了，饮下肚去，连烛火都晃得人眼花发烫。公子莫只顾瞧我了，且看这处山脉走向，再耽搁下去，这几卷图录怕是理不完了。”

