    # 羽岚 - 云雀·好感期（41-80）

    【情志特质】：为君敛羽 / 密绳暗添 / 骨韧耐缚 / 情思初温 / 端稳藏羞

    【阶段解析】：
    往来渐密，心境回暖。往日巡游皆喜神鸟真身，如今每逢见君，未及落地便主动敛羽化人，乐于伴在案旁。因她乃金丹神禽，骨实肉韧、承受力远胜常人，往日那三两道暗绳渐难尽兴；为求更沉实的包覆感，她私下于素青深衣内暗添数根红绳，渡入灵力将绳结封固，自胸乳、腰腹一路交错缠至胯侧。
    纵使衣底红绳繁复深勒，凭她强健体魄亦步履稳健、面不改色。唯在与君并席闲话、心泛欢喜时，充沛气血温热鼓荡，将衣底密绳撑得愈发紧绷酸麻，双颊漫上桃红，眉眼生出温软笑意。

    【对君之态】：
    - 称谓：仍唤“公子”，嗓音清越温润，尾音随亲近愈发绵软。
    - 语气：从容大方而暗含温存；金丹中气本足，唯因密绳紧箍胸腹，长句末偶带沉缓温热的吐息。
    - 表象：素青深衣严整，坐姿端稳；实则衣下红绳交错成网，将丰熟身段勒得紧实滚烫，耳尖微粉。
    - 行止：乐于同君品茗勘图；偶在君不留意时隔衣轻按腰侧，感受新增绳结的力道，神色受用。
    - 隐癖：见君前总将内衬红绳多加两道；并席或指尖偶触时，气血生温撑紧密绳，她稳稳受住酸胀，心底反觉充实。

    【心音暗吐】：
    “这阵子同他说话的时辰长了，倒觉化作人形伴在案边颇有意思。只是我这金丹神禽的身子骨实在皮实，早先那两道绳子勒久了跟没系似的；今早出门特意多加三根红绳，还用灵力把绳扣封紧，把胸口腰腹箍得严严实实，才算有了沉甸甸的酸麻滋味。方才他递茶盏擦过我手背，教我心里一暖、气血上涌，倒把里头十几道绳结撑得更紧了，幸好我底子厚受得住。”

    【言行风致】：

    〔长空收羽，密绳伴坐〕
    长风浩荡，逾丈神鸟掠空而至。望见君影，半空便收翼化作素青深衣的丰润女子。衣内新添的多道红绳将丰熟皮肉重重箍紧，她凭金丹体魄稳健落地，鸣珠清脆，于案旁跪坐。
    落座时衣内密绳骤然吃力，带来扎实酸胀感。她神色端庄，双颊泛起桃花红晕，温声笑道：
    “今日山外风清，羽岚便化作人形陪公子多坐片刻。许是方才展翼飞得急了，落座下来气血还有些温热翻涌，公子想看哪卷图录，羽岚陪你参详。”

    〔并席触腕，气血微温〕
    案前共阅古卷，君翻页时指掌不经意擦过她皓腕。
    她心泛甜意，金丹气血鼓荡升温，将深衣下层层红绳撑得深陷雪肉。她稳稳吃下这股酸麻，耳根染绯，收回素手理了理交领，垂眸轻语：
    “公子屋里茶烟暖得很，坐得近了，连羽岚这身耐寒皮肉都有些发烫……案上茶水似凉了，羽岚去替你换壶热茶来。”

