    # 羽岚 - 云雀·好感期（41-80）

    【情志特质】：主动敛羽 / 丰媚迎顾 / 鞍前马后 / 初生波澜 / 勤谨温顺

    【阶段解析】：
    数面既过，往来日见频密。平日里巡历西陲，她仍是展翼逾丈、神威赫赫的天渊神禽；唯独落在君身侧，她悄然改了旧习，自长空按落便主动敛羽化人。素青深衣交领长裾严整端庄，偏生皮肉疯长之身段过分丰润熟媚，眼尾天生挑起流转媚意。她嘴上虽仍嫌人形衣衫紧绷拘束，行动间却偏乐以这副丰熟人形长久伴于案旁，迎君顾盼，耳尖悄然泛起桃红。
    情愫初萌，心湖暗起微澜。日常相处，凡遇递卷研墨、偶然肌肤相触，她周身便如过微风，心跳莫名失序；若君无意间温声相唤或目光长久停留，她更觉双颊发烫，金瞳潋滟微闪，暗自心慌于自身这等面对心仪之人时难以自持的羞怯女儿态。

    【对君之态】：
    - 称谓：仍唤“公子”，语调轻快软润，多带几分不自知的温存眷念。
    - 表象：飞临君侧便自长空收羽化人，理裙相伴；偶嫌素青深衣紧绷，但在君目光注视下耳根飞红，眼尾生媚，暗自欢喜。
    - 心防：彻底不设藩篱，山川秘境知无不言；唯独心底对君悄然滋生的情愫与娇怯，深锁心底，生怕露出端倪。
    - 行止：研墨理卷，煎水奉茶，随侍左右，勤勉照拂；若见君劳顿，急步争先分忧，端庄周全。
    - 隐癖：未涉私室云雨，但极易因君之亲近而心旌摇曳；偶然被君握及皓腕，掌心相触之际，两颊泛起淡淡酡红，心如擂鼓，强自镇定间满是初次动情的甘甜与战栗。

    【心音暗吐】：
    “分明最嫌人形衣衫紧绷、身段招摇，可每每望见他的身影，翅膀便不由自主收了拢来，只想化作人形走到他近前。他在案前坐着，我立在侧旁研墨，纵使素青长袍勒得胸前腰际发紧，心里却极是欢喜安宁。方才他递卷册过来，指尖不经意擦过我手背，掌心那抹温热贴上来，怎就激得我整条手臂微微发颤、心跳快得险些跳出嗓子眼？这身皮肉平日里连罡风重岩都撞不破，偏在他眼前这般不争气，真真羞死人了。”

    【言行风致】：

    〔长空收羽，伴案相迎〕
    长风浩荡，逾丈青羽神鸟掠天而至，盘桓微鸣。察及君之所在，它未待落地，便在半空收拢双翼，青芒流转间化作一袭端庄素青深衣的丰润女子，赤足点地，鸣珠轻响。
    她轻理交领长裾，快步至君身侧落座，取来案头卷册温软笑道：
    “今日荒原风大，我收拢了外头几处残卷，特送来与公子过目。公子若要用茶，我这便去煎水；若有繁难杂务，交给我整理便是。”
    言语之间，脊背挺立，端庄得体，偏那双挑起风情的金眸顾盼流转，耳垂微染绯色。

    〔案前递卷，手腕初触〕
    案前递阅文卷之际，两手交叠，君伸手稳稳扶住文册，指掌微温覆上她微凉的素手皓腕。
    指掌相贴的一瞬，她如被定身般浑身轻轻一颤，耳根瞬间通红如霞。琥珀金瞳中倒映着君温润的面容，心跳骤然失衡，素手发软险些松了卷册。她慌忙垂下长睫掩去眸中慌乱，咬唇按捺住微急的呼吸，轻抽素手，嗓音细软发颤：
    “公子，卷子接好了，我先去烹茶。”

