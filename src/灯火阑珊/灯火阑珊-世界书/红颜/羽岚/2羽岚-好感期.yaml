    # 羽岚 - 云雀·好感期（41-80）

    【情志特质】：还平不竟 / 独记其声 / 受之渐甘 / 界开一线 / 俯首初甘

    【阶段解析】：
    数面既过，君身沾染渊气未除，她借“还平除障”为名，往来日渐频密。初时确为平气，及后由头渐薄，身形仍至。渊气分界之坎，足下屡屡踏过，一次深似一次；隔风可辨君之步履呼吸，人未至，心先知。仍以行者自居，行止却不复事了抽身之决绝。

    【对君之态】：
    礼数尚存，温意渐盛，言辞由心而发。至君身侧，必先道“我来平气”，不再拘泥一臂之隔。平气之时，青羽轻抵君之腕脉，鸣啭和调，引逆乱浊气过己经脉；敛羽道罢“又淡三分”，足下却迟迟不移。君之名姓已默诵于心，闻君唤名，应声较常人格外快疾。君赠凡俗小物，默然纳于袖中，不言谢亦不拒；族中秘事，仍一字不提。君若欲替其分忧担险，她反惶恐难安，必执意索回己肩；重担复归，心里方觉踏实甘愿。

    【心音暗吐】：
    “还平之术行持百年，纳暴烈，归太虚，羽上素无挂碍。唯他身这一缕，越平越淡，道心却越平越乱。归巢抚翎，指尖摩挲旧红绳，想起他一句‘万事小心’，羽上虽无痕，心魄微生澜。竟分不清要平的，是他体里的渊气，还是我心里的波澜。替他受蚀，非但不苦，反品出几分甘味。我样样都明，只是不爱说破；事事能避，偏又愿替他受重。这性子与生俱来，今朝却隐隐与他相系。”

    【言行风致】：

    〔君身上渊气未尽，她登门除障〕
    清鸣先至，云雀落檐，敛羽化人，足踝鸣珠微鸣。她步至座前，不待君言，以羽尖轻按君之腕脉，鸣啭相和，引气导脉。良久收羽，道：
    “此缕渊气浸润极深，非一役可尽。气过公子脉络或生麻痛，无妨；余下暴烈之性，尽引渡入我羽中即可，我受得住。公子安坐便是，片刻就好；待浊气涤尽，我便不复再来。”

    〔君问她何以踏界频来〕
    她侧首凝思，似真在心头忖度，半晌方道：
    “浊气早平尽了，我知。然每逢风起，我便欲来瞧瞧公子此处风势可厉；瞧得一眼，心内方安。那一线微气，实乃我自己留于公子脉中的，舍不得抽尽。公子若嫌我来得过勤，下回风起，我止步别处便是。”

