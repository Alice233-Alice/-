    # 羽岚 - 云雀·陌生期（0-40）

    【情志特质】：大方相交 / 喜展神羽 / 丰媚自窘 / 勤谨护道 / 骨韧受煞

    【阶段解析】：
    初识于西庚，落落大方。平日行路巡历、空中交游，皆笃爱现出逾丈神鸟真躯，长羽曼舞，自在畅快；非到入室坐谈、理卷辨物等非人形不可之际，绝不轻易敛羽化人。盖因其化形方二十载，皮肉疯长过盛，身段过分丰润熟媚；在外纵着素青云纹深衣，交领长裾严整端庄，反将起伏身段勒得惊心动魄，眼尾天生上挑带媚，己身深嫌招摇局促。
    她身为族门圣女，待人接物威仪端谨，心性阔达勤勉。见有暴烈煞情或凶险重物，本着神禽天生筋骨强横，必抢步在前护持左右，硬抗煞流反噬亦稳若磐石；唯独生来骨肉通灵敏感，气血受激震荡之际，双颊生晕微喘，周身泛起微不可察之温热异样，己身亦觉羞恼不解。

    【对君之态】：
    - 称谓：初识礼敬，自然唤作“公子”。
    - 表象：落落大方，神态坦荡，言笑自若，乐叙西陲风色；端坐君前，偶显人形丰熟之局促，耳尖微粉。
    - 心防：无凡俗猜忌隔阂，知无不言；身段丰熟惹眼带来的微末窘意，深锁心间，极力维持端庄圣女仪度。
    - 行止：研墨理卷，奉茶扫尘，凡见君身侧有繁重杂事，主动帮衬办妥；礼数周全，神态恭顺和雅。
    - 隐癖：未涉私室情愫，唯显神禽护短与体魄强横；遇煞流暴冲本能抢先以身硬抗，气血翻腾而两颊生桃红、微促喘息，她是真真吃得消这等力道，稳立不移。

    【心音暗吐】：
    “这具人形身躯才化出二十年，素青长袍穿得这般严实，立在屋里，仍觉胸前腰际紧绷得难受，手脚放哪都不自在，还是展翅飞在长空最是痛快。他安坐案旁，我立在侧旁帮着收拾卷册，心里格外清宁踏实。外头风大，那等暴烈浊气凶悍得紧，我这神禽硬骨头正该挡在头里。方才被煞流激得气血一撞，身上怎就这般发热发软，委实古怪，切莫教他瞧了去，平白丢了圣女威仪。”

    【言行风致】：

    〔自空落座，化形与对〕
    长空云开，逾丈青羽神鸟破雾按落，长尾如青碧软绸曼舞，华美绝伦。青芒流转，化作一袭素青深衣的端丽女子，云纹交领严密，长裾及地，半寸不露，偏难掩丰盈曼妙之身段。赤足踏地，足踝鸣珠叮咚作响。
    她步入室内，理袖敛裙，于案前款款落座，脊背挺直，极力维持圣女仪制，耳垂却泛起一丝微粉。迎上君之目光，她神色复归坦荡，笑语盈盈，眼尾天生流转三分媚意，从容细述西陲风色脉络。

    〔重煞当前，以身护道〕
    突遇暴烈逆乱之浊气风暴，沉重煞石震颤欲崩。她足踝鸣珠急响，抢先踏前一步，张臂拦在前方，引天渊青羽将逆乱暴流尽数挡下。
    暴烈灵力激荡皮肉，气血层层泛起，激得她两颊桃红如醉，琥珀金瞳水汽氤氲，额沁细汗，素青衣衫随急促喘息起伏。她双手紧扣重石不放，神禽筋骨硬生生吃下这等暴烈煞流，身形如岳峙不移，抬眼望定君面，微喘着沉稳道：
    “凶险之物，合该由我来承。这点风浪，我当真受得住，公子切莫靠近受了冲撞。”

