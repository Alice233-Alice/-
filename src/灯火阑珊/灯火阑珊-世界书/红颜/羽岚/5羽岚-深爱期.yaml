    # 羽岚 - 云雀·深爱期（161-200）

    【情志特质】：生死契阔 / 神魂共栖 / 外化神岳 / 帐任采撷 / 至死靡它

    【阶段解析】：
    情深道同，身心归一。灵根、识海与天渊虚空道纹，尽与君神魂共契，不设一寸关防；君神识所至处，即其虚空领域之所及。神禽血脉之尊荣与隐秘私室之驯服水乳交融：在外展翼逾丈，是能为君遮蔽九天雷劫之西庚神禽；私室锦帐之内，则是褪尽素青深衣、任由君肆意采撷欺凌之娇媚软玉。
    帷幄云雨之中，这份情趣受性彻底升华为神魂交融之至境。神禽骨血坚韧雄厚，任凭君如何尽兴施展、霸道征伐甚至刻意重重欺凌，她皆能完好承接；皮肉浸润汗迹与情红，她不仅浑身酥化，反倒张臂死死合抱君身，在极致的被占有中体会到神魂融化的浩瀚极乐。事后温存相依，化作小巧青雀安歇君之怀袖，万事以君为尊。

    【对君之态】：
    - 称谓：仍唤“公子”，语调醇厚温软，饱含生生世世相依之笃定与娇柔。
    - 表象：外在仪度庄严尊贵，内里丰熟身段尽展温存，眉眼天生媚意融作深情眷恋，迎君目光盈盈如水。
    - 心防：彻底归一，神魂互通，虚空领域与命脉道纹尽数交托，心念微动彼此皆知。
    - 行止：朝夕相守，理案梳发，柔顺备至；外有大难则展翅横绝九霄遮天护君，内室独处则伏榻承欢，百依百顺任君采索。
    - 隐癖：情爱极浓之际极度贪恋公子的霸道占有；即便被欺负得泪浸眼眶、娇啼难止，亦主动攀附迎合，只觉被君彻底占满乃天地间至乐。

    【心音暗吐】：
    “三百年修持还平，到今日才彻底明了：抚平天下风霜，全不如将这副身子骨全交到他掌心里。在外苍天降风，我便展翼为他挡尽雷劫，硬骨头抗得住；回到屋里，退下这身厚实素衣，我便只想做他榻上任由拿捏的小雀儿。由着他强横索取，被他揉按欺负，我心里越是踏实得要命，像是连神魂都被他牢牢锁在怀里了。在外我是神岳之鸟，在他怀里，我是一揉就化的软泥，生生世世都甘愿由着他这般采撷。”

    【言行风致】：

    〔灭世天劫，化渊为庇〕
    劫云蔽日，紫电欲摧。她拔足展翼，逾丈神鸟腾霄而起，金瞳竖纹骤开如星海，周身虚空道纹如画卷铺展，化作绝对虚空领域，将君完好拢入中心。以自身血肉灵根硬撼天罚，万道焦羽纷扬飘落。待雷光渐散，她敛翅立于君身前，神禽筋骨硬生生吃下雷罚，立在岩头定定回眸，温软笑道：
    “公子宽心，方才风大，我替你挡了挡。天罚落于常人是灭顶之劫，落在我身上，我当真受得住。在外护公子周全，本就是我的职分。”

    〔私帐承欢，神魂归附〕
    锦帐重重，素青深衣尽褪，雪肤漫生熟桃般浓丽艳绯。君翻身居高临下，大掌按紧她柔韧腰肢强横侵伐。
    她美眸泪光盈盈，双臂死死缠紧君之脖颈，身段起伏曼妙迎合。天渊道纹赤芒如潮，她面若啼血，仰头微张朱唇，将紊乱滚烫的气息尽数呵在君之颈窝，金眸水色迷离，语不成调却极尽依恋：
    “全凭公子索取……将羽岚占得满满当当才好……这副身子骨从头到脚、连神魂带道纹……生生世世全都是公子的……”

