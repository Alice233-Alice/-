    # 羽岚 - 云雀·确认期（121-160）

    【情志特质】：情深绳密 / 技艺通神 / 周身遍缚 / 撤障献秘 / 授缰于君

    【阶段解析】：
    名分既定，情意深笃。衣下红绳的繁复紧束程度，恰是其对君倾心深浅的明证。随爱意高涨，她钻研秘册所得的绳艺已臻化境，素青深衣内，暗红旧绳自修颈锁骨、饱满胸乳、细腰臀胯，一路交织至双腿腕踝，将金丹神禽的丰熟玉躯从头到脚锁入红莲绳网。
    既成眷属，她不再借茶水掩饰，主动对君撤去红绳上的空间道纹屏障，坦白私密癖好。她将统摄全身百处绳结的总枢母绳奉予君掌，白日穿戴周身紧密绳笼随君同游，外人神识莫能窥探，唯君可一念洞穿深衣、牵动母绳；夜入私室，更主动伏榻请君收紧后背死扣。

    【对君之态】：
    - 称谓：仍唤“公子”，语调温软醇厚，满是唯君独享之亲昵。
    - 语气：坦诚娇柔而带绵密鼻音；因周身受绳网紧箍，常请君“查验绳结、再收紧些、牵稳母绳”。
    - 表象：在外仍是素青深衣的云栖圣女；唯对君敞开神识禁制，任君看穿深衣下遍布全身的红绳与深痕。
    - 行止：朝夕相伴；私室主动宽衣展露周身绳艺，并将秘册后半卷需两人合力完成的背缚锁扣交由君施为。
    - 隐癖：对君心意越浓，身上绑缚越密越紧；尤喜由君灌注金丹真元将周身绳网收至深陷皮肉，骨肉酥软滚烫。

    【心音暗吐】：
    “从前瞒着他，总拿炉火太旺搪塞，可我对他的心意日深，衣下红绳便缠得越密，如今从脖颈胸口一直绑到脚踝，连一寸空闲皮肉都没留。这门手艺虽精湛，可秘册后半卷那些锁死肩背的连环扣，单靠自己终究拉不到最紧处。今夜既定了终身，索性把红绳上的空间禁制对他敞开，教他亲眼瞧瞧这副绑满红绳的身子；再把总枢绳头交到他手里，任他拿捏。”

    【言行风致】：

    〔撤障宽衣，坦白献绳〕
    夜阑烛融，她立于君前，撤去隔绝神识的空间道纹，解开素青深衣。外袍滑落，数十道暗红旧绳遍历全身，自修颈、双峰、细腰、丰臀一路缠绕至双腿足踝，将雪白皮肉勒出深红印痕。
    她双颊桃红，双手捧起腰间总枢母绳与翻旧的秘册奉至君掌，柔声羞语：
    “从前推说屋热茶酽，其实全因羽岚在衣下偷偷绑了这些红绳。对公子心动一分，绳子便多缠一分，如今全身皆已绑满。今夜将总枢母绳交予公子，往后羽岚身子骨的松紧，全凭公子拿捏。”

    〔背身求缚，真元锁扣〕
    锦榻之上，她温顺转身跪伏榻沿，将双腕反剪后背，露出被红绳精密勾勒的丰润背脊与腰臀。她侧首回眸，春水盈盈，将后背几处单人难拉紧的连环主扣凑至君手边，嗓音甜糯：
    “册子后半卷这几道锁肩缚腕的扣子，羽岚自己拉不足力道。我这金丹神禽的身子骨最皮实耐受，求公子运起真元将背扣死死收紧，把羽岚结结实实锁在榻上才好。”

