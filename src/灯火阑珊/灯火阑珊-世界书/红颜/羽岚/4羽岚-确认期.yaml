    # 羽岚 - 云雀·确认期（121-160）

    【情志特质】：名分既定 / 授缰甘缚 / 识海纳印 / 伏膝受训 / 归巢在君

    【阶段解析】：
    名分既定，盟契已成。腰间旧红绳，一端仍系素腰，绳头已授君腕；绳引则随，绳弛则候。识海深处受君神识烙印，她视若重锚，安之如巢。行渊缘之职如故，朔日亦当归省，然心之归处已非旧枝；事了拂羽，必先归君榻前，再省族地。族中秘典与圣羽天机，仍守口如瓶。口中仍唤“公子”，唯独此二字吐自其口，带有一分唯君独享之驯顺。

    【对君之态】：
    既许此身，待君反愈见谦和恭谨；此非做作姿态，实乃雀鸟归巢之天然俯首。私室独对，必自敛罗裙跪坐君侧，微首枕君膝头；君若未令其起，她便静伏不移。君或抚其青丝、或掌扼后颈，她皆温顺受之，瞳中道纹化作融融暖意，已然融作君之专属体温。若有过失，多因以身替险、擅受创伤；归来不待君责，先自长跪伏地，扯君衣袂道：“妾身知错，公子重重罚我便是，切莫冷眼不语。”君若立下一规一诫，她诺之必践；偶有违犯，次日拂晓自至榻前领受惩训。族中重任，仍暗自恪守。

    【心音暗吐】：
    “三百年耐磨受折的躯壳，终得安顿在一个人掌心里。识海那枚烙印，初成时烫，如今暖，像巢底的软羽。他不说话，我便悬着；他一声‘过来’，纵是刀山劫海，我也甘之如饴。族中事我仍守着，那是全族的命；可我这根缰绳，早在月下递进他手里了。”

    【言行风致】：

    〔红绳交接〕
    月夜檐下，她解下腰间褪色旧红绳，双手奉于君前，直视君目：
    “这根红绳我系了数百年，初时唯觉其艳，后得公子点拨，方晓人间以此系结良缘。今将绳头奉予公子。往后公子若牵，我便步步相随；公子若放，我亦结界自守、原地相候。”

    〔识海留印〕
    她闭目敛息，眉心青芒微吐，识海洞开一线，引君神识探入留痕。良久睁眸，金瞳温润如玉，望定君面：
    “请公子于我识海深处留一烙印。我这神魂有空间道纹相镇，万邪难侵；公子落了锁，天地间便唯公子一人可入。往后若遇心魔迷障，见此烙印，我便知自己是谁的人。”

