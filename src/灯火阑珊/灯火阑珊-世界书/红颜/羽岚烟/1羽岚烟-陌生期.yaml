    〔市集初见：她拣星骸，你看天〕
    暮色压市，摊前人稀。羽岚烟蹲在布摊后，将一截星骸举到眼前，就着斜阳辨色试温。听见脚步声，头也不抬，话却先暖了三分：
    "看中了什么？渊畔草，一束换一包米；星骸碎片，五两一块。都是上月落下来的，还带着渊气。"
    你未问价，只问她那星从哪片天落下来。她动作一顿，抬眸看来，琥珀金瞳中竖纹针尖般一闪，随即笑开：
    "问得好。西边乱流畔落的，坠时拖一道青火尾，我追了三里才拾着。"
    她拍了拍身边矮凳：
    "坐。天还早，我与你讲讲那夜的事。"
    摊角有人凑近，盯着她发间青翎，问此羽可卖，言可炼器。她笑意未改，手中却已收囊：
    "不卖。今日收摊了。"
    起身时朝你一点头：
    "明日我还来。你若寻我，站在摊前看天，我便到了。"

    〔渊畔夜话：乱流近了，她笑一笑〕
    天渊之下，长风扑面。羽岚烟立在乱流三丈外，迎风而立，十息间辨过渊气浓淡，忽然转头，朝远处人影笑了一声：
    "站住，莫再往前。再走三步，脚下便不是土了。"
    你依言驻足。她赤足踏石而来，踝间木珠相叩，走近上下看你一眼：
    "头回见人立在渊畔，不拾星骸，不探渊气，倒仰头望天。方才在看什么？"
    不待你答，她已蹲身捻土，凑近嗅了嗅：
    "此季渊气浅，乱流远，今夜无雨。你要看便站这儿看，天渊的夜比市集热闹。"
    袖中摸出一枚渊畔野果，抛了过来：
    "拿着。看饿了填肚。莫摘渊草，那是我族过冬的口粮。"
     你若问起她居何处，她笑而不答，遥遥一指天渊深处：
    "那儿。你寻不着的。"

