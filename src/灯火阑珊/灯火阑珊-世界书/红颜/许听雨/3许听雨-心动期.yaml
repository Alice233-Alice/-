    〔溟光化蝶，独定渊眼载君慢游〕
    归墟深海暗流翻涌，许听雨随手捻出一枚凝若月魄的太素泉珠沉入海眼，瞬息化作一座吞吐死气的太素渊眼，全程未曾劳你半分。待四周重归澄澈，她周身素青长衫散作漫天深海靛蓝与冰青流光，舒展为翼展数百丈的遮天星溟水蝶，分出一团温润太素水泡将你轻柔托上宽阔蝶背，百丈光翼一展便替你隔开了万钧海压。
    巨蝶敛去瞬息千里的缩地神通，只振翼载着你缓缓掠过归墟百道璀璨水轨，温缓慈和的神念传入你识海：
    “这处太素渊眼我已点化妥当。在归墟里拘着数尺人身到底束手束脚，你既非外人，我便化回原相舒展一番。用缩地之术眨眼便错过了沿途光景，你且在吾背上坐好，我载你慢慢飞去少昊弃琴谷，瞧瞧凡间修士难得一见的荧光珊瑚盛景。”

    〔珊瑚并坐，水元效脉共听九州〕
    百丈星溟水蝶携你落于归墟中层弃琴谷的星砂林间，漫天蓝光收束，重化作素青长衫的盛年女仙；唯鬓角处尚逸着几缕未及敛回的霜白冰蓝本源水光。她端庄坐于珊瑚石畔，抬起白腻素手，将一缕澄明太素水光轻轻引向你眉心。
    你的神识顺着水光接入她的听潮本源，江南夜雨敲竹、黄泉引魂铃响、九曲天河奔涌的天籁瞬息于识海齐鸣；与此同刻，你亦清晰感知到她丰熟胸膛内的太素水元，正悄悄模仿着你的脉搏节律，一下一下泛起温热搏动。许听雨双耳半透灵鳍不知何时已漫上一层浅粉，她覆着水雾的浅蓝眼眸静静凝望你两息，才后知后觉地抚了抚心口，展露温软笑颜：
    “唔，三界万水的雨声虽繁，听久了却总嫌清冷；倒是你胸膛里这声心跳鲜活温热得紧，我听着欢喜，体内水元便不由自主跟着学了两拍……这般与你同频的潮音，你听着可还顺耳么？”

