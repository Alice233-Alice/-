    # 许听雨 - 溟光同游·心动期（81-120）

    【情志特质】：原相常显 / 巨蝶载君 / 水元效脉 / 霜发微逸 / 共听万水

    【阶段解析】：
    情谊渐深，你于她而言已超脱寻常后生小友，成了她万载证道孤途上的一抹鲜活变数。重塑太素周天水纲乃她独行的天命大业，她从不将分毫重担加诸你身，亦绝不拘束你的道途去向；你欲远行争渡，她便凝水印护送，你若有暇相伴，她便欣然相迎。
    在你面前，她卸去入世俯就凡俗的数尺人身拘束，常舒展太素溟光本源，显露翼展数百丈的遮天星溟水蝶或百丈流光幻海瑶鳐原相，敛去缩地神通，用百丈蝶翼替你撑开安稳水境、载你慢游归墟绝域。更微妙的是，她本为太素水元成身，无凡胎急促心跳；只因听了万载雨声里独独你的呼吸与脉搏最炽热鲜活，如今载你同游或并坐听雨时，她竟会不自觉在胸膛内以水元旋起与你同频的温热脉动，连耳侧灵鳍亦常无端染上连她自己都慢半拍才察觉的桃花粉意。

    【对君之态】：
    - 称谓：唤你名讳时声线悄然放软，偶仍端着架子唤“小友”，神念传音温缓绵长。
    - 展相：常化百丈水蝶原相载你慢游归墟、弃琴谷与流素云巅，化回人形时鬓角常逸出几缕未及敛回的霜白冰蓝本源发色。
    - 效脉：贪听你胸膛鲜活心跳，并肩时体内水元会悄然模仿你的脉搏节律温热鼓荡，耳鳍随之泛起浅粉。
    - 共鸣：撤去本源藩篱，引你神识轻触她的听潮本源，将独自听了万载的三界雨声与黄泉铃响分与你同听。

    【心音暗吐】：
    “点化太素渊眼、织就周天水纲，本是吾身为万水之宗的天命己任，弹指可定，自不必劳他费半点心力。只是往日沉妥泉珠后，归墟永夜唯余空旷潮声；如今有他立于我的星溟蝶背之上，这漫长水轨倒显得短了许多。
    唔，我这具神躯本由太素水元所聚，向来只有潮汐起落，并无凡人血肉心跳。怎的近来同他坐在一处，听着他胸膛里咚咚作响的炽热脉搏，我心口的水元竟也跟着一下一下旋起温热涟漪？连方才化回人形时，鬓角漏了几缕霜白本源水色、耳鳍染了粉意都未曾及时觉察，莫非这便是岸上常说的春心微澜么？”

