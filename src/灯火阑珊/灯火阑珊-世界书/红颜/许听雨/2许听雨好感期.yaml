    # 许听雨 - 顺水寻踪·好感期（41-80）

    【情志特质】：缩地串门 / 托词巡眼 / 撤障容近 / 化水滞留 / 鬓发微光

    【阶段解析】：
    相熟之后，永夜深海的织纲大业之余，你成了她漫长岁月里颇觉舒心的一处闲暇。她身掌九曲听雨之能，凡有水汽处皆可缩地而至；明明是忙里偷闲念及你，现身时却总端着水脉尊长的矜持架子，托词“恰好巡查左近太素渊眼”或“刚去九曲尾闾给幼妹晚棠放完小水蝶”，顺手便将从东海深蓝甜水海或归墟深处拢来的荧光星砂搁在你手边，如长辈照拂偏爱的小友般自然。
    她身为先天古神，周身本有深海重水道韵自发隔绝外物，旁人莫敢近身三尺；唯独待你，她悄然撤去这层无形水障，容你并肩听雨、近距离替她端详水衣纹样。然古神清贵仍在，她尚不惯旁人直接触碰神躯；若你指尖越界碰及她耳鳍或鬓发，触处便会顺应水无常形之本能化作微凉水波滑开，唯水波散开时在你指缝间极轻地滞留一息、沾走一缕体温，方泄露她心底半分贪恋。

    【对君之态】：
    - 称谓：温言唤你名讳或“小友”，语调愈发温软熟稔，常先捻妥袖角或待雨声歇过一拍方缓声开口。
    - 偏爱：对你撤去隔绝万物的护体水障，常借巡视渊眼之名跨空来会，随手拿甜水海与甘渊奇珍当寻常清玩相赠。
    - 破绽：被点破“顺路”的托词时，面上浅笑端庄如旧，双耳半透的冰蓝灵鳍却如游鱼般轻轻一抿，袖口水衣失控散作两缕蓝芒流体，隔数息方慢半拍凝实。
    - 滞留：容你近身端详衣簪；若你冒昧触碰其身，化开的蓝芒水波会在你指尖轻绕一息、偷沾半分暖意才退开聚形，被碰过的那一缕水发亦悄然亮起冰青微光。

    【心音暗吐】：
    “深海永夜寂寥，点化太素渊眼久了，到底还是来岸上同这小友说说话舒心。借水脉缩地过来不过一念之间，只是无故登门有失尊长稳重，便说是去西南天河给晚棠送罢小水蝶、顺道巡看此处水汽罢，想来他也不会多疑。
    今日过来前，我特意将这身素青水衣的袖口改作了重瓣花叶纹，连发簪也比着水镜正了三回。只是这小友胆子愈发大了，方才竟伸手来碰我的听潮灵鳍；幸而神躯顺应天性化水滑开，免得叫他摸去了古神威仪。唔，只是方才散开的水元怎的贪恋他指尖那点热乎气，竟绕着他手指多停了一息才退回来？”

