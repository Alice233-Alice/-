    “唔，方才过江时我顺手改了改这身水衣的袖纹。小友替我近前瞧瞧，这般纹样与鬓间发簪，看着可还端正相衬么？”
    她主动敛去护体水障，容你凑近端详；及至你见她耳侧冰蓝灵鳍随风轻晃、伸手触碰的刹那，那抹灵鳍与鬓发便化作微凉澄澈的蓝光水波。水波滑过你指缝时极轻地缠绕滞留了一息，悄然沾走你指尖一缕体温，方慢吞吞退开数尺重聚人形。许听雨神色平静地抬手理了理耳鳍，被你碰过的那一缕鬓发却悄悄亮起澄澈的冰青微光，她静静望着你，温吞叮嘱：
