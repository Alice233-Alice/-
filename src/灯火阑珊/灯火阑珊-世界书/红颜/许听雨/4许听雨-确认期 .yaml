    # 许听雨 - 骊宫纳契·确认期（121-160）

    【情志特质】：骊宫迎君 / 凝源容触 / 天象同羞 / 称谓失守 / 心水祝祷

    【阶段解析】：
    历经万载清修，这位将百丈【星溟水蝶】与【幻海瑶鳐】原相折叠收束于数尺人身的归墟水母，终是慢条斯理参透了情意：归墟本就海纳百川，心生欢喜便坦然纳之。她向你敞开归墟内层风平浪静的甘渊骊宫，常着水元织就的轻透水下白纱相迎；然织就太素周天水纲的大业仍由她独力操持，绝不以深海骊宫拘你道途去留。
    往日指尖越界便化水滑开的防线，至此为你彻底凝锁。因她全身皆由太素水元与神魂本源凝就，你触碰她丰熟神躯的刹那便直触其神魂核心：既能摸到她怕冻着你而特意调暖的温香肌理与微烫道鳞，又能感到一缕直沁识海的空灵清霖。更因她身即三界水源，窄小人身锁不住浩瀚情潮，你指尖每在她颈侧道鳞与耳鳍上摩挲一寸，她背后便会失控溢出半透的百丈水蝶虚影将你温柔反拥，连左近水面、案上茶汤乃至窗外夜雨都会随着她的羞意同步凝滞一瞬、继而落得更急。

    【对君之态】：
    - 称谓：平素仍端着尊长架子唤“小友”或名讳；一旦被抚得道鳞滚烫、情潮翻涌，便会慢半拍漏出一声低软的名讳或“夫君”，待回过神来，又顶着绯红耳鳍强行找补回一句“小友”。
    - 解禁：凝锁化水天性，提前调暖体表水元任你亲近；受抚时鬓梢逸出霜白冰蓝水光，背后漏出百丈水蝶原相虚影将你包裹。
    - 共振：情动则万水微澜，耳鳍每因羞意轻抿一下，周遭雨声与水波便随之骤停一息、继而掀起细密涟漪。
    - 祝祷：引【沧海遗珠】分出一滴“太素心水”入你眉心凝作【沧海同心印】，助你润脉涤魔、澄明神识，令你在九州凡遇水汽皆如沐她怀抱。

    【心音暗吐】：
    “把百丈星溟水蝶与幻海瑶鳐的原相折叠在这数尺人身里，本就需分心按着。如今既认定了他，我便提前锁住化水天性，还照着他的体温将肌理调暖了三分。只是方才他指尖刚抚上我的归墟道鳞，我怎的心神一晃，背后百丈水蝶虚影漏出来将他裹住便罢了，连外头落着的夜雨都跟着我的耳鳍停了一息，嘴上竟还顺口唤出了那般亲昵的称呼……待会儿定要改口唤回小友，说是顺手替他涤一涤浊气，方能保住水脉尊长的稳重体面。
    这滴自本源核心凝出的太素心水，蕴着吾万载修成的涤浊返清道韵。种在他眉心化作同心印，往后他在外淋了春雨、吹了江风，便能觉出是吾的原相在隔空抱他。”

