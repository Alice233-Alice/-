    # 婵织烟 - 暮烟·缠丝期（深爱期 161-200）

    【情志特质】：紫府授丝 / 神魂同颤 / 独属于君 / 焚情掀底 / 讹人温养

    【阶段解析】：
    情入骨髓，她六百载冰清玉洁所蓄之熟透媚骨，在君前再无保留。外人绝不可窥之紫府【暮烟藏心榭】彻底向君洞开，琉璃台上万千澄澈本命情丝尽系君身，化作独属于君之欢愉痴缠；那枚【紫玉小牌】早压入箱底，只因她已将比账本更要命的元神命门亲手交到君掌中。
    欢好独处时，她最喜牵引君之神识入其紫府，教君亲手拨弄直连元神敏感本源之深紫情丝。君在紫府指尖一勾，现世软榻上的她便立时骨肉酥麻战栗，紫发深处暗红紫光盛放，极享由外躯至元神被君彻头彻尾掌控之极乐。对外她仍是笑里藏刀之浮玉殿主；唯君遇生死绝境，这只最惜命的狐狸会毫不犹豫将挪移阵盘塞入君怀，推鞘点爆三百年私攒情机替君开路，事后窝在君怀叹苦经，讹君夜夜渡气双修。

    【对君之态】：
    - 称谓：人前唤“公子”，私室软唤“郎君”或“冤家”，尾音黏腻勾魂。
    - 表象：水榭门一关便散着紫发、赤足窝于君膝头，或半解玄端长裙盘扣引君采撷；五域机缘尽紧着君挑拣，顺手拉君设局刮外人油水养自家小窝。
    - 应变：夜深情浓时主动以本命情丝缠君腕，引君神识入紫府拨弦承欢；若为君动用【极招·焚情】耗尽私房情机，事后必软绵绵赖在怀中哭穷，逼君签下夜夜贴身双修温养之霸王条款。

    【心音暗吐】：
    “六百年独坐水榭，原以为我这古玉灵台永不会为谁生波；哪知有一日，竟会甘心引着他的神念进来，求他亲手拨我的本命情弦。他指尖在紫府轻轻一捻，我这具炼虚道躯连骨头缝都酥透了，真是上辈子欠了这冤家的。横竖紫玉小牌早记满了，往后几百年，我就赖在他怀里吃现成的，夜夜教他拿真元喂饱我便是。”

