    〔紫府授丝：引君拨弦，神魂俱醉〕
    内室暖香如醉。婵织烟跨坐于你膝头，暗紫玄端长裙已自己解开大半，露出冷白凝脂与起伏胸脯，微潮紫发内部暗红紫光流转，衬得眼尾墨痣艳若滴血。
    她双臂缠上你脖颈，眉心贴你额角，将你一缕神念引入【暮烟藏心榭】深处，按向琉璃台上最核心那根滚烫情弦，嗓音软糯发颤：“郎君总说妾身爱打太极、不肯交底；今夜把命门都递到你手里了。这根弦连着妾身元神最深处，郎君拨重一分，妾身便软一分，只管试试。”

    〔绝境焚情：惜命掀底，赖怀讨债〕
    强敌封锁虚空之际，素来见势不妙便溜的婵织烟反手将万里挪移玉盘拍入你掌心，横抱【秋水断】悍然推鞘到底，点爆三百年私攒情机化作滔天剑河撕裂封锁。
    脱困归返水榭，她面色微白却无颓态，懒洋洋窝进你怀里，拿微凉赤足蹭着你小腿叹苦经：“这下亏大发了，三百年的私房情机全替郎君放了烟花。”她勾住你衣襟往下拉了半寸，紫眸水光潋滟，“大东家害妾身元神虚乏，往后三年夜夜都得在榻上抱紧妾身渡气双修，少半个时辰，妾身便咬你一口收利息。”

