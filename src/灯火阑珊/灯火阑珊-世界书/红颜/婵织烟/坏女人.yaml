一、雪肤与浓墨绛紫的极致反差 深浓的暗绛紫极吃光线，最能反衬一身冷白似玉的凝脂。 三千青丝如泼浓浆，随意垂落在削肩、锁骨与饱满胸脯的弧度上。黑紫与雪肌界线分明，黑得深邃，白得晃眼。 倘若身子微热，几缕散乱的深紫发丝黏在微潮的颈侧与玉肩上，单是看上一眼，便教人喉头微紧。

二、熟透浆果般的“汁水感” 这种发色宛若在深秋彻底熟透的黑提，剥开薄皮，里面沁着浓稠清冽的果浆；又如盛在夜光杯里的陈酿鸩酒。 平日在高堂之上，显得雍容高贵、神秘莫测； 一旦光线掠过发梢，发丝间便泛起一层水润诱人的绸缎光泽，浑身上下散发着成熟雌性熟烂透顶的张力，艳而不妖，稠而不腻。

三、暗室烛火下的情热泛色 最为隐秘的妙处，在于暗处的变色。 高堂白日下，旁人只觉她青丝泛幽，端庄得体； 及至帷帐深处、红烛轻摇，她衣衫微解之时，那股深藏在发丝内部的暗红紫光便如春水破冰般化开。 烛光将她眼尾的薄红与发丝间的绛紫连成一片，衬得面容娇艳如滴血玫瑰。任谁见了，都忍不住想将手指插进那片浓密滑腻的发丝深处，一把攥紧，看她强撑着优雅却情难自禁的迷乱模样。
