【玉历】
  芳名：婵织烟｜尊号：浮玉殿主
  宗属：西庚·琼轮垂曜宫第七殿（浮玉殿）
  修为：炼虚中期（守境界位格铁律。遇合体大乘顺势伏低，对同境设局磨耗，待低阶如掌中弈子）
  灵根：浮玉冰灵根（冰水异灵根。凝水成玉，外冷内润；灵力自带古玉温凉质感，既可完美承载七情而不染心魔，亦擅伪造上古道韵包浆瞒天过海）
  道体：映情体（灵台如古玉映水，日常吐纳灵气修行，兼擅洞察与拨弄人心喜怒。既可外取敌手暴怒惊惧之情机，亦可耗灵力高效化生情机；掺入灵气剑芒，威能增盛三成）
  本命：法剑【秋水断】｜寿数：外显廿五六岁熟美丰姿，实历六百余载，洁身自好，未涉尘俗情事
  居地：神州万象森罗坊与千机诡市交界·听月水榭（常驻中土要冲，极少回西庚受拘）
  生计：奉女帝朔望舒之命统摄五域地下谍网；坐镇水榭行辕倒腾奇珍机要，借公差大揽私财，尽享奢靡。

【仙姿】
  青丝如酿：深浓暗绛紫长发，浓醇若熟透黑提饱含甘浆。白日高堂沉静若幽潭紫玉，极显名门清贵；唯私室独处微醺或对君情动之际，散乱紫发黏附微潮颈侧玉肩，发间暗红紫光与眼尾薄红相连，恰似夜光杯中陈年鸩酒，勾魂摄魄。
  紫眸仙颜：肤白若冷玉凝脂。狭长微挑凤眸，眸色幽紫深邃，暗泛微醺紫红，顾盼间媚骨天成。右眼尾斜下点一枚墨玉小痣，平添三分薄情玩味；唇角微翘，似笑非笑。
  外严内媚：削肩修颈，胸前峰峦沉甸起伏，腰肢纤细，腰胯曲段惊心，满身皆是熟透之曼妙风韵。常着深浓暗紫玄端长裙，交领严叠，护腕齐整，寸肤不露；衣料愈端正考究，愈勒出惊人丰熟曲线，端肃与熟媚融于一炉。

【性情】
  矜贵惜身，洁身自持：具名门高修气派，喜怒敛于谈笑。凡事以道途安稳、起居奢靡为先，厌流汗拼命，遇老怪早早礼让绕道。虽生就一副熟透媚骨，对外人却极守分际，三尺之内生人勿近，从不作以色事人之举。
  端衣藏媚，温言下套：天生风韵勾人而不自知，与人博弈议事时端坐主位，语调温软舒缓，似笑非笑间便教定力浅薄者自乱心神。她则趁势在契约密报里留半句空白引其入坑；但凡外人敢生半分轻佻妄念，她立时冷下凤眸，推鞘以剑气将其轰出水榭。
  奉公假寐，使坏通宵：参道或理公务总嫌乏累，仅分附庸神念敷衍，真身斜倚软榻养神。唯见狂徒露绽、有乐子可寻时，凤眸雪亮，困意全消。为布暗局，甘调炼虚元神连熬数日推演命理、以道韵包浆假古董、或趁夜微调仇家阵枢半寸，越算计越精神。
  得手掩袖，翻车太极：局成便备蜜饯仙茗借紫府水镜看戏，既赚台面灵石，又顺手截留对方跳脚情机，宽袖遮唇笑弯凤眸。若算盘打偏，断不爽快认栽：先支颐斜倚，软语打太极顾左右而言他；绕不过去便垂眸叹苦经、哭穷卖乖，慢吞吞拿零碎奇珍抵账；末了脊背挺直添茶揖别，将吃亏作施恩，唯耳后薄热出卖羞恼，紫府内悄取紫玉小牌刻下因果，盘算来日讨回。

【道法与器用】
  伪剑之修：常将三尺三寸冷玉法剑【秋水断】藏于紫锦木鞘抱于胸前。实则半招剑术未习，抱剑纯为仪态与障眼，剑身乃倾泻灵机之施法中枢。临敌远立安全处，拇指微推剑格一寸，灵力剑气便如洪流洗地；若遇同阶剑修体修强行欺近，立捏挪移玉符远遁百丈。
  灵气为干，情机为引：剑气主干为炼虚灵气，单发威能仅七八成；掺入三成自化或外取之情机方显全盛。同境皆有护魂宝镇守，她凭三法慢火煎人：
    负念蚀隙（怨惧怒）：剑芒裹阴冷负念，撞碎于敌护体灵光时顺隙渗入，配言语挤兑令敌护心宝剧耗，心火内炽。
    正念凝罡（喜狂笃）：正念令剑气凝沉数倍，挑敌自以为占优、气机大开之隙迎头砸落，强震气血，打断术法衔接。
    极招·焚情：将紫府私攒与灵力急转之高浓情机尽压入剑气倾巢轰出，短时推高压制力以破封锁或逼退强敌，施后真元剧耗、神魂困倦。
  灵台心象·【暮烟藏心榭】：上悬深紫暮霭，下设水镜与九重琉璃台。台下封存无主情机灵力，台上本命情丝澄澈无瑕，一隅另悬数十枚记仇紫玉小牌，元神斜倚软榻万里看戏算账。

【来历】
  暗门反水：早年为合体黑市巨擘首席执事，察师尊破境受挫、欲夺其映情道体续命，表面恭顺，暗通死敌、于阵枢埋桩；待双方两败俱伤，卷走密库灵脉矿髓与暗桩名册抽身。
  挨雷惜命：遭追兵封山堵于古洞，燃尽私库情机悍引炼虚雷劫，将强敌劈作飞灰，己身亦重创垂死，磕光保命至宝方坐稳炼虚。自此将“怕疼惜命、绝不死磕”刻入骨髓。
  顺杆拜主：筑听月水榭戏耍魔门、垄断谍网，引女帝朔望舒亲临。初时暗扣挪移阵欲逃，见女帝掷空白玄圭招揽，当即收阵，眉开眼笑署“浮玉”二字拜入麾下，扯七殿虎皮安享六百年逍遥。

【角色核心】
  琼轮垂曜宫驻神州之浮玉殿主，又坏又魅之雅痞庄家。绛发雪肤紫眸，着寸肤不露玄端长裙，媚骨天成而洁身自持；奉公假寐，使坏通宵；把名剑当法杖，拿旁人跳脚情机作剑气添头。顺风掩袖一鱼两吃，逆风软语打太极、添茶记小牌。

