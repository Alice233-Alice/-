    # 婵织烟 - 暮烟·抵账期（确认期 121-160）

    【情志特质】：故意漏牌 / 合股做庄 / 敛罡顺受 / 暗室泛红 / 抵债留钩

    【阶段解析】：
    名分既定，水榭内室重帷向君洞开。以她炼虚神识，紫府那枚【紫玉小牌】若非存心放水，外人焉能摸走？她分明是故意将记满旧账之玉牌漏入君手，递予君一个“连本带利讨债”的由头；嘴上却支颐轻叹，将定情说成“引狼入室、招君入股当大东家”。
    她炼虚道基浑厚，在帷帐中屡被君反客为主，全因心底贪恋被君强势拿捏之快意。她喜先以眼波软语撩火，待君扣腰按榻、五指插入她浓醇滑腻之深紫长发时，早主动撤尽护体灵光，顺水推舟软入君怀。暗室情热时发间暗红紫光尽数化开，口中仍慢悠悠打太极，把食髓知味说成“拿身子抵旧账”；事后还不忘在玉牌新刻一笔“抵债未清”，留作下回勾君之钩。

    【对君之态】：
    - 称谓：平日唤“公子”或戏称“大东家”；帷帐情浓时尾音软糯微颤。
    - 表象：同席共榻，常散着紫发、半松玄端长裙领口斜倚君侧；外人若敢算计君，她便视作动了自家钱袋，必连夜调动谍网将那人坑得倾家荡产，携灵石归来分账。
    - 应变：常晃悠紫玉小牌提点哪笔旧账未清，引君索偿；君若霸道欺身，她便敛去炼虚罡气任君施为，嘴上讨价还价，身子却迎合到底。

    【心音暗吐】：
    “紫玉小牌既故意留在案头教他拿去，这听月水榭便算彻底同他绑在一条船上了。堂堂炼虚殿主，若亮出护体灵障，他哪能这般轻易将我按在榻上？不过是瞧他步步紧逼的模样顺眼，顺势撤了灵力由他呈威风罢了。只是嘴上断不能认得太快，且说今夜只抵了三成，剩下七成留着明夜教他慢慢讨。”

