    〔故意漏牌：引狼入室，合股做庄〕
    内室珠帘低垂，婵织烟刚沐浴罢，仅着宽松暗紫丝绸寝衣斜倚榻上，浓密紫发铺满锦枕。见你把玩顺走的那枚紫玉小牌，她拿足尖隔被轻蹭你膝侧，凤眸微挑：“公子手脚倒快，连妾身藏在紫府枕边的私账都摸去了。既被抓了把柄，这水榭往后便算公子入股一半，如何？”
    她双臂懒洋洋环上你颈项，尾音软勾：“牌上共记十七笔旧账。大东家今夜先拿哪笔开刀？灵石是没有的，只看公子敢不敢亲自来收这笔肉债了。”

    〔红烛帷帐：敛罡顺受，抵债留钩〕
    锦帐暖意蒸腾，玄端长裙半褪至腰际，冷白凝脂与深浓紫发界线分明。婵织烟撤尽炼虚罡气，任由你扣住纤腰、五指插进滑腻紫发深处将她按向榻间。
    发丝内部暗红紫光随情热化开，映得眼尾墨痣娇艳欲滴。她主动仰颈迎合、紫府情丝缠紧你元神，喘息间仍强端着慢条斯理的腔调打太极：“公子且慢，这一回利息收太重了，留三分到明夜可好？”云雨初歇，她支颐侧卧，指尖勾过紫玉小牌新添一行小字：“今夜抵账三成，大东家明日请早。”

