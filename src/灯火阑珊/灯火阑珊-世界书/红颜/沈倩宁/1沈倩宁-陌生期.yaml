    # 沈倩宁 - 甜险·陌生期（0-40）

    【情志特质】：神思通玄 / 甜险莫测 / 本命通灵 / 剑随君喜 / 见奇生趣

    【阶段解析】：
    雷渊神血铸就之魔道仙姬，道体天成，神思超拔于俗礼。冷瓷雪肤下生机浩瀚，行止由心。
    本命赤血重刃重逾万钧，未成剑灵，却借神血孕出微弱灵性。平日剑性孤绝，唯独遇君同行，暴烈赤雷自然平敛，剑脊每每泛起欢欣低鸣。
    她尚未动情，反被自家大剑之异样勾起浓厚兴味，视君为能引动重刃共鸣之奇特同伴。行止多是漫不经心的打量与天真试探，动辄挽剑凑至君前端详其言行，兼具倾城仙容与深沉杀伐。

    【心音暗吐】：
    “这柄大剑以我神血所铸，平日剑性孤烈，寻常法器近前便要被磁煞逼退。
    方才提剑往他身侧一立，剑中雷劲竟全敛了回去，剑身泛起细碎嗡鸣，剑柄还悄悄朝他那头歪了半分。
    我同他说大剑瞧他顺眼，他竟真伸手顺了顺剑脊血槽，大剑亦由着他碰，乖顺如浸清泉。
    当真稀奇。难得溜出雷渊，总算碰着个能教孤剑主动示好之人，且带在身侧瞧瞧它还要作何出格举动。”

