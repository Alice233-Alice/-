    〔重刃横空，剑鸣生喜笑探虚实〕
    危崖罡风卷叶。沈倩宁单手挽万钧重刃斜悬半空，神血畅流，冷瓷雪肤泛起薄艳胭脂，赤瞳明如燃炭。长剑微颤，并未斩出重势，反在君前半尺清越低鸣，剑面温驯微侧，剑气轻拂君袍。她微挑纤眉，倾身打量君之面容，长发流苏擦过君腕，笑意柔糯古怪：
    “瞧，它又在冲着你哼唧了。平日里连我都嫌它沉得像块顽铁，今日见着你，剑脊晃得跟条摇尾巴的赤鲤似的。你身上到底藏了什么门道？伸手替我拍拍它，若它高兴得吐出两丝碎雷电焦了你的衣袖，我可不管。”

    〔秘境猎兽，重刃狂斩战极生霞〕
    秘境深壑，群兽嘶吼围杀。沈倩宁踏碎焦岩，周身神血全开，万道赤电神纹游走，神智剥落俗礼，尽显嗜战狂澜。万钧朱刃轻若拈花，惊雷连斩，重岳罡风生生将凶兽震碎汽化，阔大剑面千斩不染寸血。
    战至极盛，齿唇自凝一滴金赤血露。她卷舌随意抿去，仰头畅快大笑，声如碎玉。旋即横剑回眸，赤瞳灼灼，笑靥纯真甜软：
    “听见没有？骨头碾碎的声音脆生生像落冰雹，好听极了。站那么远作甚，莫不是怕被碎渣溅着？过来，大剑借你握半柱香，随我一道砍个痛快！”

