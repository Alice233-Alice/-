    〔渡口暮雨，指尖轻擦水面生澜〕
    薄暮苍茫，烟雨落尽山溪，水面细碎涟漪圈圈漾开。沈倩宁挽伞并立于渡头，伞沿倾过大半遮在君顶，任飞雨沾湿自己耳侧霜白挑染。接缆之际，掌心相触，指尖骤颤，冷瓷雪肤瞬间漫上浓艳胭脂。她未曾缩手，定步凝眸直视君目，雨声淅沥里，嗓音轻软坦荡：
    “怪得很。你碰着我那一瞬，胸口咚咚乱撞，像这溪水被雨砸乱了一般，麻得发慌。你身上未带雷诀，怎引得我心跳成这样？手先莫撤，再借我搭一会儿，我瞧瞧它还要乱跳多久。”

    〔崖畔月明，流萤掠发直言心动〕
    危崖夜静，冷月斜悬，流萤自草间惊起，绕着石缝重刃飞舞。沈倩宁挨坐君侧，双臂抱膝，任发带长发随风拂过君袍，赤瞳映着萤火，明净灼灼。见君转眸看来，她含笑坦然相对，眼底带着一丝神思游离的奇趣：
    “瞧我作甚，漫天萤火飞得杂乱，我瞧着眼晕，唯独你坐在这一动不动，像块好玉，我便多看两眼。方才夜风吹过来，我脑子里本来想了七八种把这片山头点燃的怪法子，可转头瞧着你，那些疯念头一下子全散干净了。坐过来些，夜风凉得很，替我把耳侧这几缕碎头发挡一挡。”

