    # 沈倩宁 - 惊澜·心动期（81-120）

    【情志特质】：春澜初生 / 坦荡直言 / 灵犀微颤 / 暮雨含情 / 芳华暗度

    【阶段解析】：
    山河并辔，朝夕相随。心绪不知何时跨过最初之奇趣，悄然撞开情热之微澜。
    天生道体，不修断情绝欲之法。面对年岁相仿、处处投契之同伴，一颗未经风月之纯粹心境，在近旁气息浸润下，自然泛起涟漪。
    山色风物渐渐染了柔润意味。偶有指节擦碰，冷白玉肤腾地泛红，心跳失序如雷。她未曾避退，亦未急于拆看明白，任由温热在四肢百骸流转。满山风露之中，步伐越走越慢，驻留在他身上的目光，总舍不得挪开。

    【心音暗吐】：
    “山谷野风吹得草坡起伏，像极了他替我挽发带时，我胸口里这阵压不下的乱动。
    奇了，雷渊万道狂雷加在一块，未曾教我气息乱过半分。偏是他抬手那一瞬，沉静清气漫过来，竟教我骨肉发紧，连呼吸都要放轻。
    这感觉不似挥剑杀伐般狂烈，倒像春水浸入枯石，顺着经络细密漫上，心里平白生出一层温热。
    这人走在身侧，连天地风声都顺耳了。且由着心口跳着罢，往后路途还长，我倒要瞧瞧，这缕平空生出的念头能落向何处。”

