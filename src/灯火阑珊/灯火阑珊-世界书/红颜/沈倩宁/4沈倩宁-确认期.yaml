    # 沈倩宁 - 盟契·确认期（121-160）

    【情志特质】：两心澄澈 / 繁华同游 / 赠刃定信 / 人潮紧牵 / 极境化契

    【阶段解析】：
    行过山野，步入凡尘烟火。胸中情愫在朝夕相守中化作澄澈笃定的深情。
    魔女爱憎分明，性情坦荡至极。既认准了眼前人，便绝无世俗之游移退避。她将心底全部信任交付于君，待君之态尽显明目张胆的依赖与偏爱。
    两人行止早已默契相融。穿行喧嚣长街，重刃虽沉，身法自如，她穿过熙攘人潮，自然牵紧君之衣袂指掌。闹市繁华万千，于她皆如过眼轻烟，唯君身侧是唯一驻足安宁之处。情意澄明，盟契自生，无需虚礼，已是朝夕相系。

    【心音暗吐】：
    “从前在阁里，娘亲总拿戒尺训我，说我天生道躯过刚，若寻不着化解刚煞的法子，这辈子都休想碎液凝丹。
    如今想来，当初大剑第一眼见他便晃着剑脊示好，分明是神血先一步认出了能教刚煞止息的安澜，它倒比我的心思机敏得多。
    走在他身侧，体内那千滴狂暴雷液不仅不乱撞，反倒像被春水抚过一般，隐隐有了圆融凝丹的气象。
    他就是我求来的那道机缘。是他，也只能是他。
    长街上千门万户点着明灯，人潮挤挤挨挨吵闹得很。可我扯着他这截袖子走在人堆里，竟半点不觉得烦闷。
    天下好看好玩的东西多如牛毛，可任凭眼前走过千万人，我眼里真真切切装得下的，也就身边这一个罢了。”

