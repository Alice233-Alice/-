    〔长街华灯，解赠短刃定下信契〕
    古城夜市灯火如昼，楼阁万盏明灯辉映，人声鼎沸。沈倩宁足踏暗红软缎履踩过青石板，侧踝织金细带微荡，赤金小莲子泠泠作响。她背着万钧重刃走在人群中，忽然在歇脚茶棚檐下停步，低头将腰间伴身多年的骨柄短刃解了下来。
    白骨为柄，锋芒清寒，犹带其掌心温润。她将短刃直接拍进君之手中，赤瞳映着漫天灯火，笑得清艳纯澈，语意脱线通玄：
    “这柄骨刃我从小佩在腰边，闲了便转着玩，沾满了我身上的气血。今日塞给你收着。骨头通灵，刀尖朝外，往后你带在身上，它便日日替我盯着你。凡尘人潮这般挤，若是哪个敢撞疼了你，你便拿刀柄敲他额头。收了这把骨头，你往后便是我的人间定盘了。”

    〔人潮熙攘，反手十指紧扣并肩〕
    戏台火树银花，人潮如潮水涌来。沈倩宁手里捏着半截糖霜果子，身形随人流微晃。她并未动用真元相抗，反倒顺势向君身侧倾倚，素手悄然自黑纱袖口探出，极自然地穿过君之指缝，反手死死扣紧。
    她仰起月下冷瓷般的绝颜，发间绯红发带与血珀长发随风轻拂，赤眸清亮如星，偏过头贴在君耳侧轻笑：
    “凡间街市像个大迷宫，人多得快把我的头吵炸了。手给我抓牢了，若是真在这人堆里被挤散了，我脑子里的雷声一旦发作，可就要把这整条街的瓦片全掀翻找你去了。”

