    # 沈倩宁 - 异质·好感期（41-80）

    【情志特质】：神思游离 / 异质通玄 / 嗜战狂悦 / 本能沉溺 / 荒诞依澜

    【阶段解析】：
    并辔日久，最初之剑鸣早抛脑后。她已然明白，非大剑贪恋外人，分明是自身神血道躯，本能被君身上的沉定安澜所引。
    太古神血在体内奔涌不休，令她眼中的天地常带瑰丽与喧嚣。名利礼法皆若轻烟，行事随性荒诞。临阵神血生霞、连斩狂笑；恶战平息，神智却常陷入倦懒游离。
    唯君身侧清定之息，能教脑中杂响尽数止息。重刃随手插落泥石，她挨君而坐，将微温面颊或纤腕贴于君之颈侧手背，动作自然若无所觉。在外是惊绝人间的莫测狂澜，独对君时，如长风中飞倦之灵鸟，极尽依恋身侧片刻静谧。

    【心音暗吐】：
    “先前我还笑话大剑没出息，见他便晃剑脊。
    如今看来，这柄心头神血铸的兵刃，倒比我心思机敏。它早早察觉：这人的气息，闻着教人骨头缝里都安生。
    闭上眼，满天地尽是嘈杂碎响，脑仁里像有千百只碎雷乱跳。
    可挨近他三尺，那些吵闹动静忽地全沉了。方才走山路拽着他一截袖子，掌心温软，舒坦得连剑都不想提。
    难得遇着能治我脑仁疼之人。往后漫漫仙途，就得一直拉着他一道走，谁也别想半道把我俩拆开。”

