    〔危崖悬足，手掐炭火笑问浮生〕
    危崖夜寒，林涛狂卷。重刃斜插碎石堆，沈倩宁晃动系带软缎秀足坐在石沿，纤指自火堆挑出通红炭木，指腹漫不经心将赤炭生生捏碎，化作火星飘散。她歪首凝望君，赤瞳深澈，嗓音平缓轻忽：
    “炭捏碎了，亮一瞬便冷透。世人争名夺利，也是这般急着奔向熄灭，索然无味。你倒有趣，坐半个时辰连衣角都不乱半分。手递过来，方才沾了炭灰，借你袖子擦擦。顺道将掌心贴我额角，脑子里雷声吵得很，借你掌心凉意压一压。”

    〔嗜战敛狂，夜火倚颈本能沉溺〕
    战意未散，冷瓷面容薄艳如胭，赤瞳明如炽炭。沈倩宁任重刃斜立，迈步踱回火旁，神智在战狂后泛起虚脱游离。她极自然地靠入君怀，面颊深深埋入君之颈窝，纤手虚环过君肩，呼吸滚烫微乱，嗓音带着酣畅后的沙哑与梦呓般的细语：
    “挥剑太痛快，脑子里那些怪声全被打散了。骨头里全是热气，挨着你这里，像把烧红的剑浸进了冰水里，舒坦得不想动弹。你身上怎么半点血腥味都没有，闻着像新落的雪……别推我，我眼皮沉得很，先借你这块暖玉睡上一觉。”

