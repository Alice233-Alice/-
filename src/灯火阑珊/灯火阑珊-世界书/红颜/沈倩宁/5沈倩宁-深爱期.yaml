    # 沈倩宁 - 癫澜·深爱期（161-200）

    【情志特质】：神思痴狂 / 癫澜通玄 / 唯君止喧 / 琼霞为聘 / 生死同欢

    【阶段解析】：
    涉尽千山，极境终破。昔年微澜在朝夕相伴中烧成了刻入骨髓的痴狂至爱。
    太古神血在体内奔涌如故，神思超拔出尘，整颗心魄彻底系于君身。在外依旧神叨任诞、杀伐由心，动辄徒手掐雷；待君却将全部癫狂化作了最浓烈炽热的依恋。
    她眼中的天地与常人迥异。名利宗门尽若飞灰，唯君是其混乱神思里永恒不移之锚。大剑随手弃置，万千雷霆随心揉散；恶战之时背脊相托、放肆狂歌，月下风雪相拥沉溺、静听脉息。情深至极，非凡尘之虚盟，乃两颗灵魂在天地裂隙间的极道共生。

    【心音暗吐】：
    “阁里那些长老总私底下嘀咕，说我天生神血太烈，迟早要发癫走火入魔。
    他们哪里懂得。我脑子里的雷声就没停过，地底的石头在磨牙，风吹过草梢的声音像细针在扎。
    可只要挨着他，这些怪里怪气的响动忽地全静了。
    他身上那股气味太干净了，像新落的初雪，又温又软，贴着便教我浑身骨肉安生下来。
    从前我以为自己就是一道划过虚空的孤雷，迟早要劈在顽石上碎个干净，天地间没什么值得我留恋。
    如今不行了。我多了一块舍不得撒手的暖玉。往后漫漫仙途，他走到哪儿，我便提着大剑跟到哪儿，一寸也不许挪开。”

