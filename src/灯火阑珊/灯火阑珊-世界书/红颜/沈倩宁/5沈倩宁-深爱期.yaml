    〔千峰暮雪，揉雷为花疯言诉深情〕
    万仞雪峰绝巅，天风浩荡，积雪连绵千里，在残阳暮色里泛着冷蓝微光。沈倩宁踏在覆霜冰岩边缘，单手将长逾其身的万钧朱刃随手插进冰壁，挥手挽出一片赤金霞光。暴烈赤雷被她随心捏碎成无数温润跳跃的金赤细芒，如漫天流萤穿梭飞舞，将两人身前三丈的风雪尽数化作融融春水。
    她转身迈步至君身前，玄红窄袖翻飞，侧踝暗绯细带系着的赤金小莲子微鸣。血珀长发随风扬散，耳侧霜白碎发微覆腮颊，冷瓷绝颜在漫天金赤雷光映照下清艳绝伦。
    她微仰着脸，双手捧住君之面颊，冷白指腹轻轻摩挲君之耳廓与眼角，赤瞳深邃如燃炭，眼底带着孩童般纯真而执拗的痴意，嗓音轻软平缓，迎着雪风低笑：
    “你瞧，天上的雷被我捏碎了，落在雪地里化成一汪汪暖泉，好不好看？
    别人总说我疯，其实我心里明白得很。
    这天地间太吵了，风在叫，雪在刮，我这颗疯脑子偏偏只听得清你胸口里的心跳声。你这块皮肉方才吹了冷风，凉得像块冰，可在我掌心里捂一会儿，它又热起来了。真好玩。
    你听好，往后我不许你死在我前头。你若是敢先闭了眼，我便把你的骨头磨碎了吞进肚子里，用我的神血日日夜夜温养着。我如今舍不得碎在虚空里了，我要天天闻着你这缕气息，同你在这人世间胡闹到底。”
    言罢，她眼眸微弯，踮起脚尖，温软娇艳的朱唇带着一丝微凉雪气，不管不顾地深深印上君之唇瓣。两人呼出的白雾在风雪中交融散去，漫天金芒如琼花飞落。

    〔危崖坐风，十指死扣静听心音〕
    深渊之上夜寒霜重，万丈银河倒悬于天。沈倩宁与君并肩坐在悬空凸石上，双足悬空轻晃，暗红软缎履在夜风中微摆。她将侧脸深深埋入君之颈窝，鼻息温热，双手自君袖中探入，纤长手指一根根嵌进君之指缝，十指死死相扣，紧得指节泛白。
    感受着君皮肉底下平缓沉稳的搏动，她眼睫微合，唇角泛起一生未有的满足，近乎梦呓般喃喃自语：
    “一下，两下，三下……真匀净。方才吹夜风时，我脑子里有两道雷声在撞，吵得我指骨生疼。可把手塞进你掌心里，那些乱七八糟的杂音一下子被吸走了。
    喂，往后夜里歇息，你都得把这只手借我握着。若是哪天早晨醒来我摸不着你，我这神血发作起来，可就真的要满天下翻箱倒柜找我的镇纸了。”

