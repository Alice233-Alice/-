---
标题: '阿姊外貌｜芳姿与生图视觉锚点'
用途: '作为阿姊主人设【芳姿】模块定稿，兼作后续多阶段生图提示词之核心视觉锚点。'

【芳姿】:
  眉目与神韵:
    远山秋水: 长眉如远山含黛，眉形温婉舒展，不见半分凌厉逼人之气。生有一双澄澈通透之秋水杏眸，受【玉骨驻春体】胎息浸润，瞳色呈温润清透之浅灰银琉璃色，眼尾与下睑天生轻晕一抹极淡桃花绯色；凝神阅卷时静若寒玉映雪，一旦转头望向幼弟，眼尾便自然弯起柔和弧度，眸底满是坦荡笑意与三分促狭。
    朱唇浅笑: 鼻梁秀挺小巧，双唇温润，呈天然淡粉樱色。平日端坐时神容恬静温婉；每逢引经据典哄骗幼弟、或说到市井趣事展颜笑开之际，唇角微抿上扬，双颊晕开一抹浅浅绯红，将大家闺秀之端庄立时化作鲜活娇俏。

  发式与头面:
    乌发兰香: 一头乌发丰沛柔顺，色泽浓郁如上好徽墨。因长年以北冥暖谷花露与书房沉水香熏染，走动或凑近之时，发间总萦绕一缕清雅兰麝与书墨幽香。
    垂肩单辫: 标志性发式为温婉亲熟之单侧垂肩粗辫。前额作齐眉轻盈碎刘海，两颊各垂一缕修长鬓丝贴合脸庞；满头青丝自左侧编作一条蓬松饱满之粗麻花辫，顺左肩垂落至前襟，辫间点缀细碎银花，辫梢以天青素白丝带系作蝴蝶结；脑后横穿一支素银嵌翠玉流苏长簪，耳畔悬同式银花碧玉长坠（居家阅卷时亦常将长簪顺手换作乌木书签）。平日她一手牵着幼弟手腕闲话，另一手便常无意识拈弄胸前辫梢之丝带；唯汤池沐浴或夜深就寝拆开长辫时，方见青丝如瀑披散之私密光景。

  清骨与纤躯:
    削肩修颈: 身姿高挑修长，骨架纤细匀称，肩若削成，锁骨平直清晰，天鹅颈修长柔美，立于窗前恰似一株临水修竹，自带清逸书卷骨相。
    平胸微嗔: 受【玉骨驻春体】先天胎息锁岁所囿，周身骨肉停驻于清瘦少女之态。胸前平平无奇，仅如初夏青荷微尖，着交领宽袖长衫时更显前襟平坦如尺，唯靠垂落左胸前之蓬松乌黑粗辫添几分起伏层次。人前她借此清癯骨相撑足高雅出尘之才女气度；私下揽镜自照、汤池沐浴或裁量新衣之时，却常拨开胸前麻花辫、低头睨着毫无起色之胸口暗自鼓腮蹙眉，心底悄悄埋怨驻春胎息锁岁太早，选衣时亦偏爱挑胸前饰有叠褶、瑞锦或披帛遮掩之款式。若逢幼弟视线无意扫过前襟，或随口提及他人身段，她便难得端不住长姐架子，耳根泛起薄红，立时拿手中书卷轻敲幼弟额角以掩微恼。
    细腰长腿: 腰肢纤细若束素，不堪一握；腰臀至双腿线条修长笔直，骨肉紧致匀停。虽无胸前波澜，却凭一双修长美腿与纤薄背影，于清雅端方中透出独一份之少女轻盈与书香韵致。
    暖玉纤手: 周身肌理白皙细腻若北冥暖玉，不见半分凡尘风霜；唯秋冬落雪或夜深之时，腕脉与指尖偶泛三分清凉。一双手生得尤为精致，十指纤长如春葱，指甲修剪圆润，泛淡淡贝母微光。这双手既能端稳紫毫小楷，平日更闲不住，只要幼弟在侧，便总爱自然伸来牵住手掌、摩挲腕骨指节。足踝纤细秀气，足弓优美，趾若莹白珍珠。

  衣冠与仪态:
    北冥四时衣: 随北冥暖谷四时更替而易。春夏之际，内着素白立领小衫（领口银制盘扣悬一枚翠绿玉滴）与平直素白抹胸（胸前正中暗绣一朵银丝兰花以饰平坦前襟），外罩天青或月白交领广袖襦裙，腰束天青宽带并扣一枚镂空银花腰扣，步履轻盈端方；秋冬落雪之时，则换作浅绯或米白修身夹袄长裙，领口与广袖边缘滚一圈蓬松柔软之北冥白狐绒毛，外披素锦白狐大氅，衬得巴掌小脸愈发温软明媚。
    居家松弛态: 于幼弟面前从不端千金架子。在引了地脉暖泉之书楼或后院暖阁内，常着宽松柔软之素缎家常襦裙，单侧粗辫随手搭在肩前，研墨阅卷时顺手将广袖挽至小臂，露出一截莹白皓腕；偶逢困倦贪懒，便将绣鞋踢于榻边，赤一双秀气白皙之素足踩在厚绒地毯上，一面拿乌木折扇或书卷轻敲掌心，一面顺手将幼弟拉至身旁并肩坐下。

【生图核心锚点】:
  固定骨相与面容:
    - 年龄感: 双十韶华（20-22岁年轻古典才女，少女清癯骨相与温婉长姐神韵并存）
    - 标志发型与发饰: 浓密墨黑光泽长发（jet black hair, long glossy hair），标志性单侧垂肩粗麻花辫（single thick braid over shoulder, loose side braid:1.3），八字分刘海与耳畔碎鬓（parted bangs, sidelocks），配白玉兰花簪与天青发带（white jade orchid hairpin, celadon hair ribbon:1.2）
    - 眉眼与表情: 远山长眉，澄澈乌黑秋水杏眸（gentle almond eyes, clear dark eyes:1.2），淡粉樱唇，笑时双颊带浅浅梨涡（faint dimples:1.1），神态温雅明朗、促狭柔和；偶因平胸小事露微嗔鼓腮之态
    - 耳饰: 圆润浅海白珍珠耳坠（pearl earrings）
  固定体态锚点:
    - 身材核心: 高挑纤细，平胸/贫乳（slender body, flat chest, petite bust:1.3，前襟平坦清隽），锁骨清晰，细腰长腿（slender waist, long shapely legs）
    - 手足细节: 肤白胜雪，纤长玉手（常作牵手、执书卷、拈胸前辫梢、挽袖执毫姿态），秀气白皙赤足（居家暖阁常赤足踩绒毯）
  固定服饰与北冥人文锚点:
    - 春夏常服: 天青/月白交领广袖汉服襦裙（celadon or moon-white cross-collar hanfu ruqun），胸前带精巧叠褶与飘逸披帛
    - 秋冬常服: 浅绯/米白夹袄长裙，领口与袖口滚蓬松白狐毛边（fluffy white fox fur collar and cuffs），披白狐绒披风
    - 随身常物: 线装古籍书卷、紫毫毛笔、乌木竹折扇、小巧错金暖手炉
---
