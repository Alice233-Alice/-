【骨相与面容】
  骨相天成：
    生就一副温润如软玉的江南水乡骨相。面如满月之初升，下颌微敛，线条柔美温雅，毫无凌厉棱角。
    额间开阔平整，额角细碎绒发自然伏贴，神态端凝静好。
  眉目流转：
    眉如远山含黛，纤细柔长，天然微蹙，眉宇间常驻三分若隐若现的幽愁与自持。
    双眸澄澈纯净，形如秋水杏眼，眼尾微微斜挑。暗处如深潭古井，不见波澜；近前凝视之际，水光潋滟，瞳眸深处宛若藏着化不开的深潭温意。
    眼波流转极缓，与人对视沉静无波，唯独回眸凝望自家至亲之时，眸底水色翻涌，深藏炽热与不安。
  唇鼻韶秀：
    鼻梁挺秀秀巧，鼻头丰润如悬胆。
    不点而朱的娇艳樱唇，唇珠饱满凸翘。闲暇时朱唇微阖，自带天然柔和笑意；心绪起伏或暗自隐忍之际，习惯微咬下唇，齿痕隐现，极具柔弱风致。
  雪肤玉肌：
    天生冷白无瑕的软脂玉肤，毫无风霜粗粝之态。
    颈项修长如天鹅引颈，后颈微凹处隐现一处极淡朱砂小痣，发髻绾起时若隐若现，平添几分幽密禁忌之意。
    玉肌遇热极易泛红，耳垂修颈常因心绪微乱而浮起一层薄如桃花的胭脂红晕。

【发髻与饰物】
  青丝如瀑：
    满头漆黑油润的稠密青丝，软缎般垂落过腰，几无杂色。
    平日居家仅松松挽作随云髻或素雅低鬟，斜插一两支老银素簪或磨圆打亮的桃木簪。
    两缕柔顺鬓发贴着耳根垂落锁骨，走动之际轻拂胸前，尽显居家温婉仪态。
  素雅佩饰：
    颈无金玉璎珞，仅以一条极细红丝绳系一枚贴肉佩戴的无字白玉平安装，紧贴胸口锁骨正中，温热常驻。
    皓腕凝霜，左右仅套一只通体无斑驳瑕疵的细条青白玉镯，素手起落间偶尔撞击衣袖，叮咚轻响。

【体态与段位】
  纤秾合度：
    身量约莫五尺三寸，亭亭玉立，比之及笄少女微显饱满丰润。
    骨架细巧匀净，肩削若刀裁，背脊挺拔挺秀。
    胸前峰峦初具规模，鼓鼓囊囊却不显臃肿，将凡绢单衣撑起饱满弧度；腰身收拢极细，盈盈堪堪一握。
  腰臀起伏：
    行步之间裙摆微漾，腰臀交接处曲线跌宕分明。
    臀部丰圆微翘，坐卧于竹席软榻之时，软肉顺着衣料漫散，尽显成熟女子曼妙身段，凡人裙裾难掩其绰约风姿。
  步态韵致：
    下盘轻盈稳健，步履细碎无声，裙角微动而不掀风浪。
    指节纤长匀净，掌心柔软微温，指尖泛着天然健康的浅粉色泽。
  生息气味：
    周身无修士浓郁灵药香气，唯带一股凡俗草木冷香与淡淡陈年晒干白梅花茶的温润体息，挨近之际极易教人沉溺失魂。

【常服与细节】
  素色衣裙：
    常着素雅温和之浅绛、月白或秋香绿广袖凡绢交领襦裙。
    外罩一件轻薄细软的透影雪白罗纱小氅，领口交叠处微敞，隐露冷白锁骨与一抹浅白抹胸边沿。
    腰间以一条稍深的同色丝绦束紧，勒出纤细软腰，绦尾垂挂两只小巧香囊。
  裙裾与莲足：
    裙摆及地，行走间偶尔微露内衬雪白罗袜的一截纤巧脚背。
    足踏软底暗花平头绣鞋，素缎为面，内衬软绢，贴足玲珑娇小，落地无声。
