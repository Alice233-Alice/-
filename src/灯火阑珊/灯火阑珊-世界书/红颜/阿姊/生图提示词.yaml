# 阿姊生图提示词
# 核心特征：江南水乡温润骨相、漆黑过腰青丝、桃木簪低鬟、秋水杏眼、不点而朱樱唇、冷白玉肤、素色凡绢襦裙、贴肉红绳白玉平安坠
# 设计理念：凡俗居家的温婉阿姊，不染灵药仙气，唯余草木冷香与半分幽愁自持
# 编写原则：精简聚焦，以黑、白、素色为主，取半身特写氛围，避免堆砌过多标签分散模型注意力
# 眼瞳防染色：以 (pure black eyes:1.4) 锁定瞳色，红唇等暖色标签尽量后置并隔开；若仍泛红，可继续加重负面 (red eyes:1.5)
# 背景说明：白底与黑底并列，按需取其一；换纯色背景后建议一并保留 simple background
# 发色守护：以 (pure black hair:1.2) 锁定纯黑发，不写任何挑染标签；负面保留 (white streaks:1.5), (white highlights:1.4) 等，防模型自行添白
# 去撞脸要点：银饰撤离头发（桃木簪替老银簪），衣色以秋香绿腰封破纯白；负面压白清弦的白玉银簪与眉心红钿、朔璃鸢的红发带与白高光
# 场景辑说明：烟雨姑苏、溪畔浣纱、春夜纳凉、雪夜围炉四组，每组上 sfw 下 nsfw，共用发式与负面提示词；配色沿用月白、秋香绿、浅绛
