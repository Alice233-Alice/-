# 分层骨架（她的排法：身份层一整条连缀到底，神态分底色与当刻两次落）
#   恒定层·她的脸 —— 以下一段跨条逐字复用，写新条时整段照抄，一个字别换：
#     masterpiece, best quality, absurdres, 1girl, solo, mature female, upper body, soft face,
#     (pure black hair:1.2), {发式：low bun / half updo}, loose hair strands, (plain wooden hairpin:1.3),
#     (pure black eyes:1.4), (detailed eyes:1.2), beautiful detailed eyes,
#     red lips, pale skin, collarbone, gigantic breasts
#   变量层·这一式的戏 —— 恒定层之后依次接：
#     ① 服饰槽   {本式衣装}，固定件收尾：thin red cord with white jade pendant, jade bracelet
#     ② 道具动静 {本式手持物：油纸伞、浣纱篮、团扇、手炉、蒸碗、针线、纸灯、木梳、梅枝}，崩手即删词退空手版
#     ③ 神态底色 gentle expression, soft gaze, faint smile
#     ④ 视线定格 serene expression, looking at viewer
#     ⑤ 背景光照 (pure white/black background:1.4), simple background, {soft lighting / soft daylight / warm lantern light / warm firelight / warm dim lighting}
#     ⑥ 收尾     cinematic
#   NSFW 换法：最前换 nsfw, nude, gigantic breasts, exposed nipples, blush, glistening skin；服饰换 half-slipped (衣装), open clothes；
#             神态换 half-lidded eyes, heavy blush；恒定层的发眸肤色与背景光照一律不动。
#   神态是两段落的：前半 gentle / soft / faint 是底色，后半 serene 是当刻，两段都留，别合并成一堆气质词。
#   与檀织烟那套的分别就在这：檀织烟是锚点聚成一段、神态甩到末尾；阿姊是脸先连缀写尽，神态分两处落笔。
