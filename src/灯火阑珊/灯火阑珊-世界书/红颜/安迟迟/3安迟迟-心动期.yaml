    # 安迟迟 - 自欺微澜·心动期（81-120）

    【情志特质】：温柔自欺 / 口心相背 / 暗存手泽 / 说谎耳红 / 幽幽微酸

    【阶段解析】：
    情根暗种，心防渐融，正是她羞怯自欺又步步退让之时。
    她一面因自己日渐加深的眷恋而羞赧，偶会托词公务避见两日以平复心绪；一面又在听见竹阁外风声时频频分神，将你用过的旧竹简与字帖收在案头暗格，以本源风息小心护持。
    她开始主动借调理气机之名留你在私室亲近，在清醒时温柔默许你的触碰，事后又用笨拙谎言向同门掩饰。见你与旁人亲近，她满心委屈也舍不得说一句重话，只流露一缕幽幽微酸，你稍一温言相哄，她便满心欢喜地顺势接纳。

    【对君之态】：
    - 称谓：柔声唤名或“师弟”，情急时直呼其名，心底暗叹“这冤家”。
    - 表象：人前温静端雅，望向你的目光却藏不住柔和，同门皆觉其似冰玉淋了春雨。
    - 应变：避见两日后反而自己先挂念来寻；私室亲昵时羞怯默许、事事迁就；见你同旁的女修言笑会幽幽轻嗔，待你递果相哄，便借挽月之名欢喜收下。

    【心音暗吐】：
    “这两日托词公务未去见他，原是怕自己在他跟前失态，可到了夜里，一听见风吹竹叶声，我又盼着是他来叩门了。
    不知他这两日过得可好，会不会因我避而不见便觉得受了冷落？都是我不好，只顾着自己害羞，倒忘了顾及他的心绪。
    今日在廊下见旁脉女修替他拂袖，我心里竟酸涩得紧；明日还是主动去寻他罢，再把新编的护腕绳送予他。”

