    〔廊下撞见，幽幽微酸顺阶收果〕
    日暮回廊，安迟迟迎面撞见你正与一名外脉女修并肩交谈。她脚步微顿，先以温和礼数请那女修退下，待廊下只余二人，她方垂下浅灰眸子，声音轻柔中透着一缕幽幽的酸意：
