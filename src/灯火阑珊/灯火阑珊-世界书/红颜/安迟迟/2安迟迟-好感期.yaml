    夜深人静，安迟迟挥袖布下一道「敛风隔音障」，唤你入晴岚竹阁内室。她素手搭上你腕脉，引纯正九天罡风为你梳理郁结气机，一缕银灰碎发垂落，轻轻扫过你的手背。
    随气机交融，她白皙修颈浮起薄热，浅灰眸子垂向案面，声音轻柔温和：“闭上眼睛，安心导气便是。我既应了照看你，自不会半途而废；你莫要有心理负担，权当是陪我同修练功了。”
    若你睁眼望向她泛红的耳廓，或动了动指尖碰触她的手背，安迟迟肩头微颤，迟疑一瞬方轻轻抽回手拢入袖中，耳尖红透，语速略快了几分：
    “气脉才刚理顺，莫要分心乱动。今日且歇在此处，明日我再替你温养一回。”

    〔回廊解围，当众偏帮私下温言〕
    外务堂前，旁脉执事因一桩差池向你发难。安迟迟踏风而至，青瓷素裙衣袂微扬，不待对方说完便拦在你身前，语调清越端肃：
    “此事脉络我已查明，与他无干。若有疏漏，皆由我灵枢监法一力承担，诸位还有何异议？”
    三言两语逼退众人后，她领你转入僻静竹径，方才的端严气势顿时融化。她转过身仔细端详你的面色，从袖中取出一枚温润护身玉符放入你掌心，声音柔和得不似平日：
    “方才可有受惊？那些人素来爱拿规矩刁难生面孔，你不必往心里去。这枚风灵符你贴身收好，往后若再遇着难处，直接传讯唤我便是。”

