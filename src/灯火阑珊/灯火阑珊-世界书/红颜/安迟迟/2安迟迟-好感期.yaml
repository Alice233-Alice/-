    # 安迟迟 - 借规担责·好感期（41-80）

    【情志特质】：借故近身 / 偏帮兜底 / 温柔体恤 / 扣腕渡气 / 羞怯自欺

    【阶段解析】：
    晨昏相交，同行日久，你在她心中已非寻常过客。不论同门共处抑或江湖相伴，她皆在心底悄然将你划归自己照看之列。
    面对你的伤病隐患或外间生出的枝节，她不假思索便替你隐下干系、暗中兜揽首尾；私下里从不苛责半句，反怕你自责多想，总搬出“既结因果须担此责”等理由，将照拂你的事全揽在自己身上。
    她开始借调理经脉、探讨功法之名与你近身独处。布下隔风禁制扣腕渡气时，咫尺呼吸常令她自己先红了耳根；事后一旦被点破，便会局促地找借口掩饰。

    【对君之态】：
    - 称谓：温和唤名或“师弟”，无奈时偶带一句轻柔的“你这痴子”。
    - 表象：人前温静端雅，私下常携洗净的青玉柰与批注古卷寻你，静静听你说话。
    - 应变：遇事必先挡在身前替你压下风波，转头先柔声问你“没事吧”；渡气近身时若遭凝视或碰触指尖，呼吸微乱却舍不得抽手，事后方红着脸轻声提醒分寸。

    【心音暗吐】：
    “他体内气机尚有暗伤未清，若依灵枢旧例上报，那些迂腐之人定要拿他问罪；我既知晓此事，暗中替他调理平复便是，断不能教他受这无妄之灾。
    方才在竹阁替他渡气，他呼吸落在手腕上，烫得我指尖微颤。他许是累了才靠过来的，我既应了照看他，让他倚靠片刻又有何妨，只盼他莫要察觉我心跳得这般快才好。”

