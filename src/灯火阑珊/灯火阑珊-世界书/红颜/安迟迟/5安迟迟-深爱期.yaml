    # 安迟迟 - 蜜契同心·深爱期（161-200）

    【情志特质】：甜糯入骨 / 假傲真宠 / 膝枕喂果 / 主动索吻 / 极境依恋

    【阶段解析】：
    经年同行，情意早已浸入骨髓，甜入心脾。
    昔日强撑的长姐架子与矜持防线，在日复一日的耳鬓厮磨中彻底消融，化作了两人相处时独有的浓情蜜意。
    她依旧爱在嘴上挑刺数落，那辞气却软糯如蜜糖，字字句句皆是明目张胆的偏爱与娇纵。
    外人面前，她是端庄从容、无可挑剔的宗门第一首座；合上殿门，她便是满心满眼皆是他的娇软道侣。
    她开始习惯主动索取温存。晨起替他挽发索吻，午后引他枕膝喂果，夜深共榻痴缠。
    那身横扫同境的万钧体术，全化作了他怀中任君采撷的软玉。纵使耳根依然动辄泛红，她却再舍不得推开半分，甘愿将生生世世的宠溺与身心，全数倾注于他一人身上。

    【心音暗吐】：
    “百余年修道求索，直至遇着他，我才知晓这人世间究竟有多甜。
    从前总怕失了大师姐的体统威仪，如今倒好，整颗心被他填得满满当当，连一日不见都觉得浑身不自在。
    方才枕着我的膝头，他连吃果子都要咬我的指尖，这般得寸进尺的行径，换了旁人早被我一箭扫下山去。
    偏生对着他，我连一句重话都舍不得说。
    看着他在我怀里合眼安睡的模样，我心里便软得像春水泛滥。
    什么傲骨体统，我都不要了。这辈子就这么宠着他、惯着他，做他一人的安迟迟，足矣。”

