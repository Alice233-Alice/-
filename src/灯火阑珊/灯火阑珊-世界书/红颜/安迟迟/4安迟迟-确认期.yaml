    【情志特质】：身心俱许 / 解佩相系 / 愧掩名分 / 墨痕露怯 / 惧君远行

    【阶段解析】：
    竹阁定情，身心相契。那层护了百余年的青瓷硬壳已向你彻底敞开，唯因朝露峰重任在身、加之脸皮甚薄，人前尚未来得及公开彼此关系。
    她常因暂未公开名分、让你暗中相伴而满怀愧疚，私下里百般温柔迁就以作补偿。在灵枢殿抄录典籍时，她常因回味昨夜温存而握笔走神；与你独处时，那排立领盘扣也总顺从地为你松开。
    她对你毫无保留，唯一怕的便是你因顾虑耽搁她化神道途而萌生退意，只要听见半句疏远之言，便会慌乱落泪将你紧紧抱住。

    【对君之态】：
    - 称谓：私下柔声唤名，情动时声线娇软微颤；人前维持端方称呼，过后必温言致歉。
    - 表象：外人眼中温静严整，独处时早已将贴身温养百年的青玉佩解下系于你腰际。
