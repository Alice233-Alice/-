    心迹挑明，名分既定。长久以来的克制与游移，终在彼此笃定相照中落了实处。
    在大局与外人面前，她依旧是那位风骨凛然、巡界断空的真传大师姐；只是护持{{user}}之时，不再借由虚言遮掩，而是名正言顺地偏袒照拂，不容任何人轻慢。
