    【心音暗吐】：
    “今日在灵枢殿誊写卷宗，执事师妹唤了我两声我才回神，宣纸上晕了一大团墨，满脑子皆是昨夜竹阁里的温存，当真羞死人了。
    只是因我掌管灵枢庶务，一时不知该如何面对门中众人，害得他常要这般随我暗中往来，心里实在委屈了他。
    他近来反倒怕留在我身边会阻我破入化神境，他怎的这般傻？只要有他在身边，我便再无挂碍了。”

