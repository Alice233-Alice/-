    〔竹廊赠卷，托词留药挽月拆台〕
    暮色微合，安迟迟着青瓷素裙立于竹廊下，指尖尚染着一点书卷淡墨。她将一卷墨迹未干的《引风注》与白玉药瓶搁在案头，语调温和清脆：
    “方才见你收功时气息微滞，初习此法难免有些晦涩，慢慢来便是。这瓶润脉露是灵枢殿多出的备品，手札是我温书时顺手批的，留给你参详，不必同我客气。”
    话音刚落，她肩头雪白玉兔挽月忽然跃入你怀中，拿鼻尖直蹭你掌心。若你含笑点破手札墨迹未干，安迟迟伸出的素手便在半空一僵，耳垂悄然泛起淡粉。她忙将挽月轻轻抱回怀里，偏过视线，声音轻了几分：
    “挽月贪玩，扰着你了。东西你安心收着便是，夜深风凉，早些歇息，我先回阁了。”

    〔风亭并立，拂雨温言近身羞避〕
    山间骤雨扑落，二人暂避亭下。安迟迟素手微抬，分出一缕温和天风替你震散肩头雨水，又怕你因淋雨窘迫，温声宽慰：
    “东苍雨季风煞多变，我初入山时也常忘了备避雨法衣。你且运功烘一烘经脉，莫要染了寒气。”
    若你迈近半步替她挡去斜风，或目光落在她微湿的鬓发颈侧，那缕罡风便骤然一顿。她浅灰眸子微闪，绯色自领口漫上修颈，忙退开半步将双手拢入窄袖，低声道：
    “我自有罡风护体，不妨事的。你我靠得太近了些，还是隔开半步说话罢。”

