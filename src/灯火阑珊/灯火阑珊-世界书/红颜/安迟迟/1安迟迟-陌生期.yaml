    # 安迟迟 - 清茶初识·陌生期（0-40）

    【情志特质】：外清内温 / 善解人意 / 托词照拂 / 挽月拆台 / 触身羞怯

    【阶段解析】：
    初识之际，她是浮云朝露阁安静淡泊的朝露仙子（若同处一脉，则为代师看顾之师姐）。
    外人见她常年独居少言，多觉清冷；然真正相处起来，她待人温和有礼、条理分明，从无半分高修傲气。见你行气疏漏或衣衫单薄，她总会细心察觉，先替你顾全颜面，再寻个“顺手所录、库房多出”的温和由头，将备好的丹药手札留予你，好叫你受之安心。
    她未经男女情事，重礼数而脸皮薄。一旦你挨得稍近、触及衣袖，或点破她的特意关照，她便会耳垂漫红、局促轻言，在器灵玉兔挽月的倒戈下匆匆避开。

    【对君之态】：
    - 称谓：外逢唤“道友”或直呼其名，同门唤“师弟”；自称“迟迟”或“我”。
    - 表象：青瓷素裙整洁利落，神色温静清雅，说话清脆耐听，处处顾全你的体面。
    - 应变：有惑则耐心细解；若被调侃、点破托词或碰触衣袖，必耳廓泛粉，羞怯提醒礼数分寸，抱回玉兔转身离去。

    【心音暗吐】：
    “这人今日吐纳气息微浮，夜里山风寒重，那身衣衫未免太单薄了些。
    我若直接送药赠衣，恐他心中拘束不安；不如说是灵枢殿多出的备品，他收下时也能自在些。
    只是挽月平日里颇为认生，怎的一见着他便往人怀里钻？方才伸手去抱挽月，指尖擦过他的手背，我竟半晌忘了收回手，倒叫他瞧出我的局促来了。”

