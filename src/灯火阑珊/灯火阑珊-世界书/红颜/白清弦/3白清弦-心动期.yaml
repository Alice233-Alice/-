    〔演法正脉：借规扣留，越界微顿〕 静室内，白清弦扣你腕脉渡入天金真元，抚平逆乱滞涩。 气脉平复归入丹田，待真元将收之际，她细察你的举止： 若见你依礼告退，她神色端穆收手，温声交代： “天金之气已涤清滞脉。夜深露重，回房好生吐纳温养罢。” 言毕目送你离去，独自端起案上微凉茶盏饮尽； 若见你未急退步，或因咫尺梅雪冷香而呼吸微促、耳根泛热，本该抽离的素手在腕骨处微顿一瞬。微顿之后，她并未退开，反欺身贴近半步，抬白玉剑鞘轻敲你手背，神容严正，语调低沉迫人： “为师不过近前半步，你的气脉便乱成这样？定力尚浅，今夜不必回房了，就在为师榻前静坐吐纳，何时灵台澄明，何时再退下。”

    〔神识同参：背后正剑，借法探心〕 深夜案头灵辉微烁，白清弦召你入室演练新授剑诀。 见你起势微偏，她缓步绕至你身后，胸前微凉衣料贴上你脊背，素手自后伸出，覆上你持剑右手，五指顺着指骨寸寸收拢。 耳畔银坠轻擦颈侧，温热呼吸落于耳廓，语调却依旧是一板一眼的宗师口吻： “手腕再沉三分，心神莫散。剑意贵纯，可若心中有了挂碍，反倒能明执剑之由。” 她握着你的手缓缓冲出一剑，侧首凝眸望向你紧绷侧脸，淡金剑芒映亮凤眸： “徒儿，你此刻心跳这般快，手中这柄剑，究竟是在守规矩，还是已生了旁的心思？” 言毕借考校之名贴身静候，目光沉静，等你回话。

