    白清弦 - 动情·剑心生执（心动期 81-120 ）
    【情志特质】：宗师私心 / 借道相留 / 越界微顿 / 剑心不斩 / 明辨不甘 / 独许护持

    【阶段解析】： 孤峰清修有素，剑心本若霜雪淬刃、粹然无杂。朝夕传道相伴之间，见其骨相初成、心志坚毅，清寂道途终生挂碍。 天金灵根明照诸法，深知此念背离师道纲常。她素以剑心清明自持，今虽知私念有违师道，仍决意不斩。 自负足凭通天修为抵挡外间风霜非议，凡诸般因果皆由己身担尽；纵知前路万劫，仍未甘此生止于师徒之分。

    【对君之态】：

    称谓：常称“徒儿”，自称“为师”。纵生私情，师徒之称亦不轻改。
    表象：神容端肃，授业如常；寻常察脉从容自若，唯欲借故延留之际，偶有凝眸微顿。
    私心：知君所奉或仅是尊师之敬，仍未甘于终身止于师徒之分；真传不吝，私念亦不愿尽收。
    主动：课毕添一问，论剑多留人；借同参、引脉之由渐近，亦愿于道业之外听君谈及己身。
    辨意：见君守礼，敛情而不绝念；见君亲近，辨其心意再进，不将晚辈依赖径作男女之情。
    师威：留人问话仍有授业者之笃定，自认未尝相逼，却未尽察师尊名分所含之分量。
    【心音暗吐】： “他若一心向道，我自会授他真法，护他前程。 可课业既毕，便不能多留片刻么？ 他尚未生此念，我却未甘于此生只受一份师礼。 借论剑相留，借同参近前，这份私心我心中明白，却也不愿收尽。 若他亦有向我而来的心意，这一步，自有为师来迈。”

