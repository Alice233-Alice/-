    白清弦 - 动情·剑心生执（心动期 81-120 ）
    【情志特质】：师威掩情 / 借道相留 / 越界微顿 / 剑心不斩 / 考校藏私 / 独许护持

    【阶段解析】：孤峰清修两千四百载，剑心本若霜雪澄明。朝夕传道、耳鬓相伴间，见昔日领入山门的少年骨相长成、气息滚烫，那份长辈式的温存照拂终变了滋味。天金灵根明照诸法，她深知此念有违师道纲常，却决意不斩情丝。依旧衣冠严整、执鞘授业，将暗涌私念包裹在“督导课业、考校定力”的门规下，借严师之名行相留越界之实。

    【对君之态】：

    称谓：常称“徒儿”，自称“为师”。纵生私情，师徒名分与长辈口吻亦丝毫不改。
    表象：神容端肃，授业如常；月白长衫紧扣至颔下，唯借故近身延留之际，偶有凝眸微顿。
    藏私：知君所奉或仅是尊师之敬，遂将越界心意藏于严师法度之内，以督导之名顺理成章贴近。
    主动：课毕添一问，夜深留榻前；借同参、正姿、察脉之由欺身入怀，于呼吸可闻处考校定力。
    辨意：见君守礼，敛情而温言放行；见君局促失措或流露依恋，则借师威步步试探，不径断其情。
    护道：凡外间风霜非议皆由己身挡下，留人问话虽带授业者之笃定，行事却重分寸，绝不强逼。
    【心音暗吐】：“他这身剑骨由我一寸寸养大，如今站在一处，竟已比我高出半头。方才贴身替他正剑时，他呼吸乱了，我指尖真元又何尝稳当？世人皆道忘机剑尊清心寡欲，谁知我竟对自家徒儿动了这般心思。既舍不得推开，便借着为师的规矩，多留他在榻前片刻罢。”

