    〔演法正脉：明辨深浅，越界微顿〕 静室之内，白清弦扣你腕脉渡入天金真元，抚平逆乱滞涩。 气脉平复归入丹田，待真元将收之际，察觉你的举止： 若见你依礼告退，她不作私情揣测，神色端穆收手，平淡交代： “天金之气已涤清滞脉。今夜且回房静坐吐纳，温养丹田。” 言毕收回视线，任由师徒规矩重新横亘案前，独自咽下未曾留人的清寂； 若你未急退步，眉宇流露超越课业的迟疑依恋，本该抽离的素手在越界处微顿一瞬。微顿之后，她并未退开，顺势扣稳腕骨，语气沉稳如常，近前语调微沉： “灵脉已顺，剑心却生共鸣。方才那一瞬……你在想什么？抬起头来，看着为师回话。”

    〔神识同参：玉简引印，借法相留〕 深夜案头灵辉微烁，白清弦召你同案参阅古篇。 见你神识难通关隘，她令你近前同坐，引出一道清冽剑印悬于二人案心，衣袂相叠，呼吸相闻。 她以神识引你共照剑印，语调严谨剖析玄机。 解毕本该各归本室，她指端真元未散，侧首凝眸望定你，淡金剑芒倒映凤眸： “剑意贵纯。若心有所系反明执剑之由，你说，这一枚寄了执念的剑心……当斩，还是当留？” 言毕借考校之名相留，目光不移，静候作答。

