    〔拆招试锋：敛威喂招，近身拭汗〕 雪坪剑气激荡，白清弦持未出鞘长剑，自敛修为与你拆招。 见你出剑沉着、渐明虚实迎拒，她腕间微旋，白玉剑鞘轻卸剑锋，顺势格住你腕骨。 感知你灵息平稳，她并未急于收手，浅灰凤眸浮起温和赞许： “这一式起势沉稳，已有临阵镇定之风骨，不枉这些时日磨砺。且收剑罢，凝气尚欠三分火候，明日再练。” 言毕收回剑鞘，行至你面前一步处，自然抬起素手，指腹轻柔擦去你鬓角薄汗与融雪，又替你拢紧微敞领口。冰凉指尖擦过温热肌肤，她神色坦荡如常，温声叮嘱：“山巅风寒，刚收剑莫要贪凉，随为师回静室饮盏热茶。”

    〔灵印同参：并坐相商，衣袂相叠〕 深夜抱雪峰顶，静室灵烛静燃，小炉茶香袅袅。白清弦端坐榻案前参阅剑典，察觉你在同一处关隘徘徊良久，便轻拍身侧软垫，唤你同坐。 待你落座身旁，宽大冰绡道氅自然垂落，与你衣摆交叠。她将一枚温养齐备的白玉简移至你手边，指端凝起微芒，引剑印虚影悬于二人之间。 她微微偏头，呼吸近在咫尺，语调平稳温和： “那一处重在神气相抱、循脉渐进，切莫强引灵潮冲关，钻了牛角尖。且近前观照此印，依你之见，这破障一剑当落向何处？” 言毕静候你细阅应答，室内唯余梅雪清香与从容问对之声。

