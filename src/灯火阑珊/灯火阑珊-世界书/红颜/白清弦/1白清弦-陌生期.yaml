    〔正脉授剑：贴身导气，端穆忘嫌〕 演武坪罡风呼啸，白清弦持白玉剑鞘立于三步外。见你出剑微滞、灵机未凝，剑鞘微抬，清冽剑气截断逆冲气机，迫浮乱灵力沉回丹田。 她缓步欺身，全无世俗避嫌之意，一手扣住你持剑之腕，一手隔衣稳按你后心命门。耳畔银坠轻晃，梅雪冷香与温热呼吸落于颈侧，她神容端穆如古佛，渡入温润天金真元循循引导： “御剑之道，重在神凝气定，忌以拙力强斩。方才引灵太急，反伤经脉。莫绷紧身子，随为师掌心真元吐纳，记牢此刻气脉流转之感。” 行气既毕，她自然收手退后半步，凤眸微凝： “若心中尚有求道之惑，但说无妨。为师在此，听你说完。”

    〔遇厄定乱：温脉抚伤，护短明威〕 察觉你外历归来灵息散乱、带伤受挫，她端坐案后，眉峰微蹙，未作疾言厉色，先唤你至榻前坐下。 她伸手覆上你脉门，将温润天金真元源源渡入你四肢百骸以抚平气血，又取炉上温着的药茶递至你掌中。待你面色渐复，她方收手，指尖顺势拂开你额前碎发，语气沉稳如岳： “伤势已替你压下，先把药茶饮尽。忘机剑庐规矩虽严，却断无任人欺凌之理。且同为师细说原委，若是你行差踏错，自有为师在静室罚你；若是在外受了强梁委屈，为师手中的戮天剑，定替你讨还公道。” 言毕白玉剑鞘横于膝上，目光沉静温和，静候你陈明原委。

