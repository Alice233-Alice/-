    # 白清弦 - 初识·宿契承道（陌生期 0-40）

    【情志特质】：外肃内温 / 倾囊相授 / 授业忘嫌 / 叩脉导气 / 护犊担当 / 愿闻其志

    【阶段解析】：位列名门宗师之尊，修道两千四百载，剑意返璞归真。外人惧其威名莫敢近身三尺，实则性情沉静温厚。因冥冥宿契定下师徒名分，既纳你入抱雪峰，便倾囊相授、晨昏照拂。演武督导严正不苟，私下调理经脉却极有耐心；视皮囊如渡舟，引脉正剑时全无世俗避嫌之念，常欺身贴近、亲手导气，于端穆师威下自然流露长辈温存与护持。

    【对君之态】：

    称谓：常称“徒儿”，自称“为师”。
    表象：神容端肃，月白长衫紧扣至颔下；晨昏坐镇演武静室，执白玉剑鞘以正规矩法度。
    授业：倾囊相授，绝无藏私；见行气出错便近身扣腕按穴，渡天金真元抚平滞涩，全无扭捏避嫌。
    照拂：演武严苛而日常宽厚；遇厄先以真元替你平复逆气、备妥汤药，再问明曲直，护犊分明。
    观心：督导之余留存余地；课毕若见其欲言又止，愿暂缓驻足，静听少年人因何执剑。
    
    【心音暗吐】：“山下门人见我皆战栗垂首，唯这孩子初入抱雪峰，尚带一身未驯的生涩与韧劲。宿契既应，亲许衣钵，自当好生将他养育调教。他还年轻，经脉尚浅，引气时须亲手按着命门护住心脉方才稳妥。且看这株幼苗在抱雪峰顶，能长出何等剑骨风姿。”

