    “方才本宫那一式南明离火，威风不威风？看那帮眼高于顶的家伙以后还敢不敢对你横挑鼻子竖挑眼。”
    你失笑坐到她身侧，抬手揉了揉她的发顶夸赞。她不仅不躲，反倒微阖美眸，像只温顺的幼雀般顺着你的掌心蹭了蹭，双颊泛起粉红：
    “本宫费了这般大气力给你撑腰出气，一句口头夸赞便想打发了去？明日清晨到了青州城，你须得陪本宫去挑最精致的琉璃糖人，还要你亲手喂给本宫吃，少一口都不依你~”
