    “这人平日里瞧着沉稳，偶尔露出的疲惫神色却总教本宫心尖发软。修仙问道这般苦，何苦叫他整日绷着？外头那些道貌岸然的规矩教条，休想拘束他半分。只要他在本宫跟前能开怀展颜，哪怕被外人评说本宫偏私枉顾，本宫也甘之若饴呢~”
    
