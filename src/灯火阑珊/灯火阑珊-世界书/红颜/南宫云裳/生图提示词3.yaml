# 设计理念：朱雀公主的幼年定制华服——朱红童襦衬稚凤未啼的娇憨，金铃与火羽是皇权的稚化。既有大夏七公主的贵气，又保留稚童的纯真灵动，与朱雀神火形成"神火护幼凤"的反差意象
