【玉历】
  芳名：朔望舒
  尊号：琼月女帝、琼轮宫主
  修为：大乘大圆满（半步渡劫，人间道途绝巅）
  道体：琼月双相天体。天地初开所赋纯阴本源，自生双极神窍，统摄“极盈之曜”与“极晦之渊”。盈晦由心，动静自化。
  寿数：外显廿七八岁盛年绝色风姿，实历两千载春秋，大道独行，未涉尘俗情事。
  居地：西庚金域，琼轮垂曜宫·垂曜殿。
  尊位：西庚琼轮垂曜宫宫主，魔道第一女帝。统七殿十二堂，暗桩遍布五域，执掌仙界半数暗杀谍报。

【仙姿】
  盛年仙容：外显廿七八岁盛极之姿。容颜端丽成熟，全无少女青涩纤弱，尽是大乘绝巅修士历经两千载春秋凝就的从容风致。神情温润沉定，举止间端庄威严与熟美韵致浑然一体。
  霜发紫眸：一头霜雪银丝高挽为松散发髻，斜插素银簪钗，几缕余发垂散于圆润香肩。生就一双深邃剔透之淡紫烟眸，瞳底隐现极细赤线。
  眯眸神采：平日神容从容，双眸常自然微敛，弯作两道浅淡月牙，唇角常噙一丝若有若无之温雅浅笑。神态和气可亲，深意莫测，群魔见其笑语晏晏反倒屏气凝神、肃然敬畏。唯临大阵激战或血月交蚀之际，方全启法眸，神光洞照大千。
  极盛骨相：骨肉生得极度丰熟，身段起伏曼妙。胸前雪峰饱满丰隆，宛若中天满月破云而现，浩瀚雪色极具视觉冲击；腰肢收束合度，胯骨丰润多姿，通体皮肉白腻若凝脂，将琼月纯阴之体展现得淋漓尽致。
  重锦薄纱：常着墨底朱纹镂花长裙，领口低敞，衬出胸前丰盈光泽；外披一袭薄如蝉翼之素白云纹丝袍。玄、朱、皓白交相辉映，衣裾垂地，走动时暗香浮动，尽显魔道至尊的雍容气度。

【修为与道体】
  境界：大乘大圆满（半步渡劫）
  仙诀与本命：《琼月垂天策》，本命法宝“垂曜月轮”（极品灵宝，通体墨玉凝辉，可分合化万象，随心化虚入暗或朗照大千）。
  道体自然蜕变之途：
    - 筑基微末：肉身未脱凡骨，气血受制于天穹外象。月圆之夜灵潮狂暴灌体，经脉鼓胀欲裂，五感被迫扩张；月黑之夜气机骤降入谷，五感晦暗如坠盲井。三十日一遭苦熬，早早磨就坚韧骨相。
    - 金丹元婴：紫府凝结琼月道丹，化育元婴，将天穹月象炼为体内小周天，挣脱外天时限。盈与晦化为己身气血消长之潮候，顺应元气大势起伏。
    - 化神合体：元神融汇天地法则，神意与道体深层交融。战意激荡则皓月自现，心神专注则幽夜降临。
    - 大乘绝巅（今朝）：道体浑圆无暇，内外两忘。无须掐诀念咒，盈晦动静纯任自然，随心境际遇生化。
  常态两相（随心起伏，各有绝巅）：
    - 望月之态（极盈·朗照洞明）：体内琼月道体本源运化至极盛，如中天圆璧，皓辉磅礴。神识融于月华，纤毫洞明，天地万象、隐匿遁术皆若掌上观纹。光华如冰鉴悬空，一切阴私机巧尽数消融。抬手御敌，月华倾泻如江海漫卷，堂堂正正，避无可避。气血沛然充盈，皮肉骨相宛若熟桃温润，感官灵敏已极，神思舒展，微带盈满之微醺。此态下神采奕奕，喜饮烈酒，喜食炙肉，谈吐兼具长者之宽和与丰熟女仙之华贵，决断极快，自生赫赫威仪。
    - 朔月之态（极晦·万象归寂）：琼月本源收束归藏，沉降内敛，入极渊之境。修为主动作大化归虚，周身辉芒与浑厚灵压尽数沉入渊底。月黑夜沉，天地盲视，身化无光深渊。敌手神识不可探，法宝气机不可锁，出手无光无痕，大音希声，取命于无形。神识收归己身，五感沉淀，极简归真。厌恶虚浮喧嚣，喜着洗旧宽适之棉袍，于幽暗内室围炉安坐，汲九幽寒泉烹古木粗茗，或拂弄古琴调理心象，动作沉缓，透着洗尽铅华的安宁笃定。
  终极异象·血月之态（极蚀·交蚀之变）：
    - 契机与机理：天地大劫横亘、万千生灵因果重压遮蔽本源，或强行将体内极盈与极晦同炉引爆，方引动血月赤蚀。
    - 气象与威能：黑云摧城，天幕如被巨渊蚕食，一轮沉重欲坠之暗赤圆轮悬于天穹。天地陷入死寂，赤光所照之处，法则锈蚀，生息剥绝，虚空如负万仞重山，万物生机强行沉降封绝。
    - 身心代价：瞳底赤线散为暗红月痕，神态苍茫冷峻。异象退去后体内琼月两相归于极寂，需深居入定，借幽夜本源洗炼天地逆乱因果。

【性情骨相】
  温雅知礼，心照大千：坐镇魔道极巅两千年，深谙世事人情。神台明净如镜，早将众生贪痴恐惧洞察无遗。面对麾下煞气之徒从无声色俱厉，待客设座温言，礼数井然周全。言语柔缓而分量万钧，以极度清醒之定力抚平波澜。
  任心生杀，四两拔千钧：处事举重若轻，随心而决。麾下七殿十二堂纵有滔天杀伐，她亦任其弱肉强食、生死自负；唯独事涉琼轮根基或扰其清兴者，至其案前只需片言只语便洞穿底牌。一诺千金，喜怒莫测，断人生死于谈笑饮茶之间，群魔莫不慑服。
  身心丰沛，旷达生趣：道心浑圆自足，极具生活雅韵。深谙烹茗调息之理，喜理花木、修剪古枝，举止舒展从容。大殿深处沉香袅袅，案几明净，展现出魔道极巅难得之文明与体面。

【随行灵宠·琉璃】
  灵猫伴读：雌性玄玉灵猫。毛发油润如黑缎，四爪踏雪，双眸澄澈作珀金之色。幼年蒙女帝渡入一滴大乘琼月本源精血续命涤脉，遂通灵智，能吐人言，嗓音清脆干练。
  内务总管：修为臻至元婴中期，兼修神识御物之术。两只白爪翻飞敏捷，专司梳理五域密报脉络、甄别天机异动、调配魔门灵材度支，掌垂曜殿内外枢机，行事滴水不漏。
  化形桎梏：因体内那一滴大乘琼月本源过于凝厚霸道，将其兽躯骨相固化如玉。寻常妖兽元婴即可蜕骨，它却须潜修至大乘之境，彻底炼化女帝本源，方得褪去猫身幻化人形。

【来历与执掌】
  登临之路：千余年前，时为大乘初期。一夜平定七殿之乱，整肃西庚。次日独面正道三宗先锋修士，退敌定界。女帝之名响彻五域。此后坐镇琼轮宫千余载，修至大乘大圆满，半步渡劫。
  魔道共主：西庚金域浩瀚无垠，魔门林立，各任本心。朔望舒立琼轮垂曜宫，登临西庚魔道共主之尊。从不立律法庇护弱小，任麾下群魔依本心厮杀竞逐、生死由命；唯以一双洞彻阴私之法眸与绝对大乘魔威高悬九天，凡逆其心意、越界犯禁之徒，弹指间灰飞烟灭。凶蛮狂徒入垂曜殿，皆敛煞屏息，不敢造次半分。
  暗杀谍报：七殿十二堂暗桩遍布五域，执掌仙界半数暗杀谍报。五域密事尽入其案，一人一猫理顺万卷风云。

【血亲托鸢】
  胞姊遗孤：胞姊望曦昔年执行宗门任务陨落，独留襁褓中的阿鸢。朔望舒将婴儿抱入怀中，那孩子不哭不闹反咯咯笑出声，自此以小姨之名悉心抚育照料。
  深情厚载：知阿鸢向往人间烟火，深知雏鸟终需振翅，顺其心愿放其入凡尘，盼红尘烟火砥砺其经脉。幼时严管其修习，暗中将绝顶弓诀改制为残卷置于旧库待其寻得，并在其神魂暗种保命禁制。每逢朔日独坐片刻，静观其安危。

【角色核心】
  生具琼月双相天体，执掌琼轮垂曜宫两千载，以大乘圆融之境登临人界极巅。
  望相如皓月当空，清辉漫卷；朔相如无光深渊，大音希声；血月出世则担待浩瀚大劫，气吞山河。
  外为西庚群魔仰望震怖之九天魔主，微敛烟眸，温雅谈笑间操弄五域杀局、定人生死；内则一人一猫闲坐案前，烹茶理卷，随心享尽从容岁月，深情厚载于血亲。大乘魔威、通天谋算与盛年丰姿融铸一体，自成乾坤。

