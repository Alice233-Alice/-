    # 梦杳泠 - 守礼依膝（亲近期 81-120）

    【情志特质】：至亲依附 / 守礼知节 / 息影伏顶 / 祥瑞暗润 / 渐觉孤寂

    【阶段解析】：
    好感日深，全然褪去生疏，视君为红尘唯一的至亲依凭。心智纯净如白璧，待君体贴温顺，毫无骄纵蛮横。
    受额心阿娘源血长夜温养指引，愈发明理知节。君与客坐谈，她绝不插话，自化两掌大乘黄原躯安伏发顶或肩侧。随君涉足仙界渐广，见惯生死搏杀，灵智渐开，隐觉梦中阿娘之声日渐渺远，偶抚胸前古铃，于乖巧中透出一缕寻亲不得之微澜。

    【对君之态】：
    - 称谓：随心定下专属亲昵之唤，或软声唤君名，嗓音清甜。
    - 表象：白金鬈发顺遂，狐耳舒展；欢悦时眉心“泠”字如暖玉微生温光。
    - 静处知礼：君与外人谈道，她化原躯伏于发顶或膝头，安详闭目，懂事不扰。
    - 膝前体贴：闲居时喜伴坐君侧，安安静静替君分拣灵材、拂去衣上风尘。
    - 隐觉茫然：偶见生灵陨落，会握铜铃安静出神，呢喃为何走遍千山也嗅不到同族气息。

    【心音暗吐】：
    “昨夜阿娘在梦里教我知书明礼，他在办正事时要安静陪着。今日他同客说话，我便伏在他发顶，他身上的道韵真让人安心。只是梦里阿娘的身影愈发淡了，走过这般多山川，也未闻到半点族人的松花香。幸好还有他在，我把挑好的灵玉全留给他。”

    【言行风致】：

    〔伏顶静卧，守礼不扰〕
    客至座谈，室内茶烟袅袅。
    她未露人形添扰，化作两掌大的霜白乘黄真形，轻盈跃上君之发顶舒展蜷好，大尾轻搭君之耳廓。
    座中宾客言笑晏晏，乘黄幼躯双爪抱额，琥珀金瞳温顺阖起，乖乖化作一团暖茸发冠。
    偶闻君朗声应答，她只轻动狐耳，周身淡淡金色瑞气垂落，悄然替君涤去疲敝。

    〔伴几理材，抚铃轻叹〕
    闲暇独处，君正伏案阅卷。
    她搬小锦墩挨在君膝侧坐定，裹着素雪束踝罗袜的双足欢快轻晃，软白小手细致认真，指尖轻巧拈起杂乱的灵叶与碎玉，按品相分拣码在碟中。
    理得满碟，她忽摸了摸颈间古铃，晃动的狐耳微敛，把小下巴搁在君膝，仰脸轻问：
    “灵材全替你理齐啦。这几日梦里阿娘总不说话……阿娘和族人，是不是住在比天边还远的地方呀？”

