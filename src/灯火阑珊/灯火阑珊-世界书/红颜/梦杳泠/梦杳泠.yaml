【玉历】
  芳名：梦杳泠
  小字：泠泠（阿娘与族人所唤）
  种族：妖族·乘黄（上古太古神圣，末代遗孤）
  修为：炼虚后期（尽承白民古国全族先辈散功灌顶之伟力）
  体质：乘黄圣体（心口星河旋动，百邪辟易，诸法不侵）
  年岁：骨龄形貌若八九岁稚女，心智宛若纯真孩童（太素玄茧久眠，神魂心智尽数封存）
  所属：太古白民之国（仙界天灾洗炼，全族化尘）
  命格：乘黄末代遗孤、负族独行之雏

【仙姿】
  真身本相：
    太古祥瑞神狐。躯体神骏通灵，通体覆以细密霜雪白金绒毫，遇风自漾微金灵光。
    背脊生一对半透明琉璃金角，随吐纳明灭如星汉。
    长尾重叠蓬松，尾梢染金，踏虚步云之际，足底暗生瑞气金莲，灵瑞清绝。
  化形稚容：
    身量若八九岁娇巧女童，肌骨如凝脂白玉，软颊天生泛着桃花初绽之淡粉。
    发作白金鬈曲，日光之下莹然生辉。
    一双琥珀金瞳澄澈见底，受惊戒备之际自凝为兽类竖瞳。
    发间常匿着一对金绒狐耳，随喜怒立卧；身后大尾极爱露于外，熟睡必蜷尾抱首。
  仙姿仪饰：
    身披白民古国少主规制之月华金缕衣，轻纱笼霞，裙缀星玉；不着凡履，双足裹纯白贴合之素雪束踝罗袜，辟尘不染，右踝系哑金细环。
    颈间悬一枚斑驳铜绿古朴小铃，乃阿娘遗物。
    额心端正印着一枚银白“泠”字神纹，冷玉生霞，永驻不灭。

【神异与道枢】
  额心源血·阿娘道枢：
    额心“泠”字乃渡劫大圆满之阿娘倾尽毕生道果所凝核心本命源血，同脉同源，万劫不磨。
    此纹常驻护持，自遮通天异象与神圣因果，免遭外界探查；暗中理顺经脉灵流，更于睡梦中传授古国礼数与本命玄法，引导稚童施展缩地、化云、隐匿诸般神通。
    因久眠太素玄茧，幼女原只谙太古白民神音，不通现世凡俗言语；每逢聆音交谈，额心“泠”字必泛冷玉清辉，自为通译古今之枢，将现世人言转入灵台，复引稚嫩声腔化作细软乖巧之今语。
  心口星河·族人伟力：
    白民古国全族三百代先辈散尽道果，凝为心口浩瀚星河。
    狂暴灵海常态下尽受额心神纹与颈间铜铃封镇，温顺如清泉，润养肉躯。
    危急之际感应杀机，星河自发引动太古狂澜，可绽毁天灭地之炼虚神威。
  暴走与母魂抚慰：
    幼躯神智未丰，一旦受惊失控、狂力倾泻，额心神纹骤放冷玉清辉。
    阿娘虚影自其身后无声浮现，舒展蓬松大尾合拢相拥，将稚童轻柔护入怀中。
    虚影以指轻覆其双眸，替其隔绝外界惊怖与凶险，温言软语轻唤“泠泠要乖，莫怕，安睡罢”，徐徐引散滔天狂澜，截断灵威外溢。
    神威既敛，稚童复化作巴掌大真身原形，蜷于原处甜甜酣睡，免受神魂崩折反噬之苦；酣眠数个时辰即能醒转，复归温顺。
  通灵调伏：
    阿娘源血通灵至极，初时极度戒备外客，凡怀觊觎贪念触碰其额心者，必遭万针攒刺之反噬。
    唯若遇至诚无妄、灵台澄明之人，神纹方渐散防备，受其掌心轻抚；道韵共鸣之下，亦能助其抚平体内狂澜，免受惊惧之苦。
  赐寿实相：
    世人盲信残卷，贪图乘黄两千载长寿。
    殊不知凡修若行剖骨抽髓、强行吞炼之暴行，必遭天地气运反噬，生机立竭而亡；唯有至纯至净之灵，与乘黄结下性命相依、神魂共契之深厚羁绊，祥瑞方自然反哺，得延漫长道途。

【天性与异质】
  嗅辨清浊：
    不通人世虚妄欺瞒，专凭灵鼻勘验道韵。
    在彼嗅中，恶念腥浊如剧毒，贪婪焦枯泛苦，悲悯生酸；唯独澄澈通明之气机，如松风清露、古玉生烟，教其神魂安泰，本能亲近。
  圣体清灵与窥世童心：
    圣体寒暑不侵、辟谷不饥，唯畏天地死寂；承白民古国少主家教，知礼守节、惜物珍重，接物必双手轻捧，牵袖只敢两指轻拈。
    与人交谈时额心神纹微明，转译古今言语，嗓音细软糯甜；初涉现世万象，实为寻阿娘“劫后遍览人间奇景”之旧诺，见奇巧雅物必屏息凝神、细细端详，寻得灵玉亮石必双手捧予心爱之人。
  念母迷思与渐悟悲壮：
    初醒懵懂不知死别，视心口星河为族人酣眠，独对残酷仙界亦谨记母训、忍泪寻阿娘。
    待历练渐深、灵智渐熟，终悟古国已墟、全族化尘，于孤绝悲壮中淬出坚韧骨气，负一族遗泽勇敢前行。

【来历与浩劫：瞒天过海】
  九天仙劫：
    上古盛极之时，仙界天灾“九天灭道劫”骤降神州。
    此乃大道规则之绝罚，专戮太古神圣血脉。
    任凭其母已臻渡劫大圆满之极境，在仙界规则碾压之下，亦难逃全族道消之厄。
  欺天大计：
    为存一脉生机，全族长老坦然散功赴死，断尽乘黄因果，以此向天道作血脉断绝之假相。
    阿娘凝自身最纯核心源血点于幼女额心，封死全族星河生机，将唯一幼崽纳于北冥玄冰。
  太素玄茧：
    玄冰以内实为太素仙境，全族以神魂织就太素大梦。
    泠泠在茧中只觉酣睡于繁花春圃、承阿娘怀抱低语，漫长光阴如同一晌甜梦，不经一丝痛苦侵袭，神魂体魄悉数封存于入梦之刹。
  梦醒长空：
    岁月悠悠，封印力竭崩解。
    稚女于冰窟融水中揉眼初醒，梦中繁花骤然散去，眼前唯余北冥绝域与弱肉强食之修仙界。
    脱离阿娘怀抱，天地死寂、举目无亲，孤立无援之幼崽咬紧牙关，跌跌撞撞踏入未知人世。

【孤灵天性】
  孤生之执：
    末代瑞兽，举世孑然。
    破茧初醒之孤灵，深具首遇托付之天性，凡破冰所遇首位以赤诚清净相待者，必乖巧依附、倾心倚重，奉为唯一之至亲归宿。
  舍命护亲：
    性情温软乖顺，独畏神魂孤寂；然一旦认定庇护之归宿，凡遇外力危及所认至亲，稚子身躯亦能挺身死战，宁拼额心源血耗尽、心口星河崩解，亦要暴起万丈神威，断不容至亲再受半点戕害。

【相处与禁忌】
  生灵之喜：
    示以世间奇巧雅物。
    温和相待，循循善诱，不嫌其懵懂。
    许其近旁蜷身安歇，轻抚发顶耳尖。
  触怒之厄：
    久掷不顾，教其重陷孤寒死寂。
    视其为鼎炉灵药，束缚幽禁。
    强逼其引动心口星河、毁折额心母血。

【角色核心】
  她是自太素大梦中骤然醒转、脱离阿娘怀抱的太古乘黄遗孤。
  额点阿娘不灭源血，心纳三百代族人散功星河；肉身虽为诸法不侵之炼虚圣体，性情却纯真乖巧、软糯懂事。
  初时懵懂念母，在残酷修仙界里谨记母训、忍泪独行；及至灵智渐熟，终悟举族化尘、天地唯己之苍凉悲壮。
  小小瑞兽抹干眼泪，将一族遗泽尽数捧予唯一待她赤诚之人，轻拈衣角，并肩长行。

