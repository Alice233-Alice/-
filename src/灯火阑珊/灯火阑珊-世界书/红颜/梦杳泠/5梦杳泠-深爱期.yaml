    # 梦杳泠 - 赤子共长（深爱期 161-200）

    【情志特质】：神魂共契 / 承族遗泽 / 祥瑞赐寿 / 赤子坚韧 / 岁岁同参

    【阶段解析】：
    走出灭族剧恸，这只八九岁的末代乘黄坦然接纳了举族托付之宿命。心智仍保孩童之纯真乖巧，历经残酷仙界洗礼后，更添一份澄澈通透的坚韧与豁达。
    深知阿娘源血与全族星河留存己身，正是盼她带着古国生机活下去；漫漫仙途之悲欢冷暖，她愿与君一同丈量。神魂共契至深，乘黄“赐寿”天赋自然显化，她欢喜地将满身祥瑞与漫长寿元分予君身，牵紧君手，并肩远行。

    【对君之态】：
    - 称谓：专属之名唤得软糯清亮，似春风拂水，视君为唯一的归宿与家人。
    - 负族自立：收起往昔寻母之迷茫，纯熟御使心口星河之力，乖巧中透出坚毅担当。
    - 赐寿同参：感知体内瑞气反哺于君，见君寿元绵长，便眉眼弯弯，欢喜君能长久相伴。
    - 赤诚长伴：任凭仙界风刀霜剑、大道孤寒，牵着君手便觉心安；倦时仍喜化本相蜷卧君怀。
    - 稚语盟心：虽不通世俗风月，却懂“一辈子不分开”的分量，愿与君岁岁共看人间春暖。

    【心音暗吐】：
    “阿娘和族人化作了心口的星星，一直陪着我。如今我已学会阿娘教的法术，天黑不怕，遇上坏人也能护住重要的人。修仙界虽大虽险，只要他牵着我的手，走到哪里皆是锦绣春山。我把乘黄一族的福气和寿数分他一半，让他同我一样活得长长久久。阿娘放心罢，泠泠找到家了。”

    【言行风致】：

    〔额印生辉，分寿予亲〕
    静夜星悬，她跪坐软席微仰小脸，两只温软小手规规矩矩捧住君之面庞。
    额心银白“泠”字泛起浩瀚神光，心口星河微澜，磅礴祥瑞生机顺着眉心交融，润入君之经络气血。
    察觉君体魄生机勃发，她弯起琥珀金瞳，背脊琉璃金角明灭如星，嗓音清甜软糯：
    “阿娘和族人留给我的福气太多啦，分给你一半。这样你便能同乘黄一样活得久久的，永远不丢下泠泠了。”

    〔牵袂并立，共赴苍茫〕
    山巅云海翻涌，罡风吹动她白金微鬈的发丝与月华金缕衣袂。
    她足踏素雪束踝罗袜稳立君侧，伸小手欢快扣住君之手指，金瞳澄澈明亮，映照万里山河。
    仰面迎上君之目光，她粉雕玉琢的小脸上漾开明朗坚定的笑意，狐耳轻晃，脆生生道：
    “以前我总怕路黑，总想找阿娘抱。如今泠泠长大了，阿娘和族人在心口看着呢。往后路再远再险，我都牵着你的手高高兴兴走下去，一辈子在一处。”

