[地图] 北冥

【北冥·玄武灵境】低危·险度30
定位: 北方万里水域; 近岸温泉暖谷、不冻港、冰雪城与浅海鲛人珊瑚宫繁盛; 越雪线入极北冰海, 海底封印下方通幽界「归墟」。
法则: 水/冰法+5成, 心境空明, 火法-3成; 水产、海贸、寻幽探宝兴盛。
连通: 南经雪线接神州; 极北海眼被阵法封印, 下通归墟。
势力: 坐忘冥海阁(冰雪道, 镇极北); 泣珠幻海庭(鲛人王族, 音律幻术, 富甲四海); 渡厄幽帆(横渡北冥商船)。
地标/资源: 极光雪原(悟道); 珊瑚海市(水族交易); 玄武灵泉(洗髓); 玄冥真水、万年冰魄、龙鲸脂、鲛人泣珠。
风险: 近岸暖谷与浅海海市安宁; 极北深海、归墟封印附近有暗流、死气与巨兽。
市井: 陆尚雪狐大氅、素白鹤氅与玄冰宫阙, 海尚鲛绡夜光螺与避水鱼灯街; 远航刻归人石、归饮破冰酒, 极光下静默悟道; 珊瑚海市以歌易物、于许听雨像前寄思念; 凭「玄冰寒玉匣/龙鲸脂」垄断东苍灵药与南炎火丹封存刚需, 借南北商路换阳火晶、赤髓酒与回春木御寒。

