[地图] 九野通衢·寰宇阵枢

【九野通衢·寰宇阵枢】地脉灵轨·空间跨移网
定位: 古仙阵遗脉与诸宗合建之灵轨网, 贯通五域、四海要冲、边境及天渊外围。
三阶阵枢:
- 域间星枢(巨型): 设于五域中枢(大夏帝都/青帝苑/金秤城/琉璃仙城/冰雪仙城); 耗上品灵石与虚空晶石瞬移跨域, 仙朝宗门严控; 帝都深处尘封绝天古阵(通九霄幽冥)。
- 境道官阵(中型): 设于四海要冲(水族使节站/蓬莱海市/潮音渡)与边境四道; 联通本域各郡, 须验关牒声望。
- 隐界暗桩(微型): 散布荒墟与黑市(千机暗门/森罗黑渡/五渊哨站); 昂贵不稳, 专供走私潜渡避查。
时标基准:
- 阵枢瞬移: 星枢瞬至, 官阵半个时辰, 暗桩依乱流。
- 常规御行(横渡一域): 筑基飞舟阅尽寒暑(半年至经年), 金丹1~2月, 元婴旬日至月余, 化神炼虚数日, 合体大乘数个时辰至一日, 渡劫缩地穿五域。
- 天堑跋涉: 宝船横渡环海需数月, 远涉外海动辄经年; 登九霄/潜五渊需层层攀涉数日至旬月。
运转机制:
- 盘查伪渡: 负恶名或敌宗修士入阵遭扣杀; 可借易容、伪牒或改换信物强渡。
- 因果引渡: 持同心佩、护道命牌、灵兽血契或定点虚空盘, 野外可共鸣最近阵枢紧急挪移, 担乱流反噬。
- 异变扰动: 天渊潮汐与天道脉动令星枢瘫痪并偏坠险境断层; 五行暴走闭锁同属阵枢, 逼改水陆古径。
管控势力: 大夏仙朝(统御神州主干星枢关隘)、万象森罗坊(垄断三成商轨)、昭明破阵宗(督造南炎与要塞防线)、千机诡市(暗控黑渡暗桩)。

