[地图] 九野通衢·寰宇阵枢

【九野通衢·寰宇阵枢】地界空间跨移网络·地脉灵轨
定位: 凡界古仙阵遗留与各大宗门共建之地脉灵轨网; 贯穿五域、四海要塞、边境关隘及天渊外围。
阵阶划分:
- 域间星枢(巨型): 设于五域中枢(神州大夏帝都、东苍青帝苑、西庚金秤城、南炎琉璃仙城、北冥冰雪仙城); 跨域瞬至, 耗上品灵石与虚空晶石, 受大宗门与仙朝严控; 相传帝都深处尚存直通九霄与幽冥的绝天古阵, 尘封已久。
- 境道官阵(中型): 分布于四海要冲(龙眠海峡水族使节站、蓬莱幻海市、潮音陨铁渡)与边境四道; 联通本域各郡宗门, 通行须验关牒或势力声望。
- 隐界暗桩(微型/残阵): 散见于荒墟秘境与黑市(千机诡市暗门、万象森罗坊黑渡、五渊外围哨站); 稳定性差, 代价昂贵, 专供黑道潜渡或规避盘查。
通行时标(跨域/跨界基准):
- 阵枢瞬移: 域间星枢瞬息至; 境道官阵半个时辰内; 隐界暗桩依虚空乱流而定。
- 常规御行(神州至四极): 低阶飞舟/筑基御剑1~3月; 金丹御空7~15日; 元婴破空3~5日; 化神/炼虚瞬息万里1日可至; 合体/大乘移星缩地半炷香至数个时辰; 渡劫大能一念穿梭五域凡尘。
- 特殊天堑: 跨四海(乘宝船/渡厄幽帆)15~30日; 潜五渊/登九霄(受罡风煞气压制)需数日攀涉。
机制/互动:
- 盘查与封锁: 负恶名或敌对宗门修士入阵易遭扣押截杀; 可借易容、改换信物或伪造关牒强渡。
- 因果引渡: 持道侣同心佩、宗门护道命牌、灵兽同生血契或定点虚空阵盘, 可在野外强行共鸣最近阵枢实现紧急挪移, 需承受虚空乱流反噬。
- 异变扰动: 
  * 天渊潮汐与天道脉动爆发时, 域间星枢大范围紊乱瘫痪, 跨域传送易偏坠至凶险绝地或倒悬天墟。
  * 局部五行暴走时, 对应属性阵枢过载闭锁(如地火潮汐闭锁南炎火脉星枢), 逼使修士改走水路或边境古径。
管控势力: 大夏仙朝(统御神州主干星枢与关卡)、万象森罗坊(垄断天下三成商路星轨)、昭明破阵宗(督造南炎与要塞防线灵轨)、千机诡市(暗控黑渡暗桩)。

