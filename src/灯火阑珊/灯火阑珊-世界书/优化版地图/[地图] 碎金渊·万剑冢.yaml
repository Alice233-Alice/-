[地图] 碎金渊·万剑冢

【碎金渊·万剑冢】至凶禁地·险度92·剑灵疯魔与穿腑裂魂
定位/气象: 潮音海极西海沟深裂; 古今折剑、名门古剑乃至被禁制锁链封镇之绝世神兵尽矗于此, 冲天剑气劈开海水成无底绝峡, 与神木枯冢互为镜像。
疯灵/穿透: 矗立群剑多孕剑灵与旧主残魂, 十之八九久浸怨煞而彻底疯魔失控, 仅极少数神兵古剑之灵尚存清明理智而寂然自封。满渊金煞与疯魔剑意专走“以虚透实”之径, 无视体表护甲直穿五脏六腑与泥丸神魂, 误入者外皮完好而内腑元神俱碎。
分层: 残剑滩(近世断剑, 无形剑丝穿肺腑)→断刃崖(上古剑痕, 无形断刃袭神)→万剑渊(疯魔剑灵横行, 偶藏封印神兵与清醒古剑灵)→金气本源(先天庚金, 久留五脏血肉化金)。
奇珍/异变: 碎金结晶、剑痕铭文、金气之种; 「万剑同悲」起潮时万剑疯鸣暴走、金芒如蜡泪。
涉足: 非元婴剑修勿入, 入前须“交一剑”得共鸣; 太白剑宗访剑, 忘机剑庐枯坐, 藏锋敛锷只收碎金, 无生剑派记录尽抹。

