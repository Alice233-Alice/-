[地图] 世界空间结构

【三界架构】
天界(九霄/穹顶虚空): 拔地凌虚三万丈以上。下霄=天渊与星陨废墟(天渊为主轴天堑，废墟为环聚浮海), 中霄=太古战场·九天遗迹(龙凤战场), 上霄=天道裂隙(天道残缺断口); 天渊悬空下垂地界，罡风、星陨与空间乱流常态肆虐。
地界(浮黎古陆/凡尘): 中土神州与四极五域、环海、特殊险海(雷暴海)、边境四道、外海三域, 人族与万灵主繁衍与争锋。
幽界(九泉/深渊): 归墟、无尽炎渊、神木枯冢、碎金渊、黄泉古迹五大渊薮, 沉沦死气、地脉浊流与太古沉渣归宿。

【界域定义】
凡界(亦称下界)是天界、地界、幽界共构之三界乾坤。天界虽高悬九霄之上、远绝凡尘，仍属凡界天地；仙界独立于三界之外，唯渡劫圆满者方能循飞升通道蜕去凡胎、证道登临。

【天地渊途与太素水脉】
天界→地界: 下霄天渊直通西庚极西与潮音海(星陨坠世、渊气垂布)。
地界→幽界: 北冥海眼→归墟; 南炎火山→无尽炎渊; 东苍建木根→神木枯冢; 潮音海床裂隙→碎金渊; 神州西南天堑→黄泉古迹。
浮黎水脉大循环: 神州极巅圣境「流素灵境」孕育太素圣泉垂落高天→化为「九曲天河」润养神州全境并衍万千支流分走四海→主干西南裂谷汇入幽界黄泉古迹化为忘川。
天界深处: 循天渊与星陨废墟朔日涟漪入中霄遗迹；探遗迹寂静黑孔直达上霄裂隙。

【地界分野】
中枢: 神州(五行调和, 顶立流素灵境, 贯通九曲天河)。四极: 东苍木、西庚金、南炎火、北冥水。
环海: 潮音海(西)、龙眠海(东)、蓬莱幻海(东南)、北冥冰海(北)。
特殊海域: 雷暴海(神州正南/介于南炎与东苍之间, 木火激荡无尽狂雷, 天地熔炉与走私死地)。
边境: 苍茫古径、赤金走廊、雪线、龙眠海峡。外海: 无尽洋、天泣洋、永夜海域。
地图域规则: 环海、特殊海域与外海均为独立地图域，与神州、东苍、西庚、南炎、北冥五域同级；“四海”仅作传统环海总称，不代替具体海域。

【五行/异变】
五域灵气总量随时代盛衰，地域差异在于各域属性各极偏旺；顺属性威能×1.5~2, 逆属性仅存2~5成, 神州不增不减。
七大异变: 天渊潮汐、混沌潮汐、地火潮汐、神木泣血、幽冥潮汐、天道脉动、万剑同悲; 以五行生克连锁共振, 详见[地图] 异变感应网。

【地脉灵轨】
九野通衢: 域间星枢连五域中枢, 境道官阵通四海边关, 隐界暗桩通黑市荒墟; 详见[地图] 九野通衢·寰宇阵枢。

【五域人文与交融】
万里风情: 五域皆横跨万里(繁华腹地↔幽界绝地两极); 神州皇极礼乐、西庚西域剑侠(极西天渊下有青羽云雀净土)、南炎南疆琉璃汤泉、东苍百越森罗、北冥极光鲛歌各异, 借金火铸道、木火官丹/雷海走私、南北冰火商路紧密交融; 详见[地图] 五域风物·万里人文。

