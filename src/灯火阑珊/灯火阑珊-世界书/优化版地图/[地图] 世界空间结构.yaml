[地图] 世界空间结构

【三界界域·浩瀚尺度】
凡界(下界)由天界、地界、幽界立体共构，广袤无垠；仙界独立于三界外，唯渡劫圆满者蜕凡飞升登临。
- 天界(九霄): 凌虚三万至九万丈之苍穹残界，无寸土陆基，唯万里罡风雷海与浮空仙骸。自下而上分下霄(天渊/星陨废墟)→中霄(太古战场·九天遗迹)→上霄(天道裂隙)。
- 地界(浮黎): 中枢神州，四极东苍木、西庚金、南炎火、北冥水。五域浩瀚，每一域皆容百千凡俗皇朝、亿万黎庶与无算仙山古脉；凡夫一生难出州郡，筑基飞舟横渡一域亦需阅尽寒暑。五域外抱环海四域(西潮音/东龙眠/东南蓬莱/北冥冰海)、特殊险海(雷暴海，介于神州正南与南炎东苍间)及边境四道(苍茫古径/赤金走廊/雪线/龙眠海峡)；更远处为无尽洋、天泣洋、永夜海域等海图断绝、神识难穷之茫茫外海。
- 幽界(九泉): 倒悬于大地极深处之五大无底渊薮(归墟、无尽炎渊、神木枯冢、碎金渊、黄泉古迹)，各成万里死境。

【三界连通与水脉】
- 跨界坐标: 下霄天渊垂落西庚极西与潮音海；北冥海眼→归墟，南炎火山→无尽炎渊，东苍建木根→神木枯冢，潮音海裂隙→碎金渊，神州西南天堑→黄泉古迹。
- 太素水脉: 神州极巅「流素灵境」发源母河「九曲天河」，河面宽逾百里至数千里，万丈仙舟行之若浮沤；千百支流如经脉分走四海，主干自西南裂谷倾入地底黄泉，化为忘川。

【空间与五行规则】
- 洞天与阵枢: 名山大宗与太古神裔栖居地多嵌折叠虚空与洞天芥子，一山一谷内自成日月乾坤；五域万里阻隔，修士远行跨域多赖古仙遗留之「九野阵枢」折跃虚空。
- 地图域同级: 环海、特殊险海与外海均为独立地图域，与五域同级；“四海”仅作环海统称，不代替具体海域。
- 五行偏旺: 四极属性各偏旺，顺属威能×1.5~2，逆属存2~5成；神州五行调和不增不减。
