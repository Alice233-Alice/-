[地图] 无尽炎渊

【无尽炎渊·地心火狱】至凶禁地·险度95·极致高温与五重焚蚀
定位/封禁: 幽界极深, 南炎原始火山群地底之万丈熔岩深渊; 外有上古火眼封印与南门要塞死守, 非元婴且无辟火异宝者莫近, 火灵根生机稍长。
高温焚蚀: 渊内热浪滔天, 越深火品越高、温度越盛, 携霸道「焚蚀」伟力, 自肉身、法宝、灵气、元神直至存在概念层层熔解蚀空。
分层: 赤焰(酷烈灼肉, 火毒蚀心致狂躁嗜杀, 结丹勉强)→白焰(炽白极温, 蚀穿道纹、熔金毁器)→青焰(高温超凡物极限, 蚀解周天灵气与护体真元)→黑焰(极热焦黑扭曲虚空, 穿透皮囊直蚀紫府元神)→虚无之火(温度臻至天地极限, 将寿数、记忆与存在概念从根源蒸发蚀灭, 合体亦慎)。
奇珍/风险: 祝融神火、地心源晶(受火毒侵蚀改心性为暴躁嗜杀); 烬兽、祝融执念、概念焚蚀。
异变: 地火潮汐百年一遇, 黑焰冲封、赤血火云压城, 与黄泉幽冥潮汐阴阳交泰, 引发天地灵气剧变。

