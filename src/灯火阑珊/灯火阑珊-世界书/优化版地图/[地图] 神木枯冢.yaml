[地图] 神木枯冢

【神木枯冢·葬仙藤狱】至凶禁地·险度95·病态长生与木孽反噬
定位/封禁: 幽界极深, 东苍建木根系之下; 建木将衰败死气排入此窟, 更沦为历代寿尽修士逆天强求长生之“罪孽坟场”, 由龙吟阁与百草谷立禁碑封死。
病态木孽: 昔年贪生者将血肉与排毒枯根强行嫁接, 终化嵌于树干、非生非死之病态活尸。冢内死气与过剩生机极端扭曲, 来者寿元十倍流逝, 兼受病态生机侵染而伤口生花、五脏抽枝、血肉木石化(木灵根尤易同化为树魔); 凡借冢中道果或「枯荣丹」强行续命破关者, 必遭木孽反噬、体内钻出妖藤化作新肥。
分层: 枯骨林(寿元十倍流逝)→畸变藤狱(伤口生花、血肉木石化, 嫁接活尸盘结)→岁月灰烬(枯荣时间错乱)→枯荣本源(生死概念扭曲交界, 罪孽核心)。
奇珍/风险: 枯荣道果、岁月神木; 尸花妖、远古树魔、岁月乱流。
异变: 神木泣血, 千年一遇, 建木渗红脂、孽雾倒灌根城, 与地火潮汐相克, 引发东苍灵气衰竭与妖藤暴动。

