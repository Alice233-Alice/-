[地图] 倒悬天墟·五行逆反界

【倒悬天墟·五行逆反界】极异·险度85·道法逆位
定位: 三界阴面之镜像虚空; 天地倒悬, 山海倒挂, 乃凡界五行真元流转对冲之漏斗底界。
法则: 五行逆克, 顺行道法威能削七成, 逆运法门反增一倍; 灵气沉重如汞, 须颠倒神识上下方能御虚。
门槛/连通: 底线元婴境(或持至宝辟易深渊煞气/天渊罡风); 连通幽界五渊极底逆泉与天渊星核坍缩断口, 七大异变爆发时界壁薄如蝉翼, 可破空潜入。
九霄沉渊(天界逆像):
- 沉星渊薮(下霄天渊): 现世星陨坠世, 此地引力逆吸, 星骸碎片化作浮空晶尘向上喷涌。
- 寂灭神墟(中霄太古战场): 残留战意与龙凤威压凝固为化道迷梦, 神魂沉溺即自解归墟。
- 逆规奇点(上霄天道裂隙): 现世残缺天道在此聚为未开辟之规则实核, 可观万法初始纹理。
五渊悬天(幽界逆像):
- 倒悬命池(对映归墟): 吞噬死气转化为纯净水本源神液, 肉身残损者入池重塑生机。
- 倒挂冰峰(对映炎渊): 暴烈黑焰逆化为幽蓝寂灭阴髓, 滴水成焰, 专冻心火与元神。
- 倒生建木(对映神木): 枯萎腐根化作穹顶倒垂之青苍神木, 散发纯净乙木清气与道果。
- 融金柔沼(对映碎金渊): 万剑煞气与断刃消解为温润金液天池, 专养剑魂, 涤除剑魔。
- 回魂天城(对映黄泉): 阴森鬼蜮化为生者不夜幻城, 溯源清溪可唤醒宿世转生记忆。
机制/玩法:
- 异变平息/引流: 斩断逆位灵脉可平息现世异变灾劫, 亦可引逆界浊流冲击现世仇敌大阵。
- 倒影潜渡: 现世禁地天堑于此多为坦途, 自逆界穿梭可避过现世一切护山大阵。
- 逆道洗髓: 引逆行五行强淬道基以破修行瓶颈, 需防道心失序。
奇珍/风险: 悬天劫晶、逆命血莲、先天生机液、寂灭阴髓; 神识颠倒错乱、道法对冲反噬、逆界异兽。

