[地图] 宗门势力关系网

【宗门势力关系网·互动索引】
用途: 判定天下宗门相遇之交涉底色、冲突升级与同盟倾向；宗门本体详见「宗门势力概览」。

【正魔两极·正面死制】道统相悖，见面极易死战
- 忘机剑庐 ↔ 无生剑派：剑心澄澈荡魔 vs 极悲解脱杀戮。天下剑道两极，争执出剑根本，论剑即分生死。
- 大夏仙朝 ↔ 九幽炼魂宗：皇极运朝法度 vs 凡灵拘魂炼幡。神州正魔中枢血仇，互视对方为乱纲毁世逆贼。
- 昭明破阵宗 ↔ 蚀月血海宗：前线要塞枪阵 vs 深渊猎食真性。南炎正魔第一道防线，万修血仇，绝无转圜。
- 彼岸提灯人 ↔ 无间轮回道：阴阳生死守界 vs 颠覆沉沦轮回。黄泉界限相阻，铁锁镇魂与凿井崩界死斗。
- 坐忘冥海阁 ↔ 蚀月血海宗：极北万古玄冰 vs 深渊暴虐血炎。五行相克，冥海出关必冻血海狂澜。
- 琼轮垂曜宫 ↔ 千机诡市：月照森严法度 vs 诡市黑渡刺心。西庚魔道明面铁律与暗面狂潮暗战，牵动天下谍网。

【超然禁忌·各派敬避】神秘强大，无惧现世任何大宗
- 五域顶尖大宗(大夏仙朝/琼轮垂曜宫/忘机剑庐) ↔ 青羽云雀(天渊之鸟)：互不相犯，执礼相待。云雀一族雄踞西庚高岭飞雪之巅，直面天渊倾泻暴流，执掌虚空法则与灵渊正逆转化之术，在西庚主场更如虎添翼。凡界各派深知其渡劫古祖羽苍溟与大乘族主羽含章底蕴惊世，无人敢撄其锋芒。族中圣女羽岚行走五域红尘，各派巨擘皆以贵客之礼相迎。
- 遗誓林 ↔ 青羽云雀：同为西陲与东苍的太古神裔强族，各守天地要冲，互敬互通。

【同盟共生·利益绑缚】互为唇齿，优先谈判互保
- 万象森罗坊 ↔ 藏锋敛锷山庄：金矿源头与天下商脉互锁，垄断五域矿材流通与商契链。
- 大冶天工炉 ↔ 藏锋敛锷山庄：铸道绝巅与顶级精矿互需，定额五域法宝产出，常争优先供材。
- 苍木龙吟阁 ↔ 浮云朝露阁：青帝万木生机与九天灵药商脉相连，共固东苍正道阵脚。
- 泣珠幻海庭 ↔ 渡厄幽帆：北冥鲛珠避水宝物与幽冥凶水航路互利。
- 遗誓林 ↔ 万象森罗坊：上古誓约与商道契约互认，真伪互验，价码互补。

【暗流摩擦·旧怨偶发】涉及遗迹、利益或弟子伤亡即行升级
- 苍木龙吟阁 ↔ 镜花水月庵：镇守青帝陵 vs 红粉情欲破禁。宗门古籍载有潜陵旧案。
- 浮云朝露阁 ↔ 万象森罗坊：风雅灵丹商盟 vs 天下通利首商。暗争五域高阶灵药定价权。
- 大冶天工炉 ↔ 劫灰神祠：神兵极境成器 vs 万物焚尽澄心。相争南炎地火本源熔炉。
- 藏锋敛锷山庄 ↔ 折戟沉沙谷：商贾重利以利养和 vs 军阵战修同袍死战。常在资粮调配与退守决断起隙。

【中立枢纽·规则之域】可安全接触，行事代价极其明确
- 万象森罗坊：凡物皆有明价，唯遵等价契约。
- 太虚蜃楼：冷眼录信史，绝不干预红尘，其档可作天下定论之据。
- 忘川风月楼：凡尘幻境体验万端，唯押入真实记忆作资。
- 渡厄幽帆：横渡幽冥凶水，行舟不语，船资唯取渡客内心至珍之物。

【核心暗线·牵引界壁】表面未起烽烟，实则系于天地存亡与红颜因果
- 许听雨(水族王庭/归墟) ↔ 坐忘冥海阁/渡厄幽帆：水族至高信仰，水本源压制天地死气，归墟异动则四海皆惊。
- 晚棠(黄泉古迹) ↔ 彼岸提灯人/无间轮回道/忘川风月楼：梦游摆渡维系黄泉平稳，正魔幽冥合力互搏之定盘星。
- 沈倩宁(赤霄阁) ↔ 昭明破阵宗/蚀月血海宗：雷暴海横亘南炎，力极重刃牵制前线正魔暗涌。
- 天道脉动 ↔ 全体大宗门：天地气运逆乱之际，护山大阵暂歇、推演占卜失灵，正魔暗战突起之时。
