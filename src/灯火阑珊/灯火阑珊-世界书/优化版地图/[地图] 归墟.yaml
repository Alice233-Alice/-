[地图] 归墟

【归墟·万水终焉】至凶禁地·险度99·大乘下十死无生
定位/连通: 北冥海眼之底, 八纮九野之水、五渊死气与黄泉忘川暗流共同倾注的无底大壑; 下通云巅「流素灵境」, 与流素、黄泉共构三界水脉“一源、一渡、一归”闭环, 乃熔炼万法残骸、化死返生的返本终壑, 亦为先天水灵许听雨坐镇之家园。
特性/涉足: 外凶内静之反常绝域。外围承纳五渊死气与天地沉疴, 剥夺生机化混沌, 化神以下且无镇空至宝者莫近; 得许听雨庇护则万钧水压自退, 踏波如履平地。
三重渊景: 外渊(十死无生之永夜涡流, 剥夺灵气)→中渊(沉列古昔坠落之仙山遗脉与少昊弃琴谷, 暗流常鸣古琴遗音)→内渊「甘渊骊宫」(狂澜尽息, 荧光珊瑚与星砂辉映, 日夜涤尽浊流死气、重炼先天太素真水返哺九曲天河)。
奇珍/异变: 先天甘渊露、太素泉珠、混沌母气、少昊遗音; 寂灭游魂、法则崩解、重水碾压; 五渊死结积重或与天渊共振时引爆「混沌潮汐」, 席卷北冥并牵动九曲水脉。

【归墟外围·永夜海域】归墟以北·长夜无光
异象/道轨: 终年悬死灰天光, 灵气耗为外界1/10, 伤势凝滞。海底铺展百道蛛网状水蓝仙光, 实为许听雨沉珠点化「太素渊眼」、重塑「太素周天水纲」之本源道轨; 外人莫测, 误作归墟将崩之兆, 水族列为绝密, 渡厄幽帆见永夜即返。

