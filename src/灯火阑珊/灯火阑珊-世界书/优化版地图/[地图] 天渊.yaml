[地图] 天渊

【天渊·天之伤痕】七大异变之首·险度95·非元婴勿入
定位: 天界下霄横空天堑·拔地凌虚三至五万丈。长三万里、宽逾百里，截断天门，下垂凡尘西庚西境与潮音海；通体无寸土陆基，为下霄引力主轴，星陨废墟受其撕扯环聚其侧。
渊气元始: 凡界天地灵气受虚空浸染、乱流崩折演化之至烈浊力，杂混空间道纹残痕，侵蚀道躯；唯青羽云雀古族血脉与之同契，能化暴烈为平和。
特性/险阻: 岁月错乱，星陨如雨，九天罡风带横亘其下(触之成齑粉)；结丹方可凌空，非元婴不可深入，每月朔日方有片刻风平浪静。
层级架构:
  - 罡风乱流层(结丹承受之限，产罡风精粹)
  - 星辰冢(千万陨石浮聚，藏星核星髓)
  - 古战场遗痕(龙凤残骨，残留太古杀意)
    - 渊核断口(空间绝对断绝，直通虚无奇点)
天地枢纽: 垂落星陨渊气于西庚；下穿罡风通凡尘；逆霄可上通中霄太古战场；与幽界至深处归墟天遥共振。起潮时天地共鸣，群星轰坠。

【九天罡风带】险度90: 下霄天界屏障，元婴下触之成齑粉; 产罡风精粹。

