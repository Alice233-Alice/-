[地图] 五域风物·万里人文

【万里尺度·雅俗并蓄】
五域广袤无垠，各容百千凡俗皇朝与亿万黎庶，筑基飞舟横渡一域亦需阅尽寒暑；腹地繁盛，边地渐入险绝。经史诗礼、讲学论道与锤骨尚武并存，百工市井各有传承；风尚因城野、族群而异。

【天下共节·五域同风】
除夕贴符守岁、饮屠苏；上元张灯游市，中土莲灯斗诗，南炎火羽灯、北冥鱼灯各成风景。中秋饮桂酿、赏月团圆，北冥鲛人拜月泣珠。中元祭故，中土开鬼市、焚纸剑，东苍放引魂萤，西庚洒酒祭镇魂碑。

莲夕（仲夏）：祭九曲母河生养之德。大夏仙朝、万象森罗坊与太虚蜃楼联袂启「九曲朝宗大典」，天河主干与五域支流万舫齐发、共饮流素新澜；世人放「溯源莲舟」寄愿，相传天河水脉通连三界，至诚之念可顺水脉感召心中所念之人临水相见。

【五域水土·千里殊俗】
- 中土神州（皇极礼乐·京畿烟火）：天河沃野，广袖飞檐；重经史礼乐，书院讲学、茶楼评书，士子带经佩剑，交往长揖。春日「曲水」流觞赋诗，兼有文会题壁、琴茶雅集。
- 西庚金域（西域丝路·塞外剑侠）：绿洲白城、黄沙剑堡，胡服金冠，抚剑抱拳；交易认金秤，剑客体修好酒，琵琶胡旋流行。春「折柳」洗剑送行、刻名镇魂碑，秋「新酿」饮酒胡旋、竞买名剑。高岭飞雪之巅青羽云雀强族居云栖浮石境，化倾泻渊气为温润灵机，四季宜居；族风端严，喜青鸟原身，化形着青衣、佩鸣珠，「朔鸣」对鸣演道，圣女羽岚与族人巡游五域倍受礼遇。
- 南炎火域（南疆汤泉·赤霞琉璃）：汤谷地火，民风炽烈；百工铸器、体修浴火，火浣纱与银铃赤足常见，温泉入户、夜市繁盛。春「汤祓」共浴泼水祈福，秋「开炉」试剑开市、饮宴通宵。
- 东苍木域（百越森罗·树冠仙乡）：建木花谷，树屋藤衣；传巫歌医道，忌滥伐妄杀，以青芽为礼。春「花朝」采露酿酒、踏歌定情，秋「眠灵」禁猎吹笛、送木灵入眠。
- 北冥水域（天光雪国·沧海鲛歌）：雪国海港，陆披鹤氅，海着鲛绡；重守望，远航刻归人石，海市以歌易珠。永夜「观道」熄灯观天幕道痕，春融「破冰」擂鲸鼓迎帆、饮烈酒。

【跨域交融】
游学、商旅使节俗互传，胡旋、汤馆、茶寮与鲛歌遍及各域。西庚矿铁经赤金走廊入南炎铸炉；东苍药材明走官阵，禁货暗渡雷暴海；北冥冰匣护送灵药，换取南炎火晶、东苍回春木，匠人、食俗随商路流转。
