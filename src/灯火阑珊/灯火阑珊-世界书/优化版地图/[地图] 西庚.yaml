[地图] 西庚

【西庚·白虎锐境】中低危·险度35
定位: 西方万里金域; 腹地绿洲王城与雪山剑峰丝路繁华, 往西入万里黄沙, 临潮音海裂隙坠「碎金渊」; 天渊下另有古族「青羽云雀」辟出的化暴为平圣境。
法则: 金法/剑道+5成, 木法-3成; 尚武崇剑, 矿贸兴盛。
连通: 东接神州, 东南经赤金走廊通南炎, 西临潮音海; 西境荒芜处承天渊星陨之径。
势力: 太白剑宗(剑修圣地); 千机百炼谷(机关/兵戈); 藏锋敛锷山庄(矿脉信用); 琼轮垂曜宫; 青羽云雀(天渊下超然古族, 圣女羽岚)。
地标/资源: 剑意长城、庚金灵脉、白虎天堑、云栖浮石境; 庚金之精、星陨陨铁、剑心草。
风险: 腹地绿洲与剑城治安严, 切磋频繁; 天渊下荒无人迹, 星陨风暴与渊煞交作, 唯云雀栖息处澄澈平和。
市井: 融西域胡风与塞外剑侠气, 绿洲白城尚胡服金冠、轻纱弯刀、葡萄酒与胡旋舞, 剑堡尚玄铁护腕与铁琵琶悲歌; 云雀族笃爱逾丈天青鸟身, 化形着天青云纹深衣、系鸣珠, 朔日对鸣、巡风救迷途; 金秤街兑矿契, 精矿经赤金走廊输南炎天工炉铸剑。

