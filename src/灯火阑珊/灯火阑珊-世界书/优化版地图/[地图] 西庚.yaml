[地图] 西庚

【西庚·白虎锐境】中低危·险度35
定位: 西方万里金域; 腹地绿洲王城与雪山剑峰丝路繁华, 往西入万里黄沙, 临潮音海裂隙坠「碎金渊」; 西境高海拔飞雪崇山之巅另有太古强族「青羽云雀」化狂暴渊气为温润灵机所辟之四季如春圣境。
法则: 金法/剑道+5成, 木法-3成; 尚武崇剑, 矿贸兴盛。
连通: 东接神州, 东南经赤金走廊通南炎, 西临潮音海; 西境高岭承接天渊倾泻之径。
势力: 太白剑宗(剑修圣地); 千机百炼谷(机关/兵戈); 藏锋敛锷山庄(矿脉信用); 琼轮垂曜宫; 青羽云雀(雄踞高岭雪巅之太古强族, 圣女羽岚)。
地标/资源: 剑意长城、庚金灵脉、白虎天堑、云栖浮石境; 庚金之精、星陨陨铁、剑心草。
风险: 腹地绿洲与剑城治安严, 切磋频繁; 天渊下风雪狂暴、渊气倾泻, 唯云雀栖息之云栖浮石境暖露繁花、四季宜居。
市井: 融西域胡风与塞外剑侠气, 绿洲白城尚胡服金冠、轻纱弯刀、葡萄酒与胡旋舞, 剑堡尚玄铁护腕与铁琵琶悲歌; 云雀族笃爱逾丈天青鸟身, 化形着天青云纹深衣、系鸣珠, 朔日对鸣演道、吞吐灵渊, 圣女羽岚自由巡游五域; 金秤街兑矿契, 精矿经赤金走廊输南炎天工炉铸剑。

