[地图] 神州

【神州·中土神州】安靖·险度10
定位: 浮黎万里中枢, 五行调和; 极巅悬圣源「流素灵境」, 万顷沃野与「九曲天河」贯通, 仙凡最盛; 西南天堑下通幽界「黄泉古迹」。
法则: 五行圆融, 道法不增不减; 法度森严、消息互市便利, 适合初涉仙途者安身。
连通: 八方辐辏, 可达地界/幽界诸方; 天河主干西南天堑直通黄泉, 万千支流分走四海。
势力: 大夏仙朝(皇极运朝); 忘机剑庐(极道之剑); 太虚蜃楼(天机造化); 万象森罗坊(天下财脉)。
地标: 流素灵境(云海圣源)、问道峰、九层藏书阁、九曲天河、酆都鬼城。
市井: 尚宽袍玉冠、飞檐画舫与揖礼名分; 帝都荟萃四极风物(东苍茶寮/西庚剑铺/南炎汤馆/北冥鲛珠); 码头"半仙巷"售残丹符箓, 酆都庙街烧纸飞剑, 仙凡共饮天河水, 年节放灯赠饺。

