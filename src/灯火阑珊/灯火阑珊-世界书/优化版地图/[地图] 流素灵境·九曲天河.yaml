[地图] 流素灵境·九曲天河

【流素灵境·太素圣源】圣境·至清至圣·万水之宗
定位: 神州云海万丈仙禁深处; 浮黎古陆第一洞天圣地, 天地未凿之初太素清气与天霖汇聚之所, 亦为九曲天河发源天门。
本质/气象: 境中太素神泉方圆千里, 水澈如融融月魄; 与北冥海底「归墟甘渊」本源一体、表里成环, 承甘渊涤净回涌之先天真水, 霞光万道, 神韶自鸣。
规矩/风骨: 超然红尘正魔杀伐与皇权更迭, 境中素灵皆为先天水母许听雨点化之伴生水灵, 代代清修守望; 世传境中有古仙驻世坐镇、执掌水源天敕、曾一指点化妄图截源之合体魔祖道躯化水, 实为许听雨留驻源头之本源投影; 设十里禁空法域, 纵通天大能至此亦须敛尽煞气按落遁光, 徒步登阶以敬仙威与生养之德。

【九曲天河·浮黎母河】神州主轴·贯穿三界·仙凡共养
地位/流量: 浮黎古陆第一灵脉命脉; 名为天河, 浩瀚甚于沧海, 宽达数百至数千里, 仙朝万丈楼船行于其上如浮沤一粟。
水质/造化: 承太素神水之德, 至纯至柔, 涤荡紫府丹毒与心魔; 顺承万物不积戾气, 凡民汲饮百岁无疾, 沃野岁稔年丰。
水脉大势:
- 主干贯天冥: 源出流素灵境倾泻垂天, 前七曲贯穿神州沃野滋养大夏万千仙城凡民; 至西南第八、九曲水势深沉, 尽纳红尘寿终生灵命数与叹息, 顺万丈裂谷沉入地脉, 直注黄泉古迹化为忘川之水(先天太素水元于彼处裹黄泉净梦真灵孕育出幼妹晚棠, 亦为长姊许听雨顺流放蝶探妹、沉珠点化太素渊眼之要冲)。
- 支流归大壑: 千百支流如经脉分走八荒, 东化青江汇龙眠与蓬莱, 西穿剑崖润西庚入潮音, 南降炎毒通雷暴海, 北凝寒晶注北冥冰海; 四海与黄泉滤净魂业之忘川支流终倾北冥海眼归墟, 经甘渊涤浊返清, 复逆流还归流素圣源, 周流不息。
市井/修行: 码头渡口连绵, 渔火万点; 沿岸大宗立派争引灵泉, 半仙巷商贾如云, 为仙凡共生之繁盛胜景。

