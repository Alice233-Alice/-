[地图] 流素灵境·九曲天河

【流素灵境·太素圣源】圣境·至清至圣·万水之宗
定位: 神州极巅拔地万丈、云海仙禁深处; 浮黎古陆第一洞天圣地, 天地未凿之初太素清气与太初天霖汇聚之所。
本质/气象: 境中太素神泉方圆千里, 水澈如融融月魄, 毫无凡俗尘垢; 霞光万道, 神韶自鸣, 为「九曲天河」最初发源圣源。
规矩/风骨: 超然红尘正魔杀伐与皇权更迭, 境中素灵代代清修守望; 相传境中有太古真仙驻世坐镇, 执掌水源天敕, 曾一指点化妄图截源之合体魔祖道躯化水; 设十里绝对禁空法域, 纵通天大能至此亦须敛尽煞气按落遁光, 徒步登阶以敬仙威与生养之德。

【九曲天河·浮黎母河】神州主轴·贯穿三界·仙凡共养
地位/流量: 浮黎古陆第一灵脉命脉; 虽名为河, 浩瀚甚于沧海, 宽达数百至数千里, 仙朝万丈楼船行于其上如浮沤一粟。
水质/造化: 承太素神水之德, 至纯至柔, 涤荡紫府丹毒与心魔; 顺承万物不积戾气, 凡民汲饮百岁无疾, 沃野岁稔年丰。
水脉大势:
- 主干贯天冥: 源出流素灵境倾泻垂天, 前七曲贯穿神州沃野滋养大夏万千仙城凡民; 至西南第八、九曲水势深沉, 尽纳红尘寿终生灵命数与叹息, 顺万丈裂谷沉入地脉, 直注黄泉古迹为忘川之水。
- 支流走四海: 千百支流如经脉分走八荒, 东化青江汇龙眠/蓬莱, 西穿剑崖润西庚入潮音, 南降炎毒通雷暴海, 北凝寒晶注北冥冰海; 终汇四海蒸腾还天, 生生不息。
市井/修行: 码头渡口连绵, 渔火万点; 沿岸大宗立派争引灵泉, 半仙巷商贾如云, 为仙凡共生之绝顶盛景。

