[地图] 南炎

【南炎·朱雀圣域】低危·险度30
定位: 南方万里火域; 腹地常夏温润, 赤霞花海、梯田水乡、琉璃城与地热汤泉成南国乐土; 唯深入原始火山群与火眼封印方通幽界「无尽炎渊」。
法则: 火法+5成, 易悟生生不息; 水法-3成; 炼丹炼器成率/品质提升。
连通: 北接神州, 西北经赤金走廊通西庚, 东隔雷暴海望东苍; 火眼封印下通无尽炎渊。
势力: 南明琉璃宫(法度/琉璃仙城); 神农丹苑(丹药/灵植); 大冶天工炉(炼器第一宗); 昭明破阵宗。
地标/资源: 赤霞花海、汤谷灵泉、不灭火山口; 赤壤灵芝、琉璃火晶、朱雀遗羽、赤髓火酒。
风险: 腹地花海汤城安泰; 原始火山群/炎渊封印处有火毒瘴气、地火喷发与血海魔修。
市井: 具南疆汤泉与赤霞琉璃风, 尚朱紫火浣纱、赤金臂钏与银铃赤足, 彩琉璃筑城、温泉入户、水道红莲盛开; 待客尊汤谷共浴、饮赤髓酒, 兴朱雀火祭与流霞夜市; 经赤金走廊纳西庚精矿铸剑, 接东苍灵草炼丹, 输阳火晶与烈酒往北冥换封丹玄冰匣。

