[地图] 东苍

【东苍·青帝仙乡】低危·险度20
定位: 东方万里木域; 树冠与花谷四季如春, 人族与木灵共居, 青龙甘霖福泽; 建木盘根地底则通幽界「神木枯冢」。
法则: 木法/医道+5成, 寿元流逝缓, 金法-3成; 利培育灵植、疗伤、养老、求药。
连通: 西经苍茫古径接神州, 东临龙眠/蓬莱二海, 南隔雷暴海望南炎; 建木深根下通神木枯冢。
势力: 苍木龙吟阁(御兽双修); 灵枢百草谷(医修/灵植圣地); 浮云朝露阁(灵药商盟)。
地标/资源: 建木神树、百花秘境、青帝苑; 青木灵液、飞天神木、化形灵参。
风险: 寻常仙城治安极佳, 禁私斗毁林; 原始秘境与盘根深处有树人、遗迹、迷雾阵及枯冢死气。
市井: 尚百越森罗风, 着天蚕纱藤衣、缠活体灵藤银铃, 居悬空树屋与萤火吊脚楼; 点额赠芽为礼, 夜围巨木踏歌; 根城凡人护树根, 百草谷义诊, 叶脉长廊售忘忧茶; 灵草明走官阵入南炎丹苑, 暗经雷暴海走私违禁毒草妖木。

