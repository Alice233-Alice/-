[地图] 黄泉古迹

【黄泉古迹·九曲冥渡】至凶禁地·险度95·非元婴及无梦庇护者十死无生
定位/尺度: 神州西南万丈地裂深处, 九曲天河尾闾注入之万里坍缩断界; 与云巅「流素灵境」、北冥「归墟」共构水脉“一源、一渡、一归”闭环, 乃忘川汇回归墟前剥离众生情执的滤魂前关。
表里双相: 太古轮回崩毁后, 万载生灵临终遗恨只进不出, 化作剥夺生机道心之规则绝域; 唯摆渡人晚棠摇引魂铃、展「大梦纱幔」覆映时方显紫晶彼岸花与白玉奈何之渡口, 离梦则森罗鬼域立现。
三重诡域:
- 外域【黄泉古道·唤名花原】: 活人踏入则阳火压为肩头三寸冥烛; 灰雾化亲族故友之音贴耳唤名, 应声回首者阳火立黯, 一截寿数生魂当场剥落、于灰泥绽为殷红彼岸花。
- 中枢【忘川冥海·残魂断桥·望乡台】: 千里黑水重如铅、飞剑立沉, 窥水见自身苍老死相即道心失守溺亡; 奈何石桥中段崩断, 无梦映桥时水底苍白残魂叠作虚桥, 死拽生者足踝拉入深渊; 桥畔望乡台映百年身后宗毁人忘之荒凉, 台下石灶自沸「孟婆汤原浆」, 饮之消心魔却洗空姓名道果与半生记忆。
- 内核【冥河滩涂·九口轮回井·亘古石门】: 晚棠水月净莲常浮于此; 九口倒悬轮回井溢散错乱岁序罡风, 卷入则道行拆解、洗去灵智; 尽头矗立万丈「亘古石门」, 门缝渗吹熄元神之九幽寒息, 深藏太古大恐怖。
奇珍/异变: 孟婆汤原浆、净世莲子、忘忧清露; 彼岸提灯人镇外陵, 无间轮回道常潜入图谋; 逢甲子或晚棠破梦时引爆「幽冥潮汐」, 九井喷黑血、天河逆流染赤。

