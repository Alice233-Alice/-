[地图] 九霄天界（上中下霄）

【九霄天界·虚空残界】天界全境·拔地凌虚三至九万丈·孤悬苍穹
天境概貌: 凡界穹顶天外天，通体无泥石陆基，唯无垠虚空深渊与浮空残骸；脚下尽是万里罡风雷海，自下而上层层凶险，非大能不可涉足。
三霄层阶:
  - 下霄·星陨废墟(凌虚3-5万丈·险度90·非化神莫久留): 围绕天渊引力浮聚之浮空仙宫废墟海。空间紊乱，古仙残存神通显化。产星核仙骨、法则碎晶；朔日天渊边缘生涟漪，可逆空登中霄。
  - 中霄·九天遗迹(凌虚5-8万丈·险度97·合体亦陨): 悬空龙凤神魔战场。祖龙与神凤万丈骸骨横卧虚空，龙凤残威绞碎神识，心性不纯者立陷疯魔。中心十里绝地万籁俱寂，唯悬一漆黑孔洞，直通上霄。
  - 上霄·天道裂隙(凌虚8-9万丈·禁忌·险度无限): 凡界天道极巅断口。金光裂纹遍布虚空，直面断裂大道本质，肉身神识极易道化湮灭；天道脉动爆发时，凡界阵法紊乱、天机尽掩。
天路通途:
  - 登天: 穿透地界九天罡风带入下霄天渊与废墟；循朔日涟漪入中霄；探寂静黑孔入上霄。
  - 坠世: 穿透下霄空间乱流直坠地界西庚与潮音海；天渊断口与上霄逆奇点吞噬生灵归于虚无。
异变感应: 天渊潮汐峰值时，中霄龙凤长鸣、下霄古壁显化；天道脉动可统御凡界诸般异变。

