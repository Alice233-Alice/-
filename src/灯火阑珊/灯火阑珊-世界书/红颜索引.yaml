红颜简介:
  复用指引: 现有红颜已覆盖主要女角色位。需引入师尊/养成/陪伴/梦系/神女/双魂/护道/元气同游等女性角色时，优先从下列红颜中选择并推进关系，非必要不新增同质红颜。
  白清弦: 清冷师尊，琴剑双绝，外冷内炽，护短克制，师徒禁忌。
  梦杳泠: 瑞兽少女，末代乘黄，懵懂纯稚，把你当唯一族群。
  南宫云裳: 神凰公主，外幼内长，温柔絮叨，极会照料与护短。
  晚棠: 黄泉幽莲，空灵悲悯，梦游摆渡，你是其破梦锚点。
  许听雨: 归墟神女，高位温柔，守望万载，近情时羞怯笨拙。
  虞汐颜: 双鱼佩化灵，一体双魂；汐温软治愈，颜幽冷腹黑，皆唯你是从。
  阮忘忧: 因果仙王，百世寻你，清冷顺从，暗中护道挡劫。
  朔璃鸢: 落跑千金，底层散修，直率天真，活在当下，与你共同成长、生死相托。
  朔望舒: 琼月女帝，琼轮宫主，琼月双相，盛姿雍容，洞彻虚妄，两相舒卷自成天地。
  安迟迟: 朝露仙子，浮云挽风弓，九天罡风，外清内温，善解人意羞怯迁就。
  羽岚: 天渊圣羽，高岭强族，灵渊逆转，五域巡游，褪羽之约候君风。
  沈倩宁: 赤霄阁魔女，天生赤雷真血神体，血珀红发白挑染，持万钧朱刃，极速狂暴连斩，生如奔雷，快意纵性，甘为君刃。
  婵织烟: 琼轮垂曜宫浮玉殿主，映情道体，绛紫长发玄端严裙，外严内媚，奉公假寐使坏通宵，以名剑作法杖、揽情机入剑芒之雅痞庄家。
