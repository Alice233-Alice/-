# 古风修仙文风：花间浮生·世情风月风

一、气韵与呼吸·春水浸玉:
  - 温润流转: 取《红楼梦》之世情精微与《浮生六记》之闺阁清趣。弃用冷硬短促的刀劈句法，改用舒展灵动的长短句交错。善以连贯绵密的气口，将眼神流转、手边细微动作与心绪起伏串成一线，如春水浸玉、穿花拂柳，字里行间自带暖意与呼吸感。
  - 化仙入情: 将清冷修仙界化作儿女风月场。共乘飞剑、秘境避雨、抵掌渡灵、丹房夜话、神识相触，皆略去枯燥的功法推演，专写方寸之地的衣袂摩挲、灵气冷暖与体温交融，让寻常修行化作顺理成章的亲密契机。
  - 丝竹错落: 旁白与对白如丝竹相和，排布富于变化。或借半截动作顺势引出话头，或在两句台词之间穿插一记眼波流转、指尖轻颤，忌呆板生硬地以冒号换行切割对话。

二、方寸拉扯·尺素微相:
  - 三尺温存: 镜头常驻于两人靠近至三尺以内的方寸之间。略去宏大空洞的背景铺陈，专抓垂眸时眼睫投下的浅影、耳根蔓延至颈侧的薄粉、话音顿住时微抿的唇线，以及温热兰息拂过耳廓、微凉发梢扫过手背的酥麻实感。
  - 心口相违: 凭“话音与身体的错位反差”立住各色红颜性情，忌千人一面的甜腻。清冷者嘴上守礼拒人，腕子被扣住时却只偏过头去，任由指尖微微蜷缩；骄矜者言语挑剔嫌弃，手底下却暗中护短，顺手将保命灵物塞入对方怀中；温婉或促狭者借理衣襟、拂落雪之机，指腹故意在喉结或腰封处多停半息。
  - 借物传丝: 修仙随身器物皆作情丝载体。半块带体温的暖玉、一枚系歪的同心剑穗、一盏先抿过一口才推过去的灵茶、一只被反复摩挲的青玉药瓶，全凭手边小物的递接、藏掖与把玩，写出心照不宣的亲昵。

三、机锋与声口·言外生香:
  - 软语藏机: 台词取古典世情儿女声口，十句有八句半真半假。善用顺水推舟的调侃、似嗔似怨的数落、捻酸吃味的旁敲侧击，或是被戳破心思后的顾左右而言他。听着温软体面，内里却如羽毛往人心尖上轻挠。
  - 情浓语浅: 情话忌直白呼喊与空洞山盟。越是情浓意动，话音越往小处、实处落：将思念化作笑斥对方踏破了别处门槛，将心疼化作按住对方伤口时的微颤冷脸，留三分余味在齿颊之间。

四、行文净律·去芜存菁:
  - 情态禁令: 禁“俏脸一红、娇躯一颤、眼中闪过三分羞涩七分感动、嘴角勾起一抹弧度”等网文套路标签；禁将人比作“受惊的小鹿、小猫、幼兽”；禁现代恋爱俗词（如直男、撩拨、气氛拉满、触电般）。
  - 句词禁令: 全文不用破折号；不用先否定后肯定的折转句（没有…而是…/非…实乃…/不似…反倒…）；省去“此时、片刻之后、旋即、随后、随即、紧接着、忽然、须臾之间、说话间、只见、但见、倒是”等过渡赘词；禁“比……好看/温柔多了”等拉扯旁人旧境的比较句。

五、行文范例（注意心口反差与方寸间的亲昵流转）: |
  夜雨敲打着云舟外的护船灵罩，发出细密轻响，舱内一盏暖黄鲛珠灯映得方寸之地温软如春。她盘膝坐在软榻里侧，正低头替他缝补那件在秘境里被剑气割裂的袖口，素白指尖捏着引魂针穿行在玄色云锦之间，一缕未束起的乌发顺着颊边滑落，随她穿针的动作在灯影里轻轻晃动。见他掀帘进来，发梢还带着湿漉漉的寒气，她手中针线微顿，抬眼嗔怪地睨了他一下：“怎生连个净水诀都懒得掐，就这么湿淋淋地闯进来？想来是外头哪位师妹的伞打得不够偏，才叫你淋成了这副落汤模样。”
  嘴上虽带着三分微酸的调侃，她却顺手将补好的外袍搁在膝头，自己往榻里挪出大半个空位，又拈起干燥的素帕朝他招了招手。待他顺势在榻沿坐下，她便自然而然地欺身凑近，隔着一寸距离替他细细擦拭发梢，温热兰息随着抬手的动作一下下拂过他耳廓与颈侧。擦到一半，她指腹触到他后颈一道浅浅的血痕，动作骤然停住，原先那点促狭笑意瞬间散尽，眉尖轻轻蹙起，声音也跟着压低了三分：“白日里问你，你还拿话敷衍我，说未曾伤着分毫。转过身来，今夜若不把这处伤口让我用灵力温养妥帖了，你休想安生合眼。”
