[机制] 灵台心象·紫府道景与本命道契

【灵台心象·紫府道景】神识具象·至纯本心
定位: 金丹以上修士随平生执念、道途因果、性情骨相与灵根, 在紫府识海自然辟化之本命心界。
心迹显形:
- 外饰万般, 本心无欺; 平生所历之劫、未了之愿皆化景中草木山川、日月雷泽。
- 同执杀伐, 护生者显万家灯火, 怀怨者化焦土残阳, 绝情者成万丈寒潭孤峰; 同修生机, 仁济者现杏林春霖, 逆命者育枯荣双生木, 绝望者聚幽冥沉潭。
境界演进:
- 丹婴孕景(金丹/元婴): 凝道景雏形, 元婴坐镇主峰枢纽万邪不侵, 斗法引异象加身。
- 域照大千(化神/大乘): 道景虚影直接投影现世虚空, 移天换地化主场法域, 凝天地法相。
- 劫真化界(渡劫/仙道): 历雷劫化半步真界; 证仙则蜕为不朽仙域, 一念辟万界。

【本命命修·器灵镇景】
命器连心: 本命精血与神识温养之物(飞剑/灵宝/阵盘/神物)即紫府道景之定岳镇物, 器利则神慧, 器碎则识海崩塌。
器灵双途:
- 后天化灵(心血相生): 法宝随精血道韵孕灵; 初显寸许仙童或幼兽(灵雀/稚狐/玉兔), 随位格蜕变可长成亭亭人形; 栖道景吞吐道韵, 伴主嬉戏守丹台, 临敌破空护命, 遇主情动则羞隐鞘中。
- 先天化真(造化通神): 太古神物或造化至宝所孕真性(如双鱼古玉化灵虞汐颜); 具独立人形肉身与圆满道则, 出可随身征战红尘, 入可坐镇道景枢纽。

【同参道契·双景相系】
道印双景: 缔结「同心道誓」且情深意笃之际, 神识熔铸「同参道印」, 双方道景交感映照, 深处自发孕生对方之本命意象(如寒山点缀桃花、冰海生出暖阳)。
同契神效:
- 道韵互哺与共劫: 随情缘自发流转生机、水德、剑心或古妖通感, 双修灵台互照大减破境瓶颈; 渡劫互分天威, 濒危生万里灵觉并以本命精气吊魂; 深爱共命可引双人命器道景合璧, 爆发越阶绝杀或虚空绝命护持。
- 涉境破障救心: 一方陷心魔幻障、道景天崩地裂风雪呼啸之际, 缔契道侣可持印神念强入其紫府道景, 穿过心魔劫煞寻其本心, 拥其神魂重定乾坤。

