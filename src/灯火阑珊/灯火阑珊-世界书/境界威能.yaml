<Cultivation_System>
[境界威能总纲]
凡界九境、仙道三境，共四十八级。大境界之差是肉身、神魂与法则位格的质变，并非灵力多寡的线性差距。

[道争裁决]
1. 不掷骰、不计算概率；依次裁决：境界位格＞已建立条件＞明确克制＞主导权与场域＞主动代价。依据相当便相持、交换代价或暴露破绽，不随机定胜负。
2. 跨大境界存在质变，低境界的常规功法、技巧与数量不能逆转；达到相应位格的外物可生效，但必有反噬、损毁或暴露风险。收敛威压只便于接触，不削去真实位格。
3. 同境以五阶态势推进：敌方压制→敌方占先→相持→我方占先→我方压制。普通交锋最多一阶；只有既有铺垫、明确克制与显著代价/底牌同时成立，才可两阶或进入决胜。
4. 目标可为击杀、擒拿、夺宝、护送、拖延、破阵、逼退或脱身；杂兵可一轮解决，重要对决通常经3~6次关键交锋。难度只决定遭遇压力，不另设概率裁决。
5. {{user}}不会死亡；致命败局须转成合乎因果的负或脱身，并留下重大且可追踪的代价，不得借护命强行反胜。

[威能尺度]
下列为受控斗法中的常见表现；全力无约束释放只代表理论上限。化神以上的同阶大战通常移入洞天、虚空或阵界，只有双方真正放开压制时，才必然出现天地异象、空间破裂与法则扭曲。

[凡道九境·Rank 1-36]
1. <练气>：引气入体，淬炼肉身；可御器短途，以一敌百。
2. <筑基>：灵力化液，道基初成；可破军攻阵、削平山头。
3. <金丹>：精气神凝为一丹，神识十里；全力可毁大城、击溃凡俗国度的核心防线。
4. <元婴>：神魂质变，元婴出窍；遁行迅疾，一人镇国，低于元婴者数量再多亦难破防。
5. <化神>：元神合一，借御天地之力；可移山填海、短暂撕裂空间，对元婴及以下形成法则级压制。
6. <炼虚>：身合虚空，虚实互化；可开辟芥子、引动广域天灾，无约束久战足以酿成大陆级灾变。
7. <合体>：法相、本尊与元神相合；以法相或元神本源为锚可滴血重生，一念改易一域天象，全力相争可动摇小世界根基。
8. <大乘>：道体初成，有限度触及因果、时间与空间；可毁洞天、裂界域，凡境低阶攻伐无法触及其护体道则。
9. <渡劫>：承载部分天道权柄，直面飞升大劫；乃凡界战力极限，全力可威胁界壁与一方天道秩序，却不能随意覆灭整个三界。

[仙道三境·Rank 37-48]
仙道以仙元承载法则，通过参悟、融合与衍化大道破境。
10. <真仙/天仙>：法则之体。身融一脉法则，可剥夺区域内对应法则；凡境能量攻伐无法触及其真身。
11. <仙王/仙君>：大道之主。超脱单一法则，自身即所执大道的概念化身，可修改事物的存在定义；真仙及以下的常规法则受其统御。
12. <仙帝/道祖>：天道化身。意志可改写现实、开辟世界或终结纪元；仙帝仍是一纪难见的极数，并非仙界常态。

[仙凡与降临]
- 仙界位于凡界三界之外，渡劫圆满者重塑仙体后方可飞升。
- 仙人真身对凡境拥有绝对位格压制，斗法表现为法则剥夺、因果抹除与概念修改，而非灵力对轰。
- 投影、化身或自封仙元者，只按当前实际承载的境界发挥并承受伤害，不把真身的绝对免疫带入凡界。
- 具体神通见《神通体系》；突破、雷劫见《修仙法则》；界域与降临代价见《世界空间结构》《大能约束与护道边界》。
</Cultivation_System>
