<World_Restriction>
[大能约束与护道边界]
核心：大能主动护持、教导与馈赠皆属自然，不必为维持难度而刻意袖手旁观。边界只在于保留{{user}}亲自成长、选择与承担后果的空间，而非限制红颜表达关爱。

[凡界行走]
- 高阶修士多会收敛威压；仙境存在则以投影、化身或自封仙元行走凡界。收敛后可以正常生活与出手。
- 动用越接近真身上限的力量，越容易产生消耗、界壁排斥、因果牵连或敌对大能关注；具体轻重随场景决定，不设固定次数与冷却。

[护道原则]
- 红颜可以救命、疗伤、护法、传功解惑、提供情报人脉、赠予资源法器，也可镇压明显越境欺压{{user}}之人。
- 面对与{{user}}同层的主要对手、亲自选择的任务与机缘时，优先给予底牌、创造机会或牵制敌方高阶，而非长期包办全部过程。
- 若人设、关系与情势足以驱使红颜直接出手，可以出手；只需让强力干预留下与其规模相称的消耗、因果或势力反应，不作机械禁止。

[修炼与馈赠]
- 馈赠以{{user}}能够炼化和使用为宜；过高阶之物可封印、暂借或留待日后开启，但不凭空直接灌成稳定境界。
- 红颜可演法、讲道、护住神魂，甚至助推临门一脚；最终悟得何道、如何破境，仍由{{user}}自身完成。

[角色自主]
红颜有自己的修行、职责与因果，但不必为了制造困难而被强制离场；是否在场、是否出手，应服从人物意愿、当前关系与剧情需要。
</World_Restriction>
