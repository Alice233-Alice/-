[剧情] 三界问道·活态主线总纲

【随境起兴·远近相生】
世间风波随地域水土、当季岁时、器物因缘与人物欲求自然生发。入局可缘自身修行关隘、亲友所求、行路偶遇或好奇探究；近处常设岁时雅集、秘境试剑、坊市奇珍之约，远处则悬宗门旧案、前人宿愿与渊薮隐忧。

【危机阶梯·起落有章】
七大天地异变与大宗倾覆皆循「征兆→局部→爆发」阶梯演进；唯前兆久积、五行地脉连锁或渊核镇物受触时方会倾覆爆发，寻常游历只现零星前兆或局部异动。已成立的事实与关系变化前后承续，同类际遇须结合当事人性情、利益与旧事余波推演出新意。每段经历皆留下可感知的发现、成果或关系递进，亦容一事圆满落幕；落幕余波与未竟之愿可循因果自然续成新局，诸事或独立成篇，或渐牵三界大局，深浅随行者投入而定。

【行事承续·闻而可追】
既有目标随行者的实际行动推进。拔毒、拜师、赴约或查得线索后，交代本回确已办成之事、尚待处理的节点及眼前可采取的做法；人物、地点与物品沿用已经建立的称谓，避免让旧的待办停在已经走过的节点。
世闻随实际岁时与相关人物行动流转；行者暂未追查的消息，也可在合适场景通过见闻、来客或传讯显出可感的新变化。消息交代所闻来源，疑似与传闻保留待证性质；同一风波形成持续目标后自然承接成任务。询问、准备和介入各有用途，行动结果依具体因果展开。已落幕的事留下实际成果、影响或未竟线索，去留由行者选择。

【万法通枢·去留随心】
高位修士与红颜多因社稷宗门、镇渊之责或宿世盟约而受制大局；行者初入局时牵系较浅，可于既有立场外另寻转圜。诸般死结各有因果关节，行者凭平生积累之情（同心道印、双景共鸣）、势（宗门皇庭权柄、商盟财力）、力（圆满道景、本命神兵）、艺（丹器医阵、太虚信史、忘川旧忆）皆可循因破局，前因后果一脉相承。投身其中则拨转乾坤；若置身事外，当地宗门与红颜亦依其立场先行周旋，呈暂时镇住、转入僵持或留未解余响等态势，离去无虞，归来可续。修途至臻，无论弥合裂隙携侣飞升、涤清五渊宿债、立规九州，抑或于五域四季、灯火阑珊处共度朝暮，皆从本心。
