# 古风修仙文风：太史春秋·铁画银钩风

一、字骨与句度·铁画银钩:
  - 去脂留骨: 取《史记》之雄浑筋骨与柳宗元山水记之清峭简净。洗尽浮艳辞藻与空洞感叹，废除“极其、无比、分外”等虚浮程度词，全凭精准的名词与凝练的动词立起画面。字字如刀刻石碑，棱角分明，求实求准。
  - 长蓄短断: 句式讲求“千钧蓄势，一字立断”。铺陈环境与态势时，以沉稳绵长的分句层层压下；及至气机落定、心意决断或动作收束处，骤然收为二至五字短句，如铁锤砸砧、棋子落盘，于顿挫间生出刚劲力道。
  - 金石质地: 写物重其分量、纹理与岁月苍茫感。玄铁之沉、青石之冷、古木之糙、松火之烈，皆以坚实触感入文，忌轻飘粉饰。

二、气场与蓄势·渊渟岳峙:
  - 以静压动: 最高明的张力在于静默。越是暗流涌动、机锋相对或心绪翻覆之时，笔触越发克制内敛。善写风声骤歇、灯焰微偏、衣袂垂落、目光相抵的半息停顿，借天地万物的静默衬托人物内里的万丈波澜。
  - 形骸见骨: 摒弃琐碎小动作，专抓人物的脊梁气度、站姿坐相、步履轻重与执物分寸。立则如孤松临崖，坐则如古钟镇殿；仅凭一记抬眸、半寸按指或拂袖转身的沉凝仪态，便将其修为底蕴与威仪气魄自然托出。

三、声口与留白·片言居要:
  - 言简意重: 台词忌拉杂拖沓与絮叨解释。人物开口必切中肯綮，或直指人心，或一诺千钧，或冷隽反问。话音落处干脆利落，留三分余威在言外，不作半点试探扭捏之态。
  - 动静相咬: 对白与旁白严丝合缝，随气机流转自然嵌合。常以一记沉稳动作起势，话音居中如金石掷地，末了以环境回响或器物定格收尾，忌单调排布。

四、行文净律·大巧不工:
  - 修辞禁令: 禁脂粉俗艳之词；禁一惊一乍的浮夸烘托（如“倒吸一口凉气、恐怖如斯、震耳欲聋”）；一喻既立，不叠二喻；禁现代词汇与网络语态。
  - 句词禁令: 全文不用破折号；不用先否定后肯定的折转句（没有…而是…/非…实乃…/不似…反倒…）；省去“此时、片刻之后、旋即、随后、随即、紧接着、忽然、须臾之间、说话间、只见、但见、倒是”等过渡赘词；禁“比……强/高明多了”等拉扯旁人旧境的比较句。

五、行文范例（注意静默蓄势与铁画银钩的顿挫力道）: |
  朔风卷雪，漫山竹海尽数低伏。孤亭立于绝壁之畔，四面云海翻涌，唯石案上一豆灯火凝定不摇。她端坐北首，宽大玄衣顺着石榻垂落阶前，双眸微阖，呼吸与外间天地风雪混作一处。待来人踏上石阶，震落满肩寒霜，她方才开阖眼帘，目光自对方微乱的衣襟上一掠而过：“北邙山风雪封路三日，你竟能准时赴约，足见道心未锈。”
  亭外风声骤歇，积雪压枝之声清晰可闻。她未曾起身，只探出右手，自乌木棋罐中拈起一枚黑子，悬于纵横十九道的残局上方。指尖落定的一瞬，清脆金石声在空亭内回荡，石案四周三尺内的落雪尽数被无形气机震成细碎琼粉，顺着亭阶簌簌滑落深渊。她收回手，指腹缓缓摩挲着粗陶酒盏边缘的旧裂纹，抬眸直视过来，声线沉静如渊：“这一局棋我已候了你半月。坐下饮了这盏热酒，且看你今日落子，有几分破局的魄力。”
