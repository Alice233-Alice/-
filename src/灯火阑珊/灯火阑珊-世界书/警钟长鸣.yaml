---
标题: '警钟长鸣｜阶段人设写作的禁与戒'
用途: '撰写或修改任何红颜的阶段卡（陌生期、好感期、心动期等）之前，先通读本文件，避免重犯。'
句式禁令:
  - '全文禁用破折号；需要停顿时改用句号、分号或另起一句。'
  - '禁用"不X不X"四字连用，如不惊不赶、不近不远、不贪不慢、不碰不议；一律改成具体动作描写。'
  - '禁用"不是…便是/是…"句式。'
  - '禁用"旁人…他倒好…"的对比写法，刻意抬高{{user}}会显得做作。'
  - '同一效果词不得反复使用（如反复用"怪"形容{{user}}），那是路径依赖；换个角度重新写。'
  - '避免排比句连用（如"星泪是…渊露是…星辉草是…"），句式要长短交错，读起来才有起伏。'
对白要求:
  - '对白句子要短，多用句号、分号、冒号，避免逗号密集，读起来才顺。'
  - '对白禁止"报菜名"：逐件列货、逐项报价的推销腔一律重写。'
  - '台词和行为必须经得起"为什么"的推敲；不给角色安硬凑的提问与动机（如"此物自哪颗星坠落"）。'
  - '场景要有有机理由，不能为了制造相遇，让角色去做不符合身份的事（如云雀妖专程出山摆摊卖天渊之物）。'
结构与内容:
  - '【阶段解析】只讲事，【心音暗吐】只讲心；两段不得重复叙述同一经过，也不得过度描写。'
  - '妖类红颜必须把妖性写进场景：原形、本能（盘旋、衔物、歪头）、居地、生计；不能写得和普通人类无异。'
  - '情志特质等标签字段要收敛，不堆砌词藻。'
  - '已定但暂不启用的设定只记不用，不得擅自写入角色文件。'
设定联动:
  - '先定世界设定，角色内容再直接取用；不要先编角色细节，再回头对世界硬凑。'
  - '地理必须与地图一致：天渊在九天之上；其下西庚区域是禁地；云雀族居渊气初生之地；山外安全区几乎无渊气。不得写"天渊外围"等歧义地点。'
  - '阶段必须连续：陌生期埋下的种子（物、声、约、边界），后续阶段要回收兑现，不得突然跳变。'
  - '改动总人设或世界书前，先对照检查是否冲突，再落盘。'
  - '妖族角色不写灵根，以血脉为本；唯云雀一族例外：金丹化人形之时随人形而生人类灵根，与血脉本命相合。血脉必须有明确功能，也要写明边界，不能只有名头没有作用。'
交付方式:
  - '对话中展示草稿用普通段落，不用YAML代码块，避免横向滚动。'
