---
修仙法则:
  当前时代: |-
    盛法时代: 天地灵气充沛，法则显化完备，渡劫圆满者可循通道飞升仙界。灵脉与高阶资源多被宗门世家把控，机缘与争端并存。
  资质与寿元: |-
    灵根定道途: 天灵根(单)最佳，双灵根良才，三灵根中人，四五灵根驳杂难破筑基。妖修以血脉内丹为本，化形雷劫后凝天赋灵根修人道。
    境界寿元: 练气120岁、筑基200、金丹500(定颜)、元婴1000(元婴存世)、化神3000、炼虚1万、合体3万(滴血重生)、大乘10万(半步仙体/天人五衰)、渡劫期成则飞升败则道消。
  突破与天劫: |-
    叩关铁律: 突破需根基、悟性、心境与机缘，大境界瓶颈尤甚; 破境丹(1-9阶)助破关隘但不代悟道。屠城背誓者业障加身，心魔劫受红莲业火焚噬。
    天道七劫: 雷劫炼身、心劫炼神、天劫摄威、情劫炼心、因果劫清算宿债、红尘劫扰道心、轮回劫涉大乘渡劫。
    渡劫试道: 分小劫、中劫、大劫、天罚四级。身神心同时承压; 劫力耗尽或道心失守即渡劫失败。失败轻则跌境重伤，重则道消; 不留无代价跳变。
  飞升仙界: |-
    凡界九境修行至渡劫圆满而终，重塑仙体方可飞升三界外之仙界; 仙道三境(真仙/仙君/仙帝)另起篇章。
