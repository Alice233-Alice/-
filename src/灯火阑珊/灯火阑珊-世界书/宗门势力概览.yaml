  【天下宗门概览】五域道统交锋在于根本大义：正道立秩序庇护苍生，魔道任本心生死由命，中立恪守铁则各取所需。

  一、中土神州 (王道气运与仙道中枢)
  - 大夏仙朝【超大正道·皇极运朝】：融千万修士与黎民于一体之万古皇庭。修人皇气运与天道律令，禁修士欺凡，视魔道为乱纲逆贼。(红颜南宫云裳出身)
  - 忘机剑庐【超大正道·剑心通明】：天下正道剑修极巅。不涉权谋，一剑破万法，遇魔拔剑唯从剑心澄澈，与西庚无生剑派为宿命死敌。
  - 太岳承天宗【一流正道·肉身成圣】：祖脉体修大宗。引玄黄地煞锻骨，信奉肉身载万物、定八荒。
  - 九幽炼魂宗【超大魔道·魂者为尊】：蔑视肉身皮囊，引魂入幡视作超度永存之路，视凡尘万灵为炼幡魂料，与大夏仙朝水火难容。
  - 万象森罗坊【天下中立·商道为公】：天下首商，坐拥万千商轨。唯奉等价契约，不涉善恶正邪。
  - 太虚蜃楼【隐世中立·冷眼信史】：掌天机信史，恪守绝不干预红尘因果之誓，留档可作五域公论凭据。
  - 千机诡市【超大魔道·暗面诡市】：森罗坊暗面，专贩致命隐秘与暗桩黑渡，专以残酷真相崩解虚伪道心。

  二、西庚金域 (杀伐铁则与魔道皇庭)
  改写： - 琼轮垂曜宫【超大魔道·月照万象】：魔道第一女帝朔望舒统御七殿十二堂。以月光织就谍网，洞悉天下隐秘，执五域半数暗杀谍报；任群魔随心竞逐，唯逆女帝心意者无声抹杀。(红颜朔望舒、朔璃鸢、婵织烟所属)
  - 藏锋敛锷山庄【超大正道·以利养和】：执天下金矿商脉。重金谈和，利刃诛绝，资养西庚散修抗衡魔威。
  - 折戟沉沙谷【一流正道·同命战阵】：古战阵遗脉，神意同调，结阵共命，生死托付同袍。
  - 无生剑派【极道魔道·大悲剑途】：西庚唯一纯粹剑宗。信世间皆苦，出剑极悲，视杀戮为赐人解脱，与忘机剑庐正面死磕。
  - 尸骨浮屠塔【一流魔道·死蜕不朽】：聚强者骸骨炼化不朽傀儡，常于暗处狩猎正道天骄。
  - 青羽云雀(天渊之鸟)【太古神禽·云栖强族】：雄踞西庚高海拔飞雪崇山之巅「云栖浮石境」，直面头顶宏伟凶险、日夜倾泻狂暴渊气之天渊裂隙。族人骨肉如铁，执掌虚空折叠、空间道纹与灵渊正逆转化之术，正可纳九天狂暴渊气化为温润灵机以辟四季如春之圣境、替西庚挡去灵暴，逆可转寻常灵气为狂暴渊气御敌，于西庚主场作战更如虎添翼。族裔偏重雌性而阴阳和睦、上下同心，上有渡劫古祖羽苍溟坐镇雪巅，中有大乘掌族大长老羽含章与合体护法长老羽千钧统御，战力惊世，无惧现世任何超大仙门皇庭，五域正魔巨擘皆执礼敬让。(红颜羽岚所属强族，当代圣女兼族门行走)

  三、南炎火域 (铁血前线与烈火熔炉)
  - 昭明破阵宗【超大正道·铁壁丹心】：神州南门枪阵要塞巨擘。世代血战抵御炎渊魔潮，门风刚烈，专事守护后方生民。
  - 蚀月血海宗【超大魔道·真性无伪】：盘踞地火深渊，信奉弱肉强食与吞血真性，极厌伪善，与昭明破阵宗为千载血仇。
  - 大冶天工炉【顶尖中立·铸道通天】：炼器圣地，唯求神兵造物极境，不问买家来路。
  - 劫灰神祠【一流中立·苦行澄心】：苦修之所，信万物焚尽方见真纯，借烈焰锻去心中杂质。
  - 赤霄阁【极道魔道·力极通玄】：居雷暴海极渊浮空崖，引雷淬体修极道血雷重刃，崇尚力极证道。(红颜沈倩宁所属)
  - 渊火灵族【古地异族·炎灵自生】：地火岩浆所化，视领地为躯壳，侵入者必遭烈焰焚灼。

  四、东苍木域 (生机延绵与仙宗雅境)
  - 苍木龙吟阁【超大正道·御兽镇陵】：东苍正道旗帜。世代镇守青帝陵，精通木法御兽，誓死庇护东苍生机。
  - 浮云朝露阁【顶尖正道·风云仙商】：九天浮岛雅宗，执掌东苍商盟与灵植要道，精于罡风弓术与音律幻术。(红颜安迟迟为首座大师姐兼领灵枢监法)
  - 灵枢百草谷【顶尖正道·悬壶济世】：医道之首，救死扶伤，知晓医毒同源。
  - 镜花水月庵【一流魔道·红粉道途】：纯女修宗门，以情欲契约照见本心，严守自愿双修，痛斥强夺采补。
  - 遗誓林【隐世异族·守誓为道】：青丘古狐遗脉，以信诺织林，背誓者体内自生誓棘，唯辨真伪不拘正邪。

  五、北冥与幽界 (水极归寂与轮回死境)
  - 坐忘冥海阁【超大正道·玄冥静极】：潜修深海千载，恪守静笃，出招若冰川倾覆，水克火制衡南炎蚀月血海宗。
  - 泣珠幻海庭【四海异族·遗梦鲛宫】：北冥鲛人遗族，富甲四海；归墟神女沉眠地，水族王庭永恒信仰。(红颜许听雨所属)
  - 彼岸提灯人【幽冥正道·生死守界】：黄泉引渡者，柔抚游魂，铁锁缉捕夺舍还魂之人，护卫晚棠摆渡梦境。(红颜晚棠护道卫宿)
  - 无间轮回道【超大魔道·度灭大千】：视现世为苦海，图谋凿穿轮回井颠覆现世轮回，与提灯人为死敌。
  - 渡厄幽帆【幽冥中立·无言摆渡】：行舟幽冥险水，渡人渡魂，渡资唯取内心至珍之物。
  - 忘川风月楼【幽冥中立·记忆寄宿】：黄泉销金窟，可换诸般体验，唯押真实记忆为资。

  【宗门互动与生态法则】
  - 职级位格：遵循《[规则] 宗门阶位与职级约束》，超大巨擘宗主必在合体及以上，小门派元婴方可执柄。
  - 冲突机制：低阶修士争夺天材地宝易决生死；涉宗门高层时以利益交涉求取均势，唯道统根本颠覆、存亡之危下方启灭门征伐。
