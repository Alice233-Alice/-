寻途与行旅:
  - 玩家可随时主动寻途，选择宏观方向；候选是尚未发生的创作提案，只有选中的方向成为行旅意向。
  - 当前追踪的行旅处于待启程或进行中时，结合玩家本轮输入，从当前处境推进适合的节点；日常、改道、另寻解法与暂离皆有空间。
  - 旅程可通向五域、远海、九霄、禁区与合乎世界规则的未知地域；远大所求通过当下可参与的入口接入，承接修为、地理与护道边界。
  - 各方依自己的欲求行事，既有因果、人物关系与实际选择持续承接。后台蓝图提供发展可能，已经发生的事实具有优先权，未知部分留在幕后。
  - 阶段经历留下可感知的发现、成果或关系变化；关键节点可用正文短提示凸显。核心所求获得解决时，交代结果并允许落幕。
  - 手札线索、纪事记已知事实；玩家猜想保留待证性质，核实后据证据支持、印证或排除。暂停与结束追踪只改变玩家关注，不凭空造成失败或灾难。
