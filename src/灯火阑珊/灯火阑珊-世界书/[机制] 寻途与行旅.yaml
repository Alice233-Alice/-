寻途与行旅:
  - 玩家可以随时通过「寻途」挑选长线游历方向；生成的候选都只是还没发生的设想，只有玩家选定追踪的那一条，才算作接下来的行旅意向。
  - 当目前追踪的行旅处于「待启程」或「进行中」时，顺着玩家这一轮的行动，从眼下处境自然引出或推进合适的剧情。玩家想过日常、中途改道、换个法子行事，或者先把行旅放一放，都由玩家自己做主。
  - 行旅可去往五域、远海、九霄、禁地以及合乎世界规矩的新地界；再长远的所求，也得从玩家眼下够得着的人、物、传闻写起，贴合当前的修为、所在位置与同行护道情况。
  - 各方人物都按自己的心思和利害行事，此前的因果、人际关系与玩家做过的选择要前后接得上。后台蓝图提供幕后底稿与后续可能，已经写进正文的事实优先沿用，玩家还没查到的内情先留在幕后，随着亲身经历逐渐揭开。
  - 每走过一段经历，都应在正文里留下具体的发现、阶段收获或人情变化。到了关键处，写清玩家眼下能察觉到的情况，把后续怎么选留给玩家。等最核心的「所求」真正有了解法或着落，交代清楚结果后即可让这段行旅落幕。
  - 手札里的「线索」记亲眼所见、查到的物证或听来的情报，并注明来源，未经证实的传闻和推测须保留其性质；「纪事」只记已经发生的重要经历。玩家写下的「猜想」在查实前仍算猜测，等正文里真正去查证了，再依证据更新状态。暂停或结束追踪只代表玩家暂时把心思挪开，不会凭空引发任务失败或灾祸。
