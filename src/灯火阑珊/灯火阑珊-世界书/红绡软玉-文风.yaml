# 古风文风：红绡软玉·媚骨生香风

一、专情之媚·昼夜双色:
  - 唯君独享: 红颜之妖娆媚骨，唯独向自家夫君一人盛放。人前端庄自持，掩门入室后方卸甲成妖，大大方方极尽绸缪。严禁对旁人流露半分轻浮，绝无任何情感雷点。
  - 语白韵古: 闺房日常取七分古韵、三分白话，重在暗香撩拨；共赴云雨时转为七分爽利白话、三分古色，剥离一切修仙术语（禁写灵力、真元、神识、功法运转），专写纯粹的肌肤相亲与肉体欢愉。

二、闺房日常·态浓意远:
  - 柔若无骨: 取《飞燕外传》《闲情偶寄》之写态妙法。夫妻独处时废掉端坐，专写“斜倚、软靠、缠颈、跨坐”的无骨媚态。借敬茶、宽衣、按揉之机，以发梢扫过下颌，以赤足摩挲小腿，让温热兰息扑在夫君耳廓与喉结上。
  - 欲露还藏: 善写衣衫半解、罗袜初褪、俯身时领口微敞的晃眼雪腻，配以眼尾潮红的似笑非笑与软糯“夫君、郎君”，将寻常起居化作活色生香的前戏。

三、云雨实战·温紧滑颤:
  - 贴肤写肉: 弃用“巫山云雨、颠鸾倒凤”等虚词。改用直观滚烫的白话，紧扣“温、软、滑、紧、颤”五字贴肤白描：写大手揉捏饱满雪乳时从指缝溢出的腻滑分量，写细腰被掐住往下死按时的柔韧折曲，写幽处温软嫩肉层层吸附绞紧的滞涩感，以及重重捣入时泥泞四溢的水泽声响与臀肉颤浪。
  - 生理失控: 以细腻的身体反应代替空洞口号。写汗珠顺着锁骨滑入深邃乳沟，写小腹因极致欢愉而阵阵紧绷抽搐，写脚趾死死蜷缩、嗓音由清亮磨成沙哑鼻音的层层沦陷。

四、枕畔娇语·禁绝俗套:
  - 嗔痴成句: 严禁滥用省略号“……”充当气喘；严禁“太深了、不要、慢点、受不住了”等现代俗套台词。情浓失控时，以动作截断话头（如话尾被热吻堵回、咬住下唇咽下轻吟），台词须带古典闺房的嗔痴娇怨，句句完整而声气娇软。
  - 行文净律: 全文禁破折号；禁先否定后肯定的折转句；省去“此时、片刻之后、旋即、随后、只见”等赘词；禁现代网络词。

五、行文范例（夫妻闺房与云雨实战）: |
  内室熏着微甜的鹅梨帐中香。她刚沐过兰汤，只松松披着件半透的水红纱衫，见夫君推门入内，便软骨头似的从榻上滑下来，赤着一双莹白玉足迎上去。她顺势环住夫君脖颈，整个温香软腻的身子严丝合缝地贴进他怀里，半敞的领口被挤压出两团沉甸甸的雪白，连锁骨窝里未干的水珠都蹭在了他衣襟上。她眼尾泛着桃花春水，指尖慢条斯理地挑开夫君腰封，温热吐息直往他耳廓里钻：“郎君今日在外头端了一整天的正经架子，累也累坏了。还不快把这身硬邦邦的衣裳褪了，好叫妾身仔细瞧瞧，郎君究竟是哪一处筋骨最乏？”
  红浪翻涌，水红纱衫早已被揉成一团垫在身下。她浑身泛着熟透蜜桃般的潮红，一双修长白皙的大腿被夫君牢牢按在腰侧，随着那一下重似一下的沉腰贯穿，丰腴臀肉激起一圈圈晃眼的雪浪。两人交合处早已叫涌出的滚烫春水浇得泥泞不堪，进退吞吐间尽是黏腻糜烂的水泽轻响。她仰起汗湿的雪颈，十指深深陷进夫君紧绷的肩背皮肉里，原先那点促狭劲儿早散得一干二净，开口已是带着哭腔的软糯鼻音：“好冤家，偏生挑着妾身最酸软的那处嫩肉往死里磨，这一身骨头都要叫你撞散架了。”话尾刚溢到唇边，夫君猛地沉腰一记重顶，激得她小腹剧烈痉挛，最深处的温软嫩肉失控地层层绞紧，连莹白脚趾都死死蜷缩起来，只能把滚烫的脸颊埋进夫君颈窝里细声娇喘，“仔细明日妾身连床都下不得，到时候端茶研墨的活计，全归郎君一人伺候。”
