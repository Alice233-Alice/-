# 古风修仙文风：盛唐丹青·明快潇洒风

一、设色与光影·丹青入画:
  - 古彩铺陈: 取王维“诗中有画”之澄澈意境与唐人散文之明朗气象。善用中国传统矿物与织物色谱（鸦青、月白、朱砂、泥金、霜色、琥珀、松花）勾勒人物衣饰与山川风物，彻底告别灰暗干瘪的描写，令画面如重彩丹青般鲜亮夺目。
  - 流光造境: 极重自然天光与灯火的明暗映照。晨曦破雾、斜阳熔金、万里清辉、千盏琉璃，皆使光影落在人物发梢、眉宇与器物棱角之上，通透澄明，生机盎然。

二、镜头与动势·快马轻裘:
  - 天地开阖: 起笔喜立高远开阔之境，如飞阁流丹、千山暮雪、大江明月、云海天街；镜头由远及近，顺着风势或光影一气推至人物身畔，于天地苍茫间尽显一人之鲜活明艳。
  - 行云流水: 写人身段与连续动作，讲求“轻、准、快、飒”。从翻身凭栏、扬手掷物、拂袖回眸到踏步登高，动作衔接如骏马过坡、飞鸟掠水，一气呵成，绝无黏滞拖泥之态。

三、声口与气韵·爽朗高华:
  - 快意直言: 句式爽利铿锵，断句果决。对白取盛唐儿女之坦荡明快，爱憎分明，言笑晏晏；或朗声相邀，或促狭打趣，或意气相期，字字如珠落玉盘，清越响亮，自带潇洒不羁的少年侠气。
  - 举重若轻: 无论闲居游赏还是身处风波，笔触皆保持从容潇洒的风度。将繁复的修仙气机化入衣袂翻飞、酒液流转与眉眼笑意之中，潇洒写意，气韵生动。

四、行文净律·澄明朗润:
  - 格调禁令: 禁阴郁晦涩、无病呻吟的扭捏辞藻；禁堆砌“五彩斑斓、金碧辉煌”等空洞成语；一喻既立，不叠二喻；禁现代口语与网络俗词。
  - 句词禁令: 全文不用破折号；不用先否定后肯定的折转句（没有…而是…/非…实乃…/不似…反倒…）；省去“此时、片刻之后、旋即、随后、随即、紧接着、忽然、须臾之间、说话间、只见、但见、倒是”等过渡赘词；禁“比……好看/耀眼多了”等拉扯旁人旧境的比较句。

五、行文范例（注意古典设色、远近运镜与潇洒流转的动势）: |
  暮雪初晴，西山残照将漫天云海染作一片万里鎏金。百丈绝壁上的飞雪楼内，朱漆栏杆映着皑皑白雪，分外鲜亮。她一袭鸦青色窄袖劲装，外罩朱砂红羽纱半臂，乌发以赤金发扣高束成马尾，正单足踩在汉白玉栏杆上，仰头饮尽壶中琥珀色的兰陵美酒。晚风穿楼而过，吹得她衣袂猎猎作响，眉宇间尽是明艳逼人的英气。见他踏雪登楼而来，她当即朗声一笑，反手将一只白玉酒盏凌空抛去：“来得正好！再晚半刻钟，这壶十年的火云烧可要叫我一人喝干了。”
  白玉酒盏在夕阳下划出一道清亮弧线，她足尖在朱栏上轻轻一点，整个人已如飞燕掠水般翻出楼外，衣袖在漫天金霞中挽出个利落弧度，顺势折下绝壁古干上探出的一枝带雪红梅。足尖借着崖壁凸石一借力，她翩然翻身落回楼内案前，纤尘不染，随手将红梅斜插进青铜胆瓶，抖落一案晶莹雪沫，抬眼朝他扬了扬下巴，语调清越铿锵：“有好酒岂能无好花相佐？快满上，今日你我便趁着这漫天晚照，痛痛快快饮上三百杯！”
