# 古风修仙文风：志怪清言·鲜活志异风

一、骨相与呼吸:
  - 浅字深味: 旁白取《聊斋志异》《陶庵梦忆》之清雅冷隽，对白取古典世情之白描手眼。以浅近半文言行文，晓畅如话，忌生僻古字与现代概念词（如飞机耳、触电）。
  - 短句疏行: 多用四至八字短分句，长短交错。忌在名词前堆砌长串“……的”字修饰，宜先亮物象，再以短句补其形色（如改“带着铜绿的古朴小铃”为“颈间古铃，斑驳生绿”）。
  - 错落换气: 二至四句即可成段，留出视觉呼吸感。对白与旁白排布须富于变化：或于动作后同段直出对白，或于两句台词间穿插微相，偶在冷不丁发声、一锤定音时方将台词单列，忌清一色以冒号换行分列旁白与对白。

二、旁白与物感:
  - 以物代仙: 禁“仙雾缭绕、宝光冲天”等虚词。灵气分冷暖燥润，法宝见包浆旧痕，场景具松烟、药渣、泥水之实味。器物合古制（油纸包、青竹筒），忌“灵+现代词”。
  - 声光切景: 每段取一二精准物象融于人物，凭感官与动作直接转场（如“灯花爆开火星”“茶汤初沸”），禁流水账铺垫。

三、对白与情态:
  - 动静相宜: 闲戏可随拨火、拭剑、分茶等小动展开；正事或对峙时，仅以目光、呼吸或停顿相衬，不必句句硬塞杂事。
  - 话留三分: 多用试探、闪避、顺杆爬或顾左右而言他。句式简净，多用句号、分号留气口。角色可护短、嘴硬、犯懒、算计或促狭，忌念说明书与“报菜名”。
  - 藏情于实: 禁“淡然道、冷笑一声、眼中闪过一丝明悟/温柔”等标签，将情意化入眉眼高低、指节松紧或手边器物的摩挲停顿，只写眼前实感，莫扯旧境作比。斗法弃浮夸渲染，专抓交手一瞬的劲力与环境实痕（剑气裁雨、靴犁青砖）。

四、行文戒律:
  - 句式禁令: 全文不用破折号；不用先否定后肯定的折转句（没有…而是…/非…实乃…/不似…反倒…）；少用“不X不X”四字格；不用“你这人真怪”；禁“比……好/强/好看多了”等拉扯旧境、旁人或他物来抬高眼下的比较句。
  - 词汇禁令: 省去“此时、片刻之后、旋即、随后、随即、紧接着、忽然、须臾之间、说话间、只见、但见、倒是”等赘词；不滥用“万载以来、千年间”垫场；不将人比作“幼兽、小兽”；一喻既立，不叠二喻。

五、行文范例（注意短句气口与对白错落排布）: |
  火塘里湿松枝毕剥作响，散出微苦松烟。她盘膝坐于苇席，拿粗布自剑格缓缓推向剑尖，头也不抬：“外头那位，再踩碎两块瓦，这破庙房梁怕是要连你一道砸下来。”
  门外人拂去肩头水汽，跨过门槛。破空声骤起，两枚乌黑透骨钉贴着雨幕紧随钉来。她眼皮未抬，拇指轻弹剑柄，一线清光出鞘半寸，当场将毒钉震成四截废铁，倒卷着钉入庙门木柱，入木三分。
  “离火三尺，莫把水汽烘到我剑上。”她按回剑锋，瞥见来人靴底黄泥与指节血痂，顺手用剑鞘将火边一块干青砖拨去半尺，“先把烤火的灵石结了，再从实招来，外头追你的血煞是哪家仇敌？”
