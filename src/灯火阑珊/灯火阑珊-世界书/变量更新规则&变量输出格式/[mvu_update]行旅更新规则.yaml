变量更新规则:
  行旅:
    check:
      - '/行旅/当前追踪 与 /$行旅蓝图 由玩家在前端面板操作管理，切勿自行改动。只更新当前已存在的
        /行旅/旅程/{旅程ID}，具体旅程ID见当前变量。未选中的提案、还没发生的方向或幕后蓝图里的隐情，都不能提前当成事实写进变量。'
      - '顺着本轮正文的实际进展维护篇章、进展、下一步与状态：原本为「待启程」的行旅，在正文里真正踏出第一步、入局展开后改为「进行中」；篇章用简短词语概括当前阶段；进展简要总结目前查清的因果、定下的约定或拿到的阶段成果；下一步只写眼下顺着剧情值得去做的事。处于「暂歇」的行旅保留原记录，不自行续写进展；只有这趟行旅最核心的所求真正解决或有了着落时，才将状态改为「已落幕」。'
      - '正文里查出新情报、新物证或重要传闻时，insert
        /行旅/旅程/{旅程ID}/线索/{线索名}，值为{内容,依据,时地}，其中依据简要注明本轮正文里的证据来源，未经证实的传闻或推测需点明性质。遇到重要抉择、人物关系转折或阶段性结果时，用同样结构
        insert 到 /行旅/旅程/{旅程ID}/纪事/{纪事名}，只记关键节点，别逐轮记流水账。{线索名}与{纪事名}中禁止包含 / 或 .。'
      - '手札里玩家的「猜想」不会自动变成事实。只有本轮正文确实查证了某条猜想，才依结果将该猜想的状态更新为待核实、有证据支持、已印证或已排除，并在依据中写明本轮查到的凭据；本轮未去查证的猜想保留原状态。'
      - '关联任务与关联世闻只填写当前实际存在的任务ID与世界图志key；若本轮行旅推进同时带动了关联任务或世闻，需同步更新对应原变量。涉及的物品、灵石、修为、关系与奖励，仍在各自原有的变量系统里结算一次，不重复结算。'
