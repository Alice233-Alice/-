---
变量输出格式:
  rule:
    - '本文件只定义输出编码；字段何时变化、生命周期与事务联动由《变量更新规则》定义，两者共同约束同一次输出。'
    - '输出容器按本次请求选择：格式化输出只返回 {"analysis":"中文摘要","json_patch":[操作]}，不加 XML
      标签；工具调用使用规定工具；普通聊天输出在回复末尾使用一组
      <UpdateVariable><Analysis>...</Analysis><JSONPatch>...</JSONPatch></UpdateVariable>。下方 format
      仅为普通聊天示例。'
    - '推演摘要（analysis 字段或 Analysis/Analyze
      标签内的文字）是给玩家看的结算概括，必须只用简体中文，80字以内，人名沿用中文原名；只列实际 patch
      的变化及正文依据。禁止英文句子、中英夹杂、Y/N清单、格式讨论、翻译说明或思考过程；不得因接口字段说明使用英文而改写摘要语言。'
    - 'JSONPatch 必须是合法 JSON 数组；仅用 replace、delta、insert、remove，path 以 / 开头；每项只含 op、path 与必要
      value。只写本轮变化，禁止完整变量树、派生字段、空键、额外属性、注释、尾逗号或 Markdown
      代码块。英文键名、操作名和标签保留原样，自然语言描述用简体中文。'
    - '先逐类核对并输出事实变量的更新，最后输出 /当前处境 与
      /$可参与机遇。摘要提及的入库、移动、关系或任务变化必须有对应操作；正文已有变化时不能只生成处境与选项。不得为了增加条数编造变化。'
    - '等级仅用 replace 写绝对整数；突破成功时同组写剩余修为、修炼阶段、上次结果和最近突破记录。日常修为增长用
      delta，突破结算用一次 replace 写最终余额；同一 JSONPatch
      不重复操作同一路径。尝试突破、积累已足和盈余修为为只读信息。'
    - '红颜好感只 delta /红颜/{角色名}/好感度；关系上下文通常 replace 具体子字段（如
      /红颜/{角色名}/关系上下文/态度缘由）。确需整项替换时，value
      必须包含当前情绪、态度缘由、关系诉求、相处禁忌、未了约定五个字符串字段，禁止用字符串 replace 整个关系上下文。'
    - '新增羁绊纪事用 insert /红颜/{角色名}/羁绊纪事/{纪事名}；修订已存在的同名纪事用 replace 该条目，value
      均须含类型、摘要、时地。禁止字符串 value 或整体 replace 羁绊纪事。'
    - '任务进展使用字符串 replace /任务列表/{任务ID}/进度 与
      /任务列表/{任务ID}/下一步，仅写确有变化的字段；目标本身变化时才 replace 目标。'
    - '/当前处境 与 /$可参与机遇 每轮分别整项 replace。'
    - '任务关联使用关联人物、关联地点、关联物品字符串列表及关联事件ID；世闻可写来源、关联人物和下一步。任务回应提案填写关联任务ID，ID指向同组更新后存在的任务或事件。任务终局先写结果再写状态，_近期任务结果由结构只读归档。'
    - '可选字段在旧变量中尚不存在时用 insert 首次写入，已存在时用 replace 更新；这同样适用于任务的结果和关联信息，以及世闻的来源、关联人物、下一步。'
    - '/$可参与机遇 仅供前端；只有玩家最终提交的 input 会送入正文 AI。回应事件ID须为世界图志现有 key；新事件须 insert
      完整对象。'
    - '世界图志滚动上限为 3 条活跃事件 + 5 条近期结果；超限时同组 remove 最旧结果。'
  format: |-
    <UpdateVariable>
    <Analysis>青玉丹入库；丹香异变建档；处境与机遇更新</Analysis>
    <JSONPatch>[
      {"op":"insert","path":"/本尊/杂物袋/青玉丹","value":{"名称":"青玉丹","描述":"已购得一枚，同批丹药的药香有异，待查验。","品阶":"","数量":1}},
      {"op":"insert","path":"/世界图志/坊市丹香异变","value":{"状态":"活跃","阶段":"征兆","事件":"同批青玉丹药香异常，来路待查。","地点":"青石坊市","最近变化":"药铺开始复验库存。","可见影响":["同批丹药暂缓出售"],"参与情况":"旁观","影响等级":"微澜","更新时间":"盛法1年1月2日·辰时"}},
      {"op":"insert","path":"/任务列表/坊市寻丹源","value":{"名称":"坊市寻丹源","类型":"支线","目标":"核实同批青玉丹的药香异状与来路。","进度":"已购得青玉丹，听闻同批丹药药香有异。","下一步":"前往相邻药铺核对封蜡、药香与丹纹。","状态":"进行中","关联地点":["青石坊市"],"关联物品":["青玉丹"],"关联事件ID":"坊市丹香异变"}},
      {"op":"insert","path":"/世界图志/坊市丹香异变/来源","value":"坊市药铺近闻"},
      {"op":"insert","path":"/世界图志/坊市丹香异变/下一步","value":"在相邻药铺核对同批丹药的进货来源。"},
      {"op":"replace","path":"/当前处境","value":"你购得青玉丹，却听闻同批丹药的药香有异。"},
      {"op":"replace","path":"/$可参与机遇","value":[
        {"标题":"查验青玉丹","行动":"前往相邻药铺查验青玉丹的封蜡、药香与丹纹，并询问同批丹药的进货来源。","类型":"探索","叙事类型":"回应事件","事件性质":"回应已发生事件","关联事件ID":"坊市丹香异变","关联任务ID":"坊市寻丹源"},
        {"标题":"错送的药单","行动":"离开摊位时，伙计误递来一封配方异常的药单；先核对收件人，再追问药材来路。","类型":"探索","叙事类型":"事件行动","事件性质":"选中后成立","事件":"伙计误递来一封配方异常的药单"},
        {"标题":"静室调息","行动":"租用坊市静室，布置基础警戒后服丹调息，观察药力是否与经脉及当前修为相合。","类型":"修炼","叙事类型":"平淡延续","事件性质":"无事件"}
      ]}
    ]</JSONPatch>
    </UpdateVariable>
