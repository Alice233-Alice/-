---
变量输出格式:
  rule:
    - '本文件只定义输出编码；字段何时变化、生命周期与事务联动由《变量更新规则》定义，两者共同约束同一次输出。'
    - '每次回复末尾只输出一组 <Analysis>...</Analysis> 和 <JSONPatch>...</JSONPatch>，标签外不得解释变量。'
    - 'Analysis 限 80 字，仅列本轮需更新的字段与依据；未变化字段不写。'
    - 'JSONPatch 必须是合法 JSON 数组；每项只含 op、path 及操作需要的 value。'
    - '仅用 replace、delta、insert、remove；路径以 / 开头，字段名完全遵循 Schema。'
    - '只 patch 本轮明确变化；禁止输出完整变量树、派生字段、注释、尾逗号或 Markdown 代码块。'
    - '等级仅用 replace 写绝对整数；发生变化时按《变量更新规则》将等级、修为、尝试突破与修炼状态结算字段同组输出。'
    - '红颜好感数值的字段名固定为“好感度”。正确格式：{"op":"delta","path":"/红颜/{角色名}/好感度","value":3}；禁止使用不存在的 /红颜/{角色名}/好感。'
    - '关系上下文固定为对象，通常只 replace 具体子字段。正确格式：{"op":"replace","path":"/红颜/{角色名}/关系上下文/态度缘由","value":"因本轮援手而增加信任"}；禁止用字符串 replace 整个 /红颜/{角色名}/关系上下文。'
    - '新增羁绊纪事必须使用 {"op":"insert","path":"/红颜/{角色名}/羁绊纪事/{纪事名}","value":{"类型":"共患难","摘要":"本轮已发生的关键关系事实","时地":"事件发生的时间地点"}}；禁止把 value 写成字符串，禁止整体 replace /红颜/{角色名}/羁绊纪事。'
    - '/当前处境与/$可参与机遇每轮都整项 replace。'
    - '/$可参与机遇 的 value 是仅供前端展示的候选建议数组；$ 前缀使变量列表宏不向正文 AI 展示，只有玩家最终提交的 input 会送入正文 AI。'
  format: |-
    <Analysis>灵石支出20；青玉丹入库；处境与机遇更新</Analysis>
    <JSONPatch>[
      {"op":"delta","path":"/本尊/灵石/下品灵石","value":-20},
      {"op":"insert","path":"/本尊/杂物袋/青玉丹","value":{"品阶":"一阶上品","数量":1,"描述":"温养经脉"}},
      {"op":"replace","path":"/当前处境","value":"你已购得青玉丹，坊市人潮渐密。"},
      {"op":"replace","path":"/$可参与机遇","value":[
        {"行动":"带着青玉丹离开摊位，先在坊市僻静处查验封蜡、药香与丹纹，再向相邻药铺询问这批丹药的来路。","类型":"探索"},
        {"行动":"暂不离开摊前，借询问服药禁忌与保存之法试探摊主口风，并确认同批青玉丹是否还卖给过其他修士。","类型":"交涉"},
        {"行动":"前往坊市租用一间临时静室，布下基础警戒后再服丹调息，细察药力是否与自身经脉和当前修为相合。","类型":"修炼","提示":"服丹后需留时调息"}
      ]}
    ]</JSONPatch>
