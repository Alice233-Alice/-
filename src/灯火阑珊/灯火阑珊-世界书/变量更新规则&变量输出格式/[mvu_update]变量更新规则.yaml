---
变量更新规则:
  全局:
    check:
      - '只 patch 本轮明确变化，禁止为润色重写旧值；Analysis 仅概括 patch 可证事实，提及变化必须有对应 patch。'
      - '禁止 patch 派生字段：本尊.境界、本尊.突破目标、本尊.寿元上限、本尊.当前寿元、本尊.基础修炼效率、本尊.完整修炼效率、本尊.战力值、本尊.神通列表.*.威力等级、当前敌人.*.境界描述。'
      - '禁止 patch $地图锚点：该字段只由开场 initvar 或玩家配置，用来把浮岛、洞天、秘境等具体地点锚定到伪同层舆图母域；它不代表剧情中的移动，也不改变本尊.行踪.所属层级。'
      - '稀疏更新：世界时钟仅随时间推进；世界地图/世界图志仅随探索或事件推进；NPC图鉴仅在互动、观察或确认情报后；声望系统仅在势力关系确有变化时。'

  世界:
    世界地图:
      check:
        - '只增补本轮相关地点，不重写整图；危险度按 0安全、1低、2中、3高、4绝地。'
    当前处境:
      check:
        - '每次玩家行动后整项 replace；只写当前结论，20~50 字，不复述过程。'
    $可参与机遇:
      type: Array<{行动,类型,提示?}>
      check:
        - '$可参与机遇仅供前端展示，$ 前缀使变量列表宏不向正文 AI 展示；只有玩家最终提交的 input 才是正文 AI 可见的本轮行动。'
        - '玩家输入与某项语义一致时只执行该项，其他候选不得在正文、变量结算或 NPC 反应中同步发生；玩家自行编辑或另写行动时，以实际输入为准。'
        - '每次玩家行动后整项 replace /$可参与机遇；通常生成 3 项，场景材料不足时可为 1~2 项，上限 4 项。各项须类型或推进方向不同、符合当前场景且立即可做。'
        - '行动写成可直接发送的沉浸式成稿，40~70 字；省略“我”并从动作起笔，包含明确对象、具体做法与眼前目的，必要时最多追加一个后续步骤。'
        - '交涉类可自然加入一句简短追问或表态；禁止代写玩家心理、预告回报、保证成功、决定 NPC 反应或补充未建立的事实。'
        - '类型仅限探索、交涉、战斗、修炼、整备、亲密；提示可省略，仅写影响决定的时限、风险或代价，不与行动正文重复。'
        - '旧候选不得因曾出现在变量中而视为已发生事实；禁止沿用旧项、数组下标 patch、嵌套 patch 或清空为 []。延续上一轮最多 1 项，且须有新线索、回应或阻碍。'

  本尊:
    等级:
      check:
        - '等级是境界唯一事实源：大境界依次练气、筑基、金丹、元婴、化神、炼虚、合体、大乘、渡劫、真仙、仙王、仙帝；小境界初期/中期/后期/大圆满对应 1/2/3/4；等级=(大境界序号-1)×4+小境界序号。金丹中/后/大圆满、元婴初固定为 10/11/12/13。'
        - '只按更新前等级与正文明确的最终结果结算：普通突破仅旧等级+1；目标含糊、冲突或未明确成功则不改。禁止由派生字段、修为已满、突破目标、日常行为或 Analysis 反推；金丹中期→后期只能 10→11。'
        - '等级变化须同组更新等级（replace 绝对整数）、修为=0、尝试突破=false、修炼状态.{阶段=稳固中,上次结果=成功,境界变动={类型,目标等级,依据}}。跨级/跌境仅正文明确时使用类型=跨级突破/跌境，依据逐字摘录含原因与最终境界的正文；否则不改等级。'
    修为:
      check:
        - '仅修炼、吸收资源、传功或明确奖励时增加；普通修炼基础增量=年数×30×完整修炼效率，资源/事件另计且须有依据。'
        - '达到 80~89 提醒可突破，90~99 建议突破，100 后停增；升级后归零。'
    修炼状态:
      check:
        - '修炼开始时记录方式、地点、计划年数与已修炼年数=0；过程中按实际时间累计，结束或中断时保留结果并停止无依据增长。'
    尝试突破:
      check:
        - '开始尝试时设 true；成功升级或失败结束时设 false。'
    身份与根基:
      check:
        - '身份随剧情确认；灵根、体质通常不变，仅重大机缘改写；功法/本命兵器仅在获得、替换、进阶、损毁或失去时更新。'
        - '已活岁月只随世界时间累计，不能单独跳变。'
    神通列表:
      check:
        - '仅在习得、遗忘、熟练度或品阶明确变化时更新；同名神通按 key 修改，禁止重复插入。'
    行踪:
      check:
        - '移动后同步更新本尊.行踪与世界地图.当前位置；进入新区域时补充地点信息。'
    资产:
      check:
        - '灵石只在明确收支时 delta；背包保留装备/任务物等单件物品，法宝保留可催动器物，杂物袋保留可堆叠资源。'
        - '获得物品用 insert；同名堆叠只 delta 数量；消耗、丢弃、出售后数量为 0 时 remove。'
        - '玩家明确保留的物品必须入库；不得因文字省略、过期或整理而消失。'
    战斗状态:
      check:
        - '开战时设正在战斗=true、阶段=对峙/试探、交锋轮次=0，写明双方目的、战场要素与敌人；每次关键交锋轮次 +1。'
        - '裁决顺序：境界位格>已建立条件>明确克制>当前态势与场域>主动代价；普通交锋态势最多移动一阶，只有铺垫+克制+显著代价/底牌齐备才可移动两阶或进入决胜。'
        - '无充分因果时只能相持、交换代价或暴露破绽；禁止随机胜负。{{user}}致命败局改为负/脱身，并记录重大代价与后患。'
        - '结束时设正在战斗=false、阶段=脱战/余波，清空当前敌人并完整更新最近战果；战后负荷仅按实际恢复。'
        - '负荷可写贴合正文的简短描述，不限固定措辞；最近战果.代价涉及真元、神识或肉身时，同轮同步对应负荷，除非正文明确已恢复。'
    当前敌人:
      check:
        - '以敌人名为 key；登场时 insert 完整对象，交锋只改状态、目的、威胁手段或已暴露破绽，退场后随战斗结束清理。'
    渡劫状态:
      check:
        - '开始渡劫时设正在渡劫=true并初始化雷劫；每轮只更新实际发生的雷数、伤势、护身与环境。'
        - '结束时设 false，结果写成功/失败/中断；成功通常与等级原子事务同步，失败须写实际代价。'

  红颜:
    $角色名:
      type: "{等级,修为,灵根,体质,功法,本命兵器,神通列表,灵石,已活岁月,尝试突破,修炼状态,好感度:number,关系:string,关系上下文:{当前情绪:string,态度缘由:string,关系诉求:string,相处禁忌:string,未了约定:string},羁绊纪事:Record<纪事名,{类型:'相识'|'共患难'|'交心'|'护道'|'承诺'|'分歧'|'定情'|'离别'|'重逢'|'其他';摘要:string;时地:string}>}"
      check:
        - '每轮先归一互动对象：结合红颜现有 key、角色库、人设特征与场景连续性解析姓名、别名、代词或泛称；唯一指向时沿用标准 key，不得因未直呼姓名或角色无法说话而漏更；无法唯一判断时不猜、不以“少女”等泛称建 key。'
        - '只记录女性；首次由姓名、别名或唯一身份确认且有实质互动时，insert 完整人物、关系上下文与纪事，禁止空壳。'
        - '好感按互动造成的情感结果更新；沉默、昏迷、兽形或未出现姓名不影响结算，同一事件只计一次。单次通常 -3~+3，重大事件最多 -10~+10；关系据剧情与好感共同判断，不按阈值自动晋级。数值字段的准确名称是“好感度”，已存在角色只能 delta /红颜/{角色名}/好感度，禁止使用不存在的 /红颜/{角色名}/好感。'
        - '关系上下文必须始终为对象，且只含当前情绪、态度缘由、关系诉求、相处禁忌、未了约定。通常 replace /红颜/{角色名}/关系上下文/{具体子字段}；禁止用字符串 replace 整个 /关系上下文。确需整项替换时，value 必须是包含上述五个字段的对象。只记当前有效称谓、信任/矛盾、承诺、共同秘密与对用户认知，不追加流水账。'
        - '羁绊纪事只记录改变关系的关键事件；旧空项/冗文仅在本人出场且关系材料足够时补齐或压缩，未出场者不维护。'
        - '新增纪事必须 insert /红颜/{角色名}/羁绊纪事/{纪事名}，value 必须是包含类型、摘要、时地的完整对象；类型仅限相识、共患难、交心、护道、承诺、分歧、定情、离别、重逢、其他。禁止把字符串直接写成纪事值，禁止整体 replace /红颜/{角色名}/羁绊纪事；只有修订已存在的同名纪事时才 replace 对应纪事。纪事名须简短唯一且不含 / 或 .，每人每轮最多新增一条，结构自动保留最近 8 条。'
        - '修为通常仅在重逢、闭关完成、突破或战斗展示时更新；等级变化须同时写修为进度。'

  任务列表:
    check:
      - '每轮先做“任务审计”：接受目标即 insert 进行中任务；完成/失败/放弃即更新状态，不得以未明说忽略。'
      - '任务列表为空时，若剧情已有需跨回合推进的主线、委托、承诺或待查线索，必须当轮 insert，不得等待玩家明说“接任务”；一次性日常行动除外。'
      - '完成时先校验全部目标；满足则同轮结算奖励、更新状态并写进度/下一步=已完成，禁止重复发奖。'
      - '若任务链明确，同一 JSONPatch 必须 insert 接续任务；仅有线索时更新原任务下一步，不凭空创建。'
      - '任务名稳定唯一；目标、奖励、关键NPC、地点等用紧凑字符串/数组，不写散文。'
