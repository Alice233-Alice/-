变量输出格式:
  rule:
    - 回复末尾必须输出 <UpdateVariable>；其中固定只有 <Analysis> 与 <JSONPatch> 两段，不要夹杂别的标签、注释或解释
    - 字段语义、数值档位、边界、必更项、只读项一律以《变量更新规则》为准；本条是最终输出契约，负责强制复核与格式约束
    - <Analysis> 用中文简要概括本轮变量变化，长度≤80字；只能复述 JSONPatch 可直接证明的变化，不逐条复述 patch，不润色只读派生字段
    - <Analysis> 涉及修炼时，只允许写 修为±N / 修炼状态阶段 / 突破成功或失败 / 等级±1；禁止写 练气中期、练气大圆满、筑基初期 等境界名
    - <JSONPatch> 必须是合法 JSON 数组；每项都是合法 JSON 对象；JSON 中禁止注释、尾逗号、单引号、伪代码
    - op 仅允许 replace / delta / insert / remove；path 使用 JSON Pointer，必须以 / 开头
    - replace / delta / insert 必须带 value；remove 不带 value
    - 字符串、对象键名统一用双引号；数组、对象、字符串、数字、布尔值都直接写合法 JSON 字面量
    - 同一路径同一轮避免互相冲突的重复 patch；能合并时尽量合并；不要同时 replace 父路径又修改其子路径
    - 输出前必须按《变量更新规则》复核一次：时间、地点、处境、机遇、任务、库存、灵石、修炼、关系、战斗、渡劫是否有必更项
    - 本轮若有物品或灵石得失，必须写对应 /本尊/背包、/本尊/法宝、/本尊/杂物袋 或 /本尊/灵石 patch；不要只在正文或 Analysis 里提到
    - 若当前没有主线任务，而本轮已出现可持续剧情主轴、明确目标、委托、危机、追查对象、秘境线索、宗门安排或红颜长期牵引，优先 insert 一条主线任务
    - 涉及地区危险评估时，优先 replace /本尊/行踪/危险度；只有在补完地点长期认知时再写 /世界地图/{区域名}/danger，避免整图重写
    - /当前处境 与 /可参与机遇 若本轮需要更新，必须分别使用 {"op":"replace","path":"/当前处境","value":"..."} 与 {"op":"replace","path":"/可参与机遇","value":[...]}；禁止写 /可参与机遇/0、/可参与机遇/1 之类下标路径
    - 若本轮只能想出 1 个可信机遇，就整组 replace 为仅 1 项；若没有可信新机遇，就整组 replace 为 []；不要保留旧项凑数
    - 示例中的修为、灵石、好感、危险度数值只展示 JSONPatch 格式，不代表推荐涨幅；实际变化默认从严，优先少改或不改
  format: |-
    <UpdateVariable>
    <Analysis>≤80字：时间|修为±|阶段变化|等级±1/突破成败|灵石±|物品得失|行踪|危险度|好感±|战斗|渡劫|任务|处境|机遇</Analysis>
    <JSONPatch>[
      {"op":"replace","path":"/世界时钟/时辰","value":"午时"},
      {"op":"replace","path":"/本尊/行踪/所属层级","value":"东苍"},
      {"op":"replace","path":"/本尊/行踪/当前区域","value":"东苍·幽暗秘境·深层石室"},
      {"op":"replace","path":"/本尊/行踪/危险度","value":55},
      {"op":"delta","path":"/本尊/修为","value":18},
      {"op":"replace","path":"/本尊/修炼状态/阶段","value":"修炼中"},
      {"op":"insert","path":"/本尊/背包/青玉丹","value":{"名称":"青玉丹","数量":1,"描述":"可辅助练气修士稳固灵力的丹药"}},
      {"op":"delta","path":"/本尊/灵石","value":-100},
      {"op":"insert","path":"/红颜/某红颜","value":{"关系":"初识","好感度":0,"关系上下文":{"当前情绪":"初见","态度缘由":"本轮首次结识"}}},
      {"op":"insert","path":"/任务列表/探查幽暗秘境","value":{"名称":"探查幽暗秘境","类型":"主线","目标":"确认深层石室异动来源并找到可安全撤离的路线","状态":"进行中","创建时间":"当前时间"}},
      {"op":"replace","path":"/当前处境","value":"本尊已进入幽暗秘境深层石室，周围灵压异常且退路尚未确认。"},
      {"op":"replace","path":"/可参与机遇","value":[
        {"名称":"探查石室阵纹","来源":"幽暗秘境深层石室","类型":"秘境探索","描述":"查看墙面阵纹与灵压源头","回报预期":"获得秘境线索或开启退路","风险评估":"可能触发残阵","时限":"离开石室前","优先级":5},
        {"名称":"原地调息稳住气息","来源":"本尊当前状态","类型":"修炼","描述":"借石室灵气短暂调息","回报预期":"少量恢复或稳定修为","风险评估":"停留过久会增加遭遇风险","时限":"短时间内","优先级":3}
      ]}
    ]</JSONPatch>
    </UpdateVariable>