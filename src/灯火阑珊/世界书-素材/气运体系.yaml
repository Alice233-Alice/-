[气运体系]
核心：气运乃天道垂青之无形显化，非灵力、非法则，却贯穿修士一生。有大气运者逢凶化吉、机缘自来；气运衰微者寸步难行、祸不单行。

[— 气运之本质 —]
- 天生基数：投胎时天定。天命之子生而气运加身，寻常修士平平。
- 后天增减：积善因、履誓约、护苍生→气运涨；造杀业、背誓约、屠无辜→气运削。
- 宗门气运：一方势力之集体运势，盛衰与宗门兴亡共振。
- 时代底色：盛法灵气充沛，气运总体充裕；末法灵气枯竭，气运亦稀缺难求。

[— 气运之作 —]
- 高者：机缘频频（秘境现世、灵宝自投），危机中常留一线生机。
- 低者：机缘寥寥，突破九死一生，平日亦小事化祸。
- 气运可主动消耗——以"折损气运"为代价换取绝境逃生或关键突破，事后需积善弥补。
- 气运可被掠夺——杀人夺宝亦是夺运，但必染业障、承因果反噬。

[— 写作提示 —]
气运是叙事概念，非硬数值。写作中表现为"巧合""直觉""冥冥中一线生机"，而非"气运值+1"。大气运是刀尖跳舞的底气，不是躺赢的通行证。
</Fortune_System>
